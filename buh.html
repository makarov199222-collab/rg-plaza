<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RG Hub">

<title>RG Plaza · RG Hub — Бухгалтерия</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg:#1a1a1a; --surface:#222222; --surface2:#2a2a2a; --border:#333333;
    --accent:#e8b84b; --blue:#2196f3; --text:#ffffff; --muted:#909090;
    --green:#4caf50; --purple:#9c27b0; --red:#f44336; --orange:#ff9800;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}
  .login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .login.hidden{display:none;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);letter-spacing:5px;margin-bottom:8px;line-height:1;}
  .login-sublogo{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);letter-spacing:3px;margin-top:4px;}
  .login-sub{font-size:11px;color:var(--muted);letter-spacing:5px;font-weight:600;margin-bottom:36px;text-transform:uppercase;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 24px;width:100%;max-width:360px;}
  .login-title{font-size:14px;font-weight:600;margin-bottom:18px;text-align:center;}
  .login-input{width:100%;background:#141414;border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:500;outline:none;text-align:center;letter-spacing:1px;-webkit-appearance:none;}
  .login-input:focus{border-color:var(--accent);}
  .login-btn{width:100%;margin-top:12px;padding:14px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .login-err{margin-top:10px;font-size:13px;color:var(--red);text-align:center;min-height:18px;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:3px;line-height:1;}
  .logo span{color:#b8b8b8;font-size:9px;display:block;letter-spacing:2.5px;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;margin-top:3px;}
  .month-pick{margin-left:auto;background:#141414;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;outline:none;}
  .month-pick:focus,.month-pick:hover{border-color:var(--accent);}
  .refresh-btn{background:#141414;border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--accent);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;}

  /* === Кастомный месяц-пикер === */
  .mp-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;background:#141414;border:1px solid var(--border);border-radius:8px;padding:3px;}
  .mp-arrow{background:none;border:none;color:var(--accent);width:30px;height:30px;border-radius:5px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
  .mp-arrow:hover{background:var(--surface2);}
  .mp-arrow:active{transform:scale(.92);}
  .mp-current{background:none;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;border-radius:5px;min-width:130px;text-align:center;text-transform:capitalize;letter-spacing:.3px;transition:background .15s;}
  .mp-current:hover{background:var(--surface2);color:var(--accent);}

  .mp-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px;}
  .mp-modal.show{display:flex;}
  .mp-sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:340px;animation:mpUp .25s ease;}
  @keyframes mpUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .mp-year-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .mp-year-arrow{background:#141414;border:1px solid var(--border);color:var(--accent);width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;font-family:inherit;line-height:1;}
  .mp-year-arrow:hover{border-color:var(--accent);}
  .mp-year{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);letter-spacing:2px;}
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mp-month{padding:14px 8px;background:#141414;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-transform:capitalize;transition:all .15s;}
  .mp-month:hover{border-color:var(--accent);color:var(--accent);}
  .mp-month.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .mp-month.future{opacity:.4;}

  .wrap{padding:18px;max-width:1400px;margin:0 auto;}
  .top-tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px;}
  .top-tab{flex:1;min-width:110px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap;}
  .top-tab.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .tab-page{display:none;} .tab-page.active{display:block;}

  /* === Карточки KPI === */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .kpi.acc{border-color:rgba(232,184,75,.5);}
  .kpi.red{border-left:3px solid var(--red);}
  .kpi.green{border-left:3px solid var(--green);}
  .kpi.blue{border-left:3px solid var(--blue);}
  .kpi.orange{border-left:3px solid var(--orange);}
  .kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;}
  .kpi-val{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--accent);line-height:1;letter-spacing:.5px;}
  .kpi-val.t{color:var(--text);}
  .kpi-val.r{color:var(--red);}
  .kpi-val.g{color:var(--green);}
  .kpi-val.b{color:var(--blue);}
  .kpi-val.o{color:var(--orange);}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;}

  /* === Таблица расходов по юрлицам === */
  .data-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto;}
  .block-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);letter-spacing:2px;margin-bottom:13px;display:flex;align-items:center;gap:10px;}
  .block-actions{margin-left:auto;display:flex;gap:7px;}
  .data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
  .data-table th{text-align:left;padding:10px 10px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);}
  .data-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table .name-cell{color:var(--text);font-weight:500;}
  .data-table .num-cell{text-align:right;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;color:var(--text);}
  .data-table .num-cell.muted{color:var(--muted);}
  .data-table .total-row td{font-weight:700;background:#141414;}
  .data-table .total-row .num-cell{color:var(--accent);font-size:17px;}

  /* Фильтр юрлица */
  .entity-pills{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
  .entity-pill{padding:7px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;}
  .entity-pill.active{background:var(--accent);color:#000;border-color:var(--accent);}

  /* Календарь платежей */
  .calendar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .cal-day{background:#141414;border:1px solid var(--border);border-radius:10px;padding:13px;}
  .cal-date{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:.5px;margin-bottom:7px;}
  .cal-date small{font-size:10px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.5px;text-transform:uppercase;display:block;margin-top:-2px;}
  .cal-items{display:flex;flex-direction:column;gap:6px;}
  .cal-item{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);}
  .cal-item:last-child{border-bottom:none;}
  .cal-item-name{color:var(--muted);}
  .cal-item-amount{color:var(--text);font-weight:600;}
  .cal-total{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);text-align:right;letter-spacing:.5px;}

  /* === ФОТ — диаграммы === */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  @media (max-width:800px){.charts-grid{grid-template-columns:1fr;}}
  .chart-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .chart-wrap{position:relative;height:280px;}

  /* Сотрудники */
  .emp-list{display:flex;flex-direction:column;gap:7px;}
  .emp-row{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:10px;}
  .emp-row.detailing{border-left:3px solid var(--orange);}
  .emp-row.sovhoz{border-left:3px solid var(--green);}
  .emp-row.poyma{border-left:3px solid var(--blue);}
  .emp-row.moscow{border-left:3px solid var(--purple);}
  .emp-name{flex:1;font-size:13px;color:var(--text);font-weight:500;line-height:1.3;}
  .emp-meta{font-size:10px;color:var(--muted);margin-top:2px;}
  .emp-amount{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:.5px;text-align:right;flex-shrink:0;}
  .emp-amount small{display:block;font-family:'Inter',sans-serif;font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .emp-filters{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap;}
  .filter-btn{padding:7px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;}
  .filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .emp-search{width:100%;background:#141414;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;margin-bottom:11px;}

  /* Кредиты/лизинги */
  .loans-list{display:flex;flex-direction:column;gap:10px;}
  .loan-card{background:#141414;border:1px solid var(--border);border-radius:10px;padding:13px;}
  .loan-card.credit{border-left:3px solid var(--red);}
  .loan-card.lease{border-left:3px solid var(--blue);}
  .loan-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;flex-wrap:wrap;gap:5px;}
  .loan-name{font-size:13px;font-weight:600;color:var(--text);}
  .loan-type{font-size:9px;color:var(--muted);background:var(--surface2);padding:3px 8px;border-radius:4px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-left:auto;}
  .loan-amount{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:.5px;}
  .loan-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
  .loan-meta-item{font-size:11px;color:var(--muted);}
  .loan-meta-item b{color:var(--text);display:block;margin-top:2px;font-weight:600;}
  .loan-progress{margin-top:9px;}
  .loan-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .loan-bar-fill{height:100%;background:var(--green);border-radius:3px;}
  .loan-progress-text{font-size:10px;color:var(--muted);margin-top:4px;}

  /* Кнопки */
  .btn{padding:9px 14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;}
  .btn.secondary{background:var(--surface2);color:var(--accent);border:1px solid var(--accent);}
  .btn.danger{background:var(--red);color:#fff;}

  /* Модал */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:200;padding:14px;align-items:center;justify-content:center;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:500px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;}
  .modal-head{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;}
  .modal-body{padding:17px;overflow-y:auto;flex:1;}
  .modal-foot{padding:14px 17px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .form-group{margin-bottom:14px;}
  .form-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:block;}
  .form-input,.form-select{width:100%;background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;-webkit-appearance:none;}
  .form-input:focus{border-color:var(--accent);}
  .xbtn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}

  /* Загрузка Excel */
  .upload-zone{background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;}
  .upload-zone:hover{border-color:var(--accent);}
  .upload-zone.drag{border-color:var(--accent);background:rgba(232,184,75,.05);}
  .upload-icon{font-size:40px;margin-bottom:9px;}
  .upload-text{font-size:14px;color:var(--text);margin-bottom:4px;}
  .upload-hint{font-size:11px;color:var(--muted);}
  .upload-status{margin-top:10px;font-size:12px;color:var(--green);min-height:16px;}

  /* Toast */
  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 18px;font-size:13px;color:var(--text);z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;border-left:3px solid var(--accent);}
  .toast.show{opacity:1;}
  .toast.ok{border-left-color:var(--green);}
  .toast.err{border-left-color:var(--red);}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px;line-height:1.6;}
  .loader{display:flex;justify-content:center;align-items:center;padding:50px;color:var(--muted);font-size:13px;}
  .spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:11px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-logo">RG PLAZA<div class="login-sublogo">RG HUB</div></div>
  <div class="login-sub">бухгалтерия</div>
  <div class="login-card">
    <div class="login-title">Введите код доступа</div>
    <input type="password" class="login-input" id="login-code" placeholder="Код бухгалтера" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">ВОЙТИ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app" style="display:none;">
<header>
  <div class="logo">RG Plaza · RG Hub<span>бухгалтерия</span></div>
  <input type="hidden" id="month-pick">
  <div class="mp-wrap">
    <button class="mp-arrow" onclick="mpPrev()" title="Предыдущий">‹</button>
    <button class="mp-current" id="mp-current" onclick="mpOpenGrid()">—</button>
    <button class="mp-arrow" onclick="mpNext()" title="Следующий">›</button>
  </div>
  <button class="refresh-btn" onclick="loadAll()" title="Обновить">↻</button>
</header>

<div class="wrap">
  <div class="top-tabs">
    <button class="top-tab active" onclick="showPage('overview', this)">📊 Обзор</button>
    <button class="top-tab" onclick="showPage('expenses', this)">💸 Расходы</button>
    <button class="top-tab" onclick="showPage('taxes', this)">🏛 Налоги</button>
    <button class="top-tab" onclick="showPage('fot', this)">👥 ФОТ</button>
    <button class="top-tab" onclick="showPage('loans', this)">🏦 Кредиты/Лизинги</button>
    <button class="top-tab" onclick="showPage('ravt', this)">🔄 РАВТ</button>
    <button class="top-tab" onclick="showPage('pnl', this)">💰 Прибыль</button>
    <button class="top-tab" onclick="showPage('calendar', this)">📅 Календарь</button>
    <button class="top-tab" onclick="showPage('upload', this)">📤 Загрузить Excel</button>
  </div>

  <div class="tab-page active" id="page-overview">
    <div id="overview-content"><div class="loader"><div class="spinner"></div>Загружаю...</div></div>
  </div>
  <div class="tab-page" id="page-expenses"><div id="expenses-content"></div></div>
  <div class="tab-page" id="page-taxes"><div id="taxes-content"></div></div>
  <div class="tab-page" id="page-fot"><div id="fot-content"></div></div>
  <div class="tab-page" id="page-loans"><div id="loans-content"></div></div>
  <div class="tab-page" id="page-ravt"><div id="ravt-content"></div></div>
  <div class="tab-page" id="page-pnl"><div id="pnl-content"></div></div>
  <div class="tab-page" id="page-calendar"><div id="calendar-content"></div></div>
  <div class="tab-page" id="page-upload"><div id="upload-content"></div></div>
</div>
</div>

<div class="overlay" id="modal"><div class="modal"><div class="modal-head"><div class="modal-title" id="modal-title">Заголовок</div><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body" id="modal-body"></div><div class="modal-foot" id="modal-foot"></div></div></div>

<div class="mp-modal" id="mp-modal" onclick="if(event.target===this)mpCloseGrid()">
  <div class="mp-sheet">
    <div class="mp-year-row">
      <button class="mp-year-arrow" onclick="mpYearPrev()">‹</button>
      <div class="mp-year" id="mp-year">2026</div>
      <button class="mp-year-arrow" onclick="mpYearNext()">›</button>
    </div>
    <div class="mp-grid" id="mp-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://uxdgiwbkvgbnrsuxjhvp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bg1BRofqJsjkV_9eXzn2Pg__YJ-xRMK';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const BUH_CODE = 'buh-2026';

  // Хранилище данных
  let data = {
    expenses: [], taxes: [], fot: null, employees: [], penalties: [],
    loans: [], calendar: [], reports: [], period: null
  };
  let charts = [];

  // Категории
  const EXPENSE_CATS = {
    salary_official: '👔 Зарплата офиц',
    salary_unofficial: '💰 Зарплата неоф',
    rent_official: '🏢 Аренда офиц',
    rent_unofficial: '🏠 Аренда неоф',
    leasing: '🚛 Лизинг',
    credit_kv: '🏦 Кредит КВ'
  };
  const TAX_NAMES = {
    contributions: 'Взносы', ndfl: 'НДФЛ', fss: 'ФССнс', nds: 'НДС',

  // === LOGIN ===
  function doLogin() {
    const code = document.getElementById('login-code').value.trim();
    if (code === BUH_CODE) {
      sessionStorage.setItem('rgp_buh', '1');
      enterApp();
    } else {
      document.getElementById('login-err').textContent = 'Неверный код';

  function enterApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    const now = new Date();
    const v = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    mpUpdateLabel();
    loadAll();

  // === КАСТОМНЫЙ МЕСЯЦ-ПИКЕР ===
  const MP_MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const MP_MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  let mpGridYear = new Date().getFullYear();

  function mpGetCurrent() {
    const v = document.getElementById('month-pick').value || '';
    const [y, m] = v.split('-').map(Number);
    return [y || new Date().getFullYear(), m || (new Date().getMonth()+1)];
  }

  function mpSet(y, m) {
    const v = `${y}-${String(m).padStart(2,'0')}`;
    document.getElementById('month-pick').value = v;
    mpUpdateLabel();
    loadAll();
  }

  function mpUpdateLabel() {
    const [y, m] = mpGetCurrent();
    document.getElementById('mp-current').textContent = `${MP_MONTHS_FULL[m-1]} ${y}`;
  }

  function mpPrev() {
    let [y, m] = mpGetCurrent();
    m--; if (m < 1) { m = 12; y--; }
    mpSet(y, m);
  }
  function mpNext() {
    let [y, m] = mpGetCurrent();
    m++; if (m > 12) { m = 1; y++; }
    mpSet(y, m);
  }

  function mpOpenGrid() {
    const [y, m] = mpGetCurrent();
    mpGridYear = y;
    mpRenderGrid();
    document.getElementById('mp-modal').classList.add('show');
  }
  function mpCloseGrid() {
    document.getElementById('mp-modal').classList.remove('show');
  }
  function mpYearPrev() { mpGridYear--; mpRenderGrid(); }
  function mpYearNext() { mpGridYear++; mpRenderGrid(); }

  function mpRenderGrid() {
    document.getElementById('mp-year').textContent = mpGridYear;
    const [curY, curM] = mpGetCurrent();
    const now = new Date();
    const nowY = now.getFullYear(), nowM = now.getMonth() + 1;
    let html = '';
    for (let i = 0; i < 12; i++) {
      const m = i + 1;
      const isActive = (mpGridYear === curY && m === curM);
      const isFuture = (mpGridYear > nowY) || (mpGridYear === nowY && m > nowM);
      html += `<button class="mp-month ${isActive?'active':''} ${isFuture?'future':''}" onclick="mpPickMonth(${m})">${MP_MONTHS_FULL[i]}</button>`;
    }
    document.getElementById('mp-grid').innerHTML = html;
  }

  function mpPickMonth(m) {
    mpSet(mpGridYear, m);
    mpCloseGrid();
  }

  // === ХЕЛПЕРЫ ===
  function fm(n) { if (!n && n !== 0) return '0'; return Math.round(+n).toLocaleString('ru-RU'); }
  function fmd(n) { if (!n && n !== 0) return '0'; return (+n).toLocaleString('ru-RU', {maximumFractionDigits:2}); }
  function fs(n) { n = +n || 0; if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1)+' млн'; if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(0)+'к'; return Math.round(n)+''; }
  function showToast(t, c='') { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast '+c+' show'; setTimeout(()=>el.classList.remove('show'), 2500); }
  function destroyCharts() { charts.forEach(c => { try{c.destroy();}catch(e){} }); charts = []; }

  function showPage(p, btn) {
    document.querySelectorAll('.tab-page').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.top-tab').forEach(x => x.classList.remove('active'));
    document.getElementById('page-'+p).classList.add('active');
    if (btn) btn.classList.add('active');
    if (p === 'overview') renderOverview();
    if (p === 'expenses') renderExpenses();
    if (p === 'taxes') renderTaxes();
    if (p === 'fot') renderFot();
    if (p === 'loans') renderLoans();
    if (p === 'ravt') renderRavt();
    if (p === 'pnl') renderPnl();
    if (p === 'calendar') renderCalendar();
    if (p === 'upload') renderUpload();
  }

  async function loadAll() {
    const period = document.getElementById('month-pick').value;
    if (!period) return;
    data.period = period;
    try {
      // Защита от каскадного падения: если один запрос упадёт (нет таблицы / RLS),
      // он вернёт пустой результат, а не обрушит весь экран бухгалтерии.
      const safe = async (q, fallback) => {
        const def = fallback !== undefined ? fallback : { data: [] };
        try {
          const r = await q;
          if (r && r.error) { console.warn('Soft error (продолжаем):', r.error.message); return def; }
          return r;
        } catch (e) {
          console.warn('Soft error (продолжаем):', e.message);
          return def;
        }
      };
      const [exp, tax, fot, emp, pen, loan, cal, rep] = await Promise.all([
        safe(sb.from('expenses_monthly').select('*').eq('period', period)),
        safe(sb.from('taxes_monthly').select('*').eq('period', period)),
        safe(sb.from('fot_summary').select('*').eq('period', period).maybeSingle(), { data: null }),
        safe(sb.from('fot_employees').select('*').eq('period', period)),
        safe(sb.from('fot_penalties').select('*').eq('period', period)),
        safe(sb.from('loans_leases').select('*').eq('active', true)),
        safe(sb.from('payment_calendar').select('*').eq('period', period)),
        safe(sb.from('daily_reports_unified').select('*').gte('date', period+'-01').lte('date', period+'-31')),
      ]);
      data.expenses = exp.data || [];
      data.taxes = tax.data || [];
      data.fot = fot.data || null;
      data.employees = emp.data || [];
      data.penalties = pen.data || [];
      data.loans = loan.data || [];
      data.calendar = cal.data || [];
      data.reports = rep.data || [];
      // перерисовать активную
      const active = document.querySelector('.tab-page.active').id.replace('page-','');
      const btn = document.querySelector('.top-tab.active');
      showPage(active, btn);
    } catch (e) {
      console.error(e);
      showToast('Ошибка загрузки: '+(e.message||e), 'err');
    }
  }

  // === ОБЗОР ===

    const fotTotal = data.fot ? +data.fot.fot_total : 0;
    // ПРИОРИТЕТ 1С: выручка по факту отгрузки из 1С; ручное — пока выгрузки за день нет.
    const revenue = data.reports.reduce((s,r) => s + ((+r.total_1c || 0) > 0 ? (+r.total_1c || 0) : (+r.total_day || 0)), 0);
    // Прибыль = выручка - все расходы (но без двойного счёта зарплаты в расходах и ФОТ)
    // У нас зарплата официальная учтена в expenses, плюс ФОТ — это весь выплачиваемый ФОТ.
    // Чтобы не считать дважды, для прибыли возьмём: выручка − (expenses без зарплаты) − ФОТ − налоги
    const expWithoutSalary = data.expenses.filter(r => !r.category.startsWith('salary_')).reduce((s,r) => s + (+r.amount), 0);
    const profit = revenue - expWithoutSalary - fotTotal - totalTax;
    const profitClass = profit >= 0 ? 'g' : 'r';

    const monthName = new Date(data.period + '-01').toLocaleDateString('ru-RU', {month:'long', year:'numeric'});

        <div style="font-size:12px;color:var(--muted);">Финансовая картина</div>
      </div>

        <div class="kpi acc">

        </div>
        <div class="kpi red">
          <div class="kpi-lbl">Расходы (без ФОТ)</div>
          <div class="kpi-val r">${fm(expWithoutSalary)} ₽</div>
          <div class="kpi-sub">аренда, лизинг, кредиты</div>
        </div>
        <div class="kpi orange">
          <div class="kpi-lbl">ФОТ итого</div>
          <div class="kpi-val o">${fm(fotTotal)} ₽</div>
          <div class="kpi-sub">${data.fot ? data.fot.total_employees : 0} сотрудников</div>
        </div>
        <div class="kpi blue">
          <div class="kpi-lbl">Налоги</div>
          <div class="kpi-val b">${fm(totalTax)} ₽</div>
          <div class="kpi-sub">${data.taxes.length} платежей</div>
        </div>
        <div class="kpi ${profit >= 0 ? 'green' : 'red'}">
          <div class="kpi-lbl">Чистая прибыль</div>
          <div class="kpi-val ${profitClass}">${fm(profit)} ₽</div>
          <div class="kpi-sub">${revenue > 0 ? Math.round(profit/revenue*100) : 0}% от выручки</div>
        </div>
        <div class="kpi">
          <div class="kpi-lbl">% ФОТ от выручки</div>
          <div class="kpi-val ${revenue > 0 && fotTotal/revenue > 0.35 ? 'r' : revenue > 0 && fotTotal/revenue > 0.25 ? 'o' : 'g'}">${revenue > 0 ? Math.round(fotTotal/revenue*100) : 0}%</div>
          <div class="kpi-sub">норма 25-30%</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-block">
          <div class="block-title">📊 Расходы по юрлицам</div>
          <div class="chart-wrap"><canvas id="ch-entities"></canvas></div>
        </div>
        <div class="chart-block">
          <div class="block-title">💼 ФОТ по территориям</div>
          <div class="chart-wrap"><canvas id="ch-fot"></canvas></div>
        </div>
      </div>
    `;

    // Алерты
    const alerts = [];
    if (revenue > 0 && fotTotal / revenue > 0.4) {
      alerts.push({type:'red', text:`🚨 ФОТ ${Math.round(fotTotal/revenue*100)}% от выручки — выше нормы (макс 30%)`});
    }
    if (profit < 0) {
      alerts.push({type:'red', text:`⚠️ Месяц убыточный — расходы превышают выручку на ${fm(Math.abs(profit))} ₽`});
    }
    const usnTotal = data.taxes.filter(t => t.tax_type === 'usn').reduce((s,r) => s + (+r.amount), 0);
    if (usnTotal > 1000000) {
      alerts.push({type:'orange', text:`💰 Большая сумма УСН: ${fm(usnTotal)} ₽ — закладывайте в бюджет`});
    }
    if (alerts.length) {
      html += `<div class="data-block"><div class="block-title">⚠️ Внимание</div>` +
        alerts.map(a => `<div style="padding:11px 14px;background:#141414;border-radius:8px;border-left:3px solid var(--${a.type});margin-bottom:7px;font-size:13px;">${a.text}</div>`).join('') +
        `</div>`;
    }

    c.innerHTML = html;

    // Графики
    setTimeout(() => {
      // По юрлицам
      const byEntity = {};
      ENTITIES_ORDER.forEach(e => byEntity[e] = 0);
      data.expenses.forEach(r => { byEntity[r.entity_id] = (byEntity[r.entity_id] || 0) + (+r.amount); });
      data.taxes.forEach(r => { byEntity[r.entity_id] = (byEntity[r.entity_id] || 0) + (+r.amount); });

            borderRadius: 5

        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: {display:false}, tooltip:{callbacks:{label:c=>fm(c.raw)+' ₽'}} },
          scales: { x:{ticks:{color:'#909090'},grid:{display:false}}, y:{ticks:{color:'#909090', callback:v=>fs(v)},grid:{color:'#333'}} }
        }
      }));

      // ФОТ по территориям
      if (data.fot) {
        const ctx2 = document.getElementById('ch-fot');
        if (ctx2) charts.push(new Chart(ctx2, {
          type: 'doughnut',

            labels: ['Совхозная','Москва','Пойма','Детейлинг'],

              backgroundColor: ['#4caf50','#9c27b0','#2196f3','#ff9800'],
              borderColor: '#222', borderWidth: 2
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: {position:'bottom', labels:{color:'#fff', font:{size:11}}}, tooltip:{callbacks:{label:c=>c.label+': '+fm(c.raw)+' ₽'}} }
          }
        }));
      }
    }, 50);
  }

  // === РАСХОДЫ ===
  function renderExpenses() {
    destroyCharts();
    const c = document.getElementById('expenses-content');
    if (!data.period) { c.innerHTML = '<div class="empty">Выберите месяц</div>'; return; }

    // Группировка по категории и юрлицу
    const grid = {};
    Object.keys(EXPENSE_CATS).forEach(cat => {
      grid[cat] = {};
      ENTITIES_ORDER.forEach(e => grid[cat][e] = 0);
    });
    data.expenses.forEach(r => {
      if (grid[r.category]) grid[r.category][r.entity_id] = +r.amount;
    });

    const totals = {};
    ENTITIES_ORDER.forEach(e => totals[e] = ENTITIES_ORDER.reduce((s,_)=>s,0));
    let grandTotal = 0;
    ENTITIES_ORDER.forEach(e => {
      totals[e] = data.expenses.filter(r => r.entity_id === e).reduce((s,r) => s + (+r.amount), 0);
      grandTotal += totals[e];
    });

    let html = `
      <div class="data-block">
        <div class="block-title">💸 Расходы по статьям и юрлицам
          <div class="block-actions">

              <th class="num-cell">ТРАК</th>
              <th class="num-cell">Итого</th>

        html += `<div class="emp-row"><div class="emp-name">${p.fio}<div class="emp-meta">${p.reason || ''}</div></div><div class="emp-amount" style="color:var(--red);">−${fm(p.amount)} ₽</div></div>`;
      });
      html += `</div></div>`;
    }

    c.innerHTML = html;
    drawEmployees();
  }

  function drawEmployees() {
    const list = document.getElementById('emp-list');
    if (!list) return;
    let emps = data.employees;
    if (fotFilter.territory !== 'all') emps = emps.filter(e => e.territory === fotFilter.territory);
    if (fotFilter.search) {
      const q = fotFilter.search.toLowerCase();
      emps = emps.filter(e => (e.fio || '').toLowerCase().includes(q));
    }
    emps = emps.slice().sort((a,b) => +b.final_payable - +a.final_payable);

    if (emps.length === 0) { list.innerHTML = '<div class="empty">Никого не найдено</div>'; return; }

    let html = '<div class="emp-list">';
    emps.forEach(e => {
      const territoryClass = (e.territory || '').toLowerCase()
        .replace('совхозная','sovhoz')
        .replace('пойма','poyma')
        .replace('москва','moscow')
        .replace('детейлинг','detailing');
      html += `<div class="emp-row ${territoryClass}">
        <div class="emp-name">${e.fio}<div class="emp-meta">${e.territory} · ${e.status}${e.comment ? ' · '+e.comment : ''}</div></div>
        <div class="emp-amount">${fm(e.final_payable)} ₽<small>${e.fact_days || 0} дней</small></div>
      </div>`;
    });
    html += '</div>';
    list.innerHTML = html;
  }

  // === КРЕДИТЫ/ЛИЗИНГИ ===
  function renderLoans() {
    destroyCharts();
    const c = document.getElementById('loans-content');
    let html = `
      <div class="data-block">
        <div class="block-title">🏦 Кредиты и лизинги
          <div class="block-actions">
            <button class="btn" onclick="addLoan()">+ Добавить</button>
          </div>
        </div>`;

      html += `<div class="empty">📭 Кредитов и лизингов пока нет<br><br>Нажмите "+ Добавить" чтобы внести данные</div>`;
    } else {
      const totalMonthly = data.loans.reduce((s,r) => s + (+r.monthly_payment || 0), 0);
      const totalDebt = data.loans.reduce((s,r) => s + (+r.remaining_debt || 0), 0);
      html += `
        <div class="kpi-grid" style="margin-bottom:14px;">
          <div class="kpi red"><div class="kpi-lbl">Остаток долга</div><div class="kpi-val r">${fm(totalDebt)} ₽</div></div>
          <div class="kpi orange"><div class="kpi-lbl">Платёж в месяц</div><div class="kpi-val o">${fm(totalMonthly)} ₽</div></div>
          <div class="kpi"><div class="kpi-lbl">Всего обязательств</div><div class="kpi-val t">${data.loans.length}</div></div>
        </div>
        <div class="loans-list">`;
      data.loans.forEach(l => {
        const initial = +l.initial_amount || 0;
        const remaining = +l.remaining_debt || 0;
        const paid = initial - remaining;
        const pct = initial > 0 ? Math.round(paid/initial*100) : 0;
        html += `<div class="loan-card ${l.type}">
          <div class="loan-head">
            <div>
              <div class="loan-name">${l.bank}</div>
              ${l.description ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;">${l.description}</div>`:''}
            </div>
            <div class="loan-type">${l.type === 'credit' ? 'Кредит' : 'Лизинг'}</div>
          </div>
          <div class="loan-amount">${fm(remaining)} ₽<span style="font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);font-weight:500;margin-left:8px;">остаток</span></div>
          <div class="loan-meta">
            <div class="loan-meta-item">Платёж в мес<b>${fm(l.monthly_payment)} ₽</b></div>
            <div class="loan-meta-item">До<b>${l.end_date ? new Date(l.end_date).toLocaleDateString('ru-RU') : '—'}</b></div>
          </div>
          ${initial > 0 ? `
          <div class="loan-progress">
            <div class="loan-bar"><div class="loan-bar-fill" style="width:${pct}%;"></div></div>
            <div class="loan-progress-text">Выплачено ${pct}% · ${fm(paid)} из ${fm(initial)} ₽</div>
          </div>` : ''}

      html += `</div>`;
    }
    html += `</div>`;
    c.innerHTML = html;

  // === РАВТ ВЗАИМОЗАЧЁТЫ ===
  let ravtSettlements = [];

  async function loadRavtSettlements() {
    try {
      const { data: rows, error } = await sb.from('ravt_settlements').select('*').order('settlement_date', { ascending: false });
      if (error) throw error;
      ravtSettlements = rows || [];
    } catch (e) {
      console.error(e);
      ravtSettlements = [];
    }
  }

  async function renderRavt() {
    destroyCharts();
    const c = document.getElementById('ravt-content');
    c.innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю акты взаимозачёта...</div>';

    await loadRavtSettlements();

    // Загружаем сводку из журнала операций РАВТ (по последнему импорту)
    let journalSummary = [];
    try {
      const { data: js } = await sb.from('ravt_journal_summary').select('*');
      journalSummary = js || [];
    } catch (e) { console.error('journal_summary error:', e); }
    const journalByRegion = {};
    journalSummary.forEach(s => { journalByRegion[s.region] = s; });

    // Долги по нашему учёту: equity-ЗН с debt>0 (закрытые), по точкам→регионам
    const ourRavtDebt = { moscow: 0, izhevsk: 0 };
    try {
      // Постранично — equity-ЗН с долгом может быть >1000 (Supabase режет на 1000).
      const P = 1000; let oh = []; let f = 0;
      for (;;) {
        const { data, error } = await sb.from('orders_history_1c')
          .select('point_id, debt')
          .eq('category', 'equity')
          .gt('debt', 0)
          .range(f, f + P - 1);
        if (error) { console.warn(error.message); break; }
        const b = data || []; oh = oh.concat(b);
        if (b.length < P) break; f += P; if (f > 100000) break;
      }
      const regionMap2 = { kaluga: 'moscow', serpuhov: 'moscow', sovhoz: 'izhevsk', poyma: 'izhevsk' };
      (oh || []).forEach(r => {
        const reg = regionMap2[r.point_id];
        if (reg) ourRavtDebt[reg] += +r.debt || 0;
      });
    } catch (e) { console.error('ourRavtDebt error:', e); }

    // Текущие долги РАВТу из daily_reports — по регионам
    const oweByRegion = { moscow: 0, izhevsk: 0 };
    try {
      const { data: dr } = await sb.from('daily_reports_unified')
        .select('point_id,date,owe_ravt,points(id,format)')
        .gt('owe_ravt', 0)
        .order('date', { ascending: false })
        .limit(100);
      const lastByPoint = {};
      (dr || []).forEach(r => {
        if (!lastByPoint[r.point_id]) lastByPoint[r.point_id] = r;
      });
      // Маппинг точка → регион
      const regionMap = { kaluga: 'moscow', serpuhov: 'moscow', sovhoz: 'izhevsk', poyma: 'izhevsk' };
      Object.values(lastByPoint).forEach(r => {
        const region = regionMap[r.point_id];
        if (region) oweByRegion[region] += +r.owe_ravt || 0;
      });
    } catch (e) { console.error(e); }

    // Группируем акты по регионам и берём последний из каждого
    const lastByRegion = { moscow: null, izhevsk: null };
    ravtSettlements.forEach(s => {
      const r = s.region || 'moscow';
      if (!lastByRegion[r] || s.settlement_date > lastByRegion[r].settlement_date) {
        lastByRegion[r] = s;
      }
    });

    // Хелпер: рендер блока по региону
    const renderRegionBlock = (regionKey, regionName, regionIcon) => {
      const lastAct = lastByRegion[regionKey];
      const owe = oweByRegion[regionKey];
      const lastNet = lastAct ? (+lastAct.ravt_owes_us - +lastAct.we_owe_ravt) : null;
      const days = lastAct ? Math.floor((Date.now() - new Date(lastAct.settlement_date).getTime()) / (24*60*60*1000)) : null;

      return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--accent);letter-spacing:1.5px;margin-bottom:10px;">${regionIcon} ${regionName}</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;">
            <div style="background:#141414;border-left:3px solid var(--red);border-radius:7px;padding:9px 11px;">
              <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px;">Мы должны</div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--red);">${fm(owe)} ₽</div>
              <div style="font-size:9px;color:var(--muted);">из ежедн. отчётов</div>
            </div>
            <div style="background:#141414;border-left:3px solid var(--ok);border-radius:7px;padding:9px 11px;">
              <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px;">РАВТ должен (по акту)</div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--ok);">${lastAct ? fm(lastAct.ravt_owes_us) : '—'} ₽</div>
              <div style="font-size:9px;color:var(--muted);">${lastAct ? `${formatDate(lastAct.settlement_date)} (${days}дн)` : 'актов нет'}</div>
            </div>
            <div style="background:#141414;border-left:3px solid ${lastNet !== null && lastNet >= 0 ? 'var(--ok)' : 'var(--warn)'};border-radius:7px;padding:9px 11px;">
              <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px;">Чистая позиция</div>
              <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${lastNet !== null && lastNet >= 0 ? 'var(--ok)' : 'var(--warn)'};">${lastAct ? (lastNet >= 0 ? '+' : '') + fm(lastNet) : '—'} ₽</div>
              <div style="font-size:9px;color:var(--muted);">${lastAct ? (lastNet >= 0 ? 'РАВТ заплатит нам' : 'мы заплатим') : '—'}</div>
            </div>
          </div>
        </div>
      `;
    };

    let html = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;margin-bottom:6px;">🔄 ВЗАИМОЗАЧЁТ С РАВТ</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:12px;">
          После каждого подписанного <b style="color:var(--text);">акта взаимозачёта</b> с РАВТ — заведи его сюда. <b style="color:var(--text);">Москва</b> и <b style="color:var(--text);">Ижевск</b> работают независимо.
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
          ${renderRegionBlock('moscow', 'МОСКВА (Калужская + Серпуховская)', '🏢')}
          ${renderRegionBlock('izhevsk', 'ИЖЕВСК (Совхозная + Пойма)', '🏭')}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button onclick="openAddRavtModal()" style="background:var(--accent);color:#000;border:none;border-radius:10px;padding:13px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;cursor:pointer;">➕ ДОБАВИТЬ АКТ ВРУЧНУЮ</button>
          <button onclick="document.getElementById('file-ravt-act').click()" style="background:#141414;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:13px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;cursor:pointer;">📎 ЗАГРУЗИТЬ ИЗ EXCEL</button>
        </div>
        <input type="file" id="file-ravt-act" accept=".xlsx" style="display:none" onchange="parseRavtActFile(this)">
        <div id="ravt-act-status" style="margin-top:8px;font-size:12px;color:var(--muted);"></div>
      </div>
    `;

    // === Блок сверки с журналом операций РАВТ ===
    // Показывает: наш учёт (closed equity ЗН) vs выгрузка из 1С
    const hasJournal = journalSummary.length > 0;
    if (hasJournal || ourRavtDebt.moscow > 0 || ourRavtDebt.izhevsk > 0) {
      const renderRecon = (regionKey, regionName, regionIcon) => {
        const ours = ourRavtDebt[regionKey] || 0;
        const j = journalByRegion[regionKey];
        const fromJournal = j ? (+j.final_balance || 0) : null;
        const hasJ = j != null;
        const diff = hasJ ? (ours - fromJournal) : null;
        const lastImp = hasJ ? new Date(j.last_imported) : null;
        const imp = lastImp ? lastImp.toISOString().substring(0,10) : null;
        const period = hasJ ? `${j.period_from} — ${j.period_to}` : null;
        return `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--accent);letter-spacing:1.5px;margin-bottom:10px;">${regionIcon} ${regionName}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
              <div style="background:#141414;border-left:3px solid var(--ok);border-radius:7px;padding:9px 11px;">
                <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px;">Наш учёт</div>
                <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--ok);">${fm(ours)} ₽</div>
                <div style="font-size:9px;color:var(--muted);">закрытые equity-ЗН с долгом</div>
              </div>
              <div style="background:#141414;border-left:3px solid var(--accent);border-radius:7px;padding:9px 11px;">
                <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px;">По журналу 1С</div>
                <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);">${hasJ ? fm(fromJournal) : '—'} ₽</div>
                <div style="font-size:9px;color:var(--muted);">${hasJ ? `${j.ops_count} опер · ${period}` : 'выгрузка не загружена'}</div>
              </div>
              <div style="background:#141414;border-left:3px solid ${hasJ ? (Math.abs(diff) < 1000 ? 'var(--ok)' : 'var(--warn)') : 'var(--border)'};border-radius:7px;padding:9px 11px;">
                <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px;">Расхождение</div>
                <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${hasJ ? (Math.abs(diff) < 1000 ? 'var(--ok)' : 'var(--warn)') : 'var(--muted)'};">${hasJ ? (diff >= 0 ? '+' : '') + fm(diff) : '—'} ₽</div>
                <div style="font-size:9px;color:var(--muted);">${hasJ ? (Math.abs(diff) < 1000 ? '✓ сходится' : (diff > 0 ? 'у нас больше' : 'в 1С больше')) : ''}</div>
              </div>
            </div>
            ${hasJ ? `<div style="font-size:10px;color:var(--muted);margin-top:7px;">Журнал импортирован ${imp}</div>` : ''}
          </div>`;
      };
      html += `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:1.5px;margin-bottom:8px;">🔍 СВЕРКА: НАШИ ДОЛГИ ВS ВЫГРУЗКА РАВТ</div>
        <div style="font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:12px;">
          «Наш учёт» — сумма долгов по закрытым equity-ЗН в наших данных. «По журналу 1С» — последняя строка «Долг клиента» из загруженной выгрузки. В идеале сходится с точностью до тысячи.
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          ${renderRecon('moscow', 'МОСКВА', '🏢')}
          ${renderRecon('izhevsk', 'ИЖЕВСК', '🏭')}
        </div>
      </div>`;
    }

    // История актов
    if (ravtSettlements.length > 0) {
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:1.5px;margin-bottom:12px;">📋 ИСТОРИЯ АКТОВ</div>
        <div style="display:flex;flex-direction:column;gap:8px;">`;
      ravtSettlements.forEach(s => {
        const net = +s.ravt_owes_us - +s.we_owe_ravt;
        const region = s.region || 'moscow';
        const regionIcon = region === 'moscow' ? '🏢' : '🏭';
        const regionName = region === 'moscow' ? 'Москва' : 'Ижевск';
        html += `<div style="background:#141414;border:1px solid var(--border);border-radius:10px;padding:11px 13px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:1px;">📅 ${formatDate(s.settlement_date)}</div>
            <div style="background:#222;padding:2px 8px;border-radius:5px;font-size:11px;color:var(--text);">${regionIcon} ${regionName}</div>
            <div style="font-size:11px;color:var(--muted);">за период ${s.period}</div>
            <button onclick="deleteRavtSettlement('${s.id}')" style="margin-left:auto;background:none;border:none;color:var(--crit);font-size:14px;cursor:pointer;padding:3px 7px;border-radius:5px;">🗑</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;">
            <div><div style="color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:600;letter-spacing:.4px;">Мы должны</div><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--crit);">${fm(s.we_owe_ravt)} ₽</div></div>
            <div><div style="color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:600;letter-spacing:.4px;">РАВТ должен</div><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--ok);">${fm(s.ravt_owes_us)} ₽</div></div>
            <div><div style="color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:600;letter-spacing:.4px;">Чистая позиция</div><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:${net >= 0 ? 'var(--ok)' : 'var(--warn)'};">${net >= 0 ? '+' : ''}${fm(net)} ₽</div></div>
          </div>
          ${s.notes ? `<div style="font-size:11px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--border);">💬 ${escapeHtml(s.notes)}</div>` : ''}
        </div>`;
      });
      html += `</div></div>`;
    } else {
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;">
        📭 Актов взаимозачёта пока не заведено.<br>
        <span style="font-size:11px;">После получения первого акта от РАВТ — нажми кнопку «Добавить акт» выше.</span>
      </div>`;
    }

    c.innerHTML = html;
  }

  // === Парсер выгрузки «Взаиморасчёты с РАВТ» (журнал операций) ===
  // Каждая строка файла → запись в ravt_journal (operations log).
  // Дашборд потом сверяет «по выгрузке» vs «по нашему учёту равт-долгов».
  // Это НЕ акт — это сверочный документ.
  async function parseRavtActFile(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('ravt-act-status');
    status.style.color = 'var(--orange)';
    status.textContent = '⏳ Читаю файл...';

    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });

      // Парсинг каждой строки: ищем "Тип документа N от DD.MM.YYYY ..."
      const opRe = /^(Приходная накладная|Расходная накладная|Приход денег|Расход денег)\s+(\S+)\s+от\s+(\d{2})\.(\d{2})\.(\d{4})/i;
      const dateRe = /(\d{2})\.(\d{2})\.(\d{4})/;
      const znRe = /Заказ\s*наряд\s+(\d+)/i;
      const TYPE_MAP = {
        'приходная накладная': 'income_inv',
        'расходная накладная': 'expense_inv',
        'приход денег': 'income_cash',
        'расход денег': 'expense_cash',
      };

      const operations = [];
      let totalDebt = 0, ordersDebt = 0;
      let minDate = null, maxDate = null;

      for (let i = 0; i < rows.length; i++) {
        const r = rows[i] || [];
        const a = String(r[0] || '').trim();
        if (!a) continue;

        // Итог по основному договору (для отладки)
        if (a.toLowerCase() === 'основной договор' && i < 5) {
          totalDebt = parseFloat(r[30]) || 0;
          continue;
        }
        // Долги по заказам в конце файла
        if (a.toLowerCase().includes('долги нам по регистру')) {
          ordersDebt = parseFloat(r[30]) || 0;
          continue;
        }

        // Распознаём строку операции
        const m = a.match(opRe);
        if (!m) continue;

        const docType = TYPE_MAP[m[1].toLowerCase()] || 'other';
        const docNumber = m[2];
        const docDate = `${m[5]}-${m[4]}-${m[3]}`;
        const basis = r[12] ? String(r[12]).trim() : null;
        const znMatch = basis && basis.match(znRe);
        const znNumber = znMatch ? znMatch[1] : null;
        const amountIn = parseFloat(r[22]) || null;
        const amountOut = parseFloat(r[26]) || null;
        const balance = parseFloat(r[30]) || null;

        if (!minDate || docDate < minDate) minDate = docDate;
        if (!maxDate || docDate > maxDate) maxDate = docDate;

        operations.push({
          op_type: docType,
          doc_number: docNumber,
          doc_date: docDate,
          basis,
          zn_number: znNumber,
          amount_in: amountIn,
          amount_out: amountOut,
          balance_running: balance,
          source_row: a.substring(0, 200),
          source_file: file.name,
        });
      }

      if (operations.length === 0) {
        throw new Error('В файле не найдено ни одной операции. Это правильный файл выгрузки?');
      }

      // Спрашиваем регион перед загрузкой
      openRavtJournalConfirm({
        operations,
        opsCount: operations.length,
        minDate, maxDate,
        totalDebt, ordersDebt,
        fileName: file.name,
      });

      status.textContent = `✓ Файл прочитан · ${operations.length} операций за ${minDate} — ${maxDate}`;
      status.style.color = 'var(--ok)';
    } catch (e) {
      console.error('parseRavtActFile error:', e);
      status.style.color = 'var(--red)';
      status.textContent = `❌ Ошибка: ${e.message || e}`;
    } finally {
      input.value = '';
    }
  }

    document.getElementById('modal-foot').innerHTML = `

  async function saveRavtJournal(operations) {
    const region = document.querySelector('input[name="ravt-jrn-region"]:checked')?.value || 'moscow';
    const status = document.getElementById('ravt-act-status');
    status.style.color = 'var(--orange)';
    status.textContent = '⏳ Сохраняю...';
    try {
      // Удаляем старые операции этого региона
      const { error: delErr } = await sb.from('ravt_journal').delete().eq('region', region);
      if (delErr) throw delErr;
      // Грузим новые батчами
      const BATCH = 200;
      const withRegion = operations.map(o => ({...o, region}));
      let imported = 0;
      for (let i = 0; i < withRegion.length; i += BATCH) {
        const chunk = withRegion.slice(i, i + BATCH);
        const { error } = await sb.from('ravt_journal').insert(chunk);
        if (error) throw error;
        imported += chunk.length;
        status.textContent = `⏳ ${imported}/${withRegion.length}...`;
      }
      closeModal();
      status.style.color = 'var(--ok)';
      status.textContent = `✅ Импортировано ${imported} операций по региону ${region === 'moscow' ? 'Москва' : 'Ижевск'}`;
      toast('Журнал импортирован', 'ok');
      renderRavt();
    } catch (e) {
      console.error(e);
      status.style.color = 'var(--red)';
      status.textContent = `❌ Ошибка: ${e.message || e}`;
      toast('Ошибка: '+(e.message||e), 'err');
    }
  }

  async function onPnlFileSelected(event) {
    const file = event.target.files[0];
    if (!file) return;
    document.getElementById('pnl-file-name').textContent = '⏳ ' + file.name;
    const period = document.getElementById('pnl-import-period').value;
    if (!period) { toast('Выбери период перед загрузкой', 'err'); document.getElementById('pnl-file-name').textContent = ''; event.target.value = ''; return; }

    try {
      const fileData = await file.arrayBuffer();
      const wb = XLSX.read(fileData, { type: 'array' });
      const ws = wb.Sheets['Статьи по проектам'] || wb.Sheets[wb.SheetNames[0]];
      if (!ws) { toast('Лист «Статьи по проектам» не найден', 'err'); return; }

      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      const headers = rows[4] || [];

      // Маппинг колонок → point_id
      const colMap = {};
      headers.forEach((h, idx) => {
        if (!h) return;
        const text = String(h).toLowerCase().trim();
        if (text === 'детейлинг') colMap[idx] = 'detailing';
        else if (text.startsWith('пойма')) colMap[idx] = 'poyma';
        else if (text.startsWith('совхозная')) colMap[idx] = 'sovhoz';
        else if (text.includes('калуж')) colMap[idx] = 'kaluga';
        else if (text.includes('серпух')) colMap[idx] = 'serpuhov';
        else if (text === 'мгт') colMap[idx] = 'mgt';
        else if (text === 'школа') colMap[idx] = 'school';
        else if (text === 'без проекта') colMap[idx] = 'other';
      });
      if (Object.keys(colMap).length === 0) { toast('Не нашёл проектов в заголовках xlsx', 'err'); return; }

      const num = v => {
        if (v === null || v === undefined || v === '-') return 0;
        const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
        return isNaN(n) ? 0 : n;
      };

      // Уровень вложенности — по отступу в первой колонке
      const indentOf = (s) => {
        const str = String(s || '');
        return str.length - str.trimStart().length;
      };
      const nameOf = (s) => String(s || '').trim();

      // Ищем строки секций
      let incomeRow = null, expRow = null;
      let incomeRowIdx = -1, expRowIdx = -1;
      for (let i = 0; i < rows.length; i++) {
        const cell = nameOf(rows[i]?.[0]).toLowerCase();
        if (cell === 'поступления' && incomeRow === null) { incomeRow = rows[i]; incomeRowIdx = i; }
        if (cell === 'выплаты' && expRow === null) { expRow = rows[i]; expRowIdx = i; }
        if (incomeRow && expRow) break;
      }
      if (!incomeRow || !expRow) { toast('Не нашёл секций «Поступления» / «Выплаты»', 'err'); return; }

      // === 1. ПОДГОТОВКА point_pnl записей (агрегаты) ===
      const pnlRecords = [];
      Object.entries(colMap).forEach(([colIdx, pointId]) => {
        const income = num(incomeRow[colIdx]);
        const expenses = num(expRow[colIdx]);
        if (income > 0 || expenses > 0) {
          pnlRecords.push({ point_id: pointId, period, income, expenses, source: 'planfact' });
        }
      });

      // === 2. ПАРСИНГ СК / УСЛУГ из секции «Поступления» (revenue_breakdown) ===
      // Идём по строкам после "Поступления" пока не дошли до "Выплаты"
      // Ищем под-секции: «Продажа СК» (СК), «Продажа розница» (розница), «Продажа опт» (корпоратив)
      const breakdownRecords = [];
      let currentSection = null; // 'insurance' / 'retail' / 'corporate' / null

      for (let i = incomeRowIdx + 1; i < expRowIdx; i++) {
        const r = rows[i];
        if (!r) continue;
        const name = nameOf(r[0]);
        if (!name) continue;
        const lname = name.toLowerCase();
        const indent = indentOf(r[0]);

        // Определяем секцию по названию
        if (lname === 'продажа ск') { currentSection = 'insurance'; continue; }
        if (lname === 'продажа розница') { currentSection = 'retail'; continue; }
        if (lname.startsWith('продажа опт')) { currentSection = 'corporate'; continue; }
        // Сбрасываем при выходе на верхний уровень
        if (indent <= 8 && lname !== 'продажа ск' && lname !== 'продажа розница' && !lname.startsWith('продажа опт')) {
          // Если это новая верхнеуровневая статья — сбрасываем секцию
          if (indent <= 4) currentSection = null;
        }

        // Если внутри секции — пишем как записи (но только листовые узлы со значениями)
        if (currentSection && indent >= 16) {
          Object.entries(colMap).forEach(([colIdx, pointId]) => {
            const amt = num(r[colIdx]);
            if (amt > 0) {
              breakdownRecords.push({
                point_id: pointId,
                period,
                channel: currentSection,
                category: name,
                amount: amt,
                source: 'planfact',
                data_type: 'cash'
              });
            }
          });
        }
      }

      // === 3. ПАРСИНГ РАСХОДОВ (expense_breakdown) ===
      const expenseRecords = [];
      // Ищем секции расходов внутри «Выплаты»
      const expenseSections = {
        'покупка стекла': 'glass_supplier',
        'покупка запчастей': 'parts',
        'аренда': 'rent',
        'зарплата пп': 'salary',
        'зарплата ауп': 'salary',
        'налоги': 'tax',
        'налоги прочие': 'tax',
        'налоги на фот': 'tax',
        'налог на прибыль (доходы)': 'tax',
        'реклама': 'advertising',
        'материальные расходы': 'materials',
        'транспортные расходы': 'logistics',
        'программное обеспечение': 'utilities',
        'услуги связи, интернет': 'utilities'
      };

      let currentExpenseCat = null;
      // Ищем где конец «Выплаты» — это следующая верхнеуровневая статья (Инвестиционный поток)
      let expEndIdx = rows.length;
      for (let i = expRowIdx + 1; i < rows.length; i++) {
        const name = nameOf(rows[i]?.[0]);
        if (name === 'Инвестиционный поток' || name === 'Финансовый поток' || name === 'Общий денежный поток') {
          expEndIdx = i;
          break;
        }
      }

      for (let i = expRowIdx + 1; i < expEndIdx; i++) {
        const r = rows[i];
        if (!r) continue;
        const name = nameOf(r[0]);
        if (!name) continue;
        const lname = name.toLowerCase();
        const indent = indentOf(r[0]);

        // Определяем категорию по названию
        const matchedCat = Object.entries(expenseSections).find(([key]) => lname === key);
        if (matchedCat) {
          currentExpenseCat = matchedCat[1];
          continue;
        }
        // Сброс при верхнем уровне
        if (indent <= 4) currentExpenseCat = null;

        // Записываем только листовые узлы под категорией
        if (currentExpenseCat && indent >= 16) {
          Object.entries(colMap).forEach(([colIdx, pointId]) => {
            const amt = num(r[colIdx]);
            if (amt > 0) {
              expenseRecords.push({
                point_id: pointId,
                period,
                category: currentExpenseCat,
                subcategory: name,
                amount: amt,
                source: 'planfact'
              });
            }
          });
        }
      }

      // === СОХРАНЕНИЕ ===
      // 1) point_pnl
      const { error: delPnlErr } = await sb.from('point_pnl').delete().eq('period', period);
      if (delPnlErr) throw delPnlErr;
      if (pnlRecords.length > 0) {
        const { error } = await sb.from('point_pnl').insert(pnlRecords);
        if (error) throw error;
      }

      // 2) revenue_breakdown — удаляем только записи Планфакта за этот период (ручной ввод не трогаем)
      const { error: delRevErr } = await sb.from('revenue_breakdown')
        .delete()
        .eq('period', period)
        .eq('source', 'planfact');
      if (delRevErr) throw delRevErr;
      if (breakdownRecords.length > 0) {
        // Вставляем пачками по 100 (Supabase лимит)
        for (let i = 0; i < breakdownRecords.length; i += 100) {
          const chunk = breakdownRecords.slice(i, i + 100);
          const { error } = await sb.from('revenue_breakdown').insert(chunk);
          if (error) throw error;
        }
      }

      // 3) expense_breakdown
      const { error: delExpErr } = await sb.from('expense_breakdown').delete().eq('period', period);
      if (delExpErr) throw delExpErr;
      if (expenseRecords.length > 0) {
        for (let i = 0; i < expenseRecords.length; i += 100) {
          const chunk = expenseRecords.slice(i, i + 100);
          const { error } = await sb.from('expense_breakdown').insert(chunk);
          if (error) throw error;
        }
      }

      toast(`✅ Импорт: ${pnlRecords.length} проектов · ${breakdownRecords.length} строк выручки · ${expenseRecords.length} строк расходов`, 'ok');
      document.getElementById('pnl-file-name').textContent = '✅ ' + file.name;
      event.target.value = '';
      renderPnl();
    } catch (e) {
      console.error(e);
      toast('Ошибка: '+(e.message||e), 'err');
      document.getElementById('pnl-file-name').textContent = '❌ ошибка';
      event.target.value = '';
    }
  }

    const salaryUnof = data.expenses.filter(r => r.category === 'salary_unofficial').reduce((s,r) => s + (+r.amount), 0);
    const rent = data.expenses.filter(r => r.category.startsWith('rent')).reduce((s,r) => s + (+r.amount), 0);
    const lease = data.expenses.filter(r => r.category === 'leasing').reduce((s,r) => s + (+r.amount), 0);
    const credit = data.expenses.filter(r => r.category === 'credit_kv').reduce((s,r) => s + (+r.amount), 0);
    if (salaryOf + salaryUnof > 0) groups[25].items.push({name: '👔 Зарплата (вторая часть)', amount: Math.round((salaryOf + salaryUnof) * 0.7)});
    if (rent > 0) groups[25].items.push({name: '🏢 Аренда', amount: rent});
    if (lease > 0) groups[25].items.push({name: '🚛 Лизинг', amount: lease});
    if (credit > 0) groups[25].items.push({name: '🏦 Кредит КВ', amount: credit});

    // 28 — налоги
    const taxByType = {};
    data.taxes.forEach(t => {
      const name = TAX_NAMES[t.tax_type] || t.tax_type;
      taxByType[name] = (taxByType[name] || 0) + (+t.amount);
    });
    Object.entries(taxByType).forEach(([name, amount]) => {
      groups[28].items.push({name: '🏛 '+name, amount});
    });

    let html = `<div class="data-block"><div class="block-title">📅 Календарь платежей · ${data.period}</div><div class="calendar-grid">`;
    Object.entries(groups).forEach(([day, g]) => {
      const total = g.items.reduce((s,i) => s + i.amount, 0);
      if (total === 0 && g.items.length === 0) return;
      html += `<div class="cal-day">
        <div class="cal-date">${day}<small>${g.name}</small></div>
        <div class="cal-items">`;
      g.items.filter(i => i.amount > 0).forEach(i => {
        html += `<div class="cal-item"><span class="cal-item-name">${i.name}</span><span class="cal-item-amount">${fm(i.amount)} ₽</span></div>`;
      });
      html += `</div><div class="cal-total">${fm(total)} ₽</div></div>`;
    });
    html += `</div></div>`;
    c.innerHTML = html;
  }

  const OVR_CATEGORIES = {
