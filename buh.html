  function categorizeOvrItem(name) {
    const n = String(name || '').toLowerCase();
    if (n.includes('реализация стекла')) return 'glass_sale';
    if (/замена.*стекл/.test(n)) return 'glass_replace';
    if (n.includes('переклейка') && n.includes('стекл')) return 'glass_replace';
    if (/^\s*(лобовое|боковое|заднее|панорамн)/.test(n)) return 'glass_replace';
    if (n.includes('молдинг')) return 'glass_parts';
    if (/ремонт.*стекл|ремонт ветрового/.test(n)) return 'glass_repair';
    if (n.includes('полировка лобового') || n.includes('полировка стекла')) return 'glass_repair';
    if (n.includes('бронирован')) return 'armoring';
    if (n.includes('тонировк')) return 'tinting';
    if (n.includes('антидожд') || n.includes('гидрофоб')) return 'hydrophob';
    if (n.includes('полировка') && n.includes('фар')) return 'polish_lights';
    if (n.includes('щет') || n.includes('щёт')) return 'wipers';
    if (n.includes('датчик')) return 'rain_sensor';
    if (n.includes('выезд') || n.includes('доставк')) return 'logistics';
    if (n.includes('слесар')) return 'service';
    if (/защита.*коррози/.test(n) || n.includes('демонтаж пленки') || n.includes('устранение остатков клея')) return 'service';
    if (/филавто|авто а1|обслуживание личн/.test(n)) return 'partner_b2b';
    if (n.includes('возврат')) return 'returns';
    if (n.includes('для сотрудник')) return 'staff';
    if (n.includes('бонус')) return 'bonus';
    if (n.includes('прочие продажи') || n.includes('(то)')) return 'other_sales';
    return 'other';
  }

  // Конверсия значения в число с поддержкой "1 234 567,89" / "1,234,567.89" / 1234567.89
  function ovrToNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).replace(/\s+/g,'').replace(/,/g,'.');
    const parts = s.split('.');
    const normalized = parts.length > 2 ? parts.slice(0,-1).join('') + '.' + parts.slice(-1) : s;
    const n = parseFloat(normalized);
    return isFinite(n) ? n : null;
  }

  // Состояние парсинга — храним последний результат для сохранения в БД
  let parsedOvr = null;  // { totals: {total, insurance, retail}, items: [...] }

  // Парсер xlsx — поддерживает оба формата (год-в-одном-файле или один-месяц).
  async function handleOvrXlsx(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('status-ovr');
    status.style.color = 'var(--orange)';
    status.textContent = '⏳ Читаю файл...';
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
      const period = document.getElementById('ovr-period').value;
      const monthIdx = period ? +period.split('-')[1] : null;

      const result = parseOvrRows(rows, monthIdx);
      parsedOvr = result;

      // Подставляем итоги
      if (result.totals.total     !== null) document.getElementById('ovr-total').value     = result.totals.total;
      if (result.totals.insurance !== null) document.getElementById('ovr-insurance').value = result.totals.insurance;
      if (result.totals.retail    !== null) document.getElementById('ovr-retail').value    = result.totals.retail;

      // Превью таблицы позиций
      renderOvrPreview(result.items);

      // Предупреждение если total ≠ insurance + retail
      const warnEl = document.getElementById('ovr-warn');
      if (result.totals.total && result.totals.insurance !== null && result.totals.retail !== null) {
        const diff = +result.totals.total - (+result.totals.insurance + +result.totals.retail);
        if (Math.abs(diff) > Math.abs(result.totals.total) * 0.01) {
          warnEl.textContent = `⚠ Δ ${diff.toLocaleString('ru-RU')} ₽ между ВСЕГО и (СК+Розница)`;
          warnEl.style.color = 'var(--orange)';
        } else {
          warnEl.textContent = '✓ ВСЕГО = СК + Розница';
          warnEl.style.color = 'var(--green)';
        }
      }

      status.style.color = 'var(--green)';
      const found = ['total','insurance','retail'].filter(k => result.totals[k] !== null).length;
      const itemsCount = result.items.length;
      const itemsActive = result.items.filter(x => !x.excluded).length;
      status.textContent = `✓ Распознал ${found}/3 итога и ${itemsCount} позиций (${itemsActive} активных). Проверь и нажми «Сохранить».`;
    } catch (e) {
      status.style.color = 'var(--red)';
      status.textContent = '⚠ Ошибка: ' + (e.message || e);
    }
  }

  function parseOvrRows(rows, monthIdx, strictColumn = false) {
    // Возвращает { totals: {...}, items: [...] }
    const totals = { total: null, insurance: null, retail: null };
    const items = [];

    // Регексы для определения подытоговых строк (которые НЕ являются позициями)
    const subtotalRe = [
      /всего выполненных работ/i,
      /всего\s+(коммунарка|калужская|серпух|совхоз|пойм)/i,
      /страховые компании/i,
      /розничные продажи всего/i,
      /розничные продажи стоа/i,
      /^\s*равт\s*$/i,
      /^[\s\d]*-?\s*услуги\s*$/i,    // "1 - услуги"
      /^[\s\d]*-?\s*стекл[оа]\s*$/i, // "2 - стекло"
    ];
    // Позиции которые исключаем из деталей (они входят в розницу через формулу,
    // но не являются собственно "услугой" — это партнёры и сотрудники)
    const excludeFromDetailsRe = [
      /^филавто$/i,
      /^авто а1$/i,
      /реализация товаров для сотрудников/i,
      /обслуживание личного транспорта/i,
      /бонусы для клиентов/i,
      /возвраты поставщикам/i,
    ];

    let section = null;       // 'insurance' | 'retail' | null
    let subsection = null;    // 'service' | 'glass' | 'ravt' | null

    const matchKey = (text, keywords) => {
      const t = String(text || '').toLowerCase();
      return keywords.some(k => t.includes(k));
    };

    const labelOfRow = (row) => [row[0], row[1], row[2]].map(x => x == null ? '' : String(x)).join(' ').trim();
    const colName1   = (row) => String(row[1] || row[0] || '').trim();

    for (const row of rows) {
      if (!row || row.length === 0) continue;
      const labelFull = labelOfRow(row);
      if (!labelFull) continue;
      const label = labelFull.toLowerCase();

      // ----- ИТОГИ (как раньше) -----
      let totalKey = null;
      if (matchKey(label, ['розничные продажи всего', 'розница всего'])) totalKey = 'retail';
      else if (matchKey(label, ['страховые компании', 'страховые:'])) totalKey = 'insurance';
      else if (matchKey(label, ['всего выполненных работ', 'всего вр'])) totalKey = 'total';
      else if (totals.total === null && /всего\s+(коммунарка|калужская|серпух|совхоз|пойм)/i.test(label)) totalKey = 'total';
      else if (totals.insurance === null && /^\s*равт\s*$/i.test(colName1(row))) totalKey = 'insurance';

      if (totalKey && totals[totalKey] === null) {
        const candidates = [];
        if (monthIdx) candidates.push(monthIdx + 1);
        if (!strictColumn) {
          for (let i = 2; i < row.length; i++) {
            if (i === monthIdx + 1) continue;
            candidates.push(i);
          }
        }
        for (const i of candidates) {
          const n = ovrToNum(row[i]);
          if (n !== null && n > 0) { totals[totalKey] = n; break; }
        }
      }

      // ----- РАЗДЕЛЫ (для трекинга section/subsection) -----
      if (matchKey(label, ['страховые компании'])) { section = 'insurance'; subsection = null; continue; }
      if (matchKey(label, ['розничные продажи всего'])) { section = 'retail'; subsection = null; continue; }
      if (section === 'insurance' && /^\s*равт\s*$/i.test(colName1(row))) { subsection = 'ravt'; continue; }
      if (section === 'insurance' && /^[\s\d]*-?\s*услуги\s*$/i.test(colName1(row))) { subsection = 'service'; continue; }
      if (section === 'insurance' && /^[\s\d]*-?\s*стекл[оа]\s*$/i.test(colName1(row))) { subsection = 'glass'; continue; }

      // Если строка похожа на подытог — пропускаем
      if (subtotalRe.some(re => re.test(label))) continue;

      // ----- ПОЗИЦИИ -----
      // Имя позиции — обычно в колонке [1]
      const itemName = String(row[1] || '').trim();
      if (!itemName) continue;
      if (!section) continue;

      // Берём значение из колонки выбранного месяца
      const amountCol = monthIdx ? monthIdx + 1 : null;
      let amount = null;
      if (amountCol !== null && amountCol < row.length) {
        amount = ovrToNum(row[amountCol]);
      }
      // Если в нужной колонке нет — пробуем найти первое положительное (для one-month-формата)
      // В strictColumn-режиме (годовая загрузка) — не делаем fallback, иначе май-дек подхватят январские числа
      if ((amount === null || amount === 0) && !strictColumn) {
        for (let i = 2; i < row.length; i++) {
          if (i === amountCol) continue;
          const n = ovrToNum(row[i]);
          if (n !== null && n > 0) { amount = n; break; }
        }
      }
      if (amount === null || amount === 0) continue;

      // Категория + признак исключения
      const category = categorizeOvrItem(itemName);
      const excluded = excludeFromDetailsRe.some(re => re.test(itemName));

      items.push({
        section, subsection,
        item_name: itemName,
        amount,
        category,
        category_ru: OVR_CATEGORIES[category] || category,
        excluded,
      });
    }
    return { totals, items };
  }

  function renderOvrPreview(items) {
    let el = document.getElementById('ovr-preview');
    if (!el) {
      // Создаём контейнер превью если его нет
      const wrapAfter = document.querySelector('#upload-content .data-block:nth-of-type(2)');
      if (!wrapAfter) return;
      el = document.createElement('div');
      el.id = 'ovr-preview';
      el.style.cssText = 'margin-top:14px;padding:12px;background:#141414;border-radius:8px;font-size:12px;';
      wrapAfter.appendChild(el);
    }
    if (!items.length) { el.innerHTML = ''; return; }
    const fmt = n => Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 0 });
    const sumActive = items.filter(x => !x.excluded).reduce((a,b) => a + b.amount, 0);
    const sumExcluded = items.filter(x => x.excluded).reduce((a,b) => a + b.amount, 0);
    let html = `<div style="display:flex;justify-content:space-between;margin-bottom:10px;">
      <b style="color:var(--text);">Распознано позиций: ${items.length}</b>
      <span style="color:var(--muted);">Σ активных: ${fmt(sumActive)} · Σ исключённых: ${fmt(sumExcluded)}</span>
    </div>`;
    html += `<div style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;">
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead style="position:sticky;top:0;background:var(--surface);">
          <tr style="color:var(--muted);text-align:left;">
            <th style="padding:6px 8px;">№</th>
            <th style="padding:6px 8px;">Раздел</th>
            <th style="padding:6px 8px;">Категория</th>
            <th style="padding:6px 8px;">Услуга</th>
            <th style="padding:6px 8px;text-align:right;">Сумма</th>
            <th style="padding:6px 8px;">✓</th>
          </tr>
        </thead>
        <tbody>`;
    items.forEach((it, idx) => {
      const sectionRu = it.section === 'insurance' ? 'СК' + (it.subsection ? ' · '+it.subsection : '') : 'Розница';
      const opacity = it.excluded ? '0.5' : '1';
      const textDeco = it.excluded ? 'line-through' : 'none';
      html += `<tr style="border-bottom:1px solid var(--border-dim);opacity:${opacity};">
        <td style="padding:5px 8px;color:var(--muted);">${idx+1}</td>
        <td style="padding:5px 8px;color:var(--muted);">${sectionRu}</td>
        <td style="padding:5px 8px;">${it.category_ru}</td>
        <td style="padding:5px 8px;text-decoration:${textDeco};">${it.item_name}</td>
        <td style="padding:5px 8px;text-align:right;font-weight:600;">${fmt(it.amount)}</td>
        <td style="padding:5px 8px;"><input type="checkbox" ${!it.excluded?'checked':''} onchange="toggleOvrItem(${idx})"></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    html += `<div style="margin-top:8px;font-size:11px;color:var(--muted);">
      💡 Снимите галку у позиций которые НЕ нужно сохранять как детали (партнёры, внутр.продажи).
      Они будут учтены в итогах ВСЕГО/СК/Розница, но не попадут в анализ "топ-услуг".
    </div>`;
    el.innerHTML = html;
  }

  // Toggle excluded в позиции (по индексу)
  function toggleOvrItem(idx) {
    if (!parsedOvr || !parsedOvr.items[idx]) return;
    parsedOvr.items[idx].excluded = !parsedOvr.items[idx].excluded;
    renderOvrPreview(parsedOvr.items);
  }

  // === ЗАГРУЗКА ВСЕГО ГОДА ===
  // Состояние парсинга по году. Структура: { 'YYYY-MM': {totals, items} }
  let parsedOvrYear = null;

  async function handleOvrXlsxYear(input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('status-ovr-year');
    status.style.color = 'var(--orange)';
    status.textContent = '⏳ Читаю файл...';
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });

      // Год берём из выбранного периода (если выбран)
      const periodEl = document.getElementById('ovr-period').value;
      const year = periodEl ? periodEl.split('-')[0] : new Date().getFullYear().toString();

      // Прогоняем парсер 12 раз, по одному месяцу
      // strictColumn=true: не падать в первое попавшееся число — иначе пустые месяцы скопируют январь
      const months = {};
      for (let m = 1; m <= 12; m++) {
        const result = parseOvrRows(rows, m, true);
        // Считаем "есть ли данные" — если есть хотя бы один итог > 0
        const hasData = (result.totals.total || 0) > 0 ||
                        (result.totals.insurance || 0) > 0 ||
                        (result.totals.retail || 0) > 0;
        if (hasData) {
          months[`${year}-${String(m).padStart(2,'0')}`] = result;
        }
      }

      parsedOvrYear = months;
      const cnt = Object.keys(months).length;
      if (cnt === 0) {
        status.style.color = 'var(--red)';
        status.textContent = '⚠ Не нашёл ни одного месяца с данными.';
        return;
      }

      renderOvrYearPreview(months);
      status.style.color = 'var(--green)';
      status.textContent = `✓ Распознано ${cnt} ненулевых месяцев. Проверь превью и нажми «Сохранить все».`;
    } catch (e) {
      status.style.color = 'var(--red)';
      status.textContent = '⚠ Ошибка: ' + (e.message || e);
    }
  }

  function renderOvrYearPreview(months) {
    const el = document.getElementById('ovr-year-preview');
    if (!el) return;
    const fmt = n => Number(n||0).toLocaleString('ru-RU', { maximumFractionDigits: 0 });
    const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

    let html = '<div class="data-block" style="margin-top:0;background:#101010;">';
    html += `<div class="block-title">📚 Превью годовой загрузки</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">
      Точка <b style="color:var(--text);">${document.getElementById('ovr-point').selectedOptions[0].text}</b>.
      Снимите галку у месяцев которые НЕ нужно сохранять.
    </div>`;
    html += '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:6px;">';
    html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    html += `<thead style="background:var(--surface);color:var(--muted);">
      <tr>
        <th style="padding:7px 8px;text-align:left;">Период</th>
        <th style="padding:7px 8px;text-align:right;">ВСЕГО</th>
        <th style="padding:7px 8px;text-align:right;">СК</th>
        <th style="padding:7px 8px;text-align:right;">Розница</th>
        <th style="padding:7px 8px;text-align:right;">Позиций</th>
        <th style="padding:7px 8px;text-align:center;">✓</th>
      </tr></thead><tbody>`;
    const keys = Object.keys(months).sort();
    let sumTotal = 0;
    keys.forEach(period => {
      const r = months[period];
      const m = +period.split('-')[1];
      const itemsCnt = (r.items || []).filter(x => !x.excluded).length;
      sumTotal += r.totals.total || 0;
      html += `<tr style="border-top:1px solid var(--border-dim);">
        <td style="padding:6px 8px;font-weight:600;">${monthNames[m-1]} ${period.split('-')[0]}</td>
        <td style="padding:6px 8px;text-align:right;font-weight:600;">${fmt(r.totals.total)}</td>
        <td style="padding:6px 8px;text-align:right;color:var(--blue,#60a5fa);">${fmt(r.totals.insurance)}</td>
        <td style="padding:6px 8px;text-align:right;color:var(--green);">${fmt(r.totals.retail)}</td>
        <td style="padding:6px 8px;text-align:right;color:var(--muted);">${itemsCnt}</td>
        <td style="padding:6px 8px;text-align:center;"><input type="checkbox" data-period="${period}" checked></td>
      </tr>`;
    });
    html += `<tr style="border-top:2px solid var(--accent);background:#1a1a1a;font-weight:700;">
      <td style="padding:8px;">ИТОГО</td>
      <td style="padding:8px;text-align:right;">${fmt(sumTotal)}</td>
      <td colspan="4"></td>
    </tr>`;
    html += '</tbody></table></div>';
    html += `<div style="display:flex;gap:10px;align-items:center;margin-top:10px;">
      <button class="btn" onclick="saveOvrYear()">💾 Сохранить все отмеченные</button>
      <button class="btn secondary" onclick="cancelOvrYear()">Отмена</button>
    </div>`;
    html += '</div>';
    el.innerHTML = html;
  }

  function cancelOvrYear() {
    parsedOvrYear = null;
    document.getElementById('ovr-year-preview').innerHTML = '';
    document.getElementById('status-ovr-year').textContent = '';
    document.getElementById('file-ovr-year').value = '';
  }

  async function saveOvrYear() {
    if (!parsedOvrYear) { showToast('Нет данных для сохранения', 'err'); return; }
    const point_id = document.getElementById('ovr-point').value;
    // Какие месяцы пользователь оставил отмеченными
    const checkboxes = document.querySelectorAll('#ovr-year-preview input[type="checkbox"][data-period]');
    const periods = Array.from(checkboxes).filter(c => c.checked).map(c => c.dataset.period);
    if (periods.length === 0) { showToast('Не выбран ни один месяц', 'err'); return; }

    if (!confirm(`Сохранить ${periods.length} месяцев для точки «${point_id}»? Существующие данные за эти периоды будут перезаписаны.`)) return;

    let okCount = 0;
    let failCount = 0;
    for (const period of periods) {
      const r = parsedOvrYear[period];
      try {
        // 1. Итоги
        const { error: e1 } = await sb.from('monthly_ovr').upsert({
          point_id, period,
          total: r.totals.total || 0,
          insurance: r.totals.insurance || 0,
          retail: r.totals.retail || 0,
          source: 'xlsx'
        });
        if (e1) throw e1;

        // 2. Items: удалить старые + вставить новые активные
        await sb.from('monthly_ovr_items').delete().eq('point_id', point_id).eq('period', period);
        const activeItems = (r.items || []).filter(x => !x.excluded).map(it => ({
          point_id, period,
          section: it.section, subsection: it.subsection,
          item_name: it.item_name, amount: it.amount,
          category: it.category, category_ru: it.category_ru,
          excluded: false,
        }));
        if (activeItems.length) {
          const { error: eIns } = await sb.from('monthly_ovr_items').insert(activeItems);
          if (eIns) throw eIns;
        }
        okCount++;
      } catch (e) {
        failCount++;
        console.error(`Ошибка сохранения ${period}:`, e);
      }
    }

    if (failCount === 0) {
      showToast(`✓ Сохранено ${okCount} месяцев`, 'ok');
    } else {
      showToast(`Сохранено ${okCount}, ошибок ${failCount}. См. консоль.`, 'err');
    }
    cancelOvrYear();
    loadOvrList();
  }

  async function saveOvr() {
    const point_id = document.getElementById('ovr-point').value;
    const period   = document.getElementById('ovr-period').value;
    const total     = parseFloat(document.getElementById('ovr-total').value) || 0;
    const insurance = parseFloat(document.getElementById('ovr-insurance').value) || 0;
    const retail    = parseFloat(document.getElementById('ovr-retail').value) || 0;
    if (!period) { showToast('Укажи период', 'err'); return; }
    if (total === 0 && insurance === 0 && retail === 0) { showToast('Заполни хоть одно поле', 'err'); return; }
    try {
      // 1. Сохраняем итоги
      const { error: e1 } = await sb.from('monthly_ovr').upsert({
        point_id, period, total, insurance, retail,
        source: parsedOvr ? 'xlsx' : 'manual'
      });
      if (e1) throw e1;

      // 2. Если есть распарсенные позиции — перезаписываем items
      if (parsedOvr && parsedOvr.items && parsedOvr.items.length) {
        // Удаляем старые позиции этого периода
        const { error: eDel } = await sb.from('monthly_ovr_items')
          .delete()
          .eq('point_id', point_id)
          .eq('period', period);
        if (eDel) throw eDel;

        // Сохраняем только активные (не excluded)
        const activeItems = parsedOvr.items
          .filter(x => !x.excluded)
          .map(it => ({
            point_id, period,
            section: it.section,
            subsection: it.subsection,
            item_name: it.item_name,
            amount: it.amount,
            category: it.category,
            category_ru: it.category_ru,
            excluded: false,
          }));
        if (activeItems.length) {
          const { error: eIns } = await sb.from('monthly_ovr_items').insert(activeItems);
          if (eIns) throw eIns;
        }
        showToast(`Сохранено: итоги + ${activeItems.length} позиций`, 'ok');
      } else {
        showToast('ОВР сохранён (только итоги)', 'ok');
      }
      loadOvrList();
      // Сбрасываем парсинг (если бухгалтер захочет загрузить ещё один файл — заново)
      parsedOvr = null;
      const prev = document.getElementById('ovr-preview');
      if (prev) prev.innerHTML = '';
    } catch (e) {
      showToast('Ошибка: '+(e.message||e), 'err');
    }
  }

  async function loadOvrList() {
    const el = document.getElementById('ovr-list');
    if (!el) return;
    try {
      const { data, error } = await sb.from('monthly_ovr').select('*').order('period', { ascending:false }).order('point_id');
      if (error) throw error;
      if (!data || data.length === 0) {
        el.innerHTML = '<div style="color:var(--muted);font-size:13px;">Нет загруженных ОВР</div>';
        return;
      }
      const pointName = id => ({kaluga:'Калужская',serpuhov:'Серпуховская',sovhoz:'Совхозная',poyma:'Пойма'}[id] || id);
      const fmt = n => Number(n).toLocaleString('ru-RU', {maximumFractionDigits: 0});
      let html = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
      html += '<tr style="border-bottom:1px solid var(--border);color:var(--muted);"><th style="text-align:left;padding:6px 4px;">Период</th><th style="text-align:left;padding:6px 4px;">Точка</th><th style="text-align:right;padding:6px 4px;">ВСЕГО</th><th style="text-align:right;padding:6px 4px;">СК</th><th style="text-align:right;padding:6px 4px;">Розница</th><th></th></tr>';
      data.forEach(r => {
        html += `<tr style="border-bottom:1px solid var(--border-dim);">
          <td style="padding:6px 4px;">${r.period}</td>
          <td style="padding:6px 4px;">${pointName(r.point_id)}</td>
          <td style="padding:6px 4px;text-align:right;">${fmt(r.total)}</td>
          <td style="padding:6px 4px;text-align:right;color:var(--blue,#60a5fa);">${fmt(r.insurance)}</td>
          <td style="padding:6px 4px;text-align:right;color:var(--green);">${fmt(r.retail)}</td>
          <td style="padding:6px 4px;text-align:right;"><button class="btn secondary" style="padding:3px 8px;font-size:11px;" onclick="deleteOvr('${r.point_id}','${r.period}')">×</button></td>
        </tr>`;
      });
      html += '</table>';
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<div style="color:var(--red);font-size:13px;">Ошибка: '+(e.message||e)+'</div>';
    }
  }

  async function deleteOvr(point_id, period) {
    if (!confirm(`Удалить ОВР ${period} · ${point_id}?`)) return;
    try {
      // Сначала items, потом сам monthly_ovr
      await sb.from('monthly_ovr_items').delete().eq('point_id', point_id).eq('period', period);
      const { error } = await sb.from('monthly_ovr').delete().eq('point_id', point_id).eq('period', period);
      if (error) throw error;
      showToast('Удалено', 'ok');
      loadOvrList();
    } catch (e) {
      showToast('Ошибка: '+(e.message||e), 'err');
    }
  }

  function handleUpload(type, input) {
    const file = input.files[0];
    if (!file) return;
    const status = document.getElementById('status-'+type);
    if (type === 'fot') {
      parseSalaryFile(file, status);
    } else {
      status.style.color = 'var(--orange)';
      status.textContent = '⏳ Файл получен: '+file.name+' · '+(file.size/1024).toFixed(1)+' KB. Парсер в разработке — отправьте файл в чат для импорта.';
    }
  }

  // === Парсер «Начисление зарплаты» ===
  // Excel-файл со множеством листов «январь 26», «февраль 26» и т.д.
  // На каждом листе:
  //   - строки 19+ : сотрудники, col 2 ∈ {Совхозная, Москва, Пойма, Детейлинг}
  //   - строки с col 2 ∈ {стекло, алименты, царапины...} : удержания (привязываем к ФИО)
  // Маппинг точек:
  //   Совхозная → sovhoz, Детейлинг → sovhoz (детейлинг при ней)
  //   Пойма → poyma
  //   Москва: Пешкина Диана → serpuhov, остальные → kaluga
  const SALARY_MONTHS = {
    'январь':1,'февраль':2,'март':3,'апрель':4,'май':5,'июнь':6,
    'июль':7,'август':8,'сентябрь':9,'октябрь':10,'ноябрь':11,'декабрь':12,
  };
  const VALID_SALARY_POINTS = new Set(['Совхозная','Москва','Пойма','Детейлинг']);

  function parseSheetNameToPeriod(name) {
    const n = String(name).trim().toLowerCase();
    // ищем "<месяц> NN" (год двухзначный) или "<месяц> NNNN" (год полный)
    const m = n.match(/(январь|февраль|март|апрель|май|июнь|июль|август|сентябрь|октябрь|ноябрь|декабрь)\s+(\d{2,4})/);
    if (!m) return null;
    const monthNum = SALARY_MONTHS[m[1]];
    let year = parseInt(m[2], 10);
    if (year < 100) year += 2000;
    return `${year}-${String(monthNum).padStart(2,'0')}`;
  }

  function mapSalaryPoint(pointRaw, fio) {
    const p = String(pointRaw || '').trim();
    if (p === 'Совхозная' || p === 'Детейлинг') return 'sovhoz';
    if (p === 'Пойма') return 'poyma';
    if (p === 'Москва') {
      const f = String(fio || '').toLowerCase();
      if (f.includes('пешкина')) return 'serpuhov';
      return 'kaluga';
    }
    return null;
  }

  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    const n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  }

  async function parseSalaryFile(file, status) {
    status.style.color = 'var(--orange)';
    status.textContent = '⏳ Читаю Excel...';
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const entries = [];     // основные строки сотрудников
      const deductions = {};  // ключ "period|fio" → массив extras
      let skippedSheets = [];

      for (const sheetName of wb.SheetNames) {
        const period = parseSheetNameToPeriod(sheetName);
        if (!period) { skippedSheets.push(sheetName); continue; }
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });

        // Идём по строкам начиная с индекса 19 (стандартная позиция первой строки сотрудников)
        // Стоп: встретили "Итого" в col 1, или "УДЕРЖАНИЯ" в col 0
        let phase = 'main';
        for (let i = 19; i < rows.length; i++) {
          const r = rows[i] || [];
          const c0 = r[0], c1 = r[1], c2 = r[2];
          const c0s = String(c0 || '').trim();
          const c1s = String(c1 || '').trim();
          const c2s = String(c2 || '').trim();

          // Маркеры фаз
          if (c0s === 'УДЕРЖАНИЯ' || c0s.toLowerCase().includes('удержания')) { phase = 'deductions'; continue; }
          if (/^итого/i.test(c1s)) { phase = 'after_main'; continue; }
          // Пустая строка
          if (!c1s) continue;

          // Если это сотрудник (валидная точка)
          if (VALID_SALARY_POINTS.has(c2s) && phase === 'main') {
            const point_id = mapSalaryPoint(c2s, c1s);
            entries.push({
              period,
              point_id,
              point_raw: c2s,
              emp_num: parseInt(c0, 10) || null,
              employee: c1s,
              status: String(r[3] || '').trim() || null,
              prev_balance: num(r[4]),
              base_rate: num(r[5]),
              personal_bonus: num(r[6]),
              plan_days: parseInt(r[7], 10) || null,
              fact_time: num(r[8]),
              accr_time: num(r[9]),
              accr_personal: num(r[10]),
              vacation_sick: num(r[11]),
              ural_coef: num(r[12]),
              total_accrued: num(r[13]),
              ndfl: num(r[14]),
              accrued_net: num(r[15]),
              drycleaning: num(r[16]),
              percent_val: num(r[17]),
              total_acc_all: num(r[18]),
              deduction_corr: num(r[19]),
              to_pay: num(r[20]),
              paid_25_bank: num(r[21]),
              paid_25_cash: num(r[22]),
              paid_10_bank: num(r[23]),
              paid_10_cash: num(r[24]),
              unpaid_balance: num(r[25]),
              extras: [],
              source_file: file.name,
            });
            continue;
          }

          // Если это удержание (col 2 — не валидная точка, но что-то есть)
          // Не привязано к конкретной фазе — может быть «Химчистка» в середине или после «УДЕРЖАНИЯ»
          if (c2s && !VALID_SALARY_POINTS.has(c2s)) {
            const amount = num(r[5]);
            if (amount && amount !== 0) {
              const key = `${period}|${c1s.toLowerCase()}`;
              if (!deductions[key]) deductions[key] = [];
              deductions[key].push({ type: c2s, amount });
            }
          }
        }
      }

      // Привязываем удержания к сотрудникам.
      // ФИО в удержаниях часто короче (без отчества), поэтому матчим по «фамилия+имя»
      // (первые 2 слова), а не по полному совпадению.
      const empKey = fio => {
        const parts = String(fio || '').toLowerCase().split(/\s+/).filter(Boolean);
        return parts.slice(0, 2).join(' ');
      };
      // строим индекс period|key → entry для быстрого поиска
      const entryIdx = {};
      for (const e of entries) {
        entryIdx[`${e.period}|${empKey(e.employee)}`] = e;
      }
      let attachedCount = 0, orphanCount = 0;
      const orphans = [];
      // ключи в deductions сейчас полное-fio.lower() — перестроим в short-key
      const dedShort = {};
      for (const [k, list] of Object.entries(deductions)) {
        const [period, fioFull] = k.split('|');
        const short = `${period}|${empKey(fioFull)}`;
        if (!dedShort[short]) dedShort[short] = [];
        dedShort[short].push(...list);
      }
      for (const [k, list] of Object.entries(dedShort)) {
        const e = entryIdx[k];
        if (e) {
          e.extras.push(...list);
          attachedCount += list.length;
        } else {
          orphans.push({ key: k, items: list });
          orphanCount += list.length;
        }
      }
      if (orphans.length) console.warn('Удержания без сотрудника:', orphans);

      status.textContent = `⏳ Загружаю ${entries.length} строк в БД...`;

      // Грузим в БД через upsert (по уникальному ключу period+point_raw+employee)
      const BATCH = 100;
      let imported = 0;
      for (let i = 0; i < entries.length; i += BATCH) {
        const chunk = entries.slice(i, i + BATCH);
        const { error } = await sb.from('salary_entries')
          .upsert(chunk, { onConflict: 'period,point_raw,employee' });
        if (error) throw error;
        imported += chunk.length;
        status.textContent = `⏳ Загружено ${imported}/${entries.length}...`;
      }

      status.style.color = 'var(--green)';
      let summary = `✅ ${imported} строк загружено · ${attachedCount} удержаний прикреплено`;
      if (orphanCount > 0) summary += ` · ⚠ ${orphanCount} удержаний без сотрудника`;
      if (skippedSheets.length) summary += ` · пропущено листов: ${skippedSheets.join(', ')}`;
      status.textContent = summary;
    } catch (e) {
      console.error('Salary parse error:', e);
      status.style.color = 'var(--red)';
      status.textContent = `❌ Ошибка: ${e.message || e}`;
    }
  }

  // === МОДАЛЫ ===
  function openModal(title, body, onSave) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = body;
    document.getElementById('modal-foot').innerHTML = `
      <button class="btn secondary" onclick="closeModal()">Отмена</button>
      <button class="btn" id="modal-save">Сохранить</button>`;
    document.getElementById('modal-save').onclick = onSave;
    document.getElementById('modal').classList.add('show');
  }
  function closeModal() { document.getElementById('modal').classList.remove('show'); }

  function addExpense() {
    const body = `
      <div class="form-group">
        <label class="form-label">Юрлицо</label>
        <select class="form-select" id="m-entity">
          <option value="plaza">ПЛАЗА</option>
          <option value="ip_rkv">ИП РКВ</option>
          <option value="ip_shap">ИП ШАП</option>
          <option value="trak">ТРАК</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Категория</label>
        <select class="form-select" id="m-category">
          ${Object.entries(EXPENSE_CATS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Сумма ₽</label>
        <input class="form-input" id="m-amount" type="number" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Комментарий</label>
        <input class="form-input" id="m-notes" placeholder="например: переплата за апрель">
      </div>
    `;
    openModal('Добавить разовый расход', body, async () => {
      const entity = document.getElementById('m-entity').value;
      const cat = document.getElementById('m-category').value;
      const amount = +document.getElementById('m-amount').value;
      const notes = document.getElementById('m-notes').value;
      if (!amount) { showToast('Введите сумму', 'err'); return; }
      try {
        await sb.from('expenses_monthly').insert({
          period: data.period, entity_id: entity, category: cat, amount, notes
        });
        showToast('Сохранено', 'ok');
        closeModal();
        loadAll();
      } catch (e) { showToast('Ошибка: '+(e.message||e), 'err'); }
    });
  }

  function addLoan() {
    const body = `
      <div class="form-group">
        <label class="form-label">Тип</label>
        <select class="form-select" id="m-type">
          <option value="credit">Кредит</option>
          <option value="lease">Лизинг</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Банк / Лизинговая компания</label>
        <input class="form-input" id="m-bank" placeholder="Тинькофф / Альфа-Банк / Европлан">
      </div>
      <div class="form-group">
        <label class="form-label">Юрлицо</label>
        <select class="form-select" id="m-entity">
          <option value="plaza">ПЛАЗА</option>
          <option value="ip_rkv">ИП РКВ</option>
          <option value="ip_shap">ИП ШАП</option>
          <option value="trak">ТРАК</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Первоначальная сумма</label>
        <input class="form-input" id="m-initial" type="number" placeholder="3000000">
      </div>
      <div class="form-group">
        <label class="form-label">Остаток долга сейчас</label>
        <input class="form-input" id="m-remaining" type="number" placeholder="2200000">
      </div>
      <div class="form-group">
        <label class="form-label">Платёж в месяц</label>
        <input class="form-input" id="m-monthly" type="number" placeholder="138000">
      </div>
      <div class="form-group">
        <label class="form-label">Дата окончания</label>
        <input class="form-input" id="m-enddate" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">Описание</label>
        <input class="form-input" id="m-desc" placeholder="например: лизинг на Газель">
      </div>
    `;
    openModal('Добавить кредит/лизинг', body, async () => {
      const type = document.getElementById('m-type').value;
      const bank = document.getElementById('m-bank').value.trim();
      const entity = document.getElementById('m-entity').value;
      const initial = +document.getElementById('m-initial').value || null;
      const remaining = +document.getElementById('m-remaining').value || null;
      const monthly = +document.getElementById('m-monthly').value;
      const endDate = document.getElementById('m-enddate').value || null;
      const desc = document.getElementById('m-desc').value.trim();
      if (!bank || !monthly) { showToast('Заполните банк и платёж', 'err'); return; }
      try {
        await sb.from('loans_leases').insert({
          type, bank, entity_id: entity, initial_amount: initial,
          remaining_debt: remaining, monthly_payment: monthly,
          end_date: endDate, description: desc, active: true
        });
        showToast('Сохранено', 'ok');
        closeModal();
        loadAll();
      } catch (e) { showToast('Ошибка: '+(e.message||e), 'err'); }
    });
  }

  // === ИНИЦИАЛИЗАЦИЯ ===
  document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (sessionStorage.getItem('rgp_buh') === '1') enterApp();
</script>
<script>
// === PWA: регистрация Service Worker ===
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(reg => {
        console.log("[PWA] SW registered");
        reg.addEventListener("updatefound", () => {
          const newSW = reg.installing;
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              showPwaUpdateBanner();
            }
          });
        });
      })
      .catch(err => console.warn("[PWA] SW failed:", err));
  });
}
function showPwaUpdateBanner() {
  if (document.getElementById("pwa-update")) return;
  if (!document.getElementById("pwa-update-style")) {
    const st = document.createElement("style");
    st.id = "pwa-update-style";
    st.textContent = `
      @keyframes pwaDrop { from { transform:translate(-50%,-26px); opacity:0; } to { transform:translate(-50%,0); opacity:1; } }
      @keyframes pwaPulse { 0%,100% { box-shadow:0 0 0 0 rgba(232,184,75,.55); } 50% { box-shadow:0 0 0 8px rgba(232,184,75,0); } }
      #pwa-update { animation: pwaDrop .35s ease; }
      #pwa-update button { animation: pwaPulse 1.6s ease-in-out infinite; }
    `;
    document.head.appendChild(st);
  }
  const b = document.createElement("div");
  b.id = "pwa-update";
  b.style.cssText = "position:fixed;top:16px;left:50%;transform:translateX(-50%);" +
    "width:calc(100% - 28px);max-width:440px;background:linear-gradient(135deg,#f0c456,#e8b84b);" +
    "border:2px solid #fff3d6;border-radius:14px;padding:14px 16px;display:flex;" +
    "justify-content:space-between;align-items:center;gap:12px;z-index:100000;" +
    "font-family:Inter,sans-serif;color:#1a1407;box-shadow:0 14px 40px rgba(0,0,0,.55);";
  b.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
      '<span style="font-size:22px;line-height:1;">🔄</span>' +
      '<div style="min-width:0;">' +
        '<div style="font-weight:800;font-size:15px;letter-spacing:.2px;">Доступно обновление</div>' +
        '<div style="font-size:12px;opacity:.8;">Нажми «Обновить», чтобы загрузить новую версию</div>' +
      '</div>' +
    '</div>' +
    '<button style="flex:none;background:#1a1407;color:#f0c456;border:none;padding:11px 20px;' +
      'border-radius:9px;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;" ' +
      'onclick="pwaApplyUpdate()">Обновить</button>';
  document.body.appendChild(b);
}
function pwaApplyUpdate() {
  navigator.serviceWorker.getRegistration().then(reg => {
    if (reg && reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    setTimeout(() => location.reload(), 300);
  });
}
function showOfflineIndicator() {
  if (document.getElementById("pwa-offline")) return;
  const el = document.createElement("div");
  el.id = "pwa-offline";
  el.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(244,67,54,.95);color:#fff;padding:6px 14px;border-radius:6px;z-index:9999;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px;box-shadow:0 4px 16px rgba(0,0,0,.4);";
  el.textContent = "📡 Нет связи · работаю с кэшем";
  document.body.appendChild(el);
}
function hideOfflineIndicator() {
  const el = document.getElementById("pwa-offline");
  if (el) el.remove();
}
window.addEventListener("online", hideOfflineIndicator);
window.addEventListener("offline", showOfflineIndicator);
if (!navigator.onLine) showOfflineIndicator();
</script>
