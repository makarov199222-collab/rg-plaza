<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>RG Plaza — Дашборд руководителя</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* RG PLAZA — стиль фирменного сайта */
  :root {
    --bg:#1a1a1a;
    --surface:#222222;
    --surface2:#2a2a2a;
    --border:#333333;
    --accent:#e8b84b;
    --blue:#2196f3;
    --text:#ffffff;
    --muted:#909090;
    --green:#4caf50;
    --purple:#9c27b0;
    --red:#f44336;
    --orange:#ff9800;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}

  .login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .login.hidden{display:none;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);letter-spacing:5px;margin-bottom:8px;line-height:1;}
  .login-sub{font-size:11px;color:var(--muted);letter-spacing:5px;font-weight:600;margin-bottom:36px;text-transform:uppercase;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 24px;width:100%;max-width:360px;}
  .login-title{font-size:14px;font-weight:600;margin-bottom:18px;text-align:center;}
  .login-input{width:100%;background:#141414;border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:500;outline:none;text-align:center;letter-spacing:1px;-webkit-appearance:none;transition:border-color .15s;}
  .login-input:focus{border-color:var(--accent);}
  .login-btn{width:100%;margin-top:12px;padding:14px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;transition:filter .15s,transform .05s;}
  .login-btn:active{transform:scale(.99);filter:brightness(1.08);}
  .login-err{margin-top:10px;font-size:13px;color:var(--red);text-align:center;min-height:18px;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:3px;line-height:1;}
  .logo span{color:#b8b8b8;font-size:9px;display:block;letter-spacing:2.5px;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;margin-top:3px;}
  .month-pick{margin-left:auto;background:#141414;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;outline:none;transition:border-color .15s;}
  .month-pick:focus, .month-pick:hover{border-color:var(--accent);}
  .refresh-btn{background:#141414;border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--accent);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;}
  .refresh-btn:hover{border-color:var(--accent);}

  .wrap{padding:18px;max-width:1400px;margin:0 auto;}

  .top-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .top-tab{flex:1;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
  .top-tab.active{background:var(--accent);color:#000;border-color:var(--accent);}

  .tab-page{display:none;} .tab-page.active{display:block;}

  .city-section{margin-bottom:24px;}
  .city-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .city-title::before{content:'';width:24px;height:2px;background:var(--accent);}
  .city-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px;}
  .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .hero-card.acc{border-color:rgba(232,184,75,.5);}
  .hero-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;}
  .hero-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);line-height:1;letter-spacing:1px;}
  .hero-val.b{color:var(--blue);} .hero-val.g{color:var(--green);} .hero-val.p{color:var(--purple);} .hero-val.t{color:var(--text);}
  .hero-sub{font-size:11px;color:var(--muted);margin-top:5px;}

  .points-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-bottom:18px;}
  .point-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .point-card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .point-card-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;}
  .point-card-days{margin-left:auto;font-size:11px;color:var(--muted);background:#141414;padding:4px 10px;border-radius:5px;font-weight:600;}
  .point-card-body{padding:14px;}
  .pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .pc-stat{background:#141414;border:1px solid var(--border);border-radius:8px;padding:10px;}
  .pc-stat-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
  .pc-stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;}
  .pc-stat-val.t{color:var(--accent);} .pc-stat-val.b{color:var(--blue);} .pc-stat-val.g{color:var(--green);} .pc-stat-val.p{color:var(--purple);}

  .pc-plan{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px;margin-bottom:8px;}
  .pc-plan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .pc-plan-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
  .pc-plan-title.g{color:var(--green);} .pc-plan-title.p{color:var(--purple);}
  .pc-plan-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;}
  .pc-plan-pct.ok{color:var(--green);} .pc-plan-pct.warn{color:var(--orange);} .pc-plan-pct.bad{color:var(--red);}
  .pc-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:5px;}
  .pc-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
  .pc-bar-fill.g{background:var(--green);} .pc-bar-fill.p{background:var(--purple);} .pc-bar-fill.r{background:var(--red);}
  .pc-plan-text{font-size:10px;color:var(--muted);}

  .pc-chart{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:10px;}
  .pc-chart-title{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}

  /* Plan editor */
  .plan-editor{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .plan-editor-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .plan-editor-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;}
  .plan-editor-city{font-size:10px;color:var(--muted);font-weight:600;background:#141414;padding:4px 9px;border-radius:5px;letter-spacing:.5px;text-transform:uppercase;}
  .plan-editor-status{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;}
  .plan-editor-status.saved{color:var(--green);}
  .plan-editor-status.saving{color:var(--orange);}
  .plan-editor-body{padding:14px;}
  .plan-fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width: 600px) { .plan-fields-grid{grid-template-columns:1fr;} }
  .plan-field{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px;}
  .plan-field.g{border-left:3px solid var(--green);} .plan-field.p{border-left:3px solid var(--purple);}
  .plan-field-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
  .plan-field-lbl.g{color:var(--green);} .plan-field-lbl.p{color:var(--purple);}
  .plan-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;outline:none;-webkit-appearance:none;}
  .plan-field input:focus{border-color:var(--accent);}
  .plan-field input::placeholder{color:var(--border);}
  .plan-field.g input{color:var(--green);}
  .plan-field.p input{color:var(--purple);}

  .plan-helper{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6;padding:11px;background:#141414;border-radius:8px;}
  .plan-helper b{color:var(--text);}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}
  .loader{display:flex;justify-content:center;align-items:center;padding:60px;color:var(--muted);font-size:14px;}
  .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* === Картина учредителей === */
  .ow-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
  .ow-kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;}
  .ow-kpi.acc{border-color:rgba(232,184,75,.5);}
  .ow-kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;}
  .ow-kpi-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);line-height:1;letter-spacing:1px;}
  .ow-kpi-val.b{color:var(--blue);} .ow-kpi-val.g{color:var(--green);} .ow-kpi-val.p{color:var(--purple);}
  .ow-kpi-sub{font-size:11px;color:var(--muted);margin-top:7px;}
  .ow-delta{font-weight:600;}
  .ow-delta.up{color:var(--green);} .ow-delta.down{color:var(--red);}
  .ow-progress{margin-top:8px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .ow-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}
  .ow-progress-fill.green{background:var(--green);}
  .ow-progress-fill.red{background:var(--red);}

  .ow-heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  @media (max-width: 600px){ .ow-heroes{grid-template-columns:1fr;} }
  .ow-hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .ow-hero.leader{border-color:rgba(76,175,80,.4);}
  .ow-hero.outsider{border-color:rgba(244,67,54,.35);}
  .ow-hero-icon{font-size:24px;margin-bottom:6px;}
  .ow-hero-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px;}
  .ow-hero.leader .ow-hero-lbl{color:var(--green);}
  .ow-hero.outsider .ow-hero-lbl{color:var(--red);}
  .ow-hero-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--text);margin-bottom:7px;}
  .ow-hero-amount{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--accent);letter-spacing:1px;}
  .ow-hero-note{font-size:11px;color:var(--muted);margin-top:7px;}

  .ow-chart-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px;}
  @media (max-width: 900px){ .ow-chart-row{grid-template-columns:1fr;} }
  .ow-chart-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .ow-chart-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:2px;margin-bottom:13px;}
  .ow-chart-wrap{position:relative;height:240px;}

  .ow-points{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
  .ow-pc-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .ow-pc-row:last-child{margin-bottom:0;}
  .ow-pc-name{flex:0 0 130px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--text);}
  .ow-pc-bar-wrap{flex:1;height:24px;background:#141414;border-radius:6px;overflow:hidden;position:relative;}
  .ow-pc-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#d4a342);border-radius:6px;transition:width .5s;}
  .ow-pc-bar-text{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:'Bebas Neue',sans-serif;font-size:13px;color:#000;font-weight:600;letter-spacing:.5px;}
  .ow-pc-pct{flex:0 0 60px;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;}
  .ow-pc-pct.ok{color:var(--green);} .ow-pc-pct.warn{color:var(--orange);} .ow-pc-pct.bad{color:var(--red);} .ow-pc-pct.muted{color:var(--muted);}

  .ow-finance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  @media (max-width: 600px){ .ow-finance{grid-template-columns:1fr;} }
  .ow-finance-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .ow-finance-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;margin-bottom:11px;}
  .ow-finance-title.debt{color:var(--orange);}
  .ow-finance-title.owe{color:var(--red);}
  .ow-finance-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text);margin-bottom:9px;letter-spacing:1px;}
  .ow-finance-sub{font-size:11px;color:var(--muted);line-height:1.6;}

  .ow-copy{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
  .ow-copy-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:2px;margin-bottom:13px;}
  .ow-copy-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
  .ow-copy-btn{padding:11px 14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;cursor:pointer;transition:filter .15s,transform .05s;}
  .ow-copy-btn:active{transform:scale(.99);filter:brightness(1.08);}
  .ow-copy-btn.secondary{background:var(--surface2);color:var(--accent);border:1px solid var(--accent);}

  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 18px;font-size:13px;color:var(--text);z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;border-left:3px solid var(--accent);}
  .toast.show{opacity:1;}
  .toast.ok{border-left-color:var(--green);}
  .toast.err{border-left-color:var(--red);}

  @media (max-width: 600px) {
    .points-grid{grid-template-columns:1fr;}
    .hero{grid-template-columns:1fr 1fr;}
    .hero-val{font-size:24px;}
    header{padding:11px 13px;gap:8px;}
    .logo{font-size:20px;}
    .wrap{padding:13px;}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-logo">RG PLAZA</div>
  <div class="login-sub">ДАШБОРД РУКОВОДИТЕЛЯ</div>
  <div class="login-card">
    <div class="login-title">Введи админ-код</div>
    <input type="password" class="login-input" id="login-code" placeholder="Админ-код" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">ВОЙТИ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app" style="display:none;">

<header>
  <div class="logo">RG Plaza <span>ДАШБОРД</span></div>
  <input type="month" class="month-pick" id="month-pick" onchange="loadAll()">
  <button class="refresh-btn" onclick="loadAll()" title="Обновить">↻</button>
</header>

<div class="wrap">
  <div class="top-tabs">
    <button class="top-tab active" onclick="showPage('overview')">📊 Обзор</button>
    <button class="top-tab" onclick="showPage('plans')">🎯 Планы</button>
    <button class="top-tab" onclick="showPage('myreport')">📋 Мой отчёт</button>
    <button class="top-tab" onclick="showPage('owners')">👔 Учредителям</button>
  </div>

  <div class="tab-page active" id="page-overview">
    <div id="overview-content"><div class="loader"><div class="spinner"></div>Загружаю данные...</div></div>
  </div>

  <div class="tab-page" id="page-plans">
    <div id="plans-content"><div class="loader"><div class="spinner"></div>Загружаю планы...</div></div>
  </div>

  <div class="tab-page" id="page-myreport">
    <div id="myreport-content"><div class="loader"><div class="spinner"></div>Подготавливаю отчёт...</div></div>
  </div>

  <div class="tab-page" id="page-owners">
    <div id="owners-content"><div class="loader"><div class="spinner"></div>Подготавливаю картину для учредителей...</div></div>
  </div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://uxdgiwbkvgbnrsuxjhvp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bg1BRofqJsjkV_9eXzn2Pg__YJ-xRMK';
  const ADMIN_CODE = 'rgplaza-admin-2026';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let allCharts = [];
  let cachedData = null;
  let saveTimers = {};

  function doLogin() {
    const code = document.getElementById('login-code').value.trim();
    if (code === ADMIN_CODE) { sessionStorage.setItem('rgp_admin', '1'); enterApp(); }
    else { document.getElementById('login-err').textContent = 'Неверный код'; }
  }

  function enterApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    const now = new Date();
    document.getElementById('month-pick').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    loadAll();
  }

  function showPage(p) {
    document.querySelectorAll('.tab-page').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.top-tab').forEach(x => x.classList.remove('active'));
    document.getElementById('page-'+p).classList.add('active');
    event.target.classList.add('active');
    if (p === 'plans' && cachedData) renderPlans(cachedData);
    if (p === 'myreport' && cachedData) renderMyReport(cachedData);
    if (p === 'owners' && cachedData) renderOwnersView();
  }

  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type||'');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function fm(n) { return n ? Number(n).toLocaleString('ru-RU') : '0'; }
  function fs(n) { if (!n) return '0'; if (n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+' М'; if (n>=1000) return Math.round(n/1000)+' К'; return String(n); }
  function pdate(iso) { const [y,m,d]=iso.split('-'); return `${d}.${m}`; }

  // Рабочие дни в месяце с учётом графика
  function workDaysInMonth(year, month1, work_days) {
    const wd = work_days || 7;
    const total = new Date(year, month1, 0).getDate();
    if (wd >= 7) return total;
    let count = 0;
    for (let d = 1; d <= total; d++) {
      const day = new Date(year, month1-1, d).getDay();
      if (day !== 0) count++;
    }
    return count;
  }
  function workDaysPassed(year, month1, dayNum, work_days) {
    const wd = work_days || 7;
    if (wd >= 7) return dayNum;
    let count = 0;
    for (let d = 1; d <= dayNum; d++) {
      const day = new Date(year, month1-1, d).getDay();
      if (day !== 0) count++;
    }
    return count;
  }
  function getMonthRange() {
    const v = document.getElementById('month-pick').value || new Date().toISOString().substring(0,7);
    const [y,m] = v.split('-');
    return { start: `${y}-${m}-01`, end: new Date(+y, +m, 0).toISOString().split('T')[0], year:+y, month:+m };

  async function loadAll() {

    document.getElementById('plans-content').innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю планы...</div>';

    allCharts = [];
    ownersExtraData = null; // сбрасываем кэш учредительского вида при смене месяца

    const range = getMonthRange();
    try {
      const [pointsRes, reportsRes, plansRes] = await Promise.all([
        sb.from('points').select('*').order('id'),
        sb.from('daily_reports').select('*').gte('date', range.start).lte('date', range.end).order('date'),
        sb.from('plans').select('*')
      ]);
      if (pointsRes.error) throw pointsRes.error;
      if (reportsRes.error) throw reportsRes.error;
      if (plansRes.error) throw plansRes.error;
      cachedData = { points: pointsRes.data || [], reports: reportsRes.data || [], plans: plansRes.data || [], range };

  function aggregateByPoint(data) {
    const byPoint = {};
    data.points.forEach(p => byPoint[p.id] = {
      point: p,
      reports: [],
      plan: data.plans.find(pl => pl.point_id === p.id) || { plan_phys_day: 0, plan_phys_month: 0, plan_corp_day: 0, plan_corp_month: 0 }
    });
    data.reports.forEach(r => { if (byPoint[r.point_id]) byPoint[r.point_id].reports.push(r); });
    return byPoint;
  }

  function renderPointCard(entry, range) {
    const { point, reports, plan } = entry;
    let t=0,i=0,phys=0,c=0;
    reports.forEach(d => { t+=+d.total_day||0; i+=+d.ins_day||0; phys+=+d.phys_day||0; c+=+d.corp_day||0; });

    function progressBlock(title, cls, plan, actual) {
      if (!plan) return `<div class="pc-plan"><div class="pc-plan-head"><div class="pc-plan-title ${cls}">${title}</div><div class="pc-plan-pct">—</div></div><div class="pc-plan-text">План не задан</div></div>`;
      const pct = Math.round(actual/plan*100);
      const pctCls = pct >= 90 ? 'ok' : pct >= 70 ? 'warn' : 'bad';
      const today = new Date();
      const totalWork = workDaysInMonth(range.year, range.month, point.work_days);
      const passedWork = (today.getFullYear() === range.year && today.getMonth()+1 === range.month)
        ? workDaysPassed(range.year, range.month, today.getDate(), point.work_days)
        : totalWork;
      const expected = Math.round(plan / totalWork * passedWork);
      return `<div class="pc-plan">
        <div class="pc-plan-head">
          <div class="pc-plan-title ${cls}">${title}</div>
          <div class="pc-plan-pct ${pctCls}">${pct}%</div>
        </div>
        <div class="pc-bar"><div class="pc-bar-fill ${cls}" style="width:${Math.min(100,pct)}%"></div></div>
        <div class="pc-plan-text">${fm(actual)} / ${fm(plan)} ₽ · По графику: ${fm(expected)} ₽${actual >= expected ? ' (опережение)' : ` (отставание ${fm(expected-actual)})`}</div>
      </div>`;
    }

    return `
      <div class="point-card">
        <div class="point-card-head">
          <div class="point-card-name">${point.name}</div>
          <div class="point-card-days">${reports.length} дн.</div>
        </div>
        <div class="point-card-body">
          <div class="pc-stats">
            <div class="pc-stat"><div class="pc-stat-lbl">Всего</div><div class="pc-stat-val t">${fm(t)} ₽</div></div>
            <div class="pc-stat"><div class="pc-stat-lbl">Страховые</div><div class="pc-stat-val b">${fm(i)} ₽</div></div>
            <div class="pc-stat"><div class="pc-stat-lbl">Физлица</div><div class="pc-stat-val g">${fm(phys)} ₽</div></div>
            <div class="pc-stat"><div class="pc-stat-lbl">Корпоратив</div><div class="pc-stat-val p">${fm(c)} ₽</div></div>
          </div>
          ${progressBlock('Физлица', 'g', plan.plan_phys_month, phys)}
          ${progressBlock('Корпоратив', 'p', plan.plan_corp_month, c)}
          ${reports.length ? `<div class="pc-chart"><div class="pc-chart-title">📈 Физ vs Корп по дням</div><canvas id="chart-${point.id}" height="120"></canvas></div>` : ''}
        </div>
      </div>`;
  }

      responsive: true,
      plugins: { legend: { display: !!showLegend, labels: { color: '#ffffff', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#909090', font: { size: 9 } }, grid: { color: '#333333' } },
        y: { ticks: { color: '#909090', font: { size: 9 }, callback: v => fs(v) }, grid: { color: '#333333' } }

  function renderPlanEditor(entry) {

    const now = new Date();
    const totalWork = workDaysInMonth(now.getFullYear(), now.getMonth()+1, wd);
    const autoPhysDay = plan.plan_phys_month ? Math.round(plan.plan_phys_month / totalWork) : 0;

        <div class="plan-editor-body">

              <input type="number" placeholder="${autoPhysDay || '0'}" value="${plan.plan_phys_day || ''}" data-pid="${point.id}" data-field="plan_phys_day" oninput="onPlanInput(this)">

            </div>

  // При вводе месячного плана — автоматически обновляем подсказку дневного, если он пуст
  function onPlanInput(input) {
    const pid = input.dataset.pid;
    const field = input.dataset.field;
    const pair = input.dataset.pair; // если изменили "месяц" — авто-обновить парное "день"

    if (pair) {
      // Это поле "месяц" — обновим парное поле "день" если оно пустое
      const pairInput = document.querySelector(`input[data-pid="${pid}"][data-field="${pair}"]`);
      if (pairInput) {
        const point = cachedData.points.find(p => p.id === pid);
        const wd = point?.work_days || 7;
        const now = new Date();
        const totalWork = workDaysInMonth(now.getFullYear(), now.getMonth()+1, wd);
        const monthVal = +input.value || 0;
        const autoDay = monthVal && totalWork ? Math.round(monthVal / totalWork) : 0;
        // Обновляем placeholder
        pairInput.placeholder = autoDay || '0';
        // Если поле "день" пустое — авто-заполним
        if (!pairInput.value || pairInput.value === '0') {
          pairInput.value = autoDay || '';
        }
      }
    }

    const status = document.getElementById('plan-status-'+pid);
    status.className = 'plan-editor-status saving';
    status.textContent = '⌛ сохраняю...';
    if (saveTimers[pid]) clearTimeout(saveTimers[pid]);
    saveTimers[pid] = setTimeout(() => savePlan(pid), 1000);
  }

  async function savePlan(pid) {
    const inputs = document.querySelectorAll(`input[data-pid="${pid}"]`);
    const payload = { point_id: pid, updated_at: new Date().toISOString() };
    inputs.forEach(i => { payload[i.dataset.field] = +i.value || 0; });
    const status = document.getElementById('plan-status-'+pid);
    try {
      const { error } = await sb.from('plans').upsert(payload, { onConflict: 'point_id' });
      if (error) throw error;
      // Обновляем кэш локально
      if (cachedData) {
        const existing = cachedData.plans.find(p => p.point_id === pid);
        if (existing) Object.assign(existing, payload);
        else cachedData.plans.push(payload);
      }
      status.className = 'plan-editor-status saved';
      status.textContent = '✓ сохранено';
    } catch (e) {
      console.error(e);
      status.className = 'plan-editor-status';
      status.style.color = 'var(--red)';
      status.textContent = '⚠ ошибка';
      toast('Ошибка сохранения плана', 'err');
    }
  }

  function renderPointReport(point, data, dayReport, yearData, dateStr) {
    const r = dayReport || {};
    const range = data.range;

    // Накопленное за год (по этой точке)
    let ytdTotal=0, ytdRetail=0, ytdIns=0;
    yearData.filter(d => d.point_id === point.id).forEach(d => {
      ytdTotal += +d.total_day || 0;
      ytdRetail += +d.retail_day || 0;
      ytdIns += +d.ins_day || 0;
    });
    const yearTotal = (+point.year_start_total || 0) + ytdTotal;
    const yearRetail = (+point.year_start_retail || 0) + ytdRetail;
    const yearIns = (+point.year_start_insurance || 0) + ytdIns;

    // Месячные суммы
    const monthReports = data.reports.filter(rep => rep.point_id === point.id);
    let mTotal=0, mRetail=0, mIns=0;
    monthReports.forEach(d => { mTotal+=+d.total_day||0; mRetail+=+d.retail_day||0; mIns+=+d.ins_day||0; });

    // Парсим дату
    const [y,mo,d] = dateStr.split('-');
    const dateRu = `${d}.${mo}.${y.substring(2)}`;
    const nextDate = (() => {
      const dt = new Date(+y, +mo-1, +d+1);
      return `${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}`;
    })();

    // Дневные суммы
    const dTotal = +r.total_day || 0;
    const dRetail = +r.retail_day || 0;
    const dIns = +r.ins_day || 0;

    // Долги
    const debtTotal = +r.debt_total || 0;
    const debtRetail = +r.debt_retail || 0;
    const debtIns = +r.debt_insurance || 0;

    // Мы должны
    const oweTotal = +r.owe_total || 0;
    const oweRavt = +r.owe_ravt || 0;
    const oweOther = +r.owe_other || 0;

    const maxSubs = +r.max_subs || 0;
    const reviews = +r.reviews || 0;
    const bookings = +r.bookings || 0;
    const flow = +r.flow_directions || 0;

    const reportText =
`Отчёт ${dateRu}

${point.name}

1) Годовой вал:
${fm(yearTotal)}
${fm(yearRetail)} (розница) 
${fm(yearIns)} (страховые)

2) Вал месячный:
${fm(mTotal)}
${fm(mRetail)} (розница) 
${fm(mIns)} (страховые)

3) Вал день: 
${fm(dTotal)}
${fm(dRetail)} (розница) 
${fm(dIns)} (страховые) 

4) количество подписок MAX за день:
${maxSubs}

5) запись на ${nextDate} общая:
${bookings}

6) долги по заказ нарядам , общая сумма не погашенных заказ нарядов:
${fm(debtTotal)}
${fm(debtRetail)} (розница) 
${fm(debtIns)} (страховые) 

7)Мы должны:
${fm(oweTotal)}
${fm(oweRavt)} (РАВТ) 
${fm(oweOther)} (Остальные) 

8)Отзывы:
${reviews}

9)Поток направлений:
${point.name} ${flow}`;

    return `
      <div data-city="${point.format === 'izhevsk' ? 'izhevsk' : 'moscow'}" style="background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;">
        <div style="padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:1.5px;">${point.name}</div>
          <button onclick="copyReport('rep-${point.id}', this)" style="margin-left:auto;background:var(--accent);color:#000;border:none;padding:7px 14px;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;">📋 Скопировать</button>
        </div>
        <pre id="rep-${point.id}" style="margin:0;padding:14px;font-family:monospace;font-size:13px;line-height:1.6;color:var(--text);background:var(--bg);white-space:pre-wrap;overflow-x:auto;">${reportText}</pre>
      </div>`;
  }

  function copyReport(elId, btn) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = '✓ скопировано';
      btn.style.background = 'var(--green)';
      setTimeout(() => { btn.textContent = orig; btn.style.background = 'var(--accent)'; }, 1500);
    });
  }

  function copyAllReports() {
    const blocks = document.querySelectorAll('pre[id^="rep-"]');
    const all = Array.from(blocks).map(b => b.textContent).join('\n\n———\n\n');
    navigator.clipboard.writeText(all).then(() => toast('Все отчёты скопированы', 'ok'));

  function copyCityReports(city) {
    const wrappers = document.querySelectorAll(`div[data-city="${city}"]`);
    const texts = Array.from(wrappers).map(w => w.querySelector('pre').textContent);

    const pid = input.dataset.pid;
    const status = document.getElementById('ystatus-'+pid);
    status.textContent = '⌛';
    status.style.color = 'var(--orange)';

  async function saveYearStart(pid) {
    const inputs = document.querySelectorAll(`input[data-pid="${pid}"][data-field^="year_start_"]`);
    const payload = {};
    inputs.forEach(i => { payload[i.dataset.field] = +i.value || 0; });
    const status = document.getElementById('ystatus-'+pid);
    try {
      const { error } = await sb.from('points').update(payload).eq('id', pid);
      if (error) throw error;
      // Обновляем кэш
      if (cachedData) {
        const p = cachedData.points.find(x => x.id === pid);
        if (p) Object.assign(p, payload);
      }
      status.textContent = '✓';
      status.style.color = 'var(--green)';
      // Перерендерить отчёты с новыми значениями
      renderMyReport(cachedData);
    } catch (e) {
      console.error(e);
      status.textContent = '⚠';
      status.style.color = 'var(--red)';
      toast('Ошибка сохранения', 'err');
    }
  }

  // ============ OWNERS VIEW (картина для учредителей) ============
  let ownersExtraData = null; // кэш для prev месяца и года

  async function fetchOwnersExtra(range) {
    const prevMonth = range.month === 1 ? 12 : range.month - 1;
    const prevYear = range.month === 1 ? range.year - 1 : range.year;
    const prevStart = `${prevYear}-${String(prevMonth).padStart(2,'0')}-01`;
    const prevEnd = new Date(prevYear, prevMonth, 0).toISOString().split('T')[0];
    const yearStart = `${range.year}-01-01`;

    const [prevRes, yearRes] = await Promise.all([
      sb.from('daily_reports').select('point_id,total_day').gte('date', prevStart).lte('date', prevEnd),
      sb.from('daily_reports').select('point_id,total_day,retail_day,ins_day').gte('date', yearStart).lte('date', range.end)
    ]);
    return { prev: prevRes.data || [], year: yearRes.data || [] };
  }

          <div class="ow-kpi-val g">${fm(avgDay)} ₽</div>

      <div class="ow-points">

  function buildOwnersText(filter) {
    const data = cachedData;
    if (!data || !ownersExtraData) return '';
    const mn = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const monthName = mn[data.range.month-1];

    let points = data.points;
    let title;
    if (filter === 'moscow') { points = points.filter(p => p.format !== 'izhevsk'); title = 'Москва'; }
    else if (filter === 'izhevsk') { points = points.filter(p => p.format === 'izhevsk'); title = 'Ижевск'; }
    else { title = 'Сеть RG Plaza'; }

    const pointIds = points.map(p => p.id);
    const filteredCurrent = data.reports.filter(r => pointIds.includes(r.point_id));
    const filteredPrev = ownersExtraData.prev.filter(r => pointIds.includes(r.point_id));
    const filteredYear = ownersExtraData.year.filter(r => pointIds.includes(r.point_id));

    let mTotal=0, mIns=0, mRet=0, mPhys=0, mCorp=0;
    filteredCurrent.forEach(r => {
      mTotal += +r.total_day||0; mIns += +r.ins_day||0; mRet += +r.retail_day||0;
      mPhys += +r.phys_day||0; mCorp += +r.corp_day||0;
    });
    let pTotal=0; filteredPrev.forEach(r => pTotal += +r.total_day||0);
    const delta = pTotal ? Math.round((mTotal - pTotal) / pTotal * 100) : null;

    let yTotal=0, yRet=0, yIns=0;
    filteredYear.forEach(r => { yTotal += +r.total_day||0; yRet += +r.retail_day||0; yIns += +r.ins_day||0; });
    points.forEach(p => {
      yTotal += +p.year_start_total||0; yRet += +p.year_start_retail||0; yIns += +p.year_start_insurance||0;
    });

    let totalPlan = 0;
    data.plans.filter(pl => pointIds.includes(pl.point_id)).forEach(pl => {
      totalPlan += (+pl.plan_phys_month||0) + (+pl.plan_corp_month||0);
    });
    const planPct = totalPlan ? Math.round((mPhys + mCorp) / totalPlan * 100) : null;

    const byPoint = {};
    points.forEach(p => byPoint[p.id] = { point: p, total: 0, plan: 0 });
    filteredCurrent.forEach(r => { if (byPoint[r.point_id]) byPoint[r.point_id].total += +r.total_day||0; });
    data.plans.forEach(pl => { if (byPoint[pl.point_id]) byPoint[pl.point_id].plan = (+pl.plan_phys_month||0) + (+pl.plan_corp_month||0); });
    const sorted = Object.values(byPoint).sort((a,b) => b.total - a.total);

    let dTot=0, dRet=0, dIns=0, oTot=0, oRavt=0, oOther=0;
    points.forEach(p => {
      const reports = filteredCurrent.filter(r => r.point_id === p.id).sort((a,b) => b.date.localeCompare(a.date));
      if (reports[0]) {
        dTot += +reports[0].debt_total||0; dRet += +reports[0].debt_retail||0; dIns += +reports[0].debt_insurance||0;
        oTot += +reports[0].owe_total||0; oRavt += +reports[0].owe_ravt||0; oOther += +reports[0].owe_other||0;
      }
    });

    const days = new Set(filteredCurrent.map(r => r.date)).size;
    const todayStr = new Date().toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit' });
    const medals = ['🥇','🥈','🥉'];

    return `📊 СВОДКА — ${title}
${monthName} ${data.range.year} · на ${todayStr}

━━━━━━━━━━━━━━━━━━
ВАЛ ЗА МЕСЯЦ
━━━━━━━━━━━━━━━━━━
${fm(mTotal)} ₽${delta !== null ? ` (${delta >= 0 ? '+' : ''}${delta}% к прошлому)` : ''}
${totalPlan ? `План: ${fm(totalPlan)} ₽ (${planPct}%)` : 'План не задан'}

Структура:
  Страховые: ${fm(mIns)} ₽ (${mTotal ? Math.round(mIns/mTotal*100) : 0}%)
  Физлица: ${fm(mPhys)} ₽ (${mTotal ? Math.round(mPhys/mTotal*100) : 0}%)
  Корпоратив: ${fm(mCorp)} ₽ (${mTotal ? Math.round(mCorp/mTotal*100) : 0}%)

Дней в работе: ${days}
Средний день: ${fm(days ? mTotal/days : 0)} ₽

━━━━━━━━━━━━━━━━━━
ГОДОВОЙ ВАЛ ${data.range.year}
━━━━━━━━━━━━━━━━━━
${fm(yTotal)} ₽
  Розница: ${fm(yRet)} ₽
  Страховые: ${fm(yIns)} ₽

━━━━━━━━━━━━━━━━━━
ПО ТОЧКАМ
━━━━━━━━━━━━━━━━━━
${sorted.map((s,i) => {
  const pct = s.plan ? Math.round(s.total/s.plan*100) : null;
  const medal = i < 3 ? medals[i] + ' ' : '   ';
  return `${medal}${s.point.name}: ${fm(s.total)} ₽${pct !== null ? ` (${pct}%)` : ''}`;
}).join('\n')}

━━━━━━━━━━━━━━━━━━
ФИНАНСЫ
━━━━━━━━━━━━━━━━━━
Долги по ЗН: ${fm(dTot)} ₽
  Розница: ${fm(dRet)} ₽
  Страховые: ${fm(dIns)} ₽

Мы должны: ${fm(oTot)} ₽
  РАВТ: ${fm(oRavt)} ₽
  Остальные: ${fm(oOther)} ₽`;
  }

  function copyOwnersText(filter) {
    const text = buildOwnersText(filter);
    navigator.clipboard.writeText(text).then(() => {
      const label = filter === 'all' ? 'Общий отчёт' : filter === 'moscow' ? 'Отчёт Москвы' : 'Отчёт Ижевска';
      toast(`${label} скопирован`, 'ok');
    });
  }

  (function init() {
    if (sessionStorage.getItem('rgp_admin') === '1') enterApp();
    else document.getElementById('login-code').focus();
    document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  })();

  // Авто-обновление обзора каждые 60 сек (не трогаем планы чтобы не сбить ввод)
  setInterval(() => {
    if (sessionStorage.getItem('rgp_admin') === '1' && document.getElementById('app').style.display !== 'none') {
      const overviewActive = document.getElementById('page-overview').classList.contains('active');
      if (overviewActive) loadAll();
    }
  }, 60000);
</script>
</body>
</html>
