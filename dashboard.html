  // При вводе месячного плана — автоматически обновляем подсказку дневного, если он пуст
  function onPlanInput(input) {
    const pid = input.dataset.pid;
    const field = input.dataset.field;
    const pair = input.dataset.pair; // если изменили "месяц" — авто-обновить парное "день"

    if (pair) {
      // Это поле "месяц" — обновим парное поле "день" если оно пустое
      const pairInput = document.querySelector(`input[data-pid="${pid}"][data-field="${pair}"]`);
      if (pairInput) {
        const point = cachedData.points.find(p => p.id === pid);
        const wd = point?.work_days || 7;
        const now = new Date();
        const totalWork = workDaysInMonth(now.getFullYear(), now.getMonth()+1, wd);
        const monthVal = +input.value || 0;
        const autoDay = monthVal && totalWork ? Math.round(monthVal / totalWork) : 0;
        // Обновляем placeholder
        pairInput.placeholder = autoDay || '0';
        // Если поле "день" пустое — авто-заполним
        if (!pairInput.value || pairInput.value === '0') {
          pairInput.value = autoDay || '';
        }
      }
    }

    const status = document.getElementById('plan-status-'+pid);
    status.className = 'plan-editor-status saving';
    status.textContent = '⌛ сохраняю...';
    if (saveTimers[pid]) clearTimeout(saveTimers[pid]);
    saveTimers[pid] = setTimeout(() => savePlan(pid), 1000);
  }

  async function savePlan(pid) {
    const inputs = document.querySelectorAll(`input[data-pid="${pid}"]`);
    const payload = { point_id: pid, updated_at: new Date().toISOString() };
    inputs.forEach(i => { payload[i.dataset.field] = +i.value || 0; });
    const status = document.getElementById('plan-status-'+pid);
    try {
      const { error } = await sb.from('plans').upsert(payload, { onConflict: 'point_id' });
      if (error) throw error;
      // Обновляем кэш локально
      if (cachedData) {
        const existing = cachedData.plans.find(p => p.point_id === pid);
        if (existing) Object.assign(existing, payload);
        else cachedData.plans.push(payload);
      }
      status.className = 'plan-editor-status saved';
      status.textContent = '✓ сохранено';
    } catch (e) {
      console.error(e);
      status.className = 'plan-editor-status';
      status.style.color = 'var(--red)';
      status.textContent = '⚠ ошибка';
      toast('Ошибка сохранения плана', 'err');
    }
  }

  // ============ MY REPORT PAGE ============
  let yearDataCache = null; // кэш годовых данных
  let yearSaveTimers = {};

  async function fetchYearData(year) {
    const start = `${year}-01-01`;
    const end = `${year}-12-31`;
    const { data, error } = await sb.from('daily_reports')
      .select('point_id,date,total_day,retail_day,ins_day,phys_day,corp_day')
      .gte('date', start).lte('date', end);
    if (error) throw error;
    return data || [];
  }

  async function renderMyReport(data) {
    const range = data.range;
    const date = document.getElementById('myreport-date')?.value || new Date().toISOString().split('T')[0];

    // Грузим данные за весь год (для накопительного годового вала)
    let yearData = yearDataCache;
    if (!yearData || yearData._year !== range.year) {
      try {
        yearData = await fetchYearData(range.year);
        yearData._year = range.year;
        yearDataCache = yearData;
      } catch (e) {
        console.error(e); yearData = [];
      }
    }

    // Получаем отчёт за конкретный день
    let dayReports = {};
    let actualDates = {};   // фактическая дата отчёта по каждой точке (если fallback)
    try {
      const { data: dr, error } = await sb.from('daily_reports').select('*').eq('date', date);
      if (error) throw error;
      (dr || []).forEach(r => { dayReports[r.point_id] = r; actualDates[r.point_id] = date; });
    } catch (e) { console.error(e); }

    // Для точек без отчёта на эту дату — ищем последний отчёт за месяц
    const monthStart = `${range.year}-${String(range.month).padStart(2,'0')}-01`;
    const monthEndCalc = new Date(range.year, range.month, 0);
    const monthEnd = `${range.year}-${String(range.month).padStart(2,'0')}-${String(monthEndCalc.getDate()).padStart(2,'0')}`;
    const missingPoints = data.points.filter(p => !dayReports[p.id]).map(p => p.id);
    if (missingPoints.length > 0) {
      try {
        const { data: monthData, error } = await sb.from('daily_reports')
          .select('*')
          .in('point_id', missingPoints)
          .gte('date', monthStart)
          .lte('date', date)
          .order('date', { ascending: false });
        if (error) throw error;
        (monthData || []).forEach(r => {
          if (!dayReports[r.point_id]) {
            dayReports[r.point_id] = r;
            actualDates[r.point_id] = r.date;
          }
        });
      } catch (e) { console.error(e); }
    }

    // Загружаем ПОСЛЕДНИЕ ДОЛГИ по каждой точке за последние 90 дней
    // Менеджеры периодически забывают их указывать — берём последние актуальные
    const lastDebts = {};
    try {
      const since = new Date(new Date(date).getTime() - 90*24*60*60*1000).toISOString().substring(0,10);
      const { data: debtData } = await sb.from('daily_reports')
        .select('point_id,date,debt_total,debt_retail,debt_insurance,owe_total,owe_ravt,owe_other')
        .gte('date', since)
        .lte('date', date)
        .order('date', { ascending: false });
      (debtData || []).forEach(r => {
        const hasDebts = (+r.debt_total > 0) || (+r.owe_total > 0);
        if (!hasDebts) return;
        if (!lastDebts[r.point_id]) lastDebts[r.point_id] = r;  // первая встреча = самая свежая дата
      });
    } catch (e) { console.error(e); }

    let html = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
          <div style="font-size:12px;color:var(--muted);font-weight:600;">📅 Дата отчёта:</div>
          <input type="date" id="myreport-date" value="${date}" onchange="renderMyReport(cachedData)" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;outline:none;">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <button onclick="copyCityReports('moscow')" style="flex:1;min-width:140px;background:var(--accent);color:#000;border:none;padding:10px 14px;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;">📋 Скопировать МОСКВУ</button>
          <button onclick="copyCityReports('izhevsk')" style="flex:1;min-width:140px;background:var(--accent);color:#000;border:none;padding:10px 14px;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;">📋 Скопировать ИЖЕВСК</button>
          <button onclick="copyAllReports()" style="flex:1;min-width:140px;background:var(--surface2);color:var(--accent);border:1px solid var(--accent);padding:10px 14px;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;cursor:pointer;">📋 ВСЁ ВМЕСТЕ</button>
        </div>
        <div style="font-size:11px;color:var(--muted);line-height:1.5;">
          Отчёт собирается автоматически из данных менеджеров. Если на выбранную дату нет отчёта — берётся последний доступный за месяц (с пометкой 📅).
        </div>
      </div>
    `;

    // Группируем точки по городам
    const moscowPoints = data.points.filter(p => p.format !== 'izhevsk');
    const izhevskPoints = data.points.filter(p => p.format === 'izhevsk');

    if (moscowPoints.length) {
      html += `<div class="city-section"><div class="city-title">Москва</div>`;
      moscowPoints.forEach(p => { html += renderPointReport(p, data, dayReports[p.id], yearData, date, actualDates[p.id], lastDebts[p.id]); });
      html += `</div>`;
    }
    if (izhevskPoints.length) {
      html += `<div class="city-section"><div class="city-title">Ижевск</div>`;
      izhevskPoints.forEach(p => { html += renderPointReport(p, data, dayReports[p.id], yearData, date, actualDates[p.id], lastDebts[p.id]); });
      html += `</div>`;
    }

    document.getElementById('myreport-content').innerHTML = html;
  }

  function renderPointReport(point, data, dayReport, yearData, dateStr, actualDate, lastDebt) {
    const r = dayReport || {};
    const range = data.range;

    // Накопленное за год (по этой точке)
    let ytdTotal=0, ytdRetail=0, ytdIns=0;
    yearData.filter(d => d.point_id === point.id).forEach(d => {
      ytdTotal += +d.total_day || 0;
      ytdRetail += +d.retail_day || 0;
      ytdIns += +d.ins_day || 0;
    });
    const yearTotal = (+point.year_start_total || 0) + ytdTotal;
    const yearRetail = (+point.year_start_retail || 0) + ytdRetail;
    const yearIns = (+point.year_start_insurance || 0) + ytdIns;

    // Месячные суммы
    const monthReports = data.reports.filter(rep => rep.point_id === point.id);
    let mTotal=0, mRetail=0, mIns=0;
    monthReports.forEach(d => { mTotal+=+d.total_day||0; mRetail+=+d.retail_day||0; mIns+=+d.ins_day||0; });

    // Используем фактическую дату отчёта (может быть не та что выбрана если fallback)
    const useDate = actualDate || dateStr;
    const isFallback = actualDate && actualDate !== dateStr;
    const noData = !dayReport;

    // Парсим дату
    const [y,mo,d] = useDate.split('-');
    const dateRu = `${d}.${mo}.${y.substring(2)}`;
    const nextDate = (() => {
      const dt = new Date(+y, +mo-1, +d+1);
      return `${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}`;
    })();

    // Дневные суммы
    const dTotal = +r.total_day || 0;
    const dRetail = +r.retail_day || 0;
    const dIns = +r.ins_day || 0;

    // Долги — берём из lastDebt (последний отчёт с долгами > 0) если в текущем отчёте их нет
    // Это решает проблему «менеджер забыл указать долги в новом отчёте»
    const debtSource = (function() {
      const cur = dayReport || {};
      const curHasDebts = (+cur.debt_total > 0) || (+cur.owe_total > 0);
      if (curHasDebts) return cur;
      if (lastDebt) return lastDebt;
      return cur;
    })();
    const debtTotal = +debtSource.debt_total || 0;
    const debtRetail = +debtSource.debt_retail || 0;
    const debtIns = +debtSource.debt_insurance || 0;
    const oweTotal = +debtSource.owe_total || 0;
    const oweRavt = +debtSource.owe_ravt || 0;
    const oweOther = +debtSource.owe_other || 0;
    // Дата актуальных долгов (если отличается от dateStr — добавим в бейдж)
    const debtsFromOtherDate = lastDebt && debtSource === lastDebt && lastDebt.date !== useDate;

    const maxSubs = +r.max_subs || 0;
    const reviews = +r.reviews || 0;
    const bookings = +r.bookings || 0;
    const flow = +r.flow_directions || 0;

    const reportText =
`Отчёт ${dateRu}

${point.name}

1) Годовой вал:
${fm(yearTotal)}
${fm(yearRetail)} (розница) 
${fm(yearIns)} (страховые)

2) Вал месячный:
${fm(mTotal)}
${fm(mRetail)} (розница) 
${fm(mIns)} (страховые)

3) Вал день: 
${fm(dTotal)}
${fm(dRetail)} (розница) 
${fm(dIns)} (страховые) 

4) количество подписок MAX за день:
${maxSubs}

5) запись на ${nextDate} общая:
${bookings}

6) долги по заказ нарядам , общая сумма не погашенных заказ нарядов:
${fm(debtTotal)}
${fm(debtRetail)} (розница) 
${fm(debtIns)} (страховые) 

7)Мы должны:
${fm(oweTotal)}
${fm(oweRavt)} (РАВТ) 
${fm(oweOther)} (Остальные) 

8)Отзывы:
${reviews}

9)Поток направлений:
${point.name} ${flow}`;

    // Бейдж статуса
    let statusBadge = '';
    if (noData) {
      statusBadge = `<div style="font-size:10px;background:rgba(244,67,54,.15);color:var(--red);padding:3px 8px;border-radius:4px;font-weight:700;letter-spacing:.4px;">⚠ НЕТ ДАННЫХ ЗА МЕСЯЦ</div>`;
    } else if (isFallback) {
      const [_,fmo,fd] = actualDate.split('-');
      statusBadge = `<div style="font-size:10px;background:rgba(255,152,0,.15);color:var(--orange);padding:3px 8px;border-radius:4px;font-weight:700;letter-spacing:.4px;">📅 за ${fd}.${fmo} (нет свежее)</div>`;
    }
    if (debtsFromOtherDate) {
      const [_,dmo,dd] = lastDebt.date.split('-');
      statusBadge += `<div style="font-size:10px;background:rgba(33,150,243,.15);color:var(--blue);padding:3px 8px;border-radius:4px;font-weight:700;letter-spacing:.4px;">💼 долги от ${dd}.${dmo}</div>`;
    }

    return `
      <div data-city="${point.format === 'izhevsk' ? 'izhevsk' : 'moscow'}" style="background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;">
        <div style="padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:1.5px;">${point.name}</div>
          ${statusBadge}
          <button onclick="copyReport('rep-${point.id}', this)" style="margin-left:auto;background:var(--accent);color:#000;border:none;padding:7px 14px;border-radius:6px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;">📋 Скопировать</button>
        </div>
        <pre id="rep-${point.id}" style="margin:0;padding:14px;font-family:monospace;font-size:13px;line-height:1.6;color:var(--text);background:var(--bg);white-space:pre-wrap;overflow-x:auto;">${reportText}</pre>
      </div>`;
  }

  function copyReport(elId, btn) {
    const text = document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = '✓ скопировано';
      btn.style.background = 'var(--green)';
      setTimeout(() => { btn.textContent = orig; btn.style.background = 'var(--accent)'; }, 1500);
    });
  }

  function copyAllReports() {
    const blocks = document.querySelectorAll('pre[id^="rep-"]');
    const all = Array.from(blocks).map(b => b.textContent).join('\n\n———\n\n');
    navigator.clipboard.writeText(all).then(() => toast('Все отчёты скопированы', 'ok'));
  }

  function copyCityReports(city) {
    const wrappers = document.querySelectorAll(`div[data-city="${city}"]`);
    const texts = Array.from(wrappers).map(w => w.querySelector('pre').textContent);
    if (!texts.length) { toast('Нет точек этого города', 'err'); return; }
    const joined = texts.join('\n\n———\n\n');
    const cityName = city === 'moscow' ? 'Москвы' : 'Ижевска';
    navigator.clipboard.writeText(joined).then(() => toast(`Отчёт ${cityName} скопирован (${texts.length} ${texts.length === 1 ? 'точка' : 'точек'})`, 'ok'));
  }

  function onYearStartInput(input) {
    const pid = input.dataset.pid;
    const status = document.getElementById('ystatus-'+pid);
    status.textContent = '⌛';
    status.style.color = 'var(--orange)';
    if (yearSaveTimers[pid]) clearTimeout(yearSaveTimers[pid]);
    yearSaveTimers[pid] = setTimeout(() => saveYearStart(pid), 1000);
  }

  async function saveYearStart(pid) {
    const inputs = document.querySelectorAll(`input[data-pid="${pid}"][data-field^="year_start_"]`);
    const payload = {};
    inputs.forEach(i => { payload[i.dataset.field] = +i.value || 0; });
    const status = document.getElementById('ystatus-'+pid);
    try {
      const { error } = await sb.from('points').update(payload).eq('id', pid);
      if (error) throw error;
      // Обновляем кэш
      if (cachedData) {
        const p = cachedData.points.find(x => x.id === pid);
        if (p) Object.assign(p, payload);
      }
      status.textContent = '✓';
      status.style.color = 'var(--green)';
      // Перерендерить отчёты с новыми значениями
      renderMyReport(cachedData);
    } catch (e) {
      console.error(e);
      status.textContent = '⚠';
      status.style.color = 'var(--red)';
      toast('Ошибка сохранения', 'err');
    }
  }


  // ====================================================================
  // ВЫГРУЗКА В EXCEL
  // ====================================================================
  function exportToExcel() {
    if (!cachedData) { alert('Сначала загрузи данные'); return; }
    if (typeof XLSX === 'undefined') { alert('Excel-библиотека не загружена'); return; }
    try {
      const wb = XLSX.utils.book_new();
      const data = cachedData;
      const mn = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      const monthName = mn[data.range.month-1];

      // Лист 1: Сводка
      let monthTotal=0, monthIns=0, monthRetail=0, monthPhys=0, monthCorp=0;
      data.reports.forEach(r => { monthTotal+=+r.total_day||0; monthIns+=+r.ins_day||0; monthRetail+=+r.retail_day||0; monthPhys+=+r.phys_day||0; monthCorp+=+r.corp_day||0; });
      const fot = data.fot || {};
      const expWithoutSalary = (data.expenses||[]).filter(r => !r.category.startsWith('salary_')).reduce((s,r) => s+(+r.amount), 0);
      const taxTotal = (data.taxes||[]).reduce((s,r) => s+(+r.amount), 0);
      const profit = monthTotal - expWithoutSalary - (+fot.fot_total||0) - taxTotal;

      const summary = [
        ['Дашборд RG Plaza', `${monthName} ${data.range.year}`],
        [],
        ['ВЫРУЧКА'],
        ['Всего', monthTotal],
        ['  страховые', monthIns],
        ['  розница', monthRetail],
        ['  физлица', monthPhys],
        ['  корпоратив', monthCorp],
        [],
        ['ФИНАНСЫ'],
        ['ФОТ', +fot.fot_total||0],
        ['Расходы (без ЗП)', expWithoutSalary],
        ['Налоги', taxTotal],
        ['= Чистая прибыль', profit],
        ['Маржа, %', monthTotal > 0 ? Math.round(profit/monthTotal*100) : 0]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Сводка');

      // Лист 2: По точкам
      const pointsRows = [['Точка', 'Выручка', 'Страховые', 'Физлица', 'Корпоратив', 'Дни', 'План физ', '% физ', 'План корп', '% корп']];
      data.points.forEach(p => {
        const reports = data.reports.filter(r => r.point_id === p.id);
        const t = reports.reduce((s,r) => s+(+r.total_day||0), 0);
        const i = reports.reduce((s,r) => s+(+r.ins_day||0), 0);
        const ph = reports.reduce((s,r) => s+(+r.phys_day||0), 0);
        const cp = reports.reduce((s,r) => s+(+r.corp_day||0), 0);
        const days = new Set(reports.filter(r => +r.total_day > 0).map(r => r.date)).size;
        const plan = data.plans.find(pl => pl.point_id === p.id) || {};
        const planPhys = +plan.plan_phys_month || 0;
        const planCorp = +plan.plan_corp_month || 0;
        pointsRows.push([p.name, t, i, ph, cp, days, planPhys, planPhys > 0 ? Math.round(ph/planPhys*100) : 0, planCorp, planCorp > 0 ? Math.round(cp/planCorp*100) : 0]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pointsRows), 'По точкам');

      // Лист 3: По дням
      const daysRows = [['Дата', 'Точка', 'Всего', 'Страх', 'Розница', 'Физ', 'Корп', 'Записей', 'Долги (нам)', 'Долги (мы)']];
      data.reports.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(r => {
        const p = data.points.find(x => x.id === r.point_id);
        daysRows.push([r.date, p?.name || r.point_id, +r.total_day||0, +r.ins_day||0, +r.retail_day||0, +r.phys_day||0, +r.corp_day||0, +r.bookings||0, +r.debt_total||0, +r.owe_total||0]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(daysRows), 'По дням');

      // Лист 4: Финансы (если есть)
      if ((data.expenses||[]).length || (data.taxes||[]).length) {
        const expRows = [['Тип', 'Юрлицо', 'Категория', 'Сумма']];
        (data.expenses||[]).forEach(e => expRows.push(['Расход', e.entity_id, e.category, +e.amount||0]));
        (data.taxes||[]).forEach(t => expRows.push(['Налог', t.entity_id, t.tax_type, +t.amount||0]));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), 'Расходы и налоги');
      }

      const fileName = `RG-Plaza_Dashboard_${monthName}_${data.range.year}.xlsx`;
      XLSX.writeFile(wb, fileName);
    } catch (e) {
      console.error(e);
      alert('Ошибка: '+(e.message||e));
    }
  }

  (function init() {
    if (sessionStorage.getItem('rgp_admin') === '1') enterApp();
    else document.getElementById('login-code').focus();
    document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  })();

  // ====================================================================
  // ВКЛАДКА «ДЕТАЛИЗАЦИЯ» — разбивка выручки по СК / видам / клиентам
  // ====================================================================

  let breakdownData = null;
  let breakdownState = {
    point: 'all',           // 'all' / 'sovhoz' / 'poyma' / 'kaluga' / 'serpuhov'
    channel: 'all',         // 'all' / 'insurance' / 'retail' / 'corporate'
    period: null,           // '2026-01' и т.д.
    sortBy: 'amount'        // 'amount' / 'name'
  };
  let breakdownCharts = [];

  async function renderBreakdown() {
    const container = document.getElementById('breakdown-content');
    if (!cachedData || !cachedData.points) {
      container.innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю...</div>';
      return;
    }

    const range = cachedData.range;
    const period = `${range.year}-${String(range.month).padStart(2,'0')}`;
    breakdownState.period = period;

    container.innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю детализацию...</div>';

    try {
      const { data, error } = await sb
        .from('revenue_breakdown')
        .select('*')
        .eq('period', period)
        .order('amount', { ascending: false });
      if (error) throw error;
      breakdownData = data || [];
      drawBreakdown();
    } catch (e) {
      console.error(e);
      container.innerHTML = `<div class="empty">⚠ Ошибка загрузки: ${e.message || e}<br><br>
        <small>Возможно таблица revenue_breakdown ещё не создана.<br>
        Запусти SQL <code>breakdown_full.sql</code> в Supabase.</small></div>`;
    }
  }

  function drawBreakdown() {
    const container = document.getElementById('breakdown-content');
    breakdownCharts.forEach(c => { try { c.destroy(); } catch(e){} });
    breakdownCharts = [];

    const data = breakdownData || [];
    const points = cachedData.points;
    const period = breakdownState.period;
    const monthName = new Date(period+'-01').toLocaleDateString('ru-RU', {month:'long', year:'numeric'});

    if (data.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div style="font-size:32px;margin-bottom:14px;">📊</div>
          <div style="font-size:15px;color:var(--text);margin-bottom:8px;">Детализация за ${monthName} пока не заведена</div>
          <small style="color:var(--muted);line-height:1.6;">
            Чтобы увидеть разбивку по СК, видам работ и корпоративным клиентам — данные нужно загрузить из ОВР.<br>
            Январь–март 2026 уже есть в файле <code>breakdown_full.sql</code>.
          </small>
        </div>`;
      return;
    }

    // Фильтрация
    let filtered = data;
    if (breakdownState.point !== 'all') filtered = filtered.filter(r => r.point_id === breakdownState.point);
    if (breakdownState.channel !== 'all') filtered = filtered.filter(r => r.channel === breakdownState.channel);

    // Итоги по каналам (для шапки)
    const totals = { insurance: 0, retail: 0, corporate: 0, all: 0 };
    filtered.forEach(r => {
      totals[r.channel] = (totals[r.channel] || 0) + (+r.amount);
      totals.all += +r.amount;
    });

    // Группировка по category
    const byCat = {};
    filtered.forEach(r => {
      const key = `${r.channel}::${r.category}`;
      if (!byCat[key]) byCat[key] = { channel: r.channel, category: r.category, amount: 0, points: {} };
      byCat[key].amount += +r.amount;
      byCat[key].points[r.point_id] = (byCat[key].points[r.point_id] || 0) + (+r.amount);
    });
    const cats = Object.values(byCat);
    if (breakdownState.sortBy === 'amount') cats.sort((a,b) => b.amount - a.amount);
    else cats.sort((a,b) => a.category.localeCompare(b.category, 'ru'));

    // HTML
    let html = `
      <div class="bd-header">
        <div class="bd-title">📈 Детализация · ${monthName}</div>
        <div class="bd-subtitle">Разбивка выручки по СК, видам работ и корпоративным клиентам</div>
      </div>

      <div class="bd-filters">
        <div class="bd-filter-row">
          <label class="bd-label">Точка:</label>
          <select class="bd-select" onchange="setBreakdownFilter('point', this.value)">
            <option value="all" ${breakdownState.point==='all'?'selected':''}>Все точки</option>
            ${points.map(p => `<option value="${p.id}" ${breakdownState.point===p.id?'selected':''}>${p.name}</option>`).join('')}
          </select>
        </div>
        <div class="bd-filter-row">
          <label class="bd-label">Канал:</label>
          <div class="bd-pills">
            <button class="bd-pill ${breakdownState.channel==='all'?'active':''}" onclick="setBreakdownFilter('channel','all')">Все</button>
            <button class="bd-pill bd-pill-ins ${breakdownState.channel==='insurance'?'active':''}" onclick="setBreakdownFilter('channel','insurance')">🛡 Страх</button>
            <button class="bd-pill bd-pill-ret ${breakdownState.channel==='retail'?'active':''}" onclick="setBreakdownFilter('channel','retail')">💵 Розн</button>
            <button class="bd-pill bd-pill-cor ${breakdownState.channel==='corporate'?'active':''}" onclick="setBreakdownFilter('channel','corporate')">🏢 Корп</button>
          </div>
        </div>
      </div>

      <div class="bd-summary">
        <div class="bd-sum-card bd-sum-total">
          <div class="bd-sum-lbl">Всего за месяц</div>
          <div class="bd-sum-val">${fm(totals.all)} ₽</div>
        </div>
        <div class="bd-sum-card bd-sum-ins">
          <div class="bd-sum-lbl">🛡 Страховые</div>
          <div class="bd-sum-val">${fm(totals.insurance)} ₽</div>
          <div class="bd-sum-pct">${totals.all > 0 ? Math.round(totals.insurance/totals.all*100) : 0}%</div>
        </div>
        <div class="bd-sum-card bd-sum-ret">
          <div class="bd-sum-lbl">💵 Розница</div>
          <div class="bd-sum-val">${fm(totals.retail)} ₽</div>
          <div class="bd-sum-pct">${totals.all > 0 ? Math.round(totals.retail/totals.all*100) : 0}%</div>
        </div>
        <div class="bd-sum-card bd-sum-cor">
          <div class="bd-sum-lbl">🏢 Корпоратив</div>
          <div class="bd-sum-val">${fm(totals.corporate)} ₽</div>
          <div class="bd-sum-pct">${totals.all > 0 ? Math.round(totals.corporate/totals.all*100) : 0}%</div>
        </div>
      </div>

      <div class="bd-chart-block">
        <div class="bd-chart-title">Топ позиций (по сумме)</div>
        <div class="bd-chart-wrap"><canvas id="bd-top-chart"></canvas></div>
      </div>

      <div class="bd-list-header">
        <div class="bd-list-title">Все позиции (${cats.length})</div>
        <button class="bd-sort-btn" onclick="setBreakdownFilter('sortBy', '${breakdownState.sortBy==='amount'?'name':'amount'}')">
          ${breakdownState.sortBy==='amount'?'↓ По сумме':'↓ По названию'}
        </button>
      </div>

      <div class="bd-list">`;

    cats.forEach(c => {
      const channelEmoji = c.channel==='insurance' ? '🛡' : (c.channel==='retail' ? '💵' : '🏢');
      const channelClass = `bd-row-${c.channel}`;
      const pctOfTotal = totals.all > 0 ? (c.amount / totals.all * 100) : 0;
      const pointsList = Object.entries(c.points).map(([pid, amt]) => {
        const pName = points.find(p => p.id === pid)?.name || pid;
        return `<span class="bd-point-tag">${pName}: ${fm(amt)} ₽</span>`;
      }).join('');
      html += `
        <div class="bd-row ${channelClass}">
          <div class="bd-row-main">
            <div class="bd-row-emoji">${channelEmoji}</div>
            <div class="bd-row-name">${c.category}</div>
            <div class="bd-row-amount">${fm(c.amount)} ₽</div>
          </div>
          <div class="bd-row-bar">
            <div class="bd-row-bar-fill" style="width:${Math.min(100, pctOfTotal*5)}%"></div>
          </div>
          <div class="bd-row-meta">
            <span class="bd-row-pct">${pctOfTotal.toFixed(1)}% от месяца</span>
            ${breakdownState.point === 'all' ? `<div class="bd-row-points">${pointsList}</div>` : ''}
          </div>
        </div>`;
    });
    html += `</div>`;

    container.innerHTML = html;

    // Рисуем график топ-10
    setTimeout(() => {
      const top10 = cats.slice(0, 10);
      const ctx = document.getElementById('bd-top-chart');
      if (!ctx || top10.length === 0) return;
      const colors = top10.map(c => c.channel==='insurance' ? '#2196f3' : (c.channel==='retail' ? '#4caf50' : '#9c27b0'));
      const ch = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: top10.map(c => c.category.length > 28 ? c.category.substring(0,26)+'…' : c.category),
          datasets: [{
            data: top10.map(c => c.amount),
            backgroundColor: colors,
            borderRadius: 5,
            borderWidth: 0
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => fm(ctx.raw) + ' ₽' } }
          },
          scales: {
            x: { ticks: { color: '#909090', font: { size: 10 }, callback: v => fs(v) }, grid: { color: '#333333' } },
            y: { ticks: { color: '#ffffff', font: { size: 10 } }, grid: { display: false } }
          }
        }
      });
      breakdownCharts.push(ch);
    }, 50);
  }

  function setBreakdownFilter(field, value) {
    breakdownState[field] = value;
    drawBreakdown();
  }

  // Авто-обновление обзора каждые 60 сек (не трогаем планы чтобы не сбить ввод)
  setInterval(() => {
    if (sessionStorage.getItem('rgp_admin') === '1' && document.getElementById('app').style.display !== 'none') {
      const overviewActive = document.getElementById('page-overview').classList.contains('active');
      if (overviewActive) loadAll();
    }
  }, 60000);
</script>

</html>
