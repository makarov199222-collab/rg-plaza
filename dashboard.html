<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG Plaza — Дашборд руководителя</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#0d0f14; --surface:#161920; --surface2:#1e2230; --border:#2a2f42;
    --accent:#e8b84b; --blue:#3b82f6; --text:#e8eaf2; --muted:#6b7280;
    --green:#22c55e; --purple:#a855f7; --red:#ef4444; --orange:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Golos Text',sans-serif;padding-bottom:40px;}

  /* Login */
  .login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .login.hidden{display:none;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--accent);letter-spacing:3px;margin-bottom:6px;}
  .login-sub{font-size:11px;color:var(--muted);letter-spacing:4px;font-weight:600;margin-bottom:30px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:340px;}
  .login-title{font-size:14px;font-weight:700;margin-bottom:14px;text-align:center;color:var(--text);}
  .login-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font-family:'Golos Text',sans-serif;font-size:15px;font-weight:600;outline:none;text-align:center;letter-spacing:1px;-webkit-appearance:none;}
  .login-input:focus{border-color:var(--accent);}
  .login-btn{width:100%;margin-top:10px;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;cursor:pointer;}
  .login-err{margin-top:10px;font-size:12px;color:var(--red);text-align:center;min-height:16px;}

  /* Header */
  header{background:var(--surface);border-bottom:2px solid var(--accent);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:2px;line-height:1;}
  .logo span{color:var(--text);font-size:11px;display:block;letter-spacing:3px;font-family:'Golos Text',sans-serif;font-weight:600;margin-top:3px;}
  .month-pick{margin-left:auto;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-family:'Golos Text',sans-serif;font-size:13px;font-weight:600;cursor:pointer;outline:none;}
  .month-pick:focus{border-color:var(--accent);}
  .refresh-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--accent);font-size:13px;cursor:pointer;font-family:'Golos Text',sans-serif;font-weight:700;}

  .wrap{padding:20px;max-width:1200px;margin:0 auto;}

  /* Hero stats */
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
  .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .hero-card.acc{border-color:rgba(232,184,75,.5);background:linear-gradient(135deg,var(--surface),var(--surface2));}
  .hero-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
  .hero-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);line-height:1;}
  .hero-val.b{color:var(--blue);} .hero-val.g{color:var(--green);} .hero-val.p{color:var(--purple);} .hero-val.t{color:var(--text);}
  .hero-sub{font-size:11px;color:var(--muted);margin-top:4px;}

  /* Points grid */
  .points-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:20px;}
  .point-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .point-card-head{padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .point-card-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);letter-spacing:1.5px;}
  .point-card-days{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:6px;font-weight:700;}
  .point-card-body{padding:16px;}
  .pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .pc-stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;}
  .pc-stat-lbl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
  .pc-stat-val{font-family:'Bebas Neue',sans-serif;font-size:21px;}
  .pc-stat-val.t{color:var(--accent);} .pc-stat-val.b{color:var(--blue);} .pc-stat-val.g{color:var(--green);} .pc-stat-val.p{color:var(--purple);}

  /* Plan progress */
  .pc-plan{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px;}
  .pc-plan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .pc-plan-title{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
  .pc-plan-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;}
  .pc-plan-pct.ok{color:var(--green);} .pc-plan-pct.warn{color:var(--orange);} .pc-plan-pct.bad{color:var(--red);}
  .pc-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:6px;}
  .pc-bar-fill{height:100%;border-radius:4px;transition:width .4s;}
  .pc-bar-fill.ok{background:linear-gradient(90deg,var(--green),var(--accent));}
  .pc-bar-fill.warn{background:linear-gradient(90deg,var(--orange),var(--accent));}
  .pc-bar-fill.bad{background:var(--red);}
  .pc-plan-text{font-size:11px;color:var(--muted);}

  .pc-chart{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;}
  .pc-chart-title{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}

  /* Comparison */
  .compare-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--accent);letter-spacing:1.5px;margin-bottom:14px;}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}

  .loader{display:flex;justify-content:center;align-items:center;padding:60px;color:var(--muted);font-size:14px;}
  .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width: 600px) {
    .points-grid{grid-template-columns:1fr;}
    .hero{grid-template-columns:1fr 1fr;}
    .hero-val{font-size:24px;}
    header{padding:12px 14px;gap:8px;flex-wrap:wrap;}
    .logo{font-size:20px;}
    .wrap{padding:14px;}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-logo">RG PLAZA</div>
  <div class="login-sub">ДАШБОРД РУКОВОДИТЕЛЯ</div>
  <div class="login-card">
    <div class="login-title">Введи админ-код</div>
    <input type="password" class="login-input" id="login-code" placeholder="Админ-код" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">ВОЙТИ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app" style="display:none;">

<header>
  <div class="logo">RG Plaza <span>ДАШБОРД</span></div>
  <input type="month" class="month-pick" id="month-pick" onchange="loadAll()">
  <button class="refresh-btn" onclick="loadAll()" title="Обновить">↻</button>
</header>

<div class="wrap">
  <div id="content"><div class="loader"><div class="spinner"></div>Загружаю данные...</div></div>
</div>

</div>

<script>
  // =============== CONFIG ===============
  const SUPABASE_URL = 'https://uxdgiwbkvgbnrsuxjhvp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bg1BRofqJsjkV_9eXzn2Pg__YJ-xRMK';
  const ADMIN_CODE = 'rgplaza-admin-2026'; // ← поменяй на свой
  // ======================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let allCharts = [];

  function doLogin() {
    const code = document.getElementById('login-code').value.trim();
    if (code === ADMIN_CODE) {
      sessionStorage.setItem('rgp_admin', '1');
      enterApp();
    } else {
      document.getElementById('login-err').textContent = 'Неверный код';
    }
  }

  function enterApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    const now = new Date();
    document.getElementById('month-pick').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    loadAll();
  }

  function fm(n) { return n ? Number(n).toLocaleString('ru-RU') : '0'; }
  function fs(n) {
    if (!n) return '0';
    if (n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+' М';
    if (n>=1000) return Math.round(n/1000)+' К';
    return String(n);
  }
  function pdate(iso) { const [y,m,d]=iso.split('-'); return `${d}.${m}`; }
  function getMonthRange() {
    const v = document.getElementById('month-pick').value || new Date().toISOString().substring(0,7);
    const [y,m] = v.split('-');
    const start = `${y}-${m}-01`;
    const end = new Date(+y, +m, 0).toISOString().split('T')[0];
    return { start, end, year:+y, month:+m };
  }

  async function loadAll() {
    document.getElementById('content').innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю данные...</div>';
    allCharts.forEach(c => { try { c.destroy(); } catch(e){} });
    allCharts = [];

    const range = getMonthRange();
    try {
      const [pointsRes, reportsRes, plansRes] = await Promise.all([
        sb.from('points').select('*').order('id'),
        sb.from('daily_reports').select('*').gte('date', range.start).lte('date', range.end).order('date'),
        sb.from('plans').select('*')
      ]);
      if (pointsRes.error) throw pointsRes.error;
      if (reportsRes.error) throw reportsRes.error;
      if (plansRes.error) throw plansRes.error;
      render(pointsRes.data || [], reportsRes.data || [], plansRes.data || [], range);
    } catch (e) {
      console.error(e);
      document.getElementById('content').innerHTML = `<div class="empty">⚠ Ошибка загрузки: ${e.message || e}</div>`;
    }
  }

  function render(points, reports, plans, range) {
    if (!points.length) { document.getElementById('content').innerHTML = '<div class="empty">Точки не настроены</div>'; return; }

    const mn = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const monthName = mn[range.month-1];

    // Aggregate by point
    const byPoint = {};
    points.forEach(p => byPoint[p.id] = { point: p, reports: [], plan: plans.find(pl => pl.point_id === p.id) || { plan_day: 0, plan_month: 0 } });
    reports.forEach(r => { if (byPoint[r.point_id]) byPoint[r.point_id].reports.push(r); });

    // Totals across all points
    let allTotal = 0, allRetail = 0, allInsur = 0, allCorp = 0, allPlanMonth = 0;
    const dateSet = new Set();
    Object.values(byPoint).forEach(({reports, plan}) => {
      reports.forEach(r => {
        allTotal += +r.total_day || 0;
        allRetail += +r.retail_day || 0;
        allInsur += +r.ins_day || 0;
        allCorp += +r.corp_day || 0;
        dateSet.add(r.date);
      });
      allPlanMonth += +plan.plan_month || 0;
    });
    const daysWithData = dateSet.size;
    const overallPct = allPlanMonth ? Math.round(allRetail/allPlanMonth*100) : null;

    let html = `
      <div class="hero">
        <div class="hero-card acc">
          <div class="hero-lbl">${monthName} ${range.year} — общий вал</div>
          <div class="hero-val">${fm(allTotal)} ₽</div>
          <div class="hero-sub">обе точки, ${daysWithData} дней с данными</div>
        </div>
        <div class="hero-card">
          <div class="hero-lbl">Розница (план)</div>
          <div class="hero-val g">${fm(allRetail)} ₽</div>
          <div class="hero-sub">${overallPct !== null ? `${overallPct}% от общего плана ${fm(allPlanMonth)} ₽` : 'план не задан'}</div>
        </div>
        <div class="hero-card">
          <div class="hero-lbl">Страховые</div>
          <div class="hero-val b">${fm(allInsur)} ₽</div>
        </div>
        <div class="hero-card">
          <div class="hero-lbl">Корпоратив</div>
          <div class="hero-val p">${fm(allCorp)} ₽</div>
        </div>
      </div>

      <div class="points-grid">`;

    Object.values(byPoint).forEach(({point, reports, plan}) => {
      let t=0,i=0,r=0,c=0,phys=0;
      reports.forEach(d => { t+=+d.total_day||0; i+=+d.ins_day||0; r+=+d.retail_day||0; c+=+d.corp_day||0; phys+=+d.phys_day||0; });
      const avgRetail = reports.length ? Math.round(r/reports.length) : 0;
      const pct = plan.plan_month ? Math.round(r/plan.plan_month*100) : null;
      const cls = pct === null ? '' : pct >= 90 ? 'ok' : pct >= 70 ? 'warn' : 'bad';

      const today = new Date();
      const daysInMonth = new Date(range.year, range.month, 0).getDate();
      const daysPassed = today.getFullYear() === range.year && today.getMonth()+1 === range.month ? today.getDate() : daysInMonth;
      const expectedByNow = plan.plan_month ? Math.round(plan.plan_month / daysInMonth * daysPassed) : 0;

      html += `
        <div class="point-card">
          <div class="point-card-head">
            <div class="point-card-name">${point.name}</div>
            <div class="point-card-days">${reports.length} дн.</div>
          </div>
          <div class="point-card-body">
            <div class="pc-stats">
              <div class="pc-stat"><div class="pc-stat-lbl">Всего</div><div class="pc-stat-val t">${fm(t)} ₽</div></div>
              <div class="pc-stat"><div class="pc-stat-lbl">Розница</div><div class="pc-stat-val g">${fm(r)} ₽</div></div>
              <div class="pc-stat"><div class="pc-stat-lbl">Страховые</div><div class="pc-stat-val b">${fm(i)} ₽</div></div>
              <div class="pc-stat"><div class="pc-stat-lbl">Корпоратив</div><div class="pc-stat-val p">${fm(c)} ₽</div></div>
              <div class="pc-stat"><div class="pc-stat-lbl">Ср. розница/день</div><div class="pc-stat-val g">${fm(avgRetail)} ₽</div></div>
              <div class="pc-stat"><div class="pc-stat-lbl">Физлица</div><div class="pc-stat-val">${fm(phys)} ₽</div></div>
            </div>

            ${plan.plan_month ? `
              <div class="pc-plan">
                <div class="pc-plan-head">
                  <div class="pc-plan-title">План розницы</div>
                  <div class="pc-plan-pct ${cls}">${pct}%</div>
                </div>
                <div class="pc-bar"><div class="pc-bar-fill ${cls}" style="width:${Math.min(100,pct)}%"></div></div>
                <div class="pc-plan-text">${fm(r)} / ${fm(plan.plan_month)} ₽ · По графику: ${fm(expectedByNow)} ₽${r >= expectedByNow ? ' (опережение)' : ` (отстаём ${fm(expectedByNow-r)})`}</div>
              </div>
            ` : '<div class="pc-plan"><div class="pc-plan-text">План не установлен</div></div>'}

            <div class="pc-chart">
              <div class="pc-chart-title">📈 Розница по дням</div>
              <canvas id="chart-${point.id}" height="120"></canvas>
            </div>
          </div>
        </div>`;
    });

    html += `</div>`;

    // Comparison chart (если есть несколько точек)
    if (points.length > 1) {
      html += `
        <div class="compare-section">
          <div class="section-title">📊 Сравнение точек по дням</div>
          <canvas id="compare-chart" height="80"></canvas>
        </div>`;
    }

    document.getElementById('content').innerHTML = html;

    // Draw individual point charts
    setTimeout(() => {
      Object.values(byPoint).forEach(({point, reports, plan}) => {
        const labels = reports.map(d => pdate(d.date));
        const retailData = reports.map(d => +d.retail_day || 0);
        const planLine = reports.map(() => plan.plan_day || null);
        const ctx = document.getElementById('chart-'+point.id);
        if (!ctx) return;
        const ch = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets: [
            { label: 'Розница', data: retailData, backgroundColor: 'rgba(34,197,94,.7)', borderRadius: 3 },
            plan.plan_day ? { label: 'План', data: planLine, type: 'line', borderColor: '#ef4444', borderDash: [4,4], pointRadius: 0, borderWidth: 1.5, fill: false } : null
          ].filter(Boolean) },
          options: chartCfg(plan.plan_day > 0)
        });
        allCharts.push(ch);
      });

      // Comparison chart
      if (points.length > 1) {
        const allDates = [...new Set(reports.map(r => r.date))].sort();
        const labels = allDates.map(pdate);
        const datasets = points.map((p, idx) => {
          const colors = ['rgba(232,184,75,.8)', 'rgba(168,85,247,.8)', 'rgba(59,130,246,.8)', 'rgba(34,197,94,.8)'];
          const dataMap = {};
          (byPoint[p.id]?.reports || []).forEach(r => { dataMap[r.date] = +r.total_day || 0; });
          return {
            label: p.name,
            data: allDates.map(d => dataMap[d] || 0),
            backgroundColor: colors[idx % colors.length],
            borderRadius: 3
          };
        });
        const ctx = document.getElementById('compare-chart');
        if (ctx) {
          const ch = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets },
            options: chartCfg(true)
          });
          allCharts.push(ch);
        }
      }
    }, 50);
  }

  function chartCfg(showLegend) {
    return {
      responsive: true,
      plugins: { legend: { display: !!showLegend, labels: { color: '#e8eaf2', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#6b7280', font: { size: 9 } }, grid: { color: '#2a2f42' } },
        y: { ticks: { color: '#6b7280', font: { size: 9 }, callback: v => fs(v) }, grid: { color: '#2a2f42' } }
      }
    };
  }

  // Init
  (function init() {
    if (sessionStorage.getItem('rgp_admin') === '1') enterApp();
    else document.getElementById('login-code').focus();
    document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  })();

  // Auto-refresh every minute
  setInterval(() => {
    if (sessionStorage.getItem('rgp_admin') === '1' && document.getElementById('app').style.display !== 'none') loadAll();
  }, 60000);
</script>
</body>
</html>
