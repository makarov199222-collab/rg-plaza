<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>RG Plaza — Дашборд руководителя</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  /* RG PLAZA — стиль фирменного сайта */
  :root {
    --bg:#1a1a1a;
    --surface:#222222;
    --surface2:#2a2a2a;
    --border:#333333;
    --accent:#e8b84b;
    --blue:#2196f3;
    --text:#ffffff;
    --muted:#909090;
    --green:#4caf50;
    --purple:#9c27b0;
    --red:#f44336;
    --orange:#ff9800;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}

  .login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .login.hidden{display:none;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);letter-spacing:5px;margin-bottom:8px;line-height:1;}
  .login-sub{font-size:11px;color:var(--muted);letter-spacing:5px;font-weight:600;margin-bottom:36px;text-transform:uppercase;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 24px;width:100%;max-width:360px;}
  .login-title{font-size:14px;font-weight:600;margin-bottom:18px;text-align:center;}
  .login-input{width:100%;background:#141414;border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:500;outline:none;text-align:center;letter-spacing:1px;-webkit-appearance:none;transition:border-color .15s;}
  .login-input:focus{border-color:var(--accent);}
  .login-btn{width:100%;margin-top:12px;padding:14px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;transition:filter .15s,transform .05s;}
  .login-btn:active{transform:scale(.99);filter:brightness(1.08);}
  .login-err{margin-top:10px;font-size:13px;color:var(--red);text-align:center;min-height:18px;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:3px;line-height:1;}
  .logo span{color:#b8b8b8;font-size:9px;display:block;letter-spacing:2.5px;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;margin-top:3px;}
  .month-pick{margin-left:auto;background:#141414;border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;outline:none;transition:border-color .15s;}
  .month-pick:focus, .month-pick:hover{border-color:var(--accent);}

  /* === Кастомный месяц-пикер === */
  .mp-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;background:#141414;border:1px solid var(--border);border-radius:8px;padding:3px;}
  .mp-arrow{background:none;border:none;color:var(--accent);width:30px;height:30px;border-radius:5px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
  .mp-arrow:hover{background:var(--surface2);}
  .mp-arrow:active{transform:scale(.92);}
  .mp-current{background:none;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;border-radius:5px;min-width:130px;text-align:center;text-transform:capitalize;letter-spacing:.3px;transition:background .15s;}
  .mp-current:hover{background:var(--surface2);color:var(--accent);}
  .mp-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px;}
  .mp-modal.show{display:flex;}
  .mp-sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:340px;animation:mpUp .25s ease;}
  @keyframes mpUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .mp-year-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .mp-year-arrow{background:#141414;border:1px solid var(--border);color:var(--accent);width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;font-family:inherit;line-height:1;}
  .mp-year-arrow:hover{border-color:var(--accent);}
  .mp-year{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);letter-spacing:2px;}
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mp-month{padding:14px 8px;background:#141414;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-transform:capitalize;transition:all .15s;}
  .mp-month:hover{border-color:var(--accent);color:var(--accent);}
  .mp-month.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .mp-month.future{opacity:.4;}
  .refresh-btn{background:#141414;border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--accent);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;}
  .refresh-btn:hover{border-color:var(--accent);}
  .export-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:9px 13px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  .export-btn:hover{filter:brightness(1.08);}

  /* Алерты сверху на дашборде */
  .alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .alert{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;}
  .alert.red{border-left:3px solid var(--red);} .alert.orange{border-left:3px solid var(--orange);}
  .alert.green{border-left:3px solid var(--green);} .alert.blue{border-left:3px solid var(--blue);}
  .alert-icon{font-size:18px;flex-shrink:0;}
  .alert-text{flex:1;color:var(--text);}
  .alert-text b{color:var(--accent);}

  /* Финансовый блок на Обзоре */
  .finance-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin-bottom:14px;}
  .fin-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:all .15s;position:relative;}
  .fin-card:hover{border-color:var(--accent);}
  .fin-card.green{border-left:3px solid var(--green);}
  .fin-card.red{border-left:3px solid var(--red);}
  .fin-card.orange{border-left:3px solid var(--orange);}
  .fin-card.blue{border-left:3px solid var(--blue);}
  .fin-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .fin-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;line-height:1;}
  .fin-val.t{color:var(--text);} .fin-val.r{color:var(--red);} .fin-val.g{color:var(--green);} .fin-val.o{color:var(--orange);} .fin-val.b{color:var(--blue);} .fin-val.acc{color:var(--accent);}
  .fin-sub{font-size:10px;color:var(--muted);margin-top:3px;}
  .fin-expand-icon{position:absolute;top:8px;right:9px;color:var(--muted);font-size:11px;opacity:.6;transition:transform .2s;}
  .fin-card.is-expanded .fin-expand-icon{transform:rotate(45deg);color:var(--accent);opacity:1;}
  .fin-detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:11px;}
  .fin-detail-item{display:flex;justify-content:space-between;color:var(--muted);padding:3px 0;}
  .fin-detail-item .v{color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:.4px;}
  .fin-detail-item .v.r{color:var(--red);} .fin-detail-item .v.g{color:var(--green);} .fin-detail-item .v.o{color:var(--orange);}

  /* Долги мини-блок */
  .debts-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  @media (max-width:600px){ .debts-mini{grid-template-columns:1fr;} }
  .debt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:all .15s;}
  .debt-card:hover{border-color:var(--accent);}
  .debt-card.we-owe{border-left:3px solid var(--red);}
  .debt-card.owe-us{border-left:3px solid var(--orange);}
  .debt-title{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;margin-bottom:5px;}
  .debt-title.r{color:var(--red);} .debt-title.o{color:var(--orange);}
  .debt-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;line-height:1;}
  .debt-val.r{color:var(--red);} .debt-val.o{color:var(--orange);}
  .debt-sub{font-size:10px;color:var(--muted);margin-top:4px;}
  .refresh-btn:hover{border-color:var(--accent);}

  .wrap{padding:18px;max-width:1400px;margin:0 auto;}

  .top-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .top-tab{flex:1;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
  .top-tab.active{background:var(--accent);color:#000;border-color:var(--accent);}

  .tab-page{display:none;} .tab-page.active{display:block;}

  .city-section{margin-bottom:24px;}
  .city-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .city-title::before{content:'';width:24px;height:2px;background:var(--accent);}
  .city-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px;}
  .hero-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .hero-card.acc{border-color:rgba(232,184,75,.5);}
  .hero-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;}
  .hero-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);line-height:1;letter-spacing:1px;}
  .hero-val.b{color:var(--blue);} .hero-val.g{color:var(--green);} .hero-val.p{color:var(--purple);} .hero-val.t{color:var(--text);}
  .hero-sub{font-size:11px;color:var(--muted);margin-top:5px;}

  .points-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-bottom:18px;}
  .point-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .point-card.point-card-debt-alert{border-left:3px solid var(--red);}
  .point-card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .point-card-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;}
  .point-card-days{margin-left:auto;font-size:11px;color:var(--muted);background:#141414;padding:4px 10px;border-radius:5px;font-weight:600;}
  .point-card-body{padding:14px;}
  .pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .pc-stat{background:#141414;border:1px solid var(--border);border-radius:8px;padding:10px;}
  .pc-stat-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
  .pc-stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;}
  .pc-stat-val.t{color:var(--accent);} .pc-stat-val.b{color:var(--blue);} .pc-stat-val.g{color:var(--green);} .pc-stat-val.p{color:var(--purple);}

  .pc-plan{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px;margin-bottom:8px;}
  .pc-plan-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .pc-plan-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
  .pc-plan-title.g{color:var(--green);} .pc-plan-title.p{color:var(--purple);} .pc-plan-title.b{color:var(--blue);}
  .pc-plan-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;}
  .pc-plan-pct.ok{color:var(--green);} .pc-plan-pct.warn{color:var(--orange);} .pc-plan-pct.bad{color:var(--red);}
  .pc-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:5px;}
  .pc-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
  .pc-bar-fill.g{background:var(--green);} .pc-bar-fill.p{background:var(--purple);} .pc-bar-fill.b{background:var(--blue);} .pc-bar-fill.r{background:var(--red);}
  .pc-plan-text{font-size:10px;color:var(--muted);}

  .pc-chart{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px;margin-top:10px;}
  .pc-chart-title{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}

  /* Plan editor */
  .plan-editor{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .plan-editor-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .plan-editor-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;}
  .plan-editor-city{font-size:10px;color:var(--muted);font-weight:600;background:#141414;padding:4px 9px;border-radius:5px;letter-spacing:.5px;text-transform:uppercase;}
  .plan-editor-status{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px;}
  .plan-editor-status.saved{color:var(--green);}
  .plan-editor-status.saving{color:var(--orange);}
  .plan-editor-body{padding:14px;}
  .plan-fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width: 600px) { .plan-fields-grid{grid-template-columns:1fr;} }
  .plan-field{background:#141414;border:1px solid var(--border);border-radius:8px;padding:11px;}
  .plan-field.g{border-left:3px solid var(--green);} .plan-field.p{border-left:3px solid var(--purple);} .plan-field.b{border-left:3px solid var(--blue);}
  .plan-field-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
  .plan-field-lbl.g{color:var(--green);} .plan-field-lbl.p{color:var(--purple);} .plan-field-lbl.b{color:var(--blue);}
  .plan-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;outline:none;-webkit-appearance:none;}
  .plan-field input:focus{border-color:var(--accent);}
  .plan-field input::placeholder{color:var(--border);}
  .plan-field.g input{color:var(--green);}
  .plan-field.p input{color:var(--purple);}
  .plan-field.b input{color:var(--blue);}

  .plan-helper{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6;padding:11px;background:#141414;border-radius:8px;}
  .plan-helper b{color:var(--text);}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}
  .loader{display:flex;justify-content:center;align-items:center;padding:60px;color:var(--muted);font-size:14px;}
  .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* === Картина учредителей === */
  .ow-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
  .ow-kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px;}
  .ow-kpi.acc{border-color:rgba(232,184,75,.5);}
  .ow-kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;}
  .ow-kpi-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);line-height:1;letter-spacing:1px;}
  .ow-kpi-val.b{color:var(--blue);} .ow-kpi-val.g{color:var(--green);} .ow-kpi-val.p{color:var(--purple);}
  .ow-kpi-sub{font-size:11px;color:var(--muted);margin-top:7px;}
  .ow-delta{font-weight:600;}
  .ow-delta.up{color:var(--green);} .ow-delta.down{color:var(--red);}
  .ow-progress{margin-top:8px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .ow-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s;}
  .ow-progress-fill.green{background:var(--green);}
  .ow-progress-fill.red{background:var(--red);}

  .ow-heroes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  @media (max-width: 600px){ .ow-heroes{grid-template-columns:1fr;} }
  .ow-hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .ow-hero.leader{border-color:rgba(76,175,80,.4);}
  .ow-hero.outsider{border-color:rgba(244,67,54,.35);}
  .ow-hero-icon{font-size:24px;margin-bottom:6px;}
  .ow-hero-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px;}
  .ow-hero.leader .ow-hero-lbl{color:var(--green);}
  .ow-hero.outsider .ow-hero-lbl{color:var(--red);}
  .ow-hero-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--text);margin-bottom:7px;}
  .ow-hero-amount{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--accent);letter-spacing:1px;}
  .ow-hero-note{font-size:11px;color:var(--muted);margin-top:7px;}

  .ow-chart-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px;}
  @media (max-width: 900px){ .ow-chart-row{grid-template-columns:1fr;} }
  .ow-chart-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .ow-chart-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:2px;margin-bottom:13px;}
  .ow-chart-wrap{position:relative;height:240px;}

  .ow-points{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
  .ow-pc-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .ow-pc-row:last-child{margin-bottom:0;}
  .ow-pc-name{flex:0 0 130px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--text);}
  .ow-pc-bar-wrap{flex:1;height:24px;background:#141414;border-radius:6px;overflow:hidden;position:relative;}
  .ow-pc-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#d4a342);border-radius:6px;transition:width .5s;}
  .ow-pc-bar-text{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:'Bebas Neue',sans-serif;font-size:13px;color:#000;font-weight:600;letter-spacing:.5px;}
  .ow-pc-pct{flex:0 0 60px;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;}
  .ow-pc-pct.ok{color:var(--green);} .ow-pc-pct.warn{color:var(--orange);} .ow-pc-pct.bad{color:var(--red);} .ow-pc-pct.muted{color:var(--muted);}

  .ow-finance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  @media (max-width: 600px){ .ow-finance{grid-template-columns:1fr;} }
  .ow-finance-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .ow-finance-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;margin-bottom:11px;}

  <div class="mp-sheet">

      <button class="mp-year-arrow" onclick="mpYearPrev()">‹</button>
      <div class="mp-year" id="mp-year">2026</div>
      <button class="mp-year-arrow" onclick="mpYearNext()">›</button>
    </div>
    <div class="mp-grid" id="mp-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://uxdgiwbkvgbnrsuxjhvp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bg1BRofqJsjkV_9eXzn2Pg__YJ-xRMK';
  const ADMIN_CODE = 'rgplaza-admin-2026';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let allCharts = [];
  let cachedData = null;
  let saveTimers = {};
  let expandedFinance = new Set();  // раскрытые карточки финансов на Обзоре

  function toggleFinance(key, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (expandedFinance.has(key)) expandedFinance.delete(key); else expandedFinance.add(key);
    if (cachedData) renderOverview(cachedData);
  }

  function doLogin() {
    const code = document.getElementById('login-code').value.trim();
    if (code === ADMIN_CODE) { sessionStorage.setItem('rgp_admin', '1'); enterApp(); }
    else { document.getElementById('login-err').textContent = 'Неверный код'; }
  }

  function enterApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    const now = new Date();
    document.getElementById('month-pick').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    mpUpdateLabel();
    loadAll();
  }

  // === КАСТОМНЫЙ МЕСЯЦ-ПИКЕР ===
  const MP_MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  let mpGridYear = new Date().getFullYear();

  function mpGetCurrent() {
    const v = document.getElementById('month-pick').value || '';
    const [y, m] = v.split('-').map(Number);
    return [y || new Date().getFullYear(), m || (new Date().getMonth()+1)];
  }
  function mpSet(y, m) {
    document.getElementById('month-pick').value = `${y}-${String(m).padStart(2,'0')}`;
    mpUpdateLabel();
    loadAll();
  }
  function mpUpdateLabel() {
    const [y, m] = mpGetCurrent();
    const el = document.getElementById('mp-current');
    if (el) el.textContent = `${MP_MONTHS_FULL[m-1]} ${y}`;
  }
  function mpPrev() { let [y,m]=mpGetCurrent(); m--; if(m<1){m=12;y--;} mpSet(y,m); }
  function mpNext() { let [y,m]=mpGetCurrent(); m++; if(m>12){m=1;y++;} mpSet(y,m); }
  function mpOpenGrid() { const [y]=mpGetCurrent(); mpGridYear=y; mpRenderGrid(); document.getElementById('mp-modal').classList.add('show'); }
  function mpCloseGrid() { document.getElementById('mp-modal').classList.remove('show'); }
  function mpYearPrev() { mpGridYear--; mpRenderGrid(); }
  function mpYearNext() { mpGridYear++; mpRenderGrid(); }
  function mpRenderGrid() {
    document.getElementById('mp-year').textContent = mpGridYear;
    const [curY, curM] = mpGetCurrent();
    const now = new Date();
    const nowY = now.getFullYear(), nowM = now.getMonth()+1;
    let html = '';
    for (let i=0; i<12; i++) {
      const m = i+1;
      const isActive = (mpGridYear===curY && m===curM);
      const isFuture = (mpGridYear>nowY) || (mpGridYear===nowY && m>nowM);
      html += `<button class="mp-month ${isActive?'active':''} ${isFuture?'future':''}" onclick="mpPickMonth(${m})">${MP_MONTHS_FULL[i]}</button>`;
    }
    document.getElementById('mp-grid').innerHTML = html;
  }
  function mpPickMonth(m) { mpSet(mpGridYear, m); mpCloseGrid(); }

  function showPage(p) {
    document.querySelectorAll('.tab-page').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.top-tab').forEach(x => x.classList.remove('active'));
    document.getElementById('page-'+p).classList.add('active');
    event.target.classList.add('active');
    if (p === 'plans' && cachedData) renderPlans(cachedData);
    if (p === 'myreport' && cachedData) renderMyReport(cachedData);
    if (p === 'breakdown') renderBreakdown();
  }

  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type||'');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function fm(n) { return n ? Number(n).toLocaleString('ru-RU') : '0'; }
  function fs(n) { if (!n) return '0'; if (n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+' М'; if (n>=1000) return Math.round(n/1000)+' К'; return String(n); }
  function pdate(iso) { const [y,m,d]=iso.split('-'); return `${d}.${m}`; }

  // Рабочие дни в месяце с учётом графика
  function workDaysInMonth(year, month1, work_days) {
    const wd = work_days || 7;
    const total = new Date(year, month1, 0).getDate();
    if (wd >= 7) return total;
    let count = 0;
    for (let d = 1; d <= total; d++) {
      const day = new Date(year, month1-1, d).getDay();
      if (day !== 0) count++;
    }
    return count;
  }
  function workDaysPassed(year, month1, dayNum, work_days) {
    const wd = work_days || 7;
    if (wd >= 7) return dayNum;
    let count = 0;
    for (let d = 1; d <= dayNum; d++) {
      const day = new Date(year, month1-1, d).getDay();
      if (day !== 0) count++;
    }
    return count;
  }
  function getMonthRange() {
    const v = document.getElementById('month-pick').value || new Date().toISOString().substring(0,7);
    const [y,m] = v.split('-');
    return { start: `${y}-${m}-01`, end: new Date(+y, +m, 0).toISOString().split('T')[0], year:+y, month:+m };
  }

  async function loadAll() {
    document.getElementById('overview-content').innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю данные...</div>';
    document.getElementById('plans-content').innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю планы...</div>';
    allCharts.forEach(c => { try { c.destroy(); } catch(e){} });
    allCharts = [];

    const range = getMonthRange();
    const yearStart = `${range.year}-01-01`;
    const period = `${range.year}-${String(range.month).padStart(2,'0')}`;
    try {
      // Хелпер: если таблица не существует — возвращает пустой массив вместо краша
      const safe = async (q) => {
        try {
          const r = await q;
          if (r.error) { console.warn('Soft error:', r.error.message); return { data: [] }; }
          return r;
        } catch (e) { console.warn('Soft error:', e.message); return { data: [] }; }
      };

      const [pointsRes, reportsRes, plansRes, yearRes, fotRes, expRes, taxRes, dirsRes, pnlRes] = await Promise.all([
        sb.from('points').select('*').order('id'),
        sb.from('daily_reports').select('*').gte('date', range.start).lte('date', range.end).order('date'),
        sb.from('plans').select('*'),
        sb.from('daily_reports').select('point_id,date,total_day,debt_total,debt_retail,debt_insurance,owe_total,owe_ravt,owe_other').gte('date', yearStart).lte('date', range.end),
        sb.from('fot_summary').select('*').eq('period', period).maybeSingle(),
        sb.from('expenses_monthly').select('*').eq('period', period),
        sb.from('taxes_monthly').select('*').eq('period', period),
        sb.from('insurance_directions').select('*').gte('period', `${range.year}-01`).lte('period', period),
        safe(sb.from('point_pnl').select('*').or(`period.eq.${period},period.eq.${range.year}-YTD`))
      ]);
      if (pointsRes.error) throw pointsRes.error;
      if (reportsRes.error) throw reportsRes.error;
      if (plansRes.error) throw plansRes.error;

      const allPoints = pointsRes.data || [];
      const revenuePoints = allPoints.filter(p => p.is_revenue_point !== false && !['detailing','school','mgt','other'].includes(p.id));

      cachedData = {
        points: revenuePoints,
        allPoints: allPoints,
        reports: reportsRes.data || [],
        plans: plansRes.data || [],
        year: yearRes.data || [],
        fot: fotRes.data || null,
        expenses: expRes.data || [],
        taxes: taxRes.data || [],
        directions: dirsRes.data || [],
        pnl: pnlRes.data || [],
        range, period
      };
      renderOverview(cachedData);
      const plansActive = document.getElementById('page-plans').classList.contains('active');
      if (plansActive) renderPlans(cachedData);
      const myreportActive = document.getElementById('page-myreport').classList.contains('active');
      if (myreportActive) renderMyReport(cachedData);
      const breakdownActive = document.getElementById('page-breakdown').classList.contains('active');
      if (breakdownActive) renderBreakdown();
    } catch (e) {
      console.error(e);
      document.getElementById('overview-content').innerHTML = `<div class="empty">⚠ Ошибка загрузки: ${e.message || e}</div>`;
    }
  }

  function aggregateByPoint(data) {
    const byPoint = {};
    data.points.forEach(p => byPoint[p.id] = {
      point: p,
      reports: [],
      plan: data.plans.find(pl => pl.point_id === p.id) || { plan_phys_day: 0, plan_phys_month: 0, plan_corp_day: 0, plan_corp_month: 0, plan_ins_day: 0, plan_ins_month: 0 }
    });
    data.reports.forEach(r => { if (byPoint[r.point_id]) byPoint[r.point_id].reports.push(r); });
    return byPoint;
  }

  function renderOverview(data) {
    if (!data.points.length) { document.getElementById('overview-content').innerHTML = '<div class="empty">Точки не настроены</div>'; return; }

    const mn = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const mnShort = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    const monthName = mn[data.range.month-1];
    const byPoint = aggregateByPoint(data);

    const moscowPoints = data.points.filter(p => p.format !== 'izhevsk');
    const izhevskPoints = data.points.filter(p => p.format === 'izhevsk');

    let allTotal=0, allInsur=0, allPhys=0, allCorp=0, allRetail=0, allPlanPhysM=0, allPlanCorpM=0, allPlanInsM=0;
    const dateSet = new Set();
    Object.values(byPoint).forEach(({reports, plan}) => {
      reports.forEach(r => {
        allTotal += +r.total_day || 0;
        allInsur += +r.ins_day || 0;
        allPhys += +r.phys_day || 0;
        allCorp += +r.corp_day || 0;
        allRetail += +r.retail_day || 0;
        dateSet.add(r.date);
      });
      allPlanPhysM += +plan.plan_phys_month || 0;
      allPlanCorpM += +plan.plan_corp_month || 0;
      allPlanInsM  += +plan.plan_ins_month  || 0;
    });
    const physPct = allPlanPhysM ? Math.round(allPhys/allPlanPhysM*100) : null;
    const corpPct = allPlanCorpM ? Math.round(allCorp/allPlanCorpM*100) : null;
    const insPct  = allPlanInsM  ? Math.round(allInsur/allPlanInsM*100) : null;
    const allPlanTotal = allPlanPhysM + allPlanCorpM + allPlanInsM;
    const planPct = allPlanTotal > 0 ? Math.round(allTotal / allPlanTotal * 100) : null;

    // === Долги (берём последний отчёт где долги > 0 за весь год до конца месяца) ===
    const lastDebtsByPoint = {};
    (data.year || []).forEach(r => {
      const hasDebts = (+r.debt_total > 0) || (+r.owe_total > 0);
      if (!hasDebts) return;
      if (!lastDebtsByPoint[r.point_id] || r.date > lastDebtsByPoint[r.point_id].date) lastDebtsByPoint[r.point_id] = r;
    });
    let totalDebt=0, totalOwe=0, totalOweRavt=0, totalOweOther=0;
    Object.values(lastDebtsByPoint).forEach(r => {
      totalDebt += +r.debt_total || 0;
      totalOwe += +r.owe_total || 0;
      totalOweRavt += +r.owe_ravt || 0;
      totalOweOther += +r.owe_other || 0;
    });

    // === Финансы ===
    const fot = data.fot || {};
    const fotTotal = +fot.fot_total || 0;
    const expWithoutSalary = (data.expenses || []).filter(r => !r.category.startsWith('salary_')).reduce((s,r) => s + (+r.amount), 0);
    const taxTotal = (data.taxes || []).reduce((s,r) => s + (+r.amount), 0);
    const profit = allTotal - expWithoutSalary - fotTotal - taxTotal;
    const profitMargin = allTotal > 0 ? Math.round(profit / allTotal * 100) : 0;
    const fotPct = allTotal > 0 ? Math.round(fotTotal / allTotal * 100) : 0;
    const hasFinanceData = fotTotal > 0 || expWithoutSalary > 0 || taxTotal > 0;

    // Кэшфлоу из Планфакт за месяц
    const period = data.period;
    const revIds = new Set(data.points.map(p => p.id));
    const monthPnlMain = (data.pnl || []).filter(p => p.period === period && revIds.has(p.point_id));
    const cashflowIncome = monthPnlMain.reduce((s,p) => s + (+p.income||0), 0);
    const cashflowExp = monthPnlMain.reduce((s,p) => s + (+p.expenses||0), 0);
    const cashflow = cashflowIncome - cashflowExp;
    const cashflowMargin = cashflowIncome > 0 ? Math.round(cashflow / cashflowIncome * 100) : 0;
    const hasCashflowData = monthPnlMain.length > 0 && (cashflowIncome > 0 || cashflowExp > 0);
    // Fallback на YTD
    const ytdMain = (data.pnl || []).filter(p => p.period === `${data.range.year}-YTD` && revIds.has(p.point_id));
    const ytdIncome = ytdMain.reduce((s,p) => s + (+p.income||0), 0);
    const ytdExp = ytdMain.reduce((s,p) => s + (+p.expenses||0), 0);
    const ytdCashflow = ytdIncome - ytdExp;
    const hasYtdData = ytdMain.length > 0 && (ytdIncome > 0 || ytdExp > 0);

    // === Полнота месяца ===
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === data.range.year && today.getMonth()+1 === data.range.month;
    const isPastMonth = data.range.year < today.getFullYear() || (data.range.year === today.getFullYear() && data.range.month < today.getMonth()+1);
    const daysInMonth = new Date(data.range.year, data.range.month, 0).getDate();
    const monthCoverage = dateSet.size / daysInMonth;
    const monthsComplete = isPastMonth || monthCoverage >= 0.85;

    // === Алерты ===
    const alerts = [];

    // 1. Точки которые не отчитались до 19:00 локального времени
    if (isCurrentMonth) {
      const todayStr = today.toISOString().substring(0,10);
      const dayOfWeek = today.getDay();
      const reportedToday = new Set();
      data.reports.forEach(r => { if (r.date === todayStr && +r.total_day > 0) reportedToday.add(r.point_id); });

      // Получаем UTC-часы и считаем локальное время для каждой точки
      // Москва = UTC+3, Ижевск = UTC+4
      const utcHour = today.getUTCHours();
      const utcMin = today.getUTCMinutes();
      const moscowHour = (utcHour + 3) % 24;        // МСК
      const izhevskHour = (utcHour + 4) % 24;       // ИЖТ

      // Точки которые не отчитались
      const notReportedMoscow = [];
      const notReportedIzhevsk = [];
      data.points.forEach(p => {
        if (reportedToday.has(p.id)) return;
        const closedDay = +p.closed_day_of_week;
        if (closedDay && closedDay === dayOfWeek) return; // выходной точки
        if (p.format === 'izhevsk') {
          if (izhevskHour >= 19) notReportedIzhevsk.push(p);
        } else {
          if (moscowHour >= 19) notReportedMoscow.push(p);
        }
      });

      if (notReportedIzhevsk.length > 0) {
        alerts.push({ type:'red', icon:'⏰', text:`<b>Ижевск не отчитался до 19:00:</b> ${notReportedIzhevsk.map(p => p.name).join(', ')} (сейчас ${String(izhevskHour).padStart(2,'0')}:${String(utcMin).padStart(2,'0')} ИЖТ)` });
      }
      if (notReportedMoscow.length > 0) {
        alerts.push({ type:'red', icon:'⏰', text:`<b>Москва не отчиталась до 19:00:</b> ${notReportedMoscow.map(p => p.name).join(', ')} (сейчас ${String(moscowHour).padStart(2,'0')}:${String(utcMin).padStart(2,'0')} МСК)` });
      }

      // Превентивные напоминания за час до дедлайна
      const warnIzh = [];
      const warnMos = [];
      data.points.forEach(p => {
        if (reportedToday.has(p.id)) return;
        const closedDay = +p.closed_day_of_week;
        if (closedDay && closedDay === dayOfWeek) return;
        if (p.format === 'izhevsk') {
          if (izhevskHour === 18) warnIzh.push(p);
        } else {
          if (moscowHour === 18) warnMos.push(p);
        }
      });
      if (warnIzh.length > 0) {
        alerts.push({ type:'orange', icon:'🔔', text:`<b>Напоминание:</b> у ${warnIzh.map(p => p.name).join(', ')} (Ижевск) меньше часа до дедлайна 19:00` });
      }
      if (warnMos.length > 0) {
        alerts.push({ type:'orange', icon:'🔔', text:`<b>Напоминание:</b> у ${warnMos.map(p => p.name).join(', ')} (Москва) меньше часа до дедлайна 19:00` });
      }
    }

    // 2. Кэшфлоу — главный показатель
    if (hasCashflowData && cashflow < 0) {
      alerts.push({ type:'red', icon:'⚠️', text:`<b>Месяц убыточный по деньгам:</b> ушло на ${fm(Math.abs(cashflow))} ₽ больше чем пришло` });
    } else if (hasCashflowData && cashflowMargin > 0 && cashflowMargin < 10) {
      alerts.push({ type:'orange', icon:'📉', text:`<b>Низкая маржа кэшфлоу:</b> ${cashflowMargin}% от поступлений` });
    }

    // 3. План под угрозой (если на середине месяца идём ниже плана)
    if (isCurrentMonth && allPlanTotal > 0 && monthCoverage > 0.3) {
      const projected = allTotal / monthCoverage;
      const projectedPct = Math.round(projected / allPlanTotal * 100);
      if (projectedPct < 80) {
        alerts.push({ type:'orange', icon:'🎯', text:`<b>План под угрозой:</b> при текущей скорости будет ${projectedPct}% (${fm(projected)} из ${fm(allPlanTotal)} ₽)` });
      } else if (projectedPct >= 110) {
        alerts.push({ type:'green', icon:'🚀', text:`<b>План будет перевыполнен:</b> прогноз ${projectedPct}% (${fm(projected)} из ${fm(allPlanTotal)} ₽)` });
      }
    }

    // 4. ФОТ выше нормы
    if (fotPct > 35 && allTotal > 0 && hasFinanceData) {
      alerts.push({ type:'red', icon:'💼', text:`<b>ФОТ ${fotPct}%</b> от выручки — выше нормы (макс 30%)` });
    }

    // 5. Долги прочим
    if (totalOweOther > allTotal * 1.5 && totalOweOther > 0 && allTotal > 100000) {
      alerts.push({ type:'red', icon:'🚨', text:`<b>Долг прочим поставщикам ${fm(totalOweOther)} ₽</b> — это ${(totalOweOther/allTotal).toFixed(1)}× выручки. Без учёта РАВТ (взаимозачёт)` });
    }

    // === HTML ===
    let html = '';

    // Алерты сверху
    if (alerts.length) {
      html += `<div class="alerts">`;
      alerts.forEach(a => {
        html += `<div class="alert ${a.type}"><div class="alert-icon">${a.icon}</div><div class="alert-text">${a.text}</div></div>`;
      });
      html += `</div>`;
    }

    // Hero блок (прежний)
    html += `
      <div class="hero">
        <div class="hero-card acc">
          <div class="hero-lbl">${monthName} ${data.range.year} — общий вал</div>
          <div class="hero-val">${fm(allTotal)} ₽</div>
          <div class="hero-sub">${planPct !== null ? `${planPct}% от плана ${fm(allPlanTotal)} ₽` : `${dateSet.size} дн с отчётами`}</div>
        </div>
        <div class="hero-card">
          <div class="hero-lbl">Физлица (план)</div>
          <div class="hero-val g">${fm(allPhys)} ₽</div>
          <div class="hero-sub">${physPct !== null ? `${physPct}% от ${fm(allPlanPhysM)} ₽` : 'план не задан'}</div>
        </div>
        <div class="hero-card">
          <div class="hero-lbl">Корпоратив (план)</div>
          <div class="hero-val p">${fm(allCorp)} ₽</div>
          <div class="hero-sub">${corpPct !== null ? `${corpPct}% от ${fm(allPlanCorpM)} ₽` : 'план не задан'}</div>
        </div>
        <div class="hero-card">
          <div class="hero-lbl">Страховые</div>
          <div class="hero-val b">${fm(allInsur)} ₽</div>
        </div>
      </div>`;

    // Финансовый блок
    html += `<div class="finance-row">
      <div class="fin-card ${hasCashflowData ? (cashflow >= 0 ? 'green' : 'red') : (hasYtdData ? 'blue' : 'orange')} ${expandedFinance.has('profit')?'is-expanded':''}" onclick="toggleFinance('profit', event)">
        <div class="fin-expand-icon">+</div>
        <div class="fin-lbl">💰 Кэшфлоу <span style="font-size:8px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;">${hasCashflowData ? 'из Планфакт' : (hasYtdData ? 'YTD только' : 'из Планфакт')}</span></div>
        <div class="fin-val ${hasCashflowData ? (cashflow >= 0 ? 'g' : 'r') : (hasYtdData ? 'b' : 'o')}">${hasCashflowData ? (cashflow >= 0 ? '+' : '') + fm(cashflow) + ' ₽' : (hasYtdData ? (ytdCashflow >= 0 ? '+' : '') + fm(ytdCashflow) + ' ₽' : '— нет данных')}</div>
        <div class="fin-sub">${hasCashflowData ? `маржа ${cashflowMargin}%` : (hasYtdData ? `накопленно за год` : 'не загружено')}</div>
        ${expandedFinance.has('profit') ? `<div class="fin-detail">
          ${hasCashflowData ? `
            <div class="fin-detail-item"><span>+ Поступления</span><span class="v g">${fm(cashflowIncome)}</span></div>
            <div class="fin-detail-item"><span>− Выплаты</span><span class="v r">${fm(cashflowExp)}</span></div>
            <div class="fin-detail-item"><b>= Кэшфлоу</b><span class="v ${cashflow >= 0 ? 'g' : 'r'}">${cashflow >= 0 ? '+' : ''}${fm(cashflow)}</span></div>
          ` : (hasYtdData ? `
            <div class="fin-detail-item"><span>+ Поступления YTD</span><span class="v g">${fm(ytdIncome)}</span></div>
            <div class="fin-detail-item"><span>− Выплаты YTD</span><span class="v r">${fm(ytdExp)}</span></div>
            <div class="fin-detail-item"><b>= Кэшфлоу YTD</b><span class="v ${ytdCashflow >= 0 ? 'g' : 'r'}">${ytdCashflow >= 0 ? '+' : ''}${fm(ytdCashflow)}</span></div>
            <div class="fin-detail-item" style="grid-column:1/-1;"><span style="font-size:10px;line-height:1.4;color:var(--muted);">📊 Помесячных данных нет — показано накопленное за год</span><span></span></div>
          ` : `
            <div class="fin-detail-item" style="grid-column:1/-1;"><span style="font-size:11px;line-height:1.4;color:var(--muted);">Бухгалтер ещё не загрузил Планфакт</span><span></span></div>
          `)}
        </div>` : ''}
      </div>
      ${hasFinanceData ? `
      <div class="fin-card orange ${expandedFinance.has('fot')?'is-expanded':''}" onclick="toggleFinance('fot', event)">
        <div class="fin-expand-icon">+</div>
        <div class="fin-lbl">👥 ФОТ</div>
        <div class="fin-val o">${fm(fotTotal)} ₽</div>
        <div class="fin-sub">${fotPct}% от выручки</div>
        ${expandedFinance.has('fot') ? `<div class="fin-detail">
          <div class="fin-detail-item"><span>Совхозная</span><span class="v">${fm(fot.fot_sovhoz)}</span></div>
          <div class="fin-detail-item"><span>Москва</span><span class="v">${fm(fot.fot_moscow)}</span></div>
          <div class="fin-detail-item"><span>Пойма</span><span class="v">${fm(fot.fot_poyma)}</span></div>
          <div class="fin-detail-item"><span>Детейлинг</span><span class="v">${fm(fot.fot_detailing)}</span></div>
        </div>` : ''}
      </div>
      <div class="fin-card red ${expandedFinance.has('exp')?'is-expanded':''}" onclick="toggleFinance('exp', event)">
        <div class="fin-expand-icon">+</div>
        <div class="fin-lbl">📦 Расходы</div>
        <div class="fin-val r">${fm(expWithoutSalary)} ₽</div>
        <div class="fin-sub">аренда, лизинг, кредиты</div>
        ${expandedFinance.has('exp') ? `<div class="fin-detail">
          ${(function(){
            const cats = {};
            data.expenses.filter(r => !r.category.startsWith('salary_')).forEach(r => { cats[r.category] = (cats[r.category]||0) + (+r.amount); });
            return Object.entries(cats).sort((a,b) => b[1] - a[1]).slice(0, 6).map(([cat, sum]) =>
              `<div class="fin-detail-item"><span>${cat}</span><span class="v">${fm(sum)}</span></div>`
            ).join('');
          })()}
        </div>` : ''}
      </div>
      <div class="fin-card blue ${expandedFinance.has('tax')?'is-expanded':''}" onclick="toggleFinance('tax', event)">
        <div class="fin-expand-icon">+</div>
        <div class="fin-lbl">📋 Налоги</div>
        <div class="fin-val b">${fm(taxTotal)} ₽</div>
        <div class="fin-sub">${data.taxes.length} платежей</div>
        ${expandedFinance.has('tax') ? `<div class="fin-detail">
          ${(function(){
            const types = {};
            data.taxes.forEach(r => { types[r.tax_type] = (types[r.tax_type]||0) + (+r.amount); });
            return Object.entries(types).sort((a,b) => b[1] - a[1]).map(([t, sum]) =>
              `<div class="fin-detail-item"><span>${t}</span><span class="v">${fm(sum)}</span></div>`
            ).join('');
          })()}
        </div>` : ''}
      </div>
      ` : ''}
    </div>`;

    // Мини-блок Долги (только если есть)
    if (totalDebt > 0 || totalOwe > 0) {
      html += `<div class="debts-mini">`;
      if (totalDebt > 0) {
        html += `<div class="debt-card owe-us">
          <div class="debt-title o">🟡 Нам должны</div>
          <div class="debt-val o">${fm(totalDebt)} ₽</div>
          <div class="debt-sub">по последним заказ-нарядам</div>
        </div>`;
      }
      if (totalOwe > 0) {
        html += `<div class="debt-card we-owe">
          <div class="debt-title r">🔴 Мы должны</div>
          <div class="debt-val r">${fm(totalOwe)} ₽</div>
          <div class="debt-sub">РАВТ ${fm(totalOweRavt)} (взаимозачёт) + прочие ${fm(totalOweOther)}</div>
        </div>`;
      }
      html += `</div>`;
    }

    // Точки
    if (moscowPoints.length) {
      html += `<div class="city-section"><div class="city-title">Москва</div><div class="points-grid">`;
      moscowPoints.forEach(p => html += renderPointCard(byPoint[p.id], data.range, lastDebtsByPoint));
      html += `</div></div>`;
    }
    if (izhevskPoints.length) {
      html += `<div class="city-section"><div class="city-title">Ижевск</div><div class="points-grid">`;
      izhevskPoints.forEach(p => html += renderPointCard(byPoint[p.id], data.range, lastDebtsByPoint));
      html += `</div></div>`;
    }

    document.getElementById('overview-content').innerHTML = html;

    // Рендер графиков
    setTimeout(() => {
      data.points.forEach(p => {
        const entry = byPoint[p.id];
        if (!entry || !entry.reports.length) return;
        const ctx = document.getElementById('chart-'+p.id);
        if (!ctx) return;
        const labels = entry.reports.map(d => pdate(d.date));
        const physData = entry.reports.map(d => +d.phys_day || 0);
        const corpData = entry.reports.map(d => +d.corp_day || 0);
        const ch = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets: [
            { label: 'Физлица', data: physData, backgroundColor: 'rgba(34,197,94,.7)', borderRadius: 3 },
            { label: 'Корпоратив', data: corpData, backgroundColor: 'rgba(168,85,247,.7)', borderRadius: 3 }
          ] },
          options: chartCfg(true)
        });
        allCharts.push(ch);
      });
    }, 50);
  }

  function renderPointCard(entry, range, lastDebtsByPoint) {
    const { point, reports, plan } = entry;
    let t=0,i=0,phys=0,c=0;
    reports.forEach(d => { t+=+d.total_day||0; i+=+d.ins_day||0; phys+=+d.phys_day||0; c+=+d.corp_day||0; });

    // Долги точки
    const lastDebt = lastDebtsByPoint ? lastDebtsByPoint[point.id] : null;
    const pointDebt = lastDebt ? (+lastDebt.debt_total || 0) : 0;
    const pointOwe = lastDebt ? (+lastDebt.owe_total || 0) : 0;
    const pointOweOther = lastDebt ? (+lastDebt.owe_other || 0) : 0;
    const owesAlert = t > 0 && pointOweOther > t * 1.5;

    function progressBlock(title, cls, plan, actual) {
      if (!plan) return `<div class="pc-plan"><div class="pc-plan-head"><div class="pc-plan-title ${cls}">${title}</div><div class="pc-plan-pct">—</div></div><div class="pc-plan-text">План не задан</div></div>`;
      const pct = Math.round(actual/plan*100);
      const pctCls = pct >= 90 ? 'ok' : pct >= 70 ? 'warn' : 'bad';
      const today = new Date();
      const totalWork = workDaysInMonth(range.year, range.month, point.work_days);
      const passedWork = (today.getFullYear() === range.year && today.getMonth()+1 === range.month)
        ? workDaysPassed(range.year, range.month, today.getDate(), point.work_days)
        : totalWork;
      const expected = Math.round(plan / totalWork * passedWork);
      return `<div class="pc-plan">
        <div class="pc-plan-head">
          <div class="pc-plan-title ${cls}">${title}</div>
          <div class="pc-plan-pct ${pctCls}">${pct}%</div>
        </div>
        <div class="pc-bar"><div class="pc-bar-fill ${cls}" style="width:${Math.min(100,pct)}%"></div></div>
        <div class="pc-plan-text">${fm(actual)} / ${fm(plan)} ₽ · По графику: ${fm(expected)} ₽${actual >= expected ? ' (опережение)' : ` (отставание ${fm(expected-actual)})`}</div>
      </div>`;
    }

    return `
      <div class="point-card${owesAlert ? ' point-card-debt-alert' : ''}">
        <div class="point-card-head">
          <div class="point-card-name">${point.name}</div>
          ${owesAlert ? `<div style="font-size:9px;background:rgba(244,67,54,.2);color:var(--red);padding:3px 7px;border-radius:4px;font-weight:700;letter-spacing:.4px;margin-left:auto;margin-right:8px;">⚠ ДОЛГ</div>` : ''}
          <div class="point-card-days">${reports.length} дн.</div>
        </div>
        <div class="point-card-body">
          <div class="pc-stats">
            <div class="pc-stat"><div class="pc-stat-lbl">Всего</div><div class="pc-stat-val t">${fm(t)} ₽</div></div>
            <div class="pc-stat"><div class="pc-stat-lbl">Страховые</div><div class="pc-stat-val b">${fm(i)} ₽</div></div>
            <div class="pc-stat"><div class="pc-stat-lbl">Физлица</div><div class="pc-stat-val g">${fm(phys)} ₽</div></div>
            <div class="pc-stat"><div class="pc-stat-lbl">Корпоратив</div><div class="pc-stat-val p">${fm(c)} ₽</div></div>
          </div>
          ${(pointDebt > 0 || pointOwe > 0) ? `
          <div style="display:flex;gap:8px;margin-top:8px;font-size:11px;">
            ${pointDebt > 0 ? `<div style="flex:1;padding:7px 10px;background:#141414;border-radius:6px;border-left:2px solid var(--orange);"><div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;">🟡 Нам должны</div><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--orange);letter-spacing:.4px;">${fm(pointDebt)} ₽</div></div>` : ''}
            ${pointOwe > 0 ? `<div style="flex:1;padding:7px 10px;background:#141414;border-radius:6px;border-left:2px solid var(--red);"><div style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;">🔴 Мы должны</div><div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--red);letter-spacing:.4px;">${fm(pointOwe)} ₽</div></div>` : ''}
          </div>` : ''}
          ${progressBlock('Страховые', 'b', plan.plan_ins_month, i)}
          ${progressBlock('Физлица', 'g', plan.plan_phys_month, phys)}
          ${progressBlock('Корпоратив', 'p', plan.plan_corp_month, c)}
          ${reports.length ? `<div class="pc-chart"><div class="pc-chart-title">📈 Физ vs Корп по дням</div><canvas id="chart-${point.id}" height="120"></canvas></div>` : ''}
        </div>
      </div>`;
  }

  function chartCfg(showLegend) {
    return {
      responsive: true,
      plugins: { legend: { display: !!showLegend, labels: { color: '#ffffff', font: { size: 10 } } } },
      scales: {
        x: { ticks: { color: '#909090', font: { size: 9 } }, grid: { color: '#333333' } },
        y: { ticks: { color: '#909090', font: { size: 9 }, callback: v => fs(v) }, grid: { color: '#333333' } }
      }
    };
  }

  // ============ PLANS PAGE ============
  function renderPlans(data) {
    if (!data.points.length) { document.getElementById('plans-content').innerHTML = '<div class="empty">Точки не настроены</div>'; return; }

    const moscowPoints = data.points.filter(p => p.format !== 'izhevsk');
    const izhevskPoints = data.points.filter(p => p.format === 'izhevsk');
    const byPoint = aggregateByPoint(data);

    let html = `<div class="plan-helper">
      <b>💡 Как работает:</b> для каждой точки задаётся план на месяц — отдельно физлица и корпоратив. Дневной план рассчитывается автоматически с учётом графика точки (7/0 или 6/1) и количества рабочих дней в месяце.<br>
      Если хочешь — можешь вручную переопределить дневной план в соответствующем поле.<br>
      Изменения сохраняются автоматически (через 1 секунду после ввода). Менеджеры точки видят актуальный план в реальном времени.
    </div>`;

    if (moscowPoints.length) {
      html += `<div class="city-section"><div class="city-title">Москва</div>`;
      moscowPoints.forEach(p => html += renderPlanEditor(byPoint[p.id]));
      html += `</div>`;
    }

              <input type="number" placeholder="${autoInsDay || '0'}" value="${plan.plan_ins_day || ''}" data-pid="${point.id}" data-field="plan_ins_day" oninput="onPlanInput(this)">

              <div class="plan-field-lbl p">📅 Корпоратив / день <span style="color:var(--muted);font-weight:600;text-transform:none;font-size:9px;letter-spacing:0;">${autoCorpDay ? `(авто: ${fm(autoCorpDay)})` : ''}</span></div>
              <input type="number" placeholder="${autoCorpDay || '0'}" value="${plan.plan_corp_day || ''}" data-pid="${point.id}" data-field="plan_corp_day" oninput="onPlanInput(this)">
