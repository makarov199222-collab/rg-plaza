  // Показ деталей канала (страх/розн/корп)
  function showStructureDetail(channelKey, channelLabel, channelTotal, data, pointStats) {
    const block = document.getElementById('structure-detail-block');
    if (!block) return;
    // Разбивка по точкам для этого канала
    const byPoint = data.points.map(p => {
      const s = pointStats[p.id];
      let v = 0;
      if (channelKey === 'ins') v = s.ins;
      else if (channelKey === 'retail') v = s.retail;
      else if (channelKey === 'corp') v = s.corp;
      return { name: p.name, val: v };
    }).filter(x => x.val > 0).sort((a,b) => b.val - a.val);

    const colors = { ins: 'var(--blue)', retail: 'var(--green)', corp: 'var(--purple)' };
    block.innerHTML = `
      <div style="margin-top:14px;padding:13px;background:#141414;border-radius:10px;border-left:3px solid ${colors[channelKey] || 'var(--accent)'};">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${colors[channelKey] || 'var(--accent)'};letter-spacing:1.5px;margin-bottom:9px;">${channelLabel}: ${fm(channelTotal)} ₽</div>
        ${byPoint.length > 0 ? `<div class="expand-row">${byPoint.map(p =>
          `<div class="expand-item"><span><b>${p.name}</b></span><span class="v">${fm(p.val)} ₽ · ${Math.round(p.val/channelTotal*100)}%</span></div>`
        ).join('')}</div>` : '<div style="color:var(--muted);font-size:12px;">Нет данных по точкам</div>'}
      </div>`;
  }

  // Переход на конкретный месяц года
  function goToMonth(year, month) {
    document.getElementById('month-pick').value = `${year}-${String(month).padStart(2,'0')}`;
    mpUpdateLabel();
    loadAll();
  }

  function renderTopServices(data, monthName) {
    const breakdown = data.breakdown || [];
    const breakdownPrev = data.breakdownPrev || [];

    // Если нет данных за месяц — пропускаем блок
    if (!breakdown.length) {
      return `<div class="section">
        <div class="section-title">🏆 ТОП по услугам · ${monthName}</div>
        <div class="top-empty" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;">
          📭 Детализация по услугам за этот месяц ещё не заведена<br>
          <span style="font-size:10px;">Бухгалтер вносит детализацию обычно в начале следующего месяца</span>
        </div>
      </div>`;
    }

    // Список «допуслуг» которые интересно отслеживать (розничный канал, не основные стёкла)
    const ADDONS = ['Щётки', 'Реализация товаров (герметик, автохимия)', 'Ремонт сколов', 'Полировка', 'Тонировка', 'Бронепленка', 'Шумоизоляция', 'Антидождь'];

    // Топ услуг (только розница) — здесь category это название услуги
    const byCategory = {};
    breakdown.filter(b => b.channel === 'retail').forEach(b => {
      byCategory[b.category] = (byCategory[b.category] || 0) + (+b.amount || 0);
    });
    const topCategories = Object.entries(byCategory)
      .map(([cat, sum]) => ({ cat, sum }))
      .filter(x => x.sum > 0)
      .sort((a,b) => b.sum - a.sum)
      .slice(0, 6);

    // Прошлый месяц для сравнения (тоже только розница)
    const byCategoryPrev = {};
    breakdownPrev.filter(b => b.channel === 'retail').forEach(b => {
      byCategoryPrev[b.category] = (byCategoryPrev[b.category] || 0) + (+b.amount || 0);
    });

    const totalSum = topCategories.reduce((s,x) => s + x.sum, 0);

    // Допродажи — по точкам (где лучше продают)
    const addons = ADDONS.map(a => {
      const byPoint = {};
      let totalAddon = 0;
      breakdown.forEach(b => {
        if (b.category !== a) return;
        byPoint[b.point_id] = (byPoint[b.point_id] || 0) + (+b.amount || 0);
        totalAddon += (+b.amount || 0);
      });
      if (totalAddon === 0) return null;
      const sortedPoints = Object.entries(byPoint).sort((a,b) => b[1] - a[1]);
      const leader = sortedPoints[0];
      const leaderName = leader ? (data.points.find(p => p.id === leader[0])?.name || leader[0]) : '—';
      return { name: a, total: totalAddon, leader: leaderName, leaderSum: leader ? leader[1] : 0, byPoint: sortedPoints };
    }).filter(Boolean).sort((a,b) => b.total - a.total);

    // Топ СК за месяц
    const bySK = {};
    breakdown.filter(b => b.channel === 'insurance').forEach(b => {
      bySK[b.category] = (bySK[b.category] || 0) + (+b.amount || 0);
    });
    const topSK = Object.entries(bySK).map(([sk, sum]) => ({ sk, sum })).filter(x => x.sum > 0).sort((a,b) => b.sum - a.sum).slice(0, 5);
    const totalSK = topSK.reduce((s,x) => s + x.sum, 0);

    // По каким точкам есть данные?
    const pointsWithData = new Set(breakdown.map(b => b.point_id));
    const pointNames = Array.from(pointsWithData).map(pid => data.points.find(p => p.id === pid)?.name || pid);
    const pointsCovered = pointsWithData.size;
    const pointsMissing = data.points.filter(p => !pointsWithData.has(p.id));
    const isFullCoverage = pointsCovered === data.points.length;

    // Имя предыдущего месяца для дельт
    const prevMonthName = MP_MONTHS_SHORT[(data.range.month + 10) % 12];   // -2 mod 12 + 1

    let html = `<div class="section">
      <div class="section-title">🏆 ТОП по услугам · ${monthName}</div>`;

    // Дисклеймер если данные не по всем точкам
    if (!isFullCoverage) {
      html += `<div style="background:var(--surface);border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--text);line-height:1.5;">
        ℹ️ <b>Детализация заведена только по точкам:</b> ${pointNames.join(', ')}.
        <span style="color:var(--muted);">Данные по ${pointsMissing.map(p => p.name).join(', ')} в этом блоке отсутствуют.</span>
      </div>`;
    }

    html += `<div class="top-grid">`;

    // Карточка 1: Топ услуг
    html += `<div class="top-card">
      <div class="top-title">💰 Топ услуг розницы <span style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:4px;">живые деньги · ${pointNames.join(', ')}</span></div>
      <div class="top-list">`;
    topCategories.forEach((c, i) => {
      const prev = byCategoryPrev[c.cat] || 0;
      const delta = prev > 0 ? Math.round((c.sum - prev) / prev * 100) : null;
      const pctOfTotal = totalSum > 0 ? Math.round(c.sum / totalSum * 100) : 0;
      const deltaStr = delta !== null ? ` <span style="font-size:10px;color:${delta >= 0 ? 'var(--green)' : 'var(--red)'};">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)}% к ${prevMonthName}</span>` : ` <span style="font-size:10px;color:var(--muted);">(нет ${prevMonthName})</span>`;
      html += `<div class="top-item">
        <div class="top-item-rank">${i+1}</div>
        <div style="flex:1;">
          <div class="top-item-name">${c.cat}${deltaStr}</div>
          <div class="top-item-bar"><div class="top-item-bar-fill" style="width:${pctOfTotal}%"></div></div>
        </div>
        <div class="top-item-val">${fm(c.sum)} ₽</div>
      </div>`;
    });
    html += `</div></div>`;

    // Карточка 2: Допродажи (если есть)
    if (addons.length > 0) {
      html += `<div class="top-card">
        <div class="top-title">🛒 Допродажи</div>
        <div class="top-list">`;
      addons.forEach((a) => {
        const allPoints = a.byPoint.map(([pid, sum]) => {
          const pName = data.points.find(p => p.id === pid)?.name || pid;
          return { name: pName, sum };
        });
        const tags = allPoints.map((p, idx) =>
          `<span class="top-point-tag${idx === 0 ? ' leader' : ''}">${p.name}: ${fm(p.sum)} ₽</span>`
        ).join('');
        html += `<div class="top-item" style="flex-direction:column;align-items:stretch;gap:5px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="top-item-name" style="flex:1;">${a.name}</div>
            <div class="top-item-val acc">${fm(a.total)} ₽</div>
          </div>
          <div class="top-points-row">${tags}</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    // Карточка 3: Топ СК
    if (topSK.length > 0) {
      html += `<div class="top-card">
        <div class="top-title">🛡 Топ страховых компаний <span style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:4px;">живые деньги</span></div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:9px;line-height:1.4;">💡 Цифры из Планфакта — могут включать оплаты за прошлые периоды (отсрочки СК до 30+ дней)</div>
        <div class="top-list">`;
      topSK.forEach((s, i) => {
        const pctOfTotal = totalSK > 0 ? Math.round(s.sum / totalSK * 100) : 0;
        html += `<div class="top-item">
          <div class="top-item-rank">${i+1}</div>
          <div style="flex:1;">
            <div class="top-item-name">${s.sk}</div>
            <div class="top-item-bar"><div class="top-item-bar-fill" style="width:${pctOfTotal}%;background:#2196f3;"></div></div>
          </div>
          <div class="top-item-val">${fm(s.sum)} ₽</div>
          <div class="top-item-pct">${pctOfTotal}%</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    html += `</div></div>`;
    return html;
  }

  function renderProjectsPnl(data) {
    const pnl = data.pnl || [];
    if (!pnl.length) return '';   // нет данных — блока нет

    // Берём только YTD за текущий год (накопленно)
    const ytdRows = pnl.filter(p => p.period === `${data.range.year}-YTD`);
    if (!ytdRows.length) return '';

    const allPoints = data.allPoints || data.points;

    // Связываем PNL с проектами
    const enriched = ytdRows.map(row => {
      const proj = allPoints.find(p => p.id === row.point_id);
      return {
        ...row,
        name: proj?.name || row.point_id,
        is_revenue_point: proj?.is_revenue_point !== false,
        project_type: proj?.project_type || 'other',
        is_active: proj?.is_active !== false,
        display_order: proj?.display_order || 100
      };
    });

    // Делим на основные / прочие
    const main = enriched.filter(x => x.is_revenue_point && x.is_active).sort((a,b) => +b.operating_flow - +a.operating_flow);
    const other = enriched.filter(x => !x.is_revenue_point || !x.is_active).sort((a,b) => a.display_order - b.display_order);

    const totalIncome = enriched.reduce((s,x) => s + (+x.income||0), 0);
    const totalExpenses = enriched.reduce((s,x) => s + (+x.expenses||0), 0);
    const totalFlow = totalIncome - totalExpenses;

    let html = `<div class="section">
      <div class="section-title">💰 Прибыль по проектам · ${data.range.year} YTD <span style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px;">из Планфакт</span></div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;">
          <div style="background:#141414;border-left:3px solid var(--green);border-radius:8px;padding:10px 12px;">
            <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">📥 Поступления</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--green);letter-spacing:.5px;">${fm(totalIncome)} ₽</div>
          </div>
          <div style="background:#141414;border-left:3px solid var(--red);border-radius:8px;padding:10px 12px;">
            <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">📤 Выплаты</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red);letter-spacing:.5px;">${fm(totalExpenses)} ₽</div>
          </div>
          <div style="background:#141414;border-left:3px solid ${totalFlow >= 0 ? 'var(--accent)' : 'var(--red)'};border-radius:8px;padding:10px 12px;">
            <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">💎 Опер.поток</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:${totalFlow >= 0 ? 'var(--accent)' : 'var(--red)'};letter-spacing:.5px;">${totalFlow >= 0 ? '+' : ''}${fm(totalFlow)} ₽</div>
          </div>
        </div>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--accent);letter-spacing:1.5px;margin-bottom:11px;">🏆 ОСНОВНЫЕ ПРОЕКТЫ</div>
        <div style="display:flex;flex-direction:column;gap:6px;">`;

    main.forEach(p => {
      const flow = +p.operating_flow;
      const profit = flow >= 0;
      const margin = +p.income > 0 ? Math.round(flow / +p.income * 100) : null;
      const icon = profit ? '🟢' : '🔴';
      html += `<div style="background:#141414;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-size:14px;">${icon}</div>
        <div style="flex:1;min-width:100px;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);letter-spacing:1px;">${p.name}</div>
          <div style="font-size:10px;color:var(--muted);">поступления ${fm(+p.income)} − расходы ${fm(+p.expenses)}${margin !== null ? ` · маржа ${margin}%` : ''}</div>
        </div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${profit ? 'var(--green)' : 'var(--red)'};letter-spacing:.5px;">${profit ? '+' : ''}${fm(flow)} ₽</div>
      </div>`;
    });

    html += `</div></div>`;

    // Прочие проекты (свёрнутые, в раскрываемом блоке)
    if (other.length > 0) {
      const otherFlow = other.reduce((s,x) => s + (+x.operating_flow||0), 0);
      const isExpanded = expandedKpis.has('otherProjects');
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;" onclick="toggleExpand('otherProjects', event)">
        <div style="display:flex;align-items:center;gap:10px;${isExpanded ? 'margin-bottom:11px;' : ''}">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);letter-spacing:1.5px;">📂 ПРОЧИЕ ПРОЕКТЫ</div>
          <div style="font-size:11px;color:var(--muted);">${other.length} ${other.length === 1 ? 'проект' : 'проекта'} · ${otherFlow >= 0 ? '+' : ''}${fm(otherFlow)} ₽</div>
          <div style="margin-left:auto;color:var(--muted);font-size:11px;opacity:.6;">${isExpanded ? '−' : '+'}</div>
        </div>
        ${isExpanded ? `<div style="display:flex;flex-direction:column;gap:5px;">${other.map(p => {
          const flow = +p.operating_flow;
          const typeLabel = p.project_type === 'building' ? 'Стройка/ремонт' : p.project_type === 'other' ? 'Прочее' : '';
          const stateLabel = !p.is_active ? '⏸ свёрнут' : '';
          return `<div style="background:#141414;border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:8px;">
            <div style="flex:1;min-width:80px;">
              <div style="font-size:13px;color:var(--text);font-weight:500;">${p.name}</div>
              <div style="font-size:10px;color:var(--muted);">${[typeLabel, stateLabel].filter(Boolean).join(' · ')}${(+p.income > 0 || +p.expenses > 0) ? ` · доходы ${fm(+p.income)} расходы ${fm(+p.expenses)}` : ''}</div>
            </div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:${flow >= 0 ? 'var(--green)' : 'var(--red)'};letter-spacing:.4px;">${flow >= 0 ? '+' : ''}${fm(flow)} ₽</div>
          </div>`;
        }).join('')}</div>` : ''}
      </div>`;
    }

    html += `</div>`;
    return html;
  }

  function renderDebtBreakdown(data, type, lastByPoint) {
    const items = [];
    data.points.forEach(p => {
      const r = lastByPoint[p.id];
      if (!r) return;
      const v = type === 'debt' ? +r.debt_total || 0 : +r.owe_total || 0;
      if (v <= 0) return;
      let detail = '';
      if (type === 'debt') {
        const retail = +r.debt_retail || 0;
        const ins = +r.debt_insurance || 0;
        if (retail || ins) detail = ` <span style="color:var(--muted);font-size:10px;">(розн ${fm(retail)} + страх ${fm(ins)})</span>`;
      } else {
        const ravt = +r.owe_ravt || 0;
        const other = +r.owe_other || 0;
        if (ravt || other) detail = ` <span style="color:var(--muted);font-size:10px;">(РАВТ ${fm(ravt)} + прочие ${fm(other)})</span>`;
      }
      items.push({ name: p.name, val: v, detail });
    });
    items.sort((a,b) => b.val - a.val);
    return `<div class="expand-row">${items.map(i =>
      `<div class="expand-item"><span><b>${i.name}</b>${i.detail}</span><span class="v">${fm(i.val)} ₽</span></div>`
    ).join('')}</div>`;
  }

  function toggleExpand(key, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (expandedKpis.has(key)) expandedKpis.delete(key); else expandedKpis.add(key);
    if (cachedData) render(cachedData);
  }
  function togglePoint(id, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (expandedPoints.has(id)) expandedPoints.delete(id); else expandedPoints.add(id);
    if (cachedData) render(cachedData);
  }

  function scrollToAnchor(anchor) {
    // Если это KPI которое можно раскрыть — раскрываем заранее
    if (['total','profit','fot','year','debts','owes'].includes(anchor)) {
      expandedKpis.add(anchor);
      if (cachedData) render(cachedData);
    }
    // Скролл и подсветка
    setTimeout(() => {
      const el = document.querySelector(`[data-anchor="${anchor}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px var(--accent)';
      setTimeout(() => { el.style.boxShadow = ''; }, 1500);
    }, 100);
  }

  function exportToExcel() {
    if (!cachedData) { showToast('Сначала загрузи данные', 'err'); return; }
    if (typeof XLSX === 'undefined') { showToast('Excel-библиотека не загружена', 'err'); return; }
    try {
      const wb = XLSX.utils.book_new();
      const data = cachedData;
      const monthName = MP_MONTHS_FULL[data.range.month-1];

      let monthTotal=0, monthIns=0, monthRetail=0;
      data.current.forEach(r => { monthTotal+=rTotal(r); monthIns+=rIns(r); monthRetail+=rRetail(r); });
      const fot = data.fot || {};
      const expWithoutSalary = data.expenses.filter(r => !r.category.startsWith('salary_')).reduce((s,r) => s+(+r.amount), 0);
      const taxTotal = data.taxes.reduce((s,r) => s+(+r.amount), 0);
      const profit = monthTotal - expWithoutSalary - (+fot.fot_total||0) - taxTotal;

      const summary = [
        ['Отчёт RG Plaza', `${monthName} ${data.range.year}`],
        [],
        ['ФИНАНСОВАЯ КАРТИНА'],
        ['Выручка', monthTotal],
        ['  страховые', monthIns],
        ['  розница', monthRetail],
        ['ФОТ', +fot.fot_total||0],
        ['Расходы (аренда, лизинг, кредит)', expWithoutSalary],
        ['Налоги', taxTotal],
        ['= ЧИСТАЯ ПРИБЫЛЬ', profit],
        ['Маржа, %', monthTotal > 0 ? Math.round(profit/monthTotal*100) : 0]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Сводка');

      const pointsRows = [['Точка', 'Выручка', 'Страховые', 'Розница', 'Дни работы', 'Долги (нам)', 'Долги (мы)']];
      const lastByPoint = {};
      data.current.forEach(r => { if (!lastByPoint[r.point_id] || r.date > lastByPoint[r.point_id].date) lastByPoint[r.point_id] = r; });
      data.points.forEach(p => {
        const reports = data.current.filter(r => r.point_id === p.id);
        const t = reports.reduce((s,r) => s+rTotal(r), 0);
        const i = reports.reduce((s,r) => s+rIns(r), 0);
        const ret = reports.reduce((s,r) => s+rRetail(r), 0);
        const days = new Set(reports.filter(r => rTotal(r) > 0).map(r => r.date)).size;
        const last = lastByPoint[p.id] || {};
        pointsRows.push([p.name, t, i, ret, days, +last.debt_total||0, +last.owe_total||0]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pointsRows), 'По точкам');

      const daysRows = [['Дата', 'Точка', 'Всего', 'Страх', 'Розница', 'Записей', 'Долги (нам)', 'Долги (мы)']];
      data.current.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(r => {
        const p = data.points.find(x => x.id === r.point_id);
        daysRows.push([r.date, p?.name || r.point_id, rTotal(r), rIns(r), rRetail(r), +r.bookings||0, +r.debt_total||0, +r.owe_total||0]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(daysRows), 'По дням');

      if (data.expenses.length || data.taxes.length) {
        const expRows = [['Тип', 'Юрлицо', 'Категория', 'Сумма']];
        data.expenses.forEach(e => expRows.push(['Расход', e.entity_id, e.category, +e.amount||0]));
        data.taxes.forEach(t => expRows.push(['Налог', t.entity_id, t.tax_type, +t.amount||0]));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), 'Расходы и налоги');
      }

      if (data.directions.length) {
        const dirsRows = [['Период', 'Канал', 'СК', 'Точка', 'Поступило', 'Отозвано']];
        data.directions.forEach(d => {
          const ch = data.channels.find(c => c.id === d.channel_id);
          const co = data.companies.find(c => c.id === d.company_id);
          const p = data.points.find(x => x.id === d.point_id);
          dirsRows.push([d.period, ch?.name || '?', co?.name || '?', p?.name || '—', +d.incoming_count||0, +d.withdrawn_count||0]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dirsRows), 'Направления СК');
      }

      const fileName = `RG-Plaza_${monthName}_${data.range.year}.xlsx`;
      XLSX.writeFile(wb, fileName);
      showToast('✅ Файл скачан', 'ok');
    } catch (e) {
      console.error(e);
      showToast('Ошибка: '+(e.message||e), 'err');
    }
  }

  // ============ ПУЛЬС КОМПАНИИ (в owners) ============
  function renderPulseInOwners() {
    const container = document.getElementById('pulse-content');
    if (!cachedData) { container.innerHTML = ''; return; }
    const r = cachedData;
    const moscowPoints = ['kaluga','serpuhov'];
    const izhevskPoints = ['sovhoz','poyma'];

    // Суммы по точкам (текущий месяц и прошлый)
    const sumByPoint = {}, prevSumByPoint = {};
    for (const rep of (r.current || [])) sumByPoint[rep.point_id] = (sumByPoint[rep.point_id] || 0) + rTotal(rep);
    for (const rep of (r.prev    || [])) prevSumByPoint[rep.point_id] = (prevSumByPoint[rep.point_id] || 0) + rTotal(rep);

    const sumCity = (pts, src) => pts.reduce((s, p) => s + (src[p] || 0), 0);
    const moscowMTD = sumCity(moscowPoints, sumByPoint);
    const izhevskMTD = sumCity(izhevskPoints, sumByPoint);
    const totalMTD = moscowMTD + izhevskMTD;
    const moscowPrev = sumCity(moscowPoints, prevSumByPoint);
    const izhevskPrev = sumCity(izhevskPoints, prevSumByPoint);
    const totalPrev = moscowPrev + izhevskPrev;

    // Каналы (страх / физ / корп / детейл)
    const channels = { ins: 0, phys: 0, corp: 0, detail: 0 };
    const channelsPrev = { ins: 0, phys: 0, corp: 0, detail: 0 };
    const cars = { ins: 0, phys: 0, corp: 0, detail: 0 };
    for (const rep of (r.current || [])) {
      channels.ins    += rIns(rep);
      channels.phys   += r1c(rep) ? (+rep.retail_1c || 0) : (+rep.phys_day   || 0);
      channels.corp   += rCorp(rep);
      channels.detail += rDetail(rep);
      cars.ins    += (+rep.cars_ins    || 0);
      cars.phys   += (+rep.cars_retail || 0);
      cars.corp   += (+rep.cars_corp   || 0);
      cars.detail += (+rep.cars_detail || 0);
    }
    for (const rep of (r.prev || [])) {
      channelsPrev.ins    += rIns(rep);
      channelsPrev.phys   += r1c(rep) ? (+rep.retail_1c || 0) : (+rep.phys_day   || 0);
      channelsPrev.corp   += rCorp(rep);
      channelsPrev.detail += rDetail(rep);
    }
    const channelTotal = channels.ins + channels.phys + channels.corp + channels.detail;

    // Средний чек
    const avgCheck = {
      ins:    cars.ins    ? Math.round(channels.ins    / cars.ins)    : 0,
      phys:   cars.phys   ? Math.round(channels.phys   / cars.phys)   : 0,
      corp:   cars.corp   ? Math.round(channels.corp   / cars.corp)   : 0,
    };

    // Долги (последний отчёт по каждой точке)
    let debtClients = 0, debtRavt = 0, oweOther = 0;
    const latestByPoint = {};
    for (const rep of (r.current || [])) {
      const prev = latestByPoint[rep.point_id];
      if (!prev || rep.date > prev.date) latestByPoint[rep.point_id] = rep;
    }
    for (const pid in latestByPoint) {
      const rep = latestByPoint[pid];
      debtClients += (+rep.debt_total || 0);
      debtRavt    += (+rep.owe_ravt   || 0);
      oweOther    += (+rep.owe_other  || 0);
    }

    // Топ-5 страховых
    const dirByCompany = {};
    for (const d of (r.directions || [])) {
      if (d.period !== r.period) continue;
      const k = d.company || 'Другие';
      dirByCompany[k] = (dirByCompany[k] || 0) + (+d.count || 1);
    }
    const topInsurers = Object.entries(dirByCompany)
      .map(([name, count]) => ({ name, count }))
      .sort((a,b) => b.count - a.count).slice(0, 5);
    const totalDirs = topInsurers.reduce((s, x) => s + x.count, 0);

    // План
    const planSum = { phys: 0, corp: 0, ins: 0 };
    for (const plan of (r.plans || [])) {
      planSum.phys += (+plan.plan_phys_month || 0);
      planSum.corp += (+plan.plan_corp_month || 0);
      planSum.ins  += (+plan.plan_ins_month  || 0);
    }
    const planActual = { phys: channels.phys + channels.detail, corp: channels.corp, ins: channels.ins };

    // === Мотивашка «зона менеджера» по ТОЧКАМ (сгруппировано по регионам) ===
    // Москва: зона = розница + корп (менеджер сам ведёт корп) → план = план_розн + план_корп
    // Ижевск: зона = розница + детейл (корп — отдельный человек) → план = план_розн
    const zoneByPoint = {};  // pid -> { fact, plan, region }
    const ensureZone = pid => {
      if (!zoneByPoint[pid]) zoneByPoint[pid] = { fact: 0, plan: 0, region: REGION_MAP[pid] || 'moscow' };
      return zoneByPoint[pid];
    };
    for (const rep of (r.current || [])) {
      if (!REGION_MAP[rep.point_id]) continue;
      const z = ensureZone(rep.point_id);
      const phys = r1c(rep) ? (+rep.retail_1c || 0) : (+rep.phys_day || 0);
      const det  = rDetail(rep);
      const corp = rCorp(rep);
      z.fact += (z.region === 'izhevsk') ? (phys + det) : (phys + corp);
    }
    for (const plan of (r.plans || [])) {
      if (!REGION_MAP[plan.point_id]) continue;
      const z = ensureZone(plan.point_id);
      const pPhys = +plan.plan_phys_month || 0;
      const pCorp = +plan.plan_corp_month || 0;
      z.plan += (z.region === 'izhevsk') ? pPhys : (pPhys + pCorp);
    }
    // Имена точек для подписей
    const pointNameById = {};
    (r.points || []).forEach(p => { pointNameById[p.id] = p.name; });

    // Топ продукты ОВР
    const ovrByCategory = {};
    let ovrTotal = 0;
    for (const item of (r.ovrItems || [])) {
      const cat = item.category || 'Прочее';
      ovrByCategory[cat] = (ovrByCategory[cat] || 0) + (+item.amount || 0);
      ovrTotal += (+item.amount || 0);
    }
    const topProducts = Object.entries(ovrByCategory)
      .map(([name, amount]) => ({ name, amount }))
      .sort((a,b) => b.amount - a.amount).slice(0, 8);

    // Хелперы
    const trendBadge = (cur, prev) => {
      if (!prev || prev === 0) return '';
      const t = Math.round((cur - prev) / prev * 100);
      const cls = t > 0 ? 'up' : (t < 0 ? 'down' : 'flat');
      const arrow = t > 0 ? '↑' : (t < 0 ? '↓' : '→');
      return `<div class="pbn-trend ${cls}">${arrow} ${Math.abs(t)}%</div>`;
    };
    const channelBarHtml = (label, val, prev, total, color) => {
      const pct = total > 0 ? Math.round(val / total * 100) : 0;
      let trend = '';
      if (prev > 0) {
        const t = Math.round((val - prev) / prev * 100);
        const arrow = t > 0 ? '↑' : (t < 0 ? '↓' : '→');
        const cls = t > 0 ? 'up' : (t < 0 ? 'down' : 'flat');
        trend = `<span class="pbn-trend ${cls}" style="display:inline;margin-left:6px;">${arrow}${Math.abs(t)}%</span>`;
      }
      return `<div class="pch-bar-row">
        <div class="pch-bar-lbl"><div>${label}</div><div>${fs(val)} <span style="color:#a0a0a0;">· ${pct}%</span>${trend}</div></div>
        <div class="pch-bar"><div class="pch-bar-seg ${color}" style="width:${pct}%;"></div></div>
      </div>`;
    };
    const planBarHtml = (label, actual, plan, color) => {
      const pct = plan > 0 ? Math.round(actual / plan * 100) : 0;
      const cappedPct = Math.min(100, pct);
      const colorClass = pct >= 100 ? 'g' : color;
      return `<div class="pch-bar-row">
        <div class="pch-bar-lbl"><div>${label}</div><div>${fs(actual)} / ${fs(plan)} <span style="color:${pct>=100?'#4caf50':'#a0a0a0'};">· ${pct}%</span></div></div>
        <div class="pch-bar"><div class="pch-bar-seg ${colorClass}" style="width:${cappedPct}%;"></div></div>
      </div>`;
    };
    const zoneMotivHtml = (label, fact, plan) => {
      if (plan <= 0) return '';
      const pct = Math.round(fact / plan * 100);
      const cappedPct = Math.min(100, pct);
      const remain = Math.max(0, plan - fact);
      const reached = fact >= plan;
      const seg = reached ? 'g' : pct >= 70 ? 'a' : 'p';
      const status = reached
        ? `🎉 План выполнен (+${fs(fact - plan)})`
        : `осталось ${fs(remain)} ₽`;
      return `<div class="pch-bar-row">
        <div class="pch-bar-lbl"><div>${label}</div><div>${fs(fact)} / ${fs(plan)} <span style="color:${reached?'#4caf50':'#a0a0a0'};">· ${pct}%</span></div></div>
        <div class="pch-bar"><div class="pch-bar-seg ${seg}" style="width:${cappedPct}%;"></div></div>
        <div style="font-size:11px;color:${reached?'#4caf50':'var(--accent)'};margin-top:3px;">${status}</div>
      </div>`;
    };
    const monthName = MP_MONTHS_FULL[r.range.month-1] + ' ' + r.range.year;

    container.innerHTML = `
      <div class="pulse-wrap">
        <div class="pulse-section-title">🏥 ПУЛЬС КОМПАНИИ</div>
        <div class="pulse-period">
          <div>
            <div class="pulse-period-title">${monthName}</div>
            <div class="pulse-period-sub">в сравнении с прошлым месяцем</div>
          </div>
        </div>

        <div class="pulse-grid">

          <div class="pulse-card full">
            <div class="pulse-card-head">
              <div class="pulse-title">Выручка за месяц</div>
              <div class="pulse-hint">по городам</div>
            </div>
            <div class="pulse-big-numbers">
              <div class="pbn-card">
                <div class="pbn-val b">${fs(moscowMTD)}</div>
                <div class="pbn-lbl">Москва</div>
                <div class="pbn-sub">Калужская + Серпуховская</div>
                ${trendBadge(moscowMTD, moscowPrev)}
              </div>
              <div class="pbn-card">
                <div class="pbn-val g">${fs(izhevskMTD)}</div>
                <div class="pbn-lbl">Ижевск</div>
                <div class="pbn-sub">Совхозная + Пойма</div>
                ${trendBadge(izhevskMTD, izhevskPrev)}
              </div>
              <div class="pbn-card">
                <div class="pbn-val">${fs(totalMTD)}</div>
                <div class="pbn-lbl">Вся компания</div>
                ${trendBadge(totalMTD, totalPrev)}
              </div>
            </div>
          </div>

          <div class="pulse-card">
            <div class="pulse-card-head">
              <div class="pulse-title">Цель менеджеров (зона премии)</div>
              <div class="pulse-hint">факт vs план зоны</div>
            </div>
            ${(() => {
              const order = [
                { region: 'moscow',  label: 'МОСКВА',  zoneSuffix: 'Розница + Корп',   pts: moscowPoints },
                { region: 'izhevsk', label: 'ИЖЕВСК',  zoneSuffix: 'Розница + Детейл', pts: izhevskPoints },
              ];
              let html = '';
              order.forEach(grp => {
                // только точки с заданным планом зоны
                const rows = grp.pts
                  .map(pid => ({ pid, z: zoneByPoint[pid] }))
                  .filter(x => x.z && x.z.plan > 0);
                if (!rows.length) return;
                html += `<div style="font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin:14px 0 8px;">${grp.label}</div>`;
                html += `<div class="pulse-channels" style="grid-template-columns:1fr;gap:12px;">`;
                rows.forEach(({ pid, z }) => {
                  const name = pointNameById[pid] || pid;
                  html += zoneMotivHtml(`${name} · ${grp.zoneSuffix}`, z.fact, z.plan);
                });
                html += `</div>`;
              });
              return html || '<div class="pulse-cs-msg">Планы зон не заданы</div>';
            })()}
          </div>

          <div class="pulse-card">
            <div class="pulse-card-head">
              <div class="pulse-title">Каналы по компании</div>
              <div class="pulse-hint">${fs(channelTotal)} ₽</div>
            </div>
            <div class="pulse-channels" style="grid-template-columns:1fr;">
              ${channelBarHtml('Страховые',  channels.ins,    channelsPrev.ins,    channelTotal, 'b')}
              ${channelBarHtml('Розница',    channels.phys,   channelsPrev.phys,   channelTotal, 'g')}
              ${channelBarHtml('Корпоратив', channels.corp,   channelsPrev.corp,   channelTotal, 'p')}
              ${channelBarHtml('Детейл',     channels.detail, channelsPrev.detail, channelTotal, 'a')}
            </div>
          </div>

          <div class="pulse-card">
            <div class="pulse-card-head">
              <div class="pulse-title">Долги</div>
              <div class="pulse-hint">по последнему отчёту</div>
            </div>
            <div class="pulse-big-numbers">
              <div class="pbn-card">
                <div class="pbn-val g">${fs(debtClients)}</div>
                <div class="pbn-lbl">Клиенты нам</div>
              </div>
              <div class="pbn-card">
                <div class="pbn-val">${fs(debtRavt)}</div>
                <div class="pbn-lbl">Мы РАВТ</div>
              </div>
              <div class="pbn-card">
                <div class="pbn-val p">${fs(oweOther)}</div>
                <div class="pbn-lbl">Мы другим</div>
              </div>
            </div>
          </div>

          <div class="pulse-card">
            <div class="pulse-card-head">
              <div class="pulse-title">Топ-5 страховых</div>
              <div class="pulse-hint">${totalDirs} направлений</div>
            </div>
            ${topInsurers.length === 0 ? '<div class="pulse-cs-msg">Нет данных за месяц</div>' :
              `<div class="pulse-top-list">
                ${topInsurers.map((ins, i) => {
                  const share = totalDirs > 0 ? Math.round(ins.count / totalDirs * 100) : 0;
                  return `<div class="ptop-row"><div class="ptop-name">${i+1}. ${escapeHtmlPulse(ins.name)}</div>
                    <div><span class="ptop-val">${ins.count}</span><span class="ptop-share">${share}%</span></div></div>`;
                }).join('')}
              </div>`
            }
          </div>

          <div class="pulse-card">
            <div class="pulse-card-head">
              <div class="pulse-title">Выполнение плана</div>
              <div class="pulse-hint">факт vs план месяца</div>
            </div>
            ${(planSum.phys || planSum.corp || planSum.ins) ? `
              <div class="pulse-channels" style="grid-template-columns:1fr;">
                ${planBarHtml('Розница',    planActual.phys, planSum.phys, 'g')}
                ${planBarHtml('Страховые',  planActual.ins,  planSum.ins,  'b')}
                ${planBarHtml('Корпоратив', planActual.corp, planSum.corp, 'p')}
              </div>
            ` : '<div class="pulse-cs-msg">Планы не заданы</div>'}
          </div>

          <div class="pulse-card">
            <div class="pulse-card-head">
              <div class="pulse-title">Средний чек</div>
              <div class="pulse-hint">${cars.ins+cars.phys+cars.corp+cars.detail} машин</div>
            </div>
            <div class="pulse-big-numbers">
              <div class="pbn-card"><div class="pbn-val b">${fs(avgCheck.ins)}</div><div class="pbn-lbl">Страх</div><div class="pbn-sub">${cars.ins} ЗН</div></div>
              <div class="pbn-card"><div class="pbn-val g">${fs(avgCheck.phys)}</div><div class="pbn-lbl">Физ</div><div class="pbn-sub">${cars.phys} ЗН</div></div>
              <div class="pbn-card"><div class="pbn-val p">${fs(avgCheck.corp)}</div><div class="pbn-lbl">Корп</div><div class="pbn-sub">${cars.corp} ЗН</div></div>
            </div>
          </div>

          <div class="pulse-card full">
            <div class="pulse-card-head">
              <div class="pulse-title">Топ продукты из ОВР</div>
              <div class="pulse-hint">${ovrTotal > 0 ? fs(ovrTotal) + ' ₽' : ''}</div>
            </div>
            ${topProducts.length === 0 ? `
              <div class="pulse-cs-msg">
                ОВР за <b>${monthName}</b> ещё не загружен.<br>
                Бухгалтер должен загрузить отчёт в кабинете «Бухгалтерия».
              </div>
            ` : `
              <div class="pulse-top-list">
                ${topProducts.map((p, i) => {
                  const share = ovrTotal > 0 ? Math.round(p.amount / ovrTotal * 100) : 0;
                  return `<div class="ptop-row"><div class="ptop-name">${i+1}. ${escapeHtmlPulse(p.name)}</div>
                    <div><span class="ptop-val">${fs(p.amount)}</span><span class="ptop-share">${share}%</span></div></div>`;
                }).join('')}
              </div>
            `}
          </div>

        </div>

        <div class="pulse-grid">
          <div class="pulse-card coming-soon">
            <div class="pulse-card-head"><div class="pulse-title">Валовая прибыль и маржа</div><span class="pulse-coming-tag">скоро</span></div>
            <div class="pulse-cs-msg">Нужны данные о <b>себестоимости</b> каждого ЗН. Появится после интеграции с 1С.</div>
          </div>
          <div class="pulse-card coming-soon">
            <div class="pulse-card-head"><div class="pulse-title">Кассовый разрыв</div><span class="pulse-coming-tag">скоро</span></div>
            <div class="pulse-cs-msg">Нужна <b>таблица остатков</b> банковских счетов и кассы.</div>
          </div>
          <div class="pulse-card coming-soon">
            <div class="pulse-card-head"><div class="pulse-title">Конверсия по этапам СК</div><span class="pulse-coming-tag">скоро</span></div>
            <div class="pulse-cs-msg">Нужны <b>статусы</b> направлений: выписано → пришёл → закрыто.</div>
          </div>
          <div class="pulse-card coming-soon">
            <div class="pulse-card-head"><div class="pulse-title">Загрузка постов и мастеров</div><span class="pulse-coming-tag">скоро</span></div>
            <div class="pulse-cs-msg">Нужен <b>табель</b> мастеров и расписание постов.</div>
          </div>
          <div class="pulse-card coming-soon">
            <div class="pulse-card-head"><div class="pulse-title">Переделки и гарантии</div><span class="pulse-coming-tag">скоро</span></div>
            <div class="pulse-cs-msg">Нужны <b>флаги</b> в ЗН: норм / переделка / отмена.</div>
          </div>
          <div class="pulse-card coming-soon">
            <div class="pulse-card-head"><div class="pulse-title">Топ-5 клиентов</div><span class="pulse-coming-tag">скоро</span></div>
            <div class="pulse-cs-msg">Нужна <b>нормализация</b> клиентов в отдельной таблице (CRM).</div>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtmlPulse(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (sessionStorage.getItem('rgp_owner') === '1') enterApp();
</script>
<script>
// === PWA: регистрация Service Worker ===
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(reg => {
        console.log("[PWA] SW registered");
        reg.addEventListener("updatefound", () => {
          const newSW = reg.installing;
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              showPwaUpdateBanner();
            }
          });
        });
      })
      .catch(err => console.warn("[PWA] SW failed:", err));
  });
}
function showPwaUpdateBanner() {
  if (document.getElementById("pwa-update")) return;
  if (!document.getElementById("pwa-update-style")) {
    const st = document.createElement("style");
    st.id = "pwa-update-style";
    st.textContent = `
      @keyframes pwaDrop { from { transform:translate(-50%,-26px); opacity:0; } to { transform:translate(-50%,0); opacity:1; } }
      @keyframes pwaPulse { 0%,100% { box-shadow:0 0 0 0 rgba(232,184,75,.55); } 50% { box-shadow:0 0 0 8px rgba(232,184,75,0); } }
      #pwa-update { animation: pwaDrop .35s ease; }
      #pwa-update button { animation: pwaPulse 1.6s ease-in-out infinite; }
    `;
    document.head.appendChild(st);
  }
  const b = document.createElement("div");
  b.id = "pwa-update";
  b.style.cssText = "position:fixed;top:16px;left:50%;transform:translateX(-50%);" +
    "width:calc(100% - 28px);max-width:440px;background:linear-gradient(135deg,#f0c456,#e8b84b);" +
    "border:2px solid #fff3d6;border-radius:14px;padding:14px 16px;display:flex;" +
    "justify-content:space-between;align-items:center;gap:12px;z-index:100000;" +
    "font-family:Inter,sans-serif;color:#1a1407;box-shadow:0 14px 40px rgba(0,0,0,.55);";
  b.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
      '<span style="font-size:22px;line-height:1;">🔄</span>' +
      '<div style="min-width:0;">' +
        '<div style="font-weight:800;font-size:15px;letter-spacing:.2px;">Доступно обновление</div>' +
        '<div style="font-size:12px;opacity:.8;">Нажми «Обновить», чтобы загрузить новую версию</div>' +
      '</div>' +
    '</div>' +
    '<button style="flex:none;background:#1a1407;color:#f0c456;border:none;padding:11px 20px;' +
      'border-radius:9px;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;" ' +
      'onclick="pwaApplyUpdate()">Обновить</button>';
  document.body.appendChild(b);
}
function pwaApplyUpdate() {
  navigator.serviceWorker.getRegistration().then(reg => {
    if (reg && reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    setTimeout(() => location.reload(), 300);
  });
}
function showOfflineIndicator() {
  if (document.getElementById("pwa-offline")) return;
  const el = document.createElement("div");
  el.id = "pwa-offline";
  el.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(244,67,54,.95);color:#fff;padding:6px 14px;border-radius:6px;z-index:9999;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px;box-shadow:0 4px 16px rgba(0,0,0,.4);";
  el.textContent = "📡 Нет связи · работаю с кэшем";
  document.body.appendChild(el);
}
function hideOfflineIndicator() {
  const el = document.getElementById("pwa-offline");
  if (el) el.remove();
}
window.addEventListener("online", hideOfflineIndicator);
window.addEventListener("offline", showOfflineIndicator);
if (!navigator.onLine) showOfflineIndicator();
</script>
</body>
