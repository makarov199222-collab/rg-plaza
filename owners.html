<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>RG Plaza — Учредителям</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg:#1a1a1a; --surface:#222222; --surface2:#2a2a2a; --border:#333333;
    --accent:#e8b84b; --blue:#2196f3; --text:#ffffff; --muted:#909090;
    --green:#4caf50; --purple:#9c27b0; --red:#f44336; --orange:#ff9800;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}

  .login{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
  .login.hidden{display:none;}
  .login-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);letter-spacing:5px;margin-bottom:8px;line-height:1;}
  .login-sub{font-size:11px;color:var(--muted);letter-spacing:5px;font-weight:600;margin-bottom:36px;text-transform:uppercase;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 24px;width:100%;max-width:360px;}
  .login-title{font-size:14px;font-weight:600;margin-bottom:18px;text-align:center;}
  .login-input{width:100%;background:#141414;border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:500;outline:none;text-align:center;letter-spacing:1px;-webkit-appearance:none;}
  .login-input:focus{border-color:var(--accent);}
  .login-btn{width:100%;margin-top:12px;padding:14px;background:var(--accent);border:none;border-radius:8px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
  .login-err{margin-top:10px;font-size:13px;color:var(--red);text-align:center;min-height:18px;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:3px;line-height:1;}
  .logo span{color:#b8b8b8;font-size:9px;display:block;letter-spacing:2.5px;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;margin-top:3px;}

  .mp-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;background:#141414;border:1px solid var(--border);border-radius:8px;padding:3px;}
  .mp-arrow{background:none;border:none;color:var(--accent);width:30px;height:30px;border-radius:5px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
  .mp-arrow:hover{background:var(--surface2);} .mp-arrow:active{transform:scale(.92);}
  .mp-current{background:none;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;border-radius:5px;min-width:130px;text-align:center;text-transform:capitalize;letter-spacing:.3px;transition:background .15s;}
  .mp-current:hover{background:var(--surface2);color:var(--accent);}
  .mp-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px;}
  .mp-modal.show{display:flex;}
  .mp-sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:340px;animation:mpUp .25s ease;}
  @keyframes mpUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .mp-year-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .mp-year-arrow{background:#141414;border:1px solid var(--border);color:var(--accent);width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;font-family:inherit;line-height:1;}
  .mp-year-arrow:hover{border-color:var(--accent);}
  .mp-year{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);letter-spacing:2px;}
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mp-month{padding:14px 8px;background:#141414;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-transform:capitalize;transition:all .15s;}
  .mp-month:hover{border-color:var(--accent);color:var(--accent);}
  .mp-month.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .mp-month.future{opacity:.4;}

  .refresh-btn{background:#141414;border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--accent);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .15s;}
  .refresh-btn:hover{border-color:var(--accent);}
  .export-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:9px 13px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  .export-btn:hover{filter:brightness(1.08);}

  .wrap{padding:18px;max-width:1400px;margin:0 auto;}

  .section{margin-bottom:22px;}
  .section-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .section-title::before{content:'';width:24px;height:2px;background:var(--accent);}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;position:relative;}
  .kpi:hover{border-color:var(--accent);}
  .kpi:active{transform:scale(.98);}
  .kpi.acc{border-color:rgba(232,184,75,.5);}
  .kpi.green{border-left:3px solid var(--green);}
  .kpi.red{border-left:3px solid var(--red);}
  .kpi.blue{border-left:3px solid var(--blue);}
  .kpi.orange{border-left:3px solid var(--orange);}
  .kpi.purple{border-left:3px solid var(--purple);}
  .kpi-expand-icon{position:absolute;top:11px;right:11px;color:var(--muted);font-size:14px;transition:transform .2s;opacity:.5;}
  .kpi.is-expanded .kpi-expand-icon{transform:rotate(45deg);color:var(--accent);opacity:1;}
  .kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;display:flex;align-items:center;gap:5px;}
  .kpi-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);line-height:1;letter-spacing:1px;}
  .kpi-val.t{color:var(--text);} .kpi-val.r{color:var(--red);} .kpi-val.g{color:var(--green);} .kpi-val.o{color:var(--orange);} .kpi-val.b{color:var(--blue);} .kpi-val.p{color:var(--purple);}
  .kpi-sub{font-size:11px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:5px;}
  .kpi-delta{font-weight:600;}
  .kpi-delta.up{color:var(--green);} .kpi-delta.down{color:var(--red);}

  .expand-row{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;}
  .expand-item{display:flex;justify-content:space-between;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--border);}
  .expand-item:last-child{border-bottom:none;}
  .expand-item b{color:var(--text);font-weight:600;}
  .expand-item .v{color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.5px;}
  .expand-item .v.g{color:var(--green);} .expand-item .v.r{color:var(--red);}

  .heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media (max-width:600px){ .heroes{grid-template-columns:1fr;} }
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .hero.leader{border-color:rgba(76,175,80,.4);}
  .hero.outsider{border-color:rgba(244,67,54,.35);}
  .hero-icon{font-size:22px;margin-bottom:5px;}
  .hero-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
  .hero.leader .hero-lbl{color:var(--green);} .hero.outsider .hero-lbl{color:var(--red);}
  .hero-name{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);letter-spacing:2px;margin-bottom:5px;}
  .hero-amount{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);letter-spacing:.5px;}
  .hero-note{font-size:11px;color:var(--muted);margin-top:5px;}

  .chart-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:14px;}
  @media (max-width:900px){ .chart-row{grid-template-columns:1fr;} }
  .chart-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .chart-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:2px;margin-bottom:11px;}
  .chart-wrap{position:relative;height:240px;}

  .points-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px;margin-bottom:14px;}
  .point-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .15s;}
  .point-card:hover{border-color:var(--accent);}
  .point-card.expanded{border-color:var(--accent);}
  .point-card.point-card-alert{border-left:3px solid var(--red);}
  .point-card.point-card-alert.expanded{border-color:var(--red);}
  .pc-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .pc-name{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);letter-spacing:2px;}
  .pc-city-tag{font-size:9px;color:var(--muted);background:#141414;padding:3px 7px;border-radius:4px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .pc-toggle{margin-left:auto;color:var(--muted);font-size:18px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:#141414;border-radius:6px;transition:all .2s;}
  .pc-toggle.expanded{color:var(--accent);background:rgba(232,184,75,.15);}
  .pc-body{padding:13px;}
  .pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
  .pc-stat{background:#141414;border:1px solid var(--border);border-radius:8px;padding:9px 10px;}
  .pc-stat-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .pc-stat-val{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;}
  .pc-stat-val.t{color:var(--accent);} .pc-stat-val.b{color:var(--blue);} .pc-stat-val.g{color:var(--green);} .pc-stat-val.r{color:var(--red);}
  .pc-details{display:none;margin-top:8px;padding:11px;background:#141414;border-radius:8px;}
  .pc-details.show{display:block;}

  .finance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media (max-width:600px){ .finance-grid{grid-template-columns:1fr;} }
  .finance-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;position:relative;transition:all .15s;}
  .finance-card:hover{border-color:var(--accent);}
  .finance-card.profit{border-color:rgba(76,175,80,.4);}
  .finance-card.loss{border-color:rgba(244,67,54,.4);}
  .finance-card.debt{border-left:3px solid var(--orange);}
  .finance-card.owe{border-left:3px solid var(--red);}
  .finance-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;margin-bottom:9px;}
  .finance-title.green{color:var(--green);} .finance-title.red{color:var(--red);} .finance-title.orange{color:var(--orange);} .finance-title.acc{color:var(--accent);}
  .finance-val{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--text);letter-spacing:1px;}
  .finance-val.r{color:var(--red);} .finance-val.g{color:var(--green);} .finance-val.o{color:var(--orange);}
  .finance-sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}

  .compare-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
  .compare-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .compare-row:last-child{margin-bottom:0;}
  .compare-name{flex:0 0 110px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--text);}
  .compare-bar-wrap{flex:1;height:22px;background:#141414;border-radius:6px;overflow:hidden;position:relative;}
  .compare-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#d4a342);border-radius:6px;transition:width .5s;}
  .compare-bar-text{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-family:'Bebas Neue',sans-serif;font-size:12px;color:#000;font-weight:600;letter-spacing:.4px;}
  .compare-pct{flex:0 0 50px;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.5px;}
  .compare-pct.ok{color:var(--green);} .compare-pct.warn{color:var(--orange);} .compare-pct.bad{color:var(--red);} .compare-pct.muted{color:var(--muted);}

  .alerts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
  .alert{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;}
  .alert.red{border-left:3px solid var(--red);} .alert.orange{border-left:3px solid var(--orange);}
  .alert.green{border-left:3px solid var(--green);} .alert.blue{border-left:3px solid var(--blue);}
  .alert-icon{font-size:18px;flex-shrink:0;}
  .alert-text{flex:1;color:var(--text);}
  .alert-text b{color:var(--accent);}

  .sk-widget{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}

  /* Блок «Топ услуг» */
  .top-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media (max-width:600px){ .top-grid{grid-template-columns:1fr;} }
  .top-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .top-title{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .top-list{display:flex;flex-direction:column;gap:6px;}
  .top-item{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#141414;border-radius:7px;font-size:12px;}
  .top-item-rank{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);min-width:18px;}
  .top-item-name{flex:1;color:var(--text);font-weight:500;font-size:12px;}
  .top-item-val{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--text);letter-spacing:.4px;}
  .top-item-val.acc{color:var(--accent);}
  .top-item-pct{font-size:10px;color:var(--muted);min-width:35px;text-align:right;}
  .top-item-bar{height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
  .top-item-bar-fill{height:100%;background:var(--accent);border-radius:2px;}
  .top-empty{text-align:center;color:var(--muted);font-size:11px;padding:18px;font-style:italic;}

  .top-points-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .top-point-tag{font-size:10px;background:#141414;color:var(--muted);padding:2px 7px;border-radius:4px;border:1px solid var(--border);}
  .top-point-tag.leader{background:rgba(76,175,80,.15);color:var(--green);border-color:rgba(76,175,80,.3);}
  .sk-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:11px;}
  @media (max-width:500px){ .sk-summary{grid-template-columns:1fr 1fr;} }
  .sk-stat{background:#141414;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
  .sk-stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--accent);letter-spacing:.5px;}
  .sk-stat-val.b{color:var(--blue);} .sk-stat-val.g{color:var(--green);} .sk-stat-val.r{color:var(--red);}
  .sk-stat-lbl{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-top:3px;letter-spacing:.5px;}
  .sk-cities{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media (max-width:500px){ .sk-cities{grid-template-columns:1fr;} }
  .sk-city{background:#141414;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .sk-city-name{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;}
  .sk-city-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--text);letter-spacing:.5px;}
  .sk-city-sub{font-size:10px;color:var(--muted);margin-top:3px;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px;line-height:1.6;}
  .loader{display:flex;justify-content:center;align-items:center;padding:50px;color:var(--muted);font-size:13px;}
  .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-right:11px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 18px;font-size:13px;color:var(--text);z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;border-left:3px solid var(--accent);}
  .toast.show{opacity:1;}
  .toast.ok{border-left-color:var(--green);} .toast.err{border-left-color:var(--red);}

  @media (max-width: 600px){
    header{padding:11px 13px;gap:8px;}
    .logo{font-size:20px;}
    .wrap{padding:13px;}
    .kpi-val{font-size:24px;}
    .compare-name{flex:0 0 90px;font-size:11px;}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-logo">RG PLAZA</div>
  <div class="login-sub">Учредителям</div>
  <div class="login-card">
    <div class="login-title">Введите код доступа</div>
    <input type="password" class="login-input" id="login-code" placeholder="Код учредителя" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">ВОЙТИ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app" style="display:none;">
<header>
  <div class="logo">RG Plaza <span>УЧРЕДИТЕЛЯМ</span></div>
  <input type="hidden" id="month-pick">
  <div class="mp-wrap">
    <button class="mp-arrow" onclick="mpPrev()" title="Предыдущий">‹</button>
    <button class="mp-current" id="mp-current" onclick="mpOpenGrid()">—</button>
    <button class="mp-arrow" onclick="mpNext()" title="Следующий">›</button>
  </div>
  <button class="export-btn" onclick="exportToExcel()" title="Скачать в Excel">📥 Excel</button>
  <button class="refresh-btn" onclick="loadAll()" title="Обновить">↻</button>
</header>

<div class="wrap">
  <div id="content"><div class="loader"><div class="spinner"></div>Загружаю данные...</div></div>
</div>

</div>

<div class="mp-modal" id="mp-modal" onclick="if(event.target===this)mpCloseGrid()">
  <div class="mp-sheet">
    <div class="mp-year-row">
      <button class="mp-year-arrow" onclick="mpYearPrev()">‹</button>
      <div class="mp-year" id="mp-year">2026</div>
      <button class="mp-year-arrow" onclick="mpYearNext()">›</button>
    </div>
    <div class="mp-grid" id="mp-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://uxdgiwbkvgbnrsuxjhvp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bg1BRofqJsjkV_9eXzn2Pg__YJ-xRMK';
  const OWNERS_CODE = 'rgplaza-owners-2026';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allCharts = [];
  let cachedData = null;
  let expandedPoints = new Set();
  let expandedKpis = new Set();

  function fm(n) { return n ? Math.round(+n).toLocaleString('ru-RU') : '0'; }
  function fs(n) { n = +n || 0; if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1)+' млн'; if (Math.abs(n) >= 1e3) return Math.round(n/1e3)+'к'; return Math.round(n)+''; }
  function showToast(t, c='') { const el = document.getElementById('toast'); el.textContent = t; el.className = 'toast '+c+' show'; setTimeout(()=>el.classList.remove('show'), 2500); }
  function destroyCharts() { allCharts.forEach(c => { try{c.destroy();}catch(e){} }); allCharts = []; }
  function getMonthRange() {
    const v = document.getElementById('month-pick').value || '';
    const [y, m] = v.split('-').map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    return { year: y, month: m, start: `${y}-${String(m).padStart(2,'0')}-01`, end: `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}` };
  }
  function getPrevMonthRange() {
    const cur = getMonthRange();
    let y = cur.year, m = cur.month - 1;
    if (m < 1) { m = 12; y--; }
    const lastDay = new Date(y, m, 0).getDate();
    return { year: y, month: m, start: `${y}-${String(m).padStart(2,'0')}-01`, end: `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}` };
  }

  function doLogin() {
    const code = document.getElementById('login-code').value.trim();
    if (code === OWNERS_CODE) { sessionStorage.setItem('rgp_owner', '1'); enterApp(); }
    else { document.getElementById('login-err').textContent = 'Неверный код'; }
  }

  function enterApp() {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').style.display = 'block';
    const now = new Date();
    document.getElementById('month-pick').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    mpUpdateLabel();
    loadAll();
  }

  const MP_MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const MP_MONTHS_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  let mpGridYear = new Date().getFullYear();
  function mpGetCurrent() { const v = document.getElementById('month-pick').value || ''; const [y, m] = v.split('-').map(Number); return [y || new Date().getFullYear(), m || (new Date().getMonth()+1)]; }
  function mpSet(y, m) { document.getElementById('month-pick').value = `${y}-${String(m).padStart(2,'0')}`; mpUpdateLabel(); loadAll(); }
  function mpUpdateLabel() { const [y,m]=mpGetCurrent(); const el=document.getElementById('mp-current'); if(el) el.textContent = `${MP_MONTHS_FULL[m-1]} ${y}`; }
  function mpPrev() { let [y,m]=mpGetCurrent(); m--; if(m<1){m=12;y--;} mpSet(y,m); }
  function mpNext() { let [y,m]=mpGetCurrent(); m++; if(m>12){m=1;y++;} mpSet(y,m); }
  function mpOpenGrid() { const [y]=mpGetCurrent(); mpGridYear=y; mpRenderGrid(); document.getElementById('mp-modal').classList.add('show'); }
  function mpCloseGrid() { document.getElementById('mp-modal').classList.remove('show'); }
  function mpYearPrev() { mpGridYear--; mpRenderGrid(); }
  function mpYearNext() { mpGridYear++; mpRenderGrid(); }
  function mpRenderGrid() {
    document.getElementById('mp-year').textContent = mpGridYear;
    const [curY, curM] = mpGetCurrent();
    const now = new Date();
    const nowY = now.getFullYear(), nowM = now.getMonth()+1;
    let html = '';
    for (let i=0; i<12; i++) {
      const m = i+1;
      const isActive = (mpGridYear===curY && m===curM);
      const isFuture = (mpGridYear>nowY) || (mpGridYear===nowY && m>nowM);
      html += `<button class="mp-month ${isActive?'active':''} ${isFuture?'future':''}" onclick="mpPickMonth(${m})">${MP_MONTHS_FULL[i]}</button>`;
    }
    document.getElementById('mp-grid').innerHTML = html;
  }
  function mpPickMonth(m) { mpSet(mpGridYear, m); mpCloseGrid(); }

  async function loadAll() {
    document.getElementById('content').innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю данные...</div>';
    destroyCharts();

    const range = getMonthRange();
    const prevRange = getPrevMonthRange();
    const yearStart = `${range.year}-01-01`;
    const period = `${range.year}-${String(range.month).padStart(2,'0')}`;

    try {
      // Хелпер: если таблица не существует — возвращает пустой массив вместо краша
      const safe = async (q) => {
        try {
          const r = await q;
          if (r.error) {
            console.warn('Soft error (продолжаем):', r.error.message);
            return { data: [] };
          }
          return r;
        } catch (e) {
          console.warn('Soft error (продолжаем):', e.message);
          return { data: [] };
        }
      };

      const [pointsRes, currentRes, prevRes, yearRes, plansRes, fotRes, expRes, taxRes, loansRes, dirsRes, ravtRes, channelsRes, companiesRes, breakdownRes, breakdownPrevRes, breakdownYearRes, ravtSettlementsRes, pnlRes] = await Promise.all([
        sb.from('points').select('*').order('id'),
        sb.from('daily_reports').select('*').gte('date', range.start).lte('date', range.end).order('date'),
        sb.from('daily_reports').select('point_id,date,total_day,owe_total,owe_ravt,owe_other').gte('date', prevRange.start).lte('date', prevRange.end),
        sb.from('daily_reports').select('point_id,date,total_day,retail_day,ins_day,debt_total,debt_retail,debt_insurance,owe_total,owe_ravt,owe_other').gte('date', yearStart).lte('date', range.end),
        sb.from('plans').select('*'),
        sb.from('fot_summary').select('*').eq('period', period).maybeSingle(),
        sb.from('expenses_monthly').select('*').eq('period', period),
        sb.from('taxes_monthly').select('*').eq('period', period),
        sb.from('loans_leases').select('*').eq('active', true),
        sb.from('insurance_directions').select('*').gte('period', `${range.year}-01`).lte('period', period),
        sb.from('insurance_ravt_check').select('*').eq('period', period),
        sb.from('insurance_channels').select('*').eq('is_active', true),
        sb.from('insurance_companies').select('*').eq('is_active', true),
        sb.from('revenue_breakdown').select('*').eq('period', period),
        sb.from('revenue_breakdown').select('*').eq('period', `${prevRange.year}-${String(prevRange.month).padStart(2,'0')}`),
        sb.from('revenue_breakdown').select('*').gte('period', `${range.year}-01`).lte('period', period),
        safe(sb.from('ravt_settlements').select('*').order('settlement_date', { ascending: false }).limit(10)),
        safe(sb.from('point_pnl').select('*').or(`period.eq.${range.year}-YTD,period.eq.${period}`))
      ]);

      const allPoints = pointsRes.data || [];
      // is_revenue_point по умолчанию true для совместимости со старой схемой (если миграция не применена)
      const revenuePoints = allPoints.filter(p => p.is_revenue_point !== false && p.id !== 'detailing' && p.id !== 'school' && p.id !== 'mgt' && p.id !== 'other');

      cachedData = {
        points: revenuePoints,                      // основные точки (для виджетов)
        allPoints: allPoints,                       // ВСЕ проекты включая детейлинг/школу/МГТ
        current: currentRes.data || [],
        prev: prevRes.data || [],
        year: yearRes.data || [],
        plans: plansRes.data || [],
        fot: fotRes.data || null,
        expenses: expRes.data || [],
        taxes: taxRes.data || [],
        loans: loansRes.data || [],
        directions: dirsRes.data || [],
        ravt: ravtRes.data || [],
        channels: channelsRes.data || [],
        companies: companiesRes.data || [],
        breakdown: breakdownRes.data || [],
        breakdownPrev: breakdownPrevRes.data || [],
        breakdownYear: breakdownYearRes.data || [],
        ravtSettlements: ravtSettlementsRes.data || [],
        pnl: pnlRes.data || [],
        range, prevRange, period
      };
      render(cachedData);
    } catch (e) {
      console.error(e);
      document.getElementById('content').innerHTML = `<div class="empty">⚠ Ошибка загрузки: ${e.message || e}</div>`;
    }
  }

  function render(data) {
    if (!data.points.length) { document.getElementById('content').innerHTML = '<div class="empty">Точки не настроены</div>'; return; }

    const monthName = MP_MONTHS_FULL[data.range.month-1];
    destroyCharts();

    let monthTotal=0, monthIns=0, monthRetail=0, monthPhys=0, monthCorp=0, monthBookings=0;
    data.current.forEach(r => {
      monthTotal += +r.total_day || 0;
      monthIns += +r.ins_day || 0;
      monthRetail += +r.retail_day || 0;
      monthPhys += +r.phys_day || 0;
      monthCorp += +r.corp_day || 0;
      monthBookings += +r.bookings || 0;
    });
    // Последний отчёт по каждой точке — для долгов берём последний отчёт ГДЕ ДОЛГИ УКАЗАНЫ
    // (если менеджер ввёл новый отчёт но забыл долги — они должны браться из предыдущего)
    const lastByPoint = {};        // последний отчёт (для всего общего)
    const lastDebtsByPoint = {};   // последний отчёт где долги > 0 (для отображения долгов)
    data.year.forEach(r => {
      if (!lastByPoint[r.point_id] || r.date > lastByPoint[r.point_id].date) lastByPoint[r.point_id] = r;
      const hasDebts = (+r.debt_total > 0) || (+r.owe_total > 0);
      if (hasDebts && (!lastDebtsByPoint[r.point_id] || r.date > lastDebtsByPoint[r.point_id].date)) {
        lastDebtsByPoint[r.point_id] = r;
      }
    });
    data.current.forEach(r => {
      if (!lastByPoint[r.point_id] || r.date > lastByPoint[r.point_id].date) lastByPoint[r.point_id] = r;
      const hasDebts = (+r.debt_total > 0) || (+r.owe_total > 0);
      if (hasDebts && (!lastDebtsByPoint[r.point_id] || r.date > lastDebtsByPoint[r.point_id].date)) {
        lastDebtsByPoint[r.point_id] = r;
      }
    });
    let monthDebtTotal=0, monthOweTotal=0, monthOweRavt=0, monthOweOther=0;
    Object.values(lastDebtsByPoint).forEach(r => {
      monthDebtTotal += +r.debt_total || 0;
      monthOweTotal += +r.owe_total || 0;
      monthOweRavt += +r.owe_ravt || 0;
      monthOweOther += +r.owe_other || 0;
    });

    // Долги в прошлом месяце — для сравнения динамики
    // Берём последний отчёт ГДЕ ДОЛГИ УКАЗАНЫ до конца прошлого месяца
    const prevLastByPoint = {};
    const prevEnd = data.prevRange.end;
    data.year.forEach(r => {
      if (r.date > prevEnd) return;
      const hasDebts = (+r.debt_total > 0) || (+r.owe_total > 0);
      if (!hasDebts) return;
      if (!prevLastByPoint[r.point_id] || r.date > prevLastByPoint[r.point_id].date) prevLastByPoint[r.point_id] = r;
    });
    data.prev.forEach(r => {
      const hasDebts = (+r.debt_total > 0) || (+r.owe_total > 0);
      if (!hasDebts) return;
      if (!prevLastByPoint[r.point_id] || r.date > prevLastByPoint[r.point_id].date) prevLastByPoint[r.point_id] = r;
    });
    let prevOweTotal = 0;
    Object.values(prevLastByPoint).forEach(r => { prevOweTotal += +r.owe_total || 0; });
    const oweDelta = prevOweTotal > 0 ? Math.round((monthOweTotal - prevOweTotal) / prevOweTotal * 100) : null;

    let prevTotal = 0;
    data.prev.forEach(r => prevTotal += +r.total_day || 0);
    const monthDelta = prevTotal ? Math.round((monthTotal - prevTotal) / prevTotal * 100) : null;

    let yearTotal=0, yearRetail=0, yearIns=0;
    data.year.forEach(r => {
      yearTotal += +r.total_day || 0;
      yearRetail += +r.retail_day || 0;
      yearIns += +r.ins_day || 0;
    });
    data.points.forEach(p => {
      yearTotal += +p.year_start_total || 0;
      yearRetail += +p.year_start_retail || 0;
      yearIns += +p.year_start_insurance || 0;
    });

    const pointStats = {};
    data.points.forEach(p => {
      pointStats[p.id] = { total:0, ins:0, retail:0, phys:0, corp:0, debt:0, owe:0, bookings:0, days:new Set(),
        plan: data.plans.find(pl => pl.point_id === p.id) || {} };
    });
    data.current.forEach(r => {
      const s = pointStats[r.point_id];
      if (!s) return;
      s.total += +r.total_day || 0;
      s.ins += +r.ins_day || 0;
      s.retail += +r.retail_day || 0;
      s.phys += +r.phys_day || 0;
      s.corp += +r.corp_day || 0;
      s.bookings += +r.bookings || 0;
      s.days.add(r.date);
    });
    Object.values(lastDebtsByPoint).forEach(r => {
      const s = pointStats[r.point_id];
      if (!s) return;
      s.debt = +r.debt_total || 0;
      s.owe = +r.owe_total || 0;
    });

    const fot = data.fot || {};
    const fotTotal = +fot.fot_total || 0;
    const expWithoutSalary = data.expenses.filter(r => !r.category.startsWith('salary_')).reduce((s,r) => s + (+r.amount), 0);
    const taxTotal = data.taxes.reduce((s,r) => s + (+r.amount), 0);
    const profit = monthTotal - expWithoutSalary - fotTotal - taxTotal;
    const profitMargin = monthTotal > 0 ? Math.round(profit / monthTotal * 100) : 0;

    // === КЭШФЛОУ из Планфакт за выбранный месяц ===
    // Если за конкретный месяц данных нет — пробуем найти YTD (накопленно за год)
    const monthPnl = (data.pnl || []).filter(p => p.period === period);
    const revenuePointIds = new Set(data.points.map(p => p.id));
    const monthPnlMain = monthPnl.filter(p => revenuePointIds.has(p.point_id));
    const cashflowIncome = monthPnlMain.reduce((s,p) => s + (+p.income||0), 0);
    const cashflowExp = monthPnlMain.reduce((s,p) => s + (+p.expenses||0), 0);
    const cashflow = cashflowIncome - cashflowExp;
    const cashflowMargin = cashflowIncome > 0 ? Math.round(cashflow / cashflowIncome * 100) : 0;
    const hasCashflowData = monthPnlMain.length > 0 && (cashflowIncome > 0 || cashflowExp > 0);

    // Fallback на YTD: если за конкретный месяц данных нет — показываем YTD-итог
    const ytdPnl = (data.pnl || []).filter(p => p.period === `${data.range.year}-YTD`);
    const ytdMain = ytdPnl.filter(p => revenuePointIds.has(p.point_id));
    const ytdIncome = ytdMain.reduce((s,p) => s + (+p.income||0), 0);
    const ytdExp = ytdMain.reduce((s,p) => s + (+p.expenses||0), 0);
    const ytdCashflow = ytdIncome - ytdExp;
    const hasYtdData = ytdMain.length > 0 && (ytdIncome > 0 || ytdExp > 0);

    const fotPct = monthTotal > 0 ? Math.round(fotTotal / monthTotal * 100) : 0;

    // ФОТ по точкам (на основе территорий)
    const moscowPointTotal = data.points.filter(p => p.format === 'moscow').reduce((s,p) => s + (pointStats[p.id]?.total || 0), 0);
    const pointFot = {};
    data.points.forEach(p => {
      if (p.id === 'sovhoz') pointFot[p.id] = +fot.fot_sovhoz || 0;
      else if (p.id === 'poyma') pointFot[p.id] = +fot.fot_poyma || 0;
      else if (p.format === 'moscow' && moscowPointTotal > 0) {
        // Москву (Калужская+Серпуховская) делим пропорционально выручке
        pointFot[p.id] = (+fot.fot_moscow || 0) * (pointStats[p.id].total / moscowPointTotal);
      } else {
        pointFot[p.id] = 0;
      }
    });

    // Эффективность точки = выручка / ФОТ. Если ФОТ нет — fallback на выручку.
    const pointEfficiency = {};
    data.points.forEach(p => {
      const t = pointStats[p.id].total;
      const f = pointFot[p.id];
      pointEfficiency[p.id] = (f > 0) ? (t / f) : 0;
    });

    // Сортировка точек: если есть ФОТ — по эффективности, иначе по выручке
    const hasFot = fotTotal > 0;
    const sortedPoints = data.points.slice().filter(p => pointStats[p.id].total > 0).sort((a,b) => {
      if (hasFot) return pointEfficiency[b.id] - pointEfficiency[a.id];
      return pointStats[b.id].total - pointStats[a.id].total;
    });
    const leader = sortedPoints[0];
    const outsider = sortedPoints[sortedPoints.length - 1];

    // Определяем полный ли месяц
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === data.range.year && today.getMonth()+1 === data.range.month;
    const isPastMonth = data.range.year < today.getFullYear() || (data.range.year === today.getFullYear() && data.range.month < today.getMonth()+1);
    const daysInMonth = new Date(data.range.year, data.range.month, 0).getDate();
    const reportedDays = data.current.filter(r => +r.total_day > 0).length;
    const monthCoverage = reportedDays / daysInMonth;
    const monthsComplete = isPastMonth || monthCoverage >= 0.85;

    // Есть ли данные о расходах/ФОТ — для определения релевантности прибыли
    const hasFinanceData = fotTotal > 0 || expWithoutSalary > 0 || taxTotal > 0;

    // === УМНАЯ ДЕЛЬТА к прошлому месяцу ===
    // Если месяц неполный — сравниваем с тем же периодом прошлого месяца
    let smartDelta = null;
    let smartDeltaLabel = '';   // подпись типа "к Апр" или "к Апр (за 6 дн)"
    let smartDeltaPrev = 0;
    if (isCurrentMonth && monthCoverage < 0.5) {
      const dayOfMonth = today.getDate();
      const prevPeriodEnd = `${data.prevRange.year}-${String(data.prevRange.month).padStart(2,'0')}-${String(dayOfMonth).padStart(2,'0')}`;
      smartDeltaPrev = data.prev.filter(r => r.date <= prevPeriodEnd).reduce((s,r) => s + (+r.total_day || 0), 0);
      if (smartDeltaPrev > 0) {
        smartDelta = Math.round((monthTotal - smartDeltaPrev) / smartDeltaPrev * 100);
        smartDeltaLabel = `к ${MP_MONTHS_SHORT[data.prevRange.month-1]} (за ${dayOfMonth} дн)`;
      }
    } else if (monthsComplete && prevTotal > 0) {
      smartDelta = monthDelta;
      smartDeltaPrev = prevTotal;
      smartDeltaLabel = `к ${MP_MONTHS_SHORT[data.prevRange.month-1]}`;
    }

    const alerts = [];
    // Кэшфлоу — главный показатель раз в кассовом разрыве
    if (hasCashflowData && cashflow < 0) {
      alerts.push({ type:'red', icon:'⚠️', text:`<b>Месяц убыточный по деньгам:</b> ушло на ${fm(Math.abs(cashflow))} ₽ больше чем пришло`, scrollTo:'profit' });
    } else if (hasCashflowData && cashflowMargin > 0 && cashflowMargin < 10) {
      alerts.push({ type:'orange', icon:'📉', text:`<b>Низкая маржа кэшфлоу:</b> ${cashflowMargin}% от поступлений`, scrollTo:'profit' });
    }
    if (fotPct > 35 && monthTotal > 0 && hasFinanceData) {
      alerts.push({ type:'red', icon:'💼', text:`<b>ФОТ ${fotPct}%</b> от выручки — выше нормы (макс 30%)`, scrollTo:'fot' });
    }

    // Алерты по дельте — используем smartDelta (учитывает неполный месяц)
    if (smartDelta !== null && smartDeltaLabel.includes('за')) {
      // Текущий неполный месяц — сравнение за тот же период
      if (smartDelta < -20) alerts.push({ type:'red', icon:'📉', text:`<b>Падение к прошлому месяцу за тот же период:</b> ${smartDelta}% (${fm(smartDeltaPrev)} → ${fm(monthTotal)} ₽)`, scrollTo:'total' });
      else if (smartDelta > 20) alerts.push({ type:'green', icon:'📈', text:`<b>Рост к прошлому месяцу за тот же период:</b> +${smartDelta}% (${fm(smartDeltaPrev)} → ${fm(monthTotal)} ₽)`, scrollTo:'total' });
    } else if (smartDelta !== null) {
      if (smartDelta < -20) alerts.push({ type:'red', icon:'📉', text:`<b>Падение к прошлому месяцу:</b> ${smartDelta}% (${fm(smartDeltaPrev)} → ${fm(monthTotal)} ₽)`, scrollTo:'total' });
      else if (smartDelta > 20) alerts.push({ type:'green', icon:'📈', text:`<b>Рост к прошлому месяцу:</b> +${smartDelta}% (${fm(smartDeltaPrev)} → ${fm(monthTotal)} ₽)`, scrollTo:'total' });
    }

    // ⚠ Особенность РАВТ: долг — это рабочий капитал (стёкла на машинах в работе)
    // Реальная угроза только в (а) долге прочим поставщикам и (б) резком росте долга РАВТу
    const oweOtherDelta = (function() {
      let prevOther = 0;
      Object.values(prevLastByPoint).forEach(r => { prevOther += +r.owe_other || 0; });
      return prevOther > 0 ? Math.round((monthOweOther - prevOther) / prevOther * 100) : null;
    })();
    const oweRavtDelta = (function() {
      let prevRavt = 0;
      Object.values(prevLastByPoint).forEach(r => { prevRavt += +r.owe_ravt || 0; });
      return prevRavt > 0 ? Math.round((monthOweRavt - prevRavt) / prevRavt * 100) : null;
    })();

    // Алерт по прочим поставщикам — это «настоящий» долг, без взаимозачёта
    if (monthOweOther > monthTotal * 1.5 && monthOweOther > 0 && monthTotal > 100000) {
      alerts.push({ type:'red', icon:'🚨', text:`<b>Долг прочим поставщикам ${fm(monthOweOther)} ₽</b> — это ${(monthOweOther/monthTotal).toFixed(1)}× месячной выручки. Без учёта РАВТ (взаимозачёт)`, scrollTo:'debts' });
    } else if (monthOweOther > monthTotal && monthOweOther > 0 && monthTotal > 100000) {
      alerts.push({ type:'orange', icon:'💸', text:`<b>Долг прочим поставщикам ${fm(monthOweOther)} ₽</b> выше месячной выручки`, scrollTo:'debts' });
    }

    // Резкий рост долга прочим (без взаимозачёта)
    if (oweOtherDelta !== null && oweOtherDelta > 30 && monthOweOther > 1000000) {
      alerts.push({ type:'orange', icon:'📈', text:`<b>Долг прочим растёт быстро:</b> +${oweOtherDelta}% к прошлому месяцу`, scrollTo:'debts' });
    }

    // Резкий рост долга РАВТу — может означать что закупки опережают закрытие работ
    if (oweRavtDelta !== null && oweRavtDelta > 40 && monthOweRavt > 2000000) {

        <div class="section-title">💸 Долги</div>
        <div class="finance-grid">

            ${expandedKpis.has('debts') ? renderDebtBreakdown(data, 'debt', lastDebtsByPoint) : ''}

          <div class="finance-card owe ${expandedKpis.has('owes')?'is-expanded':''}" onclick="toggleExpand('owes', event)">

            ${expandedKpis.has('owes') ? renderDebtBreakdown(data, 'owe', lastDebtsByPoint) + `
              <div style="margin-top:11px;padding:10px 11px;background:rgba(232,184,75,.08);border-radius:7px;border-left:2px solid var(--accent);font-size:11px;line-height:1.55;color:var(--muted);">
                <b style="color:var(--accent);">🔄 Про долг РАВТу</b><br>
                РАВТ выдаёт направления → мы покупаем у них стёкла (страх+розница) → закрываем работы → СК платит РАВТу → раз в ~30 дн идёт <b style="color:var(--text);">взаимозачёт</b>: РАВТ нам должен (стекло + бонус 12%/25% + работа за каждую закрытую машину).<br>
                <b style="color:var(--text);">Реальная позиция</b> = долг РАВТу − долг РАВТ нам. Цифру дают по акту взаимозачёта.
              </div>` : ''}
          </div>
        </div>
      </div>`;
    }

    if (totalDirsMonth > 0 || totalDirsYear > 0) {
      html += `<div class="section" data-anchor="sk">
        <div class="section-title">🛡 Менеджер страховых</div>
        <div class="sk-widget">
          <div class="sk-summary">
            <div class="sk-stat">
              <div class="sk-stat-val">${totalDirsMonth}</div>
              <div class="sk-stat-lbl">Направлений в ${MP_MONTHS_SHORT[data.range.month-1]}</div>
            </div>
            <div class="sk-stat">
              <div class="sk-stat-val ${dirsDelta!==null && dirsDelta>=0?'g':dirsDelta!==null?'r':''}">${dirsDelta!==null?(dirsDelta>=0?'+':'')+dirsDelta+'%':'—'}</div>
              <div class="sk-stat-lbl">К прошлому месяцу</div>
            </div>
            <div class="sk-stat">
              <div class="sk-stat-val">${totalDirsYear}</div>
              <div class="sk-stat-lbl">За год</div>
            </div>
          </div>
          <div class="sk-cities">
            <div class="sk-city">
              <div class="sk-city-name">🏙 Москва</div>
              <div class="sk-city-val">${byCity.moscow || 0}</div>
              <div class="sk-city-sub">направлений за месяц</div>
            </div>
            <div class="sk-city">
              <div class="sk-city-name">🏘 Ижевск</div>
              <div class="sk-city-val">${byCity.izhevsk || 0}</div>
              <div class="sk-city-sub">направлений за месяц</div>
            </div>
          </div>
        </div>
      </div>`;
    }

    // === БЛОК «ТОП ПО УСЛУГАМ» ===
    html += renderTopServices(data, monthName);

    // === БЛОК «ПРИБЫЛЬ ПО ПРОЕКТАМ» (из Планфакт) ===
    html += renderProjectsPnl(data);

    html += `<div class="chart-row">
      <div class="chart-block">
        <div class="chart-title">📈 Динамика по месяцам ${data.range.year} <span style="font-size:10px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px;">тапни столбец</span></div>
        <div class="chart-wrap"><canvas id="ch-monthly"></canvas></div>
        <div id="month-detail-block"></div>
      </div>
      <div class="chart-block">
        <div class="chart-title">🎯 Структура выручки <span style="font-size:10px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px;">тапни сегмент</span></div>
        <div class="chart-wrap"><canvas id="ch-structure"></canvas></div>
        <div id="structure-detail-block"></div>
      </div>
    </div>`;

    document.getElementById('content').innerHTML = html;

    setTimeout(() => {
      // Помесячные данные с разбивкой по каналам
      const monthly = {};
      for (let m=1; m<=12; m++) monthly[m] = { total: 0, ins: 0, retail: 0, days: 0, byPoint: {} };
      data.year.forEach(r => {
        const month = +r.date.split('-')[1];
        monthly[month].total += +r.total_day || 0;
        monthly[month].ins += +r.ins_day || 0;
        monthly[month].retail += +r.retail_day || 0;
        if (+r.total_day > 0) monthly[month].days++;
        monthly[month].byPoint[r.point_id] = (monthly[month].byPoint[r.point_id] || 0) + (+r.total_day || 0);
      });

      const ctx1 = document.getElementById('ch-monthly');
      if (ctx1) allCharts.push(new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: MP_MONTHS_SHORT,
          datasets: [{
            label: 'Выручка',
            data: Object.values(monthly).map(m => m.total),
            backgroundColor: Object.values(monthly).map((m,i) => i+1 === data.range.month ? '#e8b84b' : '#2a2a2a'),
            hoverBackgroundColor: '#d4a342',
            borderRadius: 5
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          onClick: (evt, elements) => {
            if (elements.length > 0) {
              const monthIdx = elements[0].index;
              showMonthDetail(monthIdx + 1, monthly[monthIdx + 1], data);
            }
          },
          onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
          },
          plugins: { legend: {display:false}, tooltip:{callbacks:{label:c=>fm(c.raw)+' ₽ · тапни для деталей'}} },
          scales: { x:{ticks:{color:'#909090'},grid:{display:false}}, y:{ticks:{color:'#909090', callback:v=>fs(v)},grid:{color:'#333'}} }
        }
      }));

      const ctx2 = document.getElementById('ch-structure');
      if (ctx2 && monthTotal > 0) {
        const structureLabels = ['Страховые', 'Розница'];
        const structureData = [monthIns, monthRetail];
        const structureColors = ['#2196f3', '#4caf50'];
        const structureKeys = ['ins', 'retail'];
        if (monthCorp > 0) {
          structureLabels.push('Корпоратив');
          structureData.push(monthCorp);
          structureColors.push('#9c27b0');
          structureKeys.push('corp');
        }
        allCharts.push(new Chart(ctx2, {
          type: 'doughnut',
          data: { labels: structureLabels, datasets: [{ data: structureData, backgroundColor: structureColors, borderColor: '#222', borderWidth: 2, hoverOffset: 6 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            onClick: (evt, elements) => {
              if (elements.length > 0) {
                const idx = elements[0].index;
                showStructureDetail(structureKeys[idx], structureLabels[idx], structureData[idx], data, pointStats);
              }
            },
            onHover: (evt, elements) => {
              evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
            },
            plugins: { legend: {position:'bottom', labels:{color:'#fff', font:{size:11}}}, tooltip:{callbacks:{label:c=>c.label+': '+fm(c.raw)+' ₽ · тапни для деталей'}} }
          }
        }));
      }
    }, 50);
  }

  // Показ деталей выбранного месяца
  function showMonthDetail(monthNum, monthData, data) {
    const block = document.getElementById('month-detail-block');
    if (!block) return;
    const monthName = MP_MONTHS_FULL[monthNum-1];
    const prevMonth = monthNum > 1 ? data.year.filter(r => +r.date.split('-')[1] === monthNum - 1).reduce((s,r) => s+(+r.total_day||0), 0) : 0;
    const delta = prevMonth > 0 ? Math.round((monthData.total - prevMonth) / prevMonth * 100) : null;

    // Топ точка месяца
    const topPoint = Object.entries(monthData.byPoint).sort((a,b) => b[1] - a[1])[0];
    const topPointName = topPoint ? (data.points.find(p => p.id === topPoint[0])?.name || topPoint[0]) : '—';

    const isCurrentMonth = monthNum === data.range.month;
    block.innerHTML = `
      <div style="margin-top:14px;padding:13px;background:#141414;border-radius:10px;border-left:3px solid var(--accent);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);letter-spacing:1.5px;">${monthName} ${data.range.year}</div>
          ${!isCurrentMonth ? `<button onclick="goToMonth(${data.range.year}, ${monthNum})" style="background:var(--accent);color:#000;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;">→ перейти</button>` : '<span style="font-size:10px;color:var(--muted);">текущий месяц</span>'}
        </div>
        ${monthData.total > 0 ? `
        <div class="expand-row">
          <div class="expand-item"><span>📊 Всего</span><span class="v">${fm(monthData.total)} ₽</span></div>
          <div class="expand-item"><span>🛡 Страховые</span><span class="v b">${fm(monthData.ins)} ₽</span></div>
          <div class="expand-item"><span>💵 Розница</span><span class="v g">${fm(monthData.retail)} ₽</span></div>
          <div class="expand-item"><span>📅 Средний день</span><span class="v">${monthData.days > 0 ? fm(monthData.total/monthData.days) : 0} ₽</span></div>
          ${delta !== null ? `<div class="expand-item"><span>vs ${MP_MONTHS_SHORT[monthNum-2]}</span><span class="v ${delta>=0?'g':'r'}">${delta>=0?'+':''}${delta}% (${fm(prevMonth)} → ${fm(monthData.total)})</span></div>` : ''}
          <div class="expand-item"><span>🏆 Топ-точка по выручке</span><span class="v">${topPointName} (${fm(topPoint ? topPoint[1] : 0)} ₽)</span></div>
        </div>` : `<div style="color:var(--muted);font-size:12px;text-align:center;padding:14px 0;">Данных за ${monthName} ещё нет</div>`}
      </div>`;
  }

  // Показ деталей канала (страх/розн/корп)
  function showStructureDetail(channelKey, channelLabel, channelTotal, data, pointStats) {
    const block = document.getElementById('structure-detail-block');
    if (!block) return;
    // Разбивка по точкам для этого канала
    const byPoint = data.points.map(p => {
      const s = pointStats[p.id];
      let v = 0;
      if (channelKey === 'ins') v = s.ins;
      else if (channelKey === 'retail') v = s.retail;
      else if (channelKey === 'corp') v = s.corp;
      return { name: p.name, val: v };
    }).filter(x => x.val > 0).sort((a,b) => b.val - a.val);

    const colors = { ins: 'var(--blue)', retail: 'var(--green)', corp: 'var(--purple)' };
    block.innerHTML = `
      <div style="margin-top:14px;padding:13px;background:#141414;border-radius:10px;border-left:3px solid ${colors[channelKey] || 'var(--accent)'};">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:${colors[channelKey] || 'var(--accent)'};letter-spacing:1.5px;margin-bottom:9px;">${channelLabel}: ${fm(channelTotal)} ₽</div>
        ${byPoint.length > 0 ? `<div class="expand-row">${byPoint.map(p =>
          `<div class="expand-item"><span><b>${p.name}</b></span><span class="v">${fm(p.val)} ₽ · ${Math.round(p.val/channelTotal*100)}%</span></div>`
        ).join('')}</div>` : '<div style="color:var(--muted);font-size:12px;">Нет данных по точкам</div>'}
      </div>`;
  }

  // Переход на конкретный месяц года
  function goToMonth(year, month) {
    document.getElementById('month-pick').value = `${year}-${String(month).padStart(2,'0')}`;
    mpUpdateLabel();
    loadAll();
  }

  function renderTopServices(data, monthName) {
    const breakdown = data.breakdown || [];
    const breakdownPrev = data.breakdownPrev || [];

    // Если нет данных за месяц — пропускаем блок
    if (!breakdown.length) {
      return `<div class="section">
        <div class="section-title">🏆 ТОП по услугам · ${monthName}</div>
        <div class="top-empty" style="background:var(--surface);border:1px solid var(--border);border-radius:12px;">
          📭 Детализация по услугам за этот месяц ещё не заведена<br>
          <span style="font-size:10px;">Бухгалтер вносит детализацию обычно в начале следующего месяца</span>
        </div>
      </div>`;
    }

    // Список «допуслуг» которые интересно отслеживать (розничный канал, не основные стёкла)
    const ADDONS = ['Щётки', 'Реализация товаров (герметик, автохимия)', 'Ремонт сколов', 'Полировка', 'Тонировка', 'Бронепленка', 'Шумоизоляция', 'Антидождь'];

    // Топ услуг (только розница) — здесь category это название услуги
    const byCategory = {};
    breakdown.filter(b => b.channel === 'retail').forEach(b => {
      byCategory[b.category] = (byCategory[b.category] || 0) + (+b.amount || 0);
    });
    const topCategories = Object.entries(byCategory)
      .map(([cat, sum]) => ({ cat, sum }))
      .filter(x => x.sum > 0)
      .sort((a,b) => b.sum - a.sum)
      .slice(0, 6);

    // Прошлый месяц для сравнения (тоже только розница)
    const byCategoryPrev = {};
    breakdownPrev.filter(b => b.channel === 'retail').forEach(b => {
      byCategoryPrev[b.category] = (byCategoryPrev[b.category] || 0) + (+b.amount || 0);
    });

    const totalSum = topCategories.reduce((s,x) => s + x.sum, 0);

    // Допродажи — по точкам (где лучше продают)
    const addons = ADDONS.map(a => {
      const byPoint = {};
      let totalAddon = 0;
      breakdown.forEach(b => {
        if (b.category !== a) return;
        byPoint[b.point_id] = (byPoint[b.point_id] || 0) + (+b.amount || 0);
        totalAddon += (+b.amount || 0);
      });
      if (totalAddon === 0) return null;
      const sortedPoints = Object.entries(byPoint).sort((a,b) => b[1] - a[1]);
      const leader = sortedPoints[0];
      const leaderName = leader ? (data.points.find(p => p.id === leader[0])?.name || leader[0]) : '—';
      return { name: a, total: totalAddon, leader: leaderName, leaderSum: leader ? leader[1] : 0, byPoint: sortedPoints };
    }).filter(Boolean).sort((a,b) => b.total - a.total);

    // Топ СК за месяц
    const bySK = {};
    breakdown.filter(b => b.channel === 'insurance').forEach(b => {
      bySK[b.category] = (bySK[b.category] || 0) + (+b.amount || 0);
    });
    const topSK = Object.entries(bySK).map(([sk, sum]) => ({ sk, sum })).filter(x => x.sum > 0).sort((a,b) => b.sum - a.sum).slice(0, 5);
    const totalSK = topSK.reduce((s,x) => s + x.sum, 0);

    // По каким точкам есть данные?
    const pointsWithData = new Set(breakdown.map(b => b.point_id));
    const pointNames = Array.from(pointsWithData).map(pid => data.points.find(p => p.id === pid)?.name || pid);
    const pointsCovered = pointsWithData.size;
    const pointsMissing = data.points.filter(p => !pointsWithData.has(p.id));
    const isFullCoverage = pointsCovered === data.points.length;

    // Имя предыдущего месяца для дельт
    const prevMonthName = MP_MONTHS_SHORT[(data.range.month + 10) % 12];   // -2 mod 12 + 1

    let html = `<div class="section">
      <div class="section-title">🏆 ТОП по услугам · ${monthName}</div>`;

    // Дисклеймер если данные не по всем точкам
    if (!isFullCoverage) {
      html += `<div style="background:var(--surface);border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--text);line-height:1.5;">
        ℹ️ <b>Детализация заведена только по точкам:</b> ${pointNames.join(', ')}.
        <span style="color:var(--muted);">Данные по ${pointsMissing.map(p => p.name).join(', ')} в этом блоке отсутствуют.</span>
      </div>`;
    }

    html += `<div class="top-grid">`;

    // Карточка 1: Топ услуг
    html += `<div class="top-card">
      <div class="top-title">💰 Топ услуг розницы <span style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:4px;">живые деньги · ${pointNames.join(', ')}</span></div>
      <div class="top-list">`;
    topCategories.forEach((c, i) => {
      const prev = byCategoryPrev[c.cat] || 0;
      const delta = prev > 0 ? Math.round((c.sum - prev) / prev * 100) : null;
      const pctOfTotal = totalSum > 0 ? Math.round(c.sum / totalSum * 100) : 0;
      const deltaStr = delta !== null ? ` <span style="font-size:10px;color:${delta >= 0 ? 'var(--green)' : 'var(--red)'};">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)}% к ${prevMonthName}</span>` : ` <span style="font-size:10px;color:var(--muted);">(нет ${prevMonthName})</span>`;
      html += `<div class="top-item">
        <div class="top-item-rank">${i+1}</div>
        <div style="flex:1;">
          <div class="top-item-name">${c.cat}${deltaStr}</div>
          <div class="top-item-bar"><div class="top-item-bar-fill" style="width:${pctOfTotal}%"></div></div>
        </div>
        <div class="top-item-val">${fm(c.sum)} ₽</div>
      </div>`;
    });
    html += `</div></div>`;

    // Карточка 2: Допродажи (если есть)
    if (addons.length > 0) {
      html += `<div class="top-card">
        <div class="top-title">🛒 Допродажи</div>
        <div class="top-list">`;
      addons.forEach((a) => {
        const allPoints = a.byPoint.map(([pid, sum]) => {
          const pName = data.points.find(p => p.id === pid)?.name || pid;
          return { name: pName, sum };
        });
        const tags = allPoints.map((p, idx) =>
          `<span class="top-point-tag${idx === 0 ? ' leader' : ''}">${p.name}: ${fm(p.sum)} ₽</span>`
        ).join('');
        html += `<div class="top-item" style="flex-direction:column;align-items:stretch;gap:5px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="top-item-name" style="flex:1;">${a.name}</div>
            <div class="top-item-val acc">${fm(a.total)} ₽</div>
          </div>
          <div class="top-points-row">${tags}</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    // Карточка 3: Топ СК
    if (topSK.length > 0) {
      html += `<div class="top-card">
        <div class="top-title">🛡 Топ страховых компаний <span style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:4px;">живые деньги</span></div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:9px;line-height:1.4;">💡 Цифры из Планфакта — могут включать оплаты за прошлые периоды (отсрочки СК до 30+ дней)</div>
        <div class="top-list">`;
      topSK.forEach((s, i) => {
        const pctOfTotal = totalSK > 0 ? Math.round(s.sum / totalSK * 100) : 0;
        html += `<div class="top-item">
          <div class="top-item-rank">${i+1}</div>
          <div style="flex:1;">
            <div class="top-item-name">${s.sk}</div>
            <div class="top-item-bar"><div class="top-item-bar-fill" style="width:${pctOfTotal}%;background:#2196f3;"></div></div>
          </div>
          <div class="top-item-val">${fm(s.sum)} ₽</div>
          <div class="top-item-pct">${pctOfTotal}%</div>
        </div>`;
      });
      html += `</div></div>`;
    }

    html += `</div></div>`;
    return html;
  }

  function renderProjectsPnl(data) {
    const pnl = data.pnl || [];
    if (!pnl.length) return '';   // нет данных — блока нет

    // Берём только YTD за текущий год (накопленно)
    const ytdRows = pnl.filter(p => p.period === `${data.range.year}-YTD`);
    if (!ytdRows.length) return '';

    const allPoints = data.allPoints || data.points;

    // Связываем PNL с проектами
    const enriched = ytdRows.map(row => {
      const proj = allPoints.find(p => p.id === row.point_id);
      return {
        ...row,
        name: proj?.name || row.point_id,
        is_revenue_point: proj?.is_revenue_point !== false,
        project_type: proj?.project_type || 'other',
        is_active: proj?.is_active !== false,
        display_order: proj?.display_order || 100
      };
    });

    // Делим на основные / прочие
    const main = enriched.filter(x => x.is_revenue_point && x.is_active).sort((a,b) => +b.operating_flow - +a.operating_flow);
    const other = enriched.filter(x => !x.is_revenue_point || !x.is_active).sort((a,b) => a.display_order - b.display_order);

    const totalIncome = enriched.reduce((s,x) => s + (+x.income||0), 0);
    const totalExpenses = enriched.reduce((s,x) => s + (+x.expenses||0), 0);
    const totalFlow = totalIncome - totalExpenses;

    let html = `<div class="section">
      <div class="section-title">💰 Прибыль по проектам · ${data.range.year} YTD <span style="font-size:10px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px;">из Планфакт</span></div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;">
          <div style="background:#141414;border-left:3px solid var(--green);border-radius:8px;padding:10px 12px;">
            <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">📥 Поступления</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--green);letter-spacing:.5px;">${fm(totalIncome)} ₽</div>
          </div>
          <div style="background:#141414;border-left:3px solid var(--red);border-radius:8px;padding:10px 12px;">
            <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">📤 Выплаты</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red);letter-spacing:.5px;">${fm(totalExpenses)} ₽</div>
          </div>
          <div style="background:#141414;border-left:3px solid ${totalFlow >= 0 ? 'var(--accent)' : 'var(--red)'};border-radius:8px;padding:10px 12px;">
            <div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">💎 Опер.поток</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:${totalFlow >= 0 ? 'var(--accent)' : 'var(--red)'};letter-spacing:.5px;">${totalFlow >= 0 ? '+' : ''}${fm(totalFlow)} ₽</div>
          </div>
        </div>
      </div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--accent);letter-spacing:1.5px;margin-bottom:11px;">🏆 ОСНОВНЫЕ ПРОЕКТЫ</div>
        <div style="display:flex;flex-direction:column;gap:6px;">`;

    main.forEach(p => {
      const flow = +p.operating_flow;
      const profit = flow >= 0;
      const margin = +p.income > 0 ? Math.round(flow / +p.income * 100) : null;
      const icon = profit ? '🟢' : '🔴';
      html += `<div style="background:#141414;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-size:14px;">${icon}</div>
        <div style="flex:1;min-width:100px;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);letter-spacing:1px;">${p.name}</div>
          <div style="font-size:10px;color:var(--muted);">поступления ${fm(+p.income)} − расходы ${fm(+p.expenses)}${margin !== null ? ` · маржа ${margin}%` : ''}</div>
        </div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${profit ? 'var(--green)' : 'var(--red)'};letter-spacing:.5px;">${profit ? '+' : ''}${fm(flow)} ₽</div>
      </div>`;
    });

    html += `</div></div>`;

    // Прочие проекты (свёрнутые, в раскрываемом блоке)
    if (other.length > 0) {
      const otherFlow = other.reduce((s,x) => s + (+x.operating_flow||0), 0);
      const isExpanded = expandedKpis.has('otherProjects');
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;" onclick="toggleExpand('otherProjects', event)">
        <div style="display:flex;align-items:center;gap:10px;${isExpanded ? 'margin-bottom:11px;' : ''}">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--muted);letter-spacing:1.5px;">📂 ПРОЧИЕ ПРОЕКТЫ</div>
          <div style="font-size:11px;color:var(--muted);">${other.length} ${other.length === 1 ? 'проект' : 'проекта'} · ${otherFlow >= 0 ? '+' : ''}${fm(otherFlow)} ₽</div>
          <div style="margin-left:auto;color:var(--muted);font-size:11px;opacity:.6;">${isExpanded ? '−' : '+'}</div>
        </div>
        ${isExpanded ? `<div style="display:flex;flex-direction:column;gap:5px;">${other.map(p => {
          const flow = +p.operating_flow;
          const typeLabel = p.project_type === 'building' ? 'Стройка/ремонт' : p.project_type === 'other' ? 'Прочее' : '';
          const stateLabel = !p.is_active ? '⏸ свёрнут' : '';
          return `<div style="background:#141414;border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:8px;">
            <div style="flex:1;min-width:80px;">
              <div style="font-size:13px;color:var(--text);font-weight:500;">${p.name}</div>
              <div style="font-size:10px;color:var(--muted);">${[typeLabel, stateLabel].filter(Boolean).join(' · ')}${(+p.income > 0 || +p.expenses > 0) ? ` · доходы ${fm(+p.income)} расходы ${fm(+p.expenses)}` : ''}</div>
            </div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:${flow >= 0 ? 'var(--green)' : 'var(--red)'};letter-spacing:.4px;">${flow >= 0 ? '+' : ''}${fm(flow)} ₽</div>
          </div>`;
        }).join('')}</div>` : ''}
      </div>`;
    }

    html += `</div>`;
    return html;
  }

  function renderDebtBreakdown(data, type, lastByPoint) {
    const items = [];
    data.points.forEach(p => {
      const r = lastByPoint[p.id];
      if (!r) return;
      const v = type === 'debt' ? +r.debt_total || 0 : +r.owe_total || 0;
      if (v <= 0) return;
      let detail = '';
      if (type === 'debt') {
        const retail = +r.debt_retail || 0;
        const ins = +r.debt_insurance || 0;
        if (retail || ins) detail = ` <span style="color:var(--muted);font-size:10px;">(розн ${fm(retail)} + страх ${fm(ins)})</span>`;
      } else {
        const ravt = +r.owe_ravt || 0;
        const other = +r.owe_other || 0;
        if (ravt || other) detail = ` <span style="color:var(--muted);font-size:10px;">(РАВТ ${fm(ravt)} + прочие ${fm(other)})</span>`;
      }
      items.push({ name: p.name, val: v, detail });
    });
    items.sort((a,b) => b.val - a.val);
    return `<div class="expand-row">${items.map(i =>
      `<div class="expand-item"><span><b>${i.name}</b>${i.detail}</span><span class="v">${fm(i.val)} ₽</span></div>`
    ).join('')}</div>`;
  }

  function toggleExpand(key, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (expandedKpis.has(key)) expandedKpis.delete(key); else expandedKpis.add(key);
    if (cachedData) render(cachedData);
  }
  function togglePoint(id, ev) {
    if (ev) { ev.stopPropagation(); ev.preventDefault(); }
    if (expandedPoints.has(id)) expandedPoints.delete(id); else expandedPoints.add(id);
    if (cachedData) render(cachedData);
  }

  function scrollToAnchor(anchor) {
    // Если это KPI которое можно раскрыть — раскрываем заранее
    if (['total','profit','fot','year','debts','owes'].includes(anchor)) {
      expandedKpis.add(anchor);
      if (cachedData) render(cachedData);
    }
    // Скролл и подсветка
    setTimeout(() => {
      const el = document.querySelector(`[data-anchor="${anchor}"]`);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.transition = 'box-shadow .3s';
      el.style.boxShadow = '0 0 0 3px var(--accent)';
      setTimeout(() => { el.style.boxShadow = ''; }, 1500);
    }, 100);
  }

  function exportToExcel() {
    if (!cachedData) { showToast('Сначала загрузи данные', 'err'); return; }
    if (typeof XLSX === 'undefined') { showToast('Excel-библиотека не загружена', 'err'); return; }
    try {
      const wb = XLSX.utils.book_new();
      const data = cachedData;
      const monthName = MP_MONTHS_FULL[data.range.month-1];

      let monthTotal=0, monthIns=0, monthRetail=0;
      data.current.forEach(r => { monthTotal+=+r.total_day||0; monthIns+=+r.ins_day||0; monthRetail+=+r.retail_day||0; });
      const fot = data.fot || {};
      const expWithoutSalary = data.expenses.filter(r => !r.category.startsWith('salary_')).reduce((s,r) => s+(+r.amount), 0);
      const taxTotal = data.taxes.reduce((s,r) => s+(+r.amount), 0);
      const profit = monthTotal - expWithoutSalary - (+fot.fot_total||0) - taxTotal;

      const summary = [
        ['Отчёт RG Plaza', `${monthName} ${data.range.year}`],
        [],
        ['ФИНАНСОВАЯ КАРТИНА'],
        ['Выручка', monthTotal],
        ['  страховые', monthIns],
        ['  розница', monthRetail],
        ['ФОТ', +fot.fot_total||0],
        ['Расходы (аренда, лизинг, кредит)', expWithoutSalary],
        ['Налоги', taxTotal],
        ['= ЧИСТАЯ ПРИБЫЛЬ', profit],
        ['Маржа, %', monthTotal > 0 ? Math.round(profit/monthTotal*100) : 0]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Сводка');

      const pointsRows = [['Точка', 'Выручка', 'Страховые', 'Розница', 'Дни работы', 'Долги (нам)', 'Долги (мы)']];
      const lastByPoint = {};
      data.current.forEach(r => { if (!lastByPoint[r.point_id] || r.date > lastByPoint[r.point_id].date) lastByPoint[r.point_id] = r; });
      data.points.forEach(p => {
        const reports = data.current.filter(r => r.point_id === p.id);
        const t = reports.reduce((s,r) => s+(+r.total_day||0), 0);
        const i = reports.reduce((s,r) => s+(+r.ins_day||0), 0);
        const ret = reports.reduce((s,r) => s+(+r.retail_day||0), 0);
        const days = new Set(reports.filter(r => +r.total_day > 0).map(r => r.date)).size;
        const last = lastByPoint[p.id] || {};
        pointsRows.push([p.name, t, i, ret, days, +last.debt_total||0, +last.owe_total||0]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pointsRows), 'По точкам');

      const daysRows = [['Дата', 'Точка', 'Всего', 'Страх', 'Розница', 'Записей', 'Долги (нам)', 'Долги (мы)']];
      data.current.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(r => {
        const p = data.points.find(x => x.id === r.point_id);
        daysRows.push([r.date, p?.name || r.point_id, +r.total_day||0, +r.ins_day||0, +r.retail_day||0, +r.bookings||0, +r.debt_total||0, +r.owe_total||0]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(daysRows), 'По дням');

      if (data.expenses.length || data.taxes.length) {
        const expRows = [['Тип', 'Юрлицо', 'Категория', 'Сумма']];
        data.expenses.forEach(e => expRows.push(['Расход', e.entity_id, e.category, +e.amount||0]));
        data.taxes.forEach(t => expRows.push(['Налог', t.entity_id, t.tax_type, +t.amount||0]));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), 'Расходы и налоги');
      }

      if (data.directions.length) {
        const dirsRows = [['Период', 'Канал', 'СК', 'Точка', 'Поступило', 'Отозвано']];
        data.directions.forEach(d => {
          const ch = data.channels.find(c => c.id === d.channel_id);
          const co = data.companies.find(c => c.id === d.company_id);
          const p = data.points.find(x => x.id === d.point_id);
          dirsRows.push([d.period, ch?.name || '?', co?.name || '?', p?.name || '—', +d.incoming_count||0, +d.withdrawn_count||0]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dirsRows), 'Направления СК');
      }

      const fileName = `RG-Plaza_${monthName}_${data.range.year}.xlsx`;
      XLSX.writeFile(wb, fileName);
      showToast('✅ Файл скачан', 'ok');
    } catch (e) {
      console.error(e);
      showToast('Ошибка: '+(e.message||e), 'err');
    }
  }

  document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (sessionStorage.getItem('rgp_owner') === '1') enterApp();
</script>
</body>
</html>
