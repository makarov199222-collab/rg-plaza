        ${catLine}
        <div class="fn-rec-meta dim">${escapeHtml(r.car_model || '')}${r.plate ? ' · ' + escapeHtml(r.plate) : ''} · рек. ${escapeHtml(r.rec_number || '')}</div>
        ${action}
      </div>`;
    };

    let rowsHtml;
    if (!list.length) {
      rowsHtml = '<div class="fn-rec-empty">Пусто</div>';
    } else if (kind === 'needDocs') {
      // Документы группируем ПО ТОЧКАМ — чтобы не искать вперемешку.
      const groups = {}; // point_id → [recs]
      list.forEach(r => { const k = r.point_id || '_'; (groups[k] = groups[k] || []).push(r); });
      const order = points.map(p => p.id).filter(id => groups[id]); // порядок как точки города
      if (groups['_']) order.push('_');                              // нераспознанные — в конец
      rowsHtml = order.map(pid => {
        const pt = points.find(p => p.id === pid);
        const ptName = pt ? pt.name : 'Без точки';
        const recs = groups[pid];
        const sum = recs.reduce((s, r) => s + (+r.amount || 0), 0);
        return `<div class="fn-group-head">${escapeHtml(ptName)} <span class="fn-group-count">${recs.length} · ${fmt(sum)} ₽</span></div>`
          + recs.map(renderRec).join('');
      }).join('');
    } else {
      rowsHtml = list.map(renderRec).join('');
    }
    document.getElementById('fn-task-modal-title').textContent = title;
    document.getElementById('fn-task-modal-body').innerHTML = rowsHtml;
    document.getElementById('fn-task-modal').classList.add('show');
  }
  function closeFunnelTask() { document.getElementById('fn-task-modal').classList.remove('show'); }

  // ====== ПЕРЕВОД В «СЕРВИСНУЮ» (Этап 3) ======
  // Пишем service_confirmed_at = now() в insurance_recommendations.
  // НЕ трогаем r.stage — чтобы импорт файла не откатил перевод.
  // Локально обновляем recsData, чтобы не перезагружать всё.
  async function confirmServiceMass() {
    const f = funnelCompute();
    const list = f.toService;
    if (!list.length) { toast('Нечего переводить', 'ok'); return; }
    const nums = list.map(r => r.rec_number);
    const ok = confirm(
      `Подтвердить «Сервисную» для ${nums.length} рекомендаций?\n\n` +
      `Запишется service_confirmed_at = текущее время.\n` +
      `Стадия из файла (stage) не меняется — повторный импорт не откатит.\n` +
      `Действие обратимо (можно снять подтверждение).`
    );
    if (!ok) return;
    await writeServiceConfirm(nums, new Date().toISOString());
  }

  async function confirmServiceOne(recNumber) {
    const r = recsData.find(x => String(x.rec_number) === String(recNumber));
    if (!r) { toast('Запись не найдена', 'err'); return; }
    const ok = confirm(
      `Перевести в «Сервисную» рекомендацию ${recNumber}?\n` +
      `ЗН ${r.zn_number || '—'}. Запишется service_confirmed_at = сейчас.`
    );
    if (!ok) return;
    await writeServiceConfirm([recNumber], new Date().toISOString());
    showFunnelTask('toService'); // перерисуем список без закрытой записи
  }

  // Снять подтверждение: вернуть запись из «Сервисной» обратно к стадии из файла.
  async function unconfirmServiceOne(recNumber) {
    const r = recsData.find(x => String(x.rec_number) === String(recNumber));
    if (!r) { toast('Запись не найдена', 'err'); return; }
    const ok = confirm(
      `Снять подтверждение «Сервисной» у ${recNumber}?\n` +
      `service_confirmed_at очистится, стадия вернётся к «${r.stage}» (из файла).`
    );
    if (!ok) return;
    await writeServiceConfirm([recNumber], null);
    showFunnelTask('confirmed'); // перерисуем список подтверждённых
  }

  // value: ISO-строка для подтверждения, либо null для снятия.
  async function writeServiceConfirm(recNumbers, value) {
    if (!recNumbers || !recNumbers.length) return;
    setStatus('saving');
    try {
      const CHUNK = 200;
      let done = 0;
      for (let i = 0; i < recNumbers.length; i += CHUNK) {
        const part = recNumbers.slice(i, i + CHUNK);
        const { error } = await sb.from('insurance_recommendations')
          .update({ service_confirmed_at: value })
          .in('rec_number', part);
        if (error) throw error;
        done += part.length;
      }
      // Локально синхронизируем, чтобы воронка пересчиталась без полной перезагрузки.
      const set = new Set(recNumbers.map(String));
      recsData.forEach(r => { if (set.has(String(r.rec_number))) r.service_confirmed_at = value; });
      setStatus('saved');
      toast(value ? `✅ Переведено в Сервисную: ${done}` : `↩ Снято подтверждений: ${done}`, 'ok');
      render();
    } catch (e) {
      console.error('writeServiceConfirm:', e);
      setStatus('error');
      toast('Ошибка записи: ' + (e.message || e), 'err');
    }
  }

  function render() {
    const city = getCity();
    if (!channels.length) { document.getElementById('content').innerHTML = '<div class="empty">Нет активных каналов для этого города</div>'; return; }
    _recCountCache = null;       // сбрасываем кэш сверки — месяц/город могли смениться
    _equityCache = null;         // кэш каналов по payer — месяц/город могли смениться
    _companyRoots = null;        // справочник мог обновиться
    let html = renderFunnel();   // виджет воронки (направления) наверху #content
    html += `<div class="ch-section-lbl">Каналы · отгруженный страховой вал за ${escapeHtml(formatMonth())} (по плательщику)</div>`;
    html += '<div class="channels-grid">';
    if (city === 'moscow') {
      points.forEach(p => { channels.forEach(ch => { html += renderChannelCard(ch, p); }); });
    } else {
      channels.forEach(ch => { html += renderChannelCard(ch, null); });
    }
    html += '</div>';
    html += renderUnmatched();    // плашка «⚠ Проверь оформление»
    html += renderSummary();
    html += renderPointCompare(); // график-сравнение СК по направлениям — внизу
    document.getElementById('content').innerHTML = html;
    drawPointCompareChart();      // рисуем график после вставки в DOM
  }

  function getRecord(channelId, companyId, pointId) {
    return directionsData.find(d => d.channel_id === channelId && d.company_id === companyId && (pointId ? d.point_id === pointId : !d.point_id));
  }
  function getPrevRecord(channelId, companyId, pointId) {
    return prevMonthData.find(d => d.channel_id === channelId && d.company_id === companyId && (pointId ? d.point_id === pointId : !d.point_id));
  }
  function getRavtRecord(channelId, pointId) {
    return ravtData.find(r => r.channel_id === channelId && (pointId ? r.point_id === pointId : !r.point_id));
  }

  // График-сравнение СК по точкам (сгруппированные столбцы, Chart.js).
  // Показываем только если в городе ≥2 точек и есть направления.
  let pointCompareChart = null;
  function renderPointCompare() {
    if (!points || points.length < 2) return '';
    const hasData = companies.some(c => points.some(p => recCountByCompany(c.id, p.id).count > 0));
    if (!hasData) return '';
    const periodLbl = recFunnelMode === 'month' ? `за ${formatMonth()}` : 'всего';
    return `<div class="pc-block">
      <div class="pc-title">Сравнение СК по направлениям <span class="pc-sub">(воронка, ${escapeHtml(periodLbl)})</span></div>
      <div class="pc-chart-wrap"><canvas id="pc-chart"></canvas></div>
    </div>`;
  }

  function drawPointCompareChart() {
    if (pointCompareChart) { try { pointCompareChart.destroy(); } catch(e){} pointCompareChart = null; }
    const ctx = document.getElementById('pc-chart');
    if (!ctx || points.length < 2) return;

    // СК с направлениями, по убыванию суммы по всем точкам.
    const rows = companies.map(c => {
      const byPoint = points.map(p => recCountByCompany(c.id, p.id).count);
      return { name: c.name, byPoint, total: byPoint.reduce((s,n)=>s+n,0) };
    }).filter(r => r.total > 0).sort((a,b) => b.total - a.total);
    if (!rows.length) return;

    const labels = rows.map(r => r.name.length > 14 ? r.name.slice(0,13)+'…' : r.name);
    // Цвета точек: янтарь, синий, зелёный, фиолетовый (по числу точек).
    const palette = ['#e8b84b', '#2196f3', '#4caf50', '#9c6ade'];
    const datasets = points.map((p, i) => ({
      label: p.name,
      data: rows.map(r => r.byPoint[i]),
      backgroundColor: palette[i % palette.length],
      borderRadius: 4,
    }));

    pointCompareChart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#b8b8b8', font: { size: 12 }, usePointStyle: true } },
          tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.raw} напр.` } },
        },
        scales: {
          x: { ticks: { color: '#b8b8b8', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#909090', precision: 0 }, grid: { color: '#333' }, beginAtZero: true },
        },
      },
    });
  }

  // ====================================================================
  // КАНАЛЫ ПО ПЛАТЕЛЬЩИКУ (единый закон для Москвы и Ижевска)
  // ====================================================================
  // Источник: orders_history_1c (equity, status_1c='Отгружен') за выбранный
  // месяц по date_shipped. Разнесение по payer:
  //   • payer содержит «равт»               → бакет РАВТ
  //   • payer матчится со справочником СК    → бакет Локальные (по конкретной СК)
  //   • иначе (физлицо / не-СК / пусто)      → «⚠ Проверь оформление» (ошибка в 1С)
  // Почему по payer, а не по направлениям: по Ижевску направлений в
  // insurance_recommendations нет (0), а equity-отгрузок 4301 — payer чистый.
  // Метрика «отгруженный вал», привязка к date_shipped — как весь вал Ижевска.

  // Границы выбранного месяца для фильтра date_shipped: [start, nextStart).
  function periodBounds() {
    const [y, m] = getPeriod().split('-').map(Number);
    const start = `${y}-${String(m).padStart(2,'0')}-01`;
    const ny = m === 12 ? y + 1 : y;
    const nm = m === 12 ? 1 : m + 1;
    const next = `${ny}-${String(nm).padStart(2,'0')}-01`;
    return { start, next };
  }

  async function loadEquityChannels() {
    equityRows = [];
    _equityCache = null;
    try {
      const ids = points.map(p => p.id);
      if (!ids.length) return;
      const { start, next } = periodBounds();
      const PAGE = 1000;
      let from = 0, rows = [];
      for (;;) {
        const { data, error } = await sb
          .from('orders_history_1c')
          .select('zn_number, point_id, payer, amount, date_shipped')
          .eq('category', 'equity')
          .eq('status_1c', 'Отгружен')
          .in('point_id', ids)
          .gte('date_shipped', start)
          .lt('date_shipped', next)
          .range(from, from + PAGE - 1);
        if (error) throw error;
        const batch = data || [];
        rows = rows.concat(batch);
        if (batch.length < PAGE) break;
        from += PAGE;
        if (from > 50000) break; // предохранитель
      }
      equityRows = rows;
    } catch (e) {
      console.warn('loadEquityChannels:', e);
      equityRows = [];
    }
  }

  // payer → нормализованная строка (нижний регистр, только буквы) для матчинга.
  function payerNorm(s) { return recNorm(s); }
  function payerIsRavt(payer) { return payerNorm(payer).includes('равт'); }

  // Корни СК из справочника (активные), по убыванию длины — чтобы «Энергогарант МСК»
  // проверялся раньше «Энергогарант». Матчинг по вхождению: полное юр-имя в payer
  // («…ИНГОССТРАХ ПАО») содержит корень имени СК («ингосстрах»).
  let _companyRoots = null;
  function companyRoots() {
    if (_companyRoots) return _companyRoots;
    _companyRoots = companies
      .map(c => ({ id: c.id, name: c.name, root: payerNorm(c.name) }))
      .filter(c => c.root.length >= 2)
      .sort((a, b) => b.root.length - a.root.length);
    return _companyRoots;
  }
  // payer → company_id (только Локальные). РАВТ и непривязанные → null.
  function payerToCompanyId(payer) {
    if (payerIsRavt(payer)) return null;
    const n = payerNorm(payer);
    if (!n) return null;
    for (const c of companyRoots()) { if (n.includes(c.root)) return c.id; }
    return null;
  }

  // Сводим equityRows в кэш: по точкам и бакетам (ravt / company_id / unmatched).
  function buildEquityCache() {
    const cache = {
      ravt: {},        // pointId|'all' → {count, sum} — весь РАВТ-поток (итог карточки)
      ravtByCo: {},    // `${pointId}|${companyId}` и `all|${companyId}` → {count,sum} — РАВТ в разрезе реальной СК
      ravtNoSk: {},    // pointId|'all' → {count, sum} — РАВТ-ЗН без распознанной СК
      ravtSeen: {},    // pointId|'all' → Set(companyId) — какие СК были в РАВТ-потоке
      byCompany: {},   // `${pointId}|${companyId}` и `all|${companyId}` → {count, sum} — прямые от СК (Локальные)
      unmatched: {},   // pointId|'all' → [{payer, count, sum}] (агрегируем по payer)
      companiesSeen: {}, // pointId|'all' → Set(companyId) — какие СК встречались (Локальные)
    };
    // Карта: ЗН (точка+номер, 10 знаков) → реальная СК из направления.
    // Для РАВТ-потока 1С хранит плательщиком РАВТ, а страховщик — в направлении
    // (поле «Вид Заказ-наряда»). Поэтому СК тянем из insurance_recommendations по ЗН.
    const recCoByZn = new Map();
    recsData.forEach(r => {
      if (r.company_id && r.zn_number != null) recCoByZn.set(znKey(r.point_id, padZn(r.zn_number)), r.company_id);
    });

    const addRavt = (pid, amt) => {
      [pid, 'all'].forEach(k => {
        const e = cache.ravt[k] || (cache.ravt[k] = { count: 0, sum: 0 });
        e.count++; e.sum += amt;
      });
    };
    const addRavtCo = (pid, cid, amt) => {
      [`${pid}|${cid}`, `all|${cid}`].forEach(k => {
        const e = cache.ravtByCo[k] || (cache.ravtByCo[k] = { count: 0, sum: 0 });
        e.count++; e.sum += amt;
      });
      [pid, 'all'].forEach(k => { (cache.ravtSeen[k] || (cache.ravtSeen[k] = new Set())).add(cid); });
    };
    const addRavtNoSk = (pid, amt) => {
      [pid, 'all'].forEach(k => {
        const e = cache.ravtNoSk[k] || (cache.ravtNoSk[k] = { count: 0, sum: 0 });
        e.count++; e.sum += amt;
      });
    };
    const addCompany = (pid, cid, amt) => {
      [`${pid}|${cid}`, `all|${cid}`].forEach(k => {
        const e = cache.byCompany[k] || (cache.byCompany[k] = { count: 0, sum: 0 });
        e.count++; e.sum += amt;
      });
      [pid, 'all'].forEach(k => {
        const s = cache.companiesSeen[k] || (cache.companiesSeen[k] = new Set());
        s.add(cid);
      });
    };
    const addUnmatched = (pid, payer, amt) => {
      [pid, 'all'].forEach(k => {
        const list = cache.unmatched[k] || (cache.unmatched[k] = []);
        const label = (payer && String(payer).trim()) || '(пусто)';
        let row = list.find(r => r.payer === label);
        if (!row) { row = { payer: label, count: 0, sum: 0 }; list.push(row); }
        row.count++; row.sum += amt;
      });
    };
    equityRows.forEach(o => {
      const pid = o.point_id;
      if (!pid) return;
      const amt = +o.amount || 0;
      if (payerIsRavt(o.payer)) {
        addRavt(pid, amt);
        const cid = recCoByZn.get(znKey(pid, padZn(o.zn_number)));
        if (cid) addRavtCo(pid, cid, amt); else addRavtNoSk(pid, amt);
        return;
      }
      const cid = payerToCompanyId(o.payer);
      if (cid) addCompany(pid, cid, amt);
      else addUnmatched(pid, o.payer, amt);
    });
    _equityCache = cache;
  }
  function equityCache() { if (!_equityCache) buildEquityCache(); return _equityCache; }

  // pointId === null → агрегат по всему городу (ключ 'all').
  function eqKey(pointId) { return pointId == null ? 'all' : pointId; }
  function equityRavt(pointId) { return equityCache().ravt[eqKey(pointId)] || { count: 0, sum: 0 }; }
  function equityRavtByCompany(companyId, pointId) {
    return equityCache().ravtByCo[`${eqKey(pointId)}|${companyId}`] || { count: 0, sum: 0 };
  }
  function equityRavtSeen(pointId) { return equityCache().ravtSeen[eqKey(pointId)] || new Set(); }
  function equityRavtNoSk(pointId) { return equityCache().ravtNoSk[eqKey(pointId)] || { count: 0, sum: 0 }; }
  function equityCompany(companyId, pointId) {
    return equityCache().byCompany[`${eqKey(pointId)}|${companyId}`] || { count: 0, sum: 0 };
  }
  function equitySeen(pointId) { return equityCache().companiesSeen[eqKey(pointId)] || new Set(); }
  function equityUnmatched(pointId) {
    return (equityCache().unmatched[eqKey(pointId)] || []).slice().sort((a, b) => b.count - a.count);
  }

  // Тип канала по id/имени: РАВТ или Локальные (прямые СК).
  function channelKind(channel) {
    const id = String(channel.id || '').toLowerCase();
    const nm = payerNorm(channel.name);
    if (id.endsWith('_ravt') || nm === 'равт') return 'ravt';
    if (id.endsWith('_local') || nm.includes('локальн')) return 'local';
    return 'other';
  }

  function renderChannelCard(channel, point) {
    const cardKey = `${channel.id}__${point ? point.id : 'null'}`;
    const cityLabel = channel.city === 'moscow' ? 'Москва' : 'Ижевск';
    const subtitle = point ? point.name : cityLabel;
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    const headSumFmt = s => s >= 1000000
      ? `${(s/1000000).toFixed(1).replace('.',',')} млн ₽` : `${fmt(s)} ₽`;
    const kind = channelKind(channel);

    let totalCount = 0, totalSum = 0, listHtml = '';

    if (kind === 'ravt') {
      // РАВТ-карточка: поток через РАВТ (взаимозачёт). Плательщик — РАВТ, но реальный
      // страховщик берётся из направления (поле «Вид Заказ-наряда») по номеру ЗН.
      const e = equityRavt(point?.id);
      totalCount = e.count; totalSum = e.sum;
      if (e.count === 0) {
        listHtml = `<div class="cx-empty">Нет отгрузок за ${formatMonth()}</div>`;
      } else {
        const byCo = companies.map(c => {
          const x = equityRavtByCompany(c.id, point?.id);
          return { c, count: x.count, sum: x.sum };
        }).filter(x => x.count > 0).sort((a, b) => b.count - a.count || b.sum - a.sum);
        const noSk = equityRavtNoSk(point?.id);
        const rows = byCo.map(x => `<div class="cx-row">
            <div class="cx-num">${x.count}</div>
            <div class="cx-mid">
              <div class="cx-name">${escapeHtml(x.c.name)}</div>
              <div class="cx-meta"><span class="cx-sum">${fmt(x.sum)} ₽</span></div>
            </div>
          </div>`).join('');
        // ЗН без распознанной СК (направление не импортировано/нет «Вид Заказ-наряда»).
        const noSkRow = noSk.count > 0
          ? `<div class="cx-row">
              <div class="cx-num">${noSk.count}</div>
              <div class="cx-mid">
                <div class="cx-name" style="color:var(--muted);">СК не указана</div>
                <div class="cx-meta"><span class="cx-sum">${fmt(noSk.sum)} ₽</span> · нет направления в 1С</div>
              </div>
            </div>`
          : '';
        // Если ни одной СK не распозналось (направления Ижевска ещё не импортированы) —
        // показываем единой строкой, чтобы карточка не выглядела пустой.
        listHtml = (byCo.length || noSk.count)
          ? `${rows}${noSkRow}`
          : `<div class="cx-row">
              <div class="cx-num">${e.count}</div>
              <div class="cx-mid">
                <div class="cx-name">РАВТ (взаимозачёт)</div>
                <div class="cx-meta"><span class="cx-sum">${fmt(e.sum)} ₽</span> · импортируй направления для разбивки по СК</div>
              </div>
            </div>`;
      }
    } else if (kind === 'local') {
      // Локальные: разбивка по конкретным СК (прямые плательщики-страховые).
      const seen = equitySeen(point?.id);
      const all = companies.map(c => {
        const e = equityCompany(c.id, point?.id);
        return { c, count: e.count, sum: e.sum };
      });
      const active = all.filter(x => x.count > 0).sort((a, b) => b.count - a.count || b.sum - a.sum);
      const sleeping = all.filter(x => x.count === 0);
      active.forEach(x => { totalCount += x.count; totalSum += x.sum; });
      const rows = active.map(x => `<div class="cx-row">
          <div class="cx-num">${x.count}</div>
          <div class="cx-mid">
            <div class="cx-name">${escapeHtml(x.c.name)}</div>
            <div class="cx-meta"><span class="cx-sum">${fmt(x.sum)} ₽</span></div>
          </div>
        </div>`).join('');
      const sleepingRow = (active.length && sleeping.length)
        ? `<div class="cx-sleeping"><span class="cx-sleeping-lbl">Без отгрузок:</span> ${sleeping.map(x => escapeHtml(x.c.name)).join(', ')}</div>`
        : '';
      const emptyRow = active.length === 0
        ? `<div class="cx-empty">Нет отгрузок за ${formatMonth()}</div>` : '';
      listHtml = `${emptyRow}${rows}${sleepingRow}`;
    } else {
      // Прочие каналы (МОБИСКАР/АГ ЭКСПЕРТ и т.п.) — пока без источника, пусто.
      listHtml = `<div class="cx-empty">Канал без данных</div>`;
    }

    const fillClass = totalCount > 0 ? 'fill-full' : 'fill-empty';
    const fillBadge = totalCount > 0 ? `${totalCount} ЗН · ${headSumFmt(totalSum)}` : 'Нет отгрузок';

    // Сверка с РАВТ (ручной ввод) — только на РАВТ-карточке: сравниваем отгруженные
    // нами ЗН с числом, которое РАВТ показывает у себя.
    let ravtDetails = '';
    if (kind === 'ravt') {
      const ravtRec = getRavtRecord(channel.id, point?.id);
      const ravtTotal = ravtRec ? +ravtRec.ravt_total || 0 : 0;
      const diffHtml = renderRavtDiff(ravtTotal, totalCount);
      const ravtBody = `<div class="ck-ravt-row">
          <div class="ck-ravt-lbl">РАВТ показывает у себя:</div>
          <div class="ck-ravt-stepper ${ravtTotal > 0 ? 'has-value' : ''}" data-channel="${channel.id}" data-point="${point?.id || ''}" data-card="${cardKey}">
            <button class="stepper-btn" onpointerdown="ravtStepperDown(event,this,-1)" onpointerup="stepperUp(this)" onpointerleave="stepperUp(this)" onpointercancel="stepperUp(this)">−</button>
            <input class="stepper-val" type="text" inputmode="numeric" pattern="[0-9]*" value="${ravtTotal}" data-channel="${channel.id}" data-point="${point?.id || ''}" data-card="${cardKey}" onfocus="this.select()" oninput="onRavtDirectInput(this)" onblur="this.value = (+this.value || 0).toString()">
            <button class="stepper-btn" onpointerdown="ravtStepperDown(event,this,1)" onpointerup="stepperUp(this)" onpointerleave="stepperUp(this)" onpointercancel="stepperUp(this)">+</button>
          </div>
          <div class="ck-ravt-lbl">ЗН</div>
        </div>
        <div onclick="showRavtExplainer('${cardKey}')">${diffHtml}</div>`;
      ravtDetails = `<details class="ck-ravt-details" ${ravtTotal > 0 ? 'open' : ''}>
        <summary class="ck-ravt-summary">Сверка с данными РАВТ${ravtTotal > 0 ? ` · ${ravtTotal}` : ''}</summary>
        <div class="ck-ravt-inner">${ravtBody}</div>
      </details>`;
    }

    return `<div class="channel-card ${fillClass}" id="card-${cardKey}">
      <div class="channel-head">
        <div class="channel-name">${escapeHtml(channel.name)}</div>
        <div class="channel-pin">${escapeHtml(subtitle)}</div>
        <div class="channel-status-badge ${fillClass}">
          <div class="channel-led"></div>
          <span>${fillBadge}</span>
        </div>
      </div>
      <div class="cx-list">${listHtml}</div>
      <div class="cx-totals">
        <div class="cx-totals-num">${totalCount}</div>
        <div class="cx-totals-lbl">отгружено ЗН · ${headSumFmt(totalSum)}</div>
      </div>
      ${ravtDetails}
    </div>`;
  }

  function renderRavtDiff(ravtTotal, ourCount) {
    if (ravtTotal === 0) return `<span class="ck-diff empty">Введи число РАВТ для запуска сверки</span>`;
    const diff = ravtTotal - ourCount;
    if (diff === 0) return `<span class="ck-diff ok">Сходится: ${ourCount} = ${ravtTotal}</span>`;
    if (diff > 0) return `<span class="ck-diff warn">РАВТ показывает +${diff} (вероятно ещё в работе) · нажми для пояснения</span>`;
    return `<span class="ck-diff warn">У нас +${-diff} (возможно отзывы) · нажми для пояснения</span>`;
  }

  // Плашка «⚠ Проверь оформление»: equity-ЗН, где плательщик не РАВТ и не СК
  // (физлицо / не-СК / пусто) — ошибка оформления в 1С, менеджер чинит тип ЗН/плательщика.
  function renderUnmatched() {
    const list = equityUnmatched(null); // по всему городу
    if (!list.length) return '';
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    const totalCount = list.reduce((s, r) => s + r.count, 0);
    const rows = list.slice(0, 30).map(r => `<div class="unm-row">
        <span class="unm-payer">${escapeHtml(r.payer)}</span>
        <span class="unm-meta">${r.count} ЗН · ${fmt(r.sum)} ₽</span>
      </div>`).join('');
    const more = list.length > 30 ? `<div class="unm-more">…и ещё ${list.length - 30}</div>` : '';
    return `<div class="unm-block">
      <div class="unm-title">⚠ Проверь оформление · ${totalCount} ЗН</div>
      <div class="unm-sub">Страховые ЗН, где плательщик — физлицо или не страховая. Скорее всего неверный тип ЗН или плательщик в 1С — поправь, и они уйдут в нужный канал.</div>
      <div class="unm-list">${rows}${more}</div>
    </div>`;
  }

  function renderSummary() {
    // Сводка по ОТГРУЖЕННОМУ equity-валу за месяц (тот же источник, что карточки).
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    const rav = equityRavt(null);
    // Локальные: сумма по всем СК города.
    let localCount = 0, localSum = 0;
    companies.forEach(c => { const e = equityCompany(c.id, null); localCount += e.count; localSum += e.sum; });
    const unm = equityUnmatched(null);
    const unmCount = unm.reduce((s, r) => s + r.count, 0);
    const totalCount = rav.count + localCount + unmCount;
    const totalSum = rav.sum + localSum + unm.reduce((s, r) => s + r.sum, 0);

    // Ручная сверка с РАВТ (если введена) — сравниваем с отгруженным РАВТ-валом.
    let totalRavt = 0;
    ravtData.forEach(r => { totalRavt += +r.ravt_total || 0; });

    return `<div class="summary-block">
      <div class="summary-title">Отгружено за ${formatMonth()}</div>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-item-lbl">Всего ЗН</div>
          <div class="summary-item-val">${totalCount}</div>
          <div class="summary-item-sub">${fmt(totalSum)} ₽</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-lbl">РАВТ</div>
          <div class="summary-item-val b">${rav.count}</div>
          <div class="summary-item-sub">${fmt(rav.sum)} ₽</div>
        </div>
        <div class="summary-item">
          <div class="summary-item-lbl">Локальные (СК)</div>
          <div class="summary-item-val g">${localCount}</div>
          <div class="summary-item-sub">${fmt(localSum)} ₽</div>
        </div>
        ${unmCount ? `<div class="summary-item">
          <div class="summary-item-lbl">Проверь оформление</div>
          <div class="summary-item-val r">${unmCount}</div>
          <div class="summary-item-sub down">ошибки в 1С</div>
        </div>` : ''}
        ${totalRavt ? `<div class="summary-item">
          <div class="summary-item-lbl">РАВТ показывает</div>
          <div class="summary-item-val b">${totalRavt}</div>
          ${totalRavt - rav.count > 0 ? `<div class="summary-item-sub down">+${totalRavt - rav.count} у РАВТ</div>` : ''}
        </div>` : ''}
      </div>
    </div>`;
  }

  function formatMonth() {
    const [y, m] = getPeriod().split('-');
    const mn = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    return `${mn[+m - 1]} ${y}`;
  }

  // ============ STEPPER ============
  let stepperHoldInterval = null;
  let stepperHoldTimeout = null;
  let stepperAccel = 0;

  function stepperDown(event, btn, delta) {
    event.preventDefault();
    const stepperEl = btn.closest('.stepper');
    const inputEl = stepperEl.querySelector('.stepper-val');
    haptic(8);
    applyStepperChange(stepperEl, inputEl, delta, 1);
    stepperAccel = 0;
    stepperHoldTimeout = setTimeout(() => {
      stepperHoldInterval = setInterval(() => {
        stepperAccel++;
        const step = stepperAccel < 5 ? 1 : (stepperAccel < 12 ? 5 : 10);
        applyStepperChange(stepperEl, inputEl, delta, step);
        haptic(5);
      }, 120);
    }, 500);
  }
  function ravtStepperDown(event, btn, delta) {
    event.preventDefault();
    const stepperEl = btn.closest('.ck-ravt-stepper');
    const inputEl = stepperEl.querySelector('.stepper-val');
    haptic(8);
    applyRavtChange(stepperEl, inputEl, delta, 1);
    stepperAccel = 0;
    stepperHoldTimeout = setTimeout(() => {
      stepperHoldInterval = setInterval(() => {
        stepperAccel++;
        const step = stepperAccel < 5 ? 1 : (stepperAccel < 12 ? 5 : 10);
        applyRavtChange(stepperEl, inputEl, delta, step);
        haptic(5);
      }, 120);
    }, 500);
  }
  function stepperUp(btn) {
    if (stepperHoldTimeout) { clearTimeout(stepperHoldTimeout); stepperHoldTimeout = null; }
    if (stepperHoldInterval) { clearInterval(stepperHoldInterval); stepperHoldInterval = null; }
    stepperAccel = 0;
  }

  function applyStepperChange(stepperEl, inputEl, delta, step) {
    let v = (+inputEl.value || 0) + (delta * step);
    if (v < 0) v = 0;
    inputEl.value = v;
    if (v > 0) stepperEl.classList.add('has-value'); else stepperEl.classList.remove('has-value');
    const channelId = stepperEl.dataset.channel;
    const companyId = stepperEl.dataset.company;
    const pointId = stepperEl.dataset.point || null;
    const field = stepperEl.dataset.field;
    const cardKey = stepperEl.dataset.card;
    updateLocalRecord(channelId, companyId, pointId, field, v);
    refreshCardTotals(cardKey, channelId, pointId);
    refreshSummary();
    queueSave('direction', { channelId, companyId, pointId, cardKey });
  }

  function applyRavtChange(stepperEl, inputEl, delta, step) {
    let v = (+inputEl.value || 0) + (delta * step);
    if (v < 0) v = 0;
    inputEl.value = v;
    if (v > 0) stepperEl.classList.add('has-value'); else stepperEl.classList.remove('has-value');
    const channelId = stepperEl.dataset.channel;
    const pointId = stepperEl.dataset.point || null;
    const cardKey = stepperEl.dataset.card;
    updateLocalRavt(channelId, pointId, v);
    refreshCardTotals(cardKey, channelId, pointId);
    refreshSummary();
    queueSave('ravt', { channelId, pointId, value: v, cardKey });
  }

  function onDirectInput(input) {
    const v = Math.max(0, +input.value || 0);
    const stepperEl = input.closest('.stepper');
    if (v > 0) stepperEl.classList.add('has-value'); else stepperEl.classList.remove('has-value');
    const channelId = input.dataset.channel;
    const companyId = input.dataset.company;
    const pointId = input.dataset.point || null;
    const field = input.dataset.field;
    const cardKey = input.dataset.card;
    updateLocalRecord(channelId, companyId, pointId, field, v);
    refreshCardTotals(cardKey, channelId, pointId);
    refreshSummary();
    queueSave('direction', { channelId, companyId, pointId, cardKey });
  }

  function onRavtDirectInput(input) {
    const v = Math.max(0, +input.value || 0);
    const stepperEl = input.closest('.ck-ravt-stepper');
    if (v > 0) stepperEl.classList.add('has-value'); else stepperEl.classList.remove('has-value');
    const channelId = input.dataset.channel;
    const pointId = input.dataset.point || null;
    const cardKey = input.dataset.card;
    updateLocalRavt(channelId, pointId, v);
    refreshCardTotals(cardKey, channelId, pointId);
    refreshSummary();
    queueSave('ravt', { channelId, pointId, value: v, cardKey });
  }

  function updateLocalRecord(channelId, companyId, pointId, field, value) {
    const period = getPeriod();
    let rec = getRecord(channelId, companyId, pointId);
    if (!rec) { rec = { period, channel_id: channelId, company_id: companyId, point_id: pointId, incoming_count: 0, withdrawn_count: 0 }; directionsData.push(rec); }
    rec[field] = value;
  }
  function updateLocalRavt(channelId, pointId, value) {
    const period = getPeriod();
    let rec = getRavtRecord(channelId, pointId);
    if (!rec) { rec = { period, channel_id: channelId, point_id: pointId, ravt_total: 0 }; ravtData.push(rec); }
    rec.ravt_total = value;
  }

  function refreshCardTotals(cardKey, channelId, pointId) {
    // После ручного ввода числа РАВТ обновляем ТОЛЬКО строку сверки на РАВТ-карточке.
    // Бейдж и итоги карточки — отгруженный вал (date_shipped), от ручного РАВТ
    // не зависят, поэтому их не трогаем (раньше тут пересчитывались направления).
    const card = document.getElementById('card-' + cardKey);
    if (!card) return;
    const pid = pointId || null;
    const ravtRec = getRavtRecord(channelId, pid);
    const ravtTotal = ravtRec ? +ravtRec.ravt_total || 0 : 0;
    const ourCount = equityRavt(pid).count; // отгружено нами по РАВТ за месяц
    const diffEl = card.querySelector('.ck-diff');
    if (diffEl) {
      const tmp = document.createElement('div');
      tmp.innerHTML = renderRavtDiff(ravtTotal, ourCount);
      const newEl = tmp.firstElementChild;
      if (newEl) { diffEl.className = newEl.className; diffEl.textContent = newEl.textContent; }
    }
  }

  function refreshSummary() {
    const summaryEl = document.querySelector('.summary-block');
    if (!summaryEl) return;
    summaryEl.outerHTML = renderSummary();
  }

  function queueSave(type, data) {
    pendingSaves++;
    setStatus('saving');
    const key = type === 'direction'
      ? `dir_${data.channelId}_${data.companyId}_${data.pointId || 'null'}`
      : `ravt_${data.channelId}_${data.pointId || 'null'}`;
    saveQueue.set(key, { type, data });
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(processSaveQueue, 600);
  }

  async function processSaveQueue() {
    if (saveQueue.size === 0) { setStatus(pendingSaves > 0 ? 'saving' : 'saved'); return; }
    const items = Array.from(saveQueue.entries());
    saveQueue.clear();
    for (const [key, item] of items) {
      try {
        if (item.type === 'direction') await saveDirection(item.data);
        else await saveRavt(item.data);
        pendingSaves = Math.max(0, pendingSaves - 1);
      } catch (e) {
        console.error('Save error:', e);
        pendingSaves = Math.max(0, pendingSaves - 1);
        setStatus('error');
        toast('Ошибка сохранения. Повторим', 'err');
        saveQueue.set(key, item);
        setTimeout(processSaveQueue, 3000);
        return;
      }
    }
    setStatus(pendingSaves > 0 ? 'saving' : 'saved');
  }

  // ====== АВТОЗАПОЛНЕНИЕ «Поступило» ИЗ 1С (рекомендаций) ======
  // Данные 1С считаем вернее ручных. Перед записью показываем предпросмотр
  // (было → станет по каждой СК) и ждём подтверждения. Бэкап ручных данных
  // сделан в insurance_directions_backup_20260526.
  async function fillFrom1C(channelId, pointIdRaw) {
    const pointId = pointIdRaw || null;
    // Собираем расхождения: где ручная цифра не равна числу рекомендаций.
    const changes = [];
    companies.forEach(c => {
      const rc = recCountByCompany(c.id, pointId).count;
      if (rc <= 0) return;
      const cur = +(getRecord(channelId, c.id, pointId)?.incoming_count || 0);
      if (cur !== rc) changes.push({ company: c, from: cur, to: rc });
    });
    if (!changes.length) { toast('Всё уже совпадает с 1С', 'ok'); return; }

    // Предпросмотр изменений в окне подтверждения.
    const lines = changes.map(ch => `• ${ch.company.name}: ${ch.from} → ${ch.to}`).join('\n');
    const ok = confirm(
      `Заполнить «Поступило» из 1С? Изменится ${changes.length} строк:\n\n` +
      lines +
      `\n\nРучные значения перезапишутся данными 1С (они вернее).\n` +
      `Бэкап сохранён, откат возможен.`
    );
    if (!ok) return;

    // Пишем через тот же механизм, что и ручной ввод: локально + очередь сохранения.
    changes.forEach(ch => {
      updateLocalRecord(channelId, ch.company.id, pointId, 'incoming_count', ch.to);
      queueSave('direction', { channelId, companyId: ch.company.id, pointId });
    });
    toast(`Заполнено из 1С: ${changes.length}`, 'ok');
    render(); // перерисуем карточки с новыми цифрами
  }

  async function saveDirection({ channelId, companyId, pointId }) {
    const period = getPeriod();
    const rec = getRecord(channelId, companyId, pointId);
    const payload = {
      period, channel_id: channelId, company_id: companyId,
      point_id: pointId || null,
      incoming_count: rec?.incoming_count || 0,
      withdrawn_count: rec?.withdrawn_count || 0,
      amount: 0,
      updated_at: new Date().toISOString()
    };
    const { error } = await sb.from('insurance_directions').upsert(payload, { onConflict: 'period,channel_id,company_id,point_id' });
    if (error) throw error;
  }
  async function saveRavt({ channelId, pointId, value }) {
    const period = getPeriod();
    const payload = {
      period, channel_id: channelId, point_id: pointId || null,
      ravt_total: value, updated_at: new Date().toISOString()
    };
    const { error } = await sb.from('insurance_ravt_check').upsert(payload, { onConflict: 'period,channel_id,point_id' });
    if (error) throw error;
  }

  function showRavtExplainer(cardKey) {
    const card = document.getElementById('card-' + cardKey);
    if (!card) return;
    const stepper = card.querySelector('.ck-ravt-stepper');
    const channelId = stepper.dataset.channel;
    const pointId = stepper.dataset.point || null;
    let totalInc = 0;
    companies.forEach(c => { const r = getRecord(channelId, c.id, pointId); if (r) totalInc += +r.incoming_count || 0; });
    const ravtRec = getRavtRecord(channelId, pointId);
    const ravtTotal = ravtRec ? +ravtRec.ravt_total || 0 : 0;
    const diff = ravtTotal - totalInc;
    if (ravtTotal === 0) return;
    let title, text;
    if (diff === 0) {
      title = 'Сверка пройдена';
      text = `<b>Учёт совпадает с РАВТ</b>. И у вас, и в их системе зарегистрировано <b>${totalInc}</b> направлений за этот период.`;
    } else if (diff > 0) {
      title = 'Задержка фиксации';
      text = `РАВТ показывает <b>${ravtTotal}</b> направлений, у нас зафиксировано <b>${totalInc}</b>. Расхождение: <b>${diff}</b>.<br><br>Это <b>нормальная ситуация</b> и обычно <b>не означает потерю</b>. РАВТ показывает направление в момент выдачи, а мы регистрируем его только когда:<ul><li>Клиент позвонил и записался</li><li>Передан на закупку стекла</li><li>Приняты документы</li></ul>Поэтому "хвост" в РАВТ — это направления <b>в работе</b>: ещё не дозвонились, не приехали или ждут стекло.<br><br>Если расхождение растёт месяц от месяца — стоит проверить, не теряются ли клиенты на этапе первого касания.`;
    } else {
      title = 'У нас больше чем у РАВТ';
      text = `У нас зафиксировано <b>${totalInc}</b> направлений, у РАВТ <b>${ravtTotal}</b>. Превышение: <b>${-diff}</b>.<br><br>Это нормально если есть отзывы (РАВТ их вычитает). Также возможно:<ul><li>Двойной учёт (один клиент = два направления)</li><li>Внутренние правки на стороне РАВТ</li><li>Прямые направления от СК учли как РАВТ</li></ul>`;
    }
    document.getElementById('explainer-title').textContent = title;
    document.getElementById('explainer-text').innerHTML = text;
    document.getElementById('explainer-overlay').classList.add('show');
  }
  function closeExplainer(event) {
    if (event && event.target.classList.contains('explainer')) return;
    if (event && event.target.closest('.explainer') && !event.target.classList.contains('explainer-close')) return;
    document.getElementById('explainer-overlay').classList.remove('show');
  }

  let pullStartY = 0, pullDist = 0, pullActive = false;
  function setupPullToRefresh() {
    const el = document.body;
    el.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0 && e.touches.length === 1) {
        pullStartY = e.touches[0].clientY; pullActive = true;
      }
    }, { passive: true });
    el.addEventListener('touchmove', (e) => {
      if (!pullActive) return;
      pullDist = e.touches[0].clientY - pullStartY;
      if (pullDist > 0 && window.scrollY === 0) {
        const ind = document.getElementById('pull-ind');
        if (pullDist > 60) {
          ind.classList.add('show', 'releasing');
          document.getElementById('pull-text').textContent = 'Отпусти для обновления';
        } else if (pullDist > 20) {
          ind.classList.add('show'); ind.classList.remove('releasing');
          document.getElementById('pull-text').textContent = 'Потяни для обновления';
        }
      }
    }, { passive: true });
    el.addEventListener('touchend', () => {
      if (!pullActive) return;
      const ind = document.getElementById('pull-ind');
      if (pullDist > 60) {
        ind.classList.add('refreshing');
        document.getElementById('pull-text').textContent = 'Обновляю...';
        haptic(15);
        loadAll().then(() => { ind.classList.remove('show', 'refreshing', 'releasing'); });
      } else { ind.classList.remove('show', 'releasing'); }
      pullActive = false; pullDist = 0;
    });
  }

  (function init() {
    if (sessionStorage.getItem('rgp_insmgr') === '1') enterApp();
    else document.getElementById('login-code').focus();
    document.getElementById('login-code').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeExplainer(); });
  })();

  // ====================================================================
  // РЕЖИМ ГОДА — аналитика по всем месяцам года
  // ====================================================================
  let currentMode = 'month';
  let yearCharts = [];
  let yearChannelFilter = 'all';   // 'all', 'РАВТ', 'Локальные'
  let yearRawData = null;           // сохраняем для перерисовки при смене фильтра

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('mode-month-btn').classList.toggle('active', mode === 'month');
    document.getElementById('mode-year-btn').classList.toggle('active', mode === 'year');
    document.getElementById('mode-month-content').style.display = mode === 'month' ? 'block' : 'none';
    document.getElementById('mode-year-content').style.display = mode === 'year' ? 'block' : 'none';
    haptic(10);
    if (mode === 'year') loadYearData();
  }

  async function loadYearData() {
    const city = getCity();
    const [y] = mpGetCurrent();
    const yearStart = `${y}-01`;
    const yearEnd = `${y}-12`;

    const channelIdsForCity = channels.map(c => c.id);
    if (channelIdsForCity.length === 0) {
      document.getElementById('year-content').innerHTML = '<div class="empty">Нет активных каналов</div>';
      return;
    }

    document.getElementById('year-content').innerHTML = '<div class="loader"><div class="spinner"></div>Загружаю...</div>';

    try {
      const { data: dirs } = await sb.from('insurance_directions')
        .select('*')
        .gte('period', yearStart).lte('period', yearEnd)
        .in('channel_id', channelIdsForCity);
      const { data: ravt } = await sb.from('insurance_ravt_check')
        .select('*')
        .gte('period', yearStart).lte('period', yearEnd)
        .in('channel_id', channelIdsForCity);

      yearRawData = { dirs: dirs || [], ravt: ravt || [], year: y, city };
      renderYear();
    } catch (e) {
      document.getElementById('year-content').innerHTML = `<div class="empty">⚠ Ошибка: ${e.message || e}</div>`;
    }
  }

  function setYearChannelFilter(filter) {
    yearChannelFilter = filter;
    renderYear();
  }

  function renderYear() {
    if (!yearRawData) return;
    let { dirs, ravt, year, city } = yearRawData;

    yearCharts.forEach(c => { try{c.destroy();}catch(e){} });
    yearCharts = [];

    // Фильтруем по выбранному каналу
    const availableChannels = [...new Set(channels.map(c => c.name))]; // ['РАВТ', 'Локальные']
    if (yearChannelFilter !== 'all') {
      const allowedChannelIds = channels.filter(c => c.name === yearChannelFilter).map(c => c.id);
      dirs = dirs.filter(d => allowedChannelIds.includes(d.channel_id));
    }

    const months = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

    // Агрегируем по месяцам
    const monthly = {};
    for (let m = 1; m <= 12; m++) {
      const period = `${year}-${String(m).padStart(2,'0')}`;
      monthly[period] = { incoming: 0, withdrawn: 0, byCompany: {}, byChannel: {} };
    }

    dirs.forEach(d => {
      if (!monthly[d.period]) return;
      monthly[d.period].incoming += +d.incoming_count || 0;
      monthly[d.period].withdrawn += +d.withdrawn_count || 0;
      const compId = d.company_id;
      monthly[d.period].byCompany[compId] = (monthly[d.period].byCompany[compId] || 0) + (+d.incoming_count || 0);
      monthly[d.period].byChannel[d.channel_id] = (monthly[d.period].byChannel[d.channel_id] || 0) + (+d.incoming_count || 0);
    });

    // Подсчёты
    const periods = Object.keys(monthly).sort();
    const totalsByMonth = periods.map(p => monthly[p].incoming);
    const yearTotal = totalsByMonth.reduce((a,b) => a + b, 0);
    const monthsWithData = totalsByMonth.filter(t => t > 0).length;
    const avgPerMonth = monthsWithData > 0 ? yearTotal / monthsWithData : 0;
    const bestMonthIdx = totalsByMonth.indexOf(Math.max(...totalsByMonth));
    const worstMonthIdx = totalsByMonth.map((v,i) => v > 0 ? v : Infinity).indexOf(Math.min(...totalsByMonth.filter(t => t > 0)));

    // Топ-СК за год
    const yearByCompany = {};
    dirs.forEach(d => {
      const compId = d.company_id;
      yearByCompany[compId] = (yearByCompany[compId] || 0) + (+d.incoming_count || 0);
    });
    const topCompanies = Object.entries(yearByCompany)
      .map(([id, count]) => ({ id, count, name: companies.find(c => c.id === id)?.name || id }))
      .filter(x => x.count > 0)
      .sort((a,b) => b.count - a.count);

    // === Алерты ===
    const alerts = [];

    // 1. Падение месяц-к-месяцу > 30%
    for (let i = 1; i < 12; i++) {
      const prev = totalsByMonth[i-1];
      const curr = totalsByMonth[i];
      if (prev > 5 && curr > 0 && curr < prev * 0.7) {
        const drop = Math.round((1 - curr/prev) * 100);
        alerts.push({ type:'red', icon:'📉', text: `<b>${months[i]} ${year}</b> — падение на ${drop}% к ${months[i-1]} (${prev} → ${curr} направлений)` });
      }
    }

    // 2. Прогноз — если текущий месяц на середине идёт ниже среднего × 60%
    const now = new Date();
    if (now.getFullYear() === year) {
      const currMonthIdx = now.getMonth();
      const currMonthVal = totalsByMonth[currMonthIdx];
      const dayOfMonth = now.getDate();
      const daysInMonth = new Date(year, currMonthIdx+1, 0).getDate();
      const monthProgress = dayOfMonth / daysInMonth;
      if (monthProgress > 0.3 && currMonthVal > 0 && avgPerMonth > 5) {
        const projected = currMonthVal / monthProgress;
        if (projected < avgPerMonth * 0.7) {
          const drop = Math.round((1 - projected/avgPerMonth) * 100);
          alerts.push({ type:'orange', icon:'⚠️', text: `<b>Прогноз ${months[currMonthIdx]}</b>: при текущей скорости будет ~${Math.round(projected)} направлений — на ${drop}% ниже среднего по году (${Math.round(avgPerMonth)})` });
        }
      }
    }

    // 3. Замирание Локальных каналов (только Иж локалка)
    if (city === 'izhevsk') {
      const localChannels = channels.filter(c => c.name === 'Локальные');
      localChannels.forEach(ch => {
        let lastWithData = -1;
        for (let i = 0; i < 12; i++) {
          const period = periods[i];
          if ((monthly[period].byChannel[ch.id] || 0) > 0) lastWithData = i;
        }
        const currMonthIdx = (now.getFullYear() === year) ? now.getMonth() : 11;
        if (lastWithData >= 0 && lastWithData < currMonthIdx - 1) {
          const monthsAgo = currMonthIdx - lastWithData;
          alerts.push({ type:'red', icon:'💤', text: `<b>Локальный канал "${escapeHtml(ch.name)}"</b> молчит уже ${monthsAgo} мес. Последняя активность: ${months[lastWithData]} ${year}` });
        }
      });
    }

    // 4. Лидер роста
    if (topCompanies.length >= 2) {
      const top = topCompanies[0];
      alerts.push({ type:'green', icon:'🏆', text: `<b>Лидер года</b>: ${escapeHtml(top.name)} — ${top.count} направлений (${Math.round(top.count/yearTotal*100)}% от общего)` });
    }

    // === HTML ===
    const cityLabel = city === 'moscow' ? 'Москва' : 'Ижевск';

    // Подсчёт по каналам для пилюль (используем ВСЕ данные, не отфильтрованные)
    const allDirs = yearRawData.dirs;
    const channelCounts = { all: 0 };
    availableChannels.forEach(ch => channelCounts[ch] = 0);
    allDirs.forEach(d => {
      const ch = channels.find(c => c.id === d.channel_id);
      if (!ch) return;
      const v = +d.incoming_count || 0;
      channelCounts.all += v;
      channelCounts[ch.name] = (channelCounts[ch.name] || 0) + v;
    });

    let pillsHtml = '';
    if (availableChannels.length > 1) {
      pillsHtml = `<div class="year-channel-pills">
        <button class="year-pill ${yearChannelFilter==='all'?'active':''}" onclick="setYearChannelFilter('all')">
          Все каналы<span class="year-pill-count">${channelCounts.all}</span>
        </button>`;
      availableChannels.forEach(chName => {
        const icon = chName === 'РАВТ' ? '🔗' : '📍';
        pillsHtml += `<button class="year-pill ${yearChannelFilter===chName?'active':''}" onclick="setYearChannelFilter('${escapeHtml(chName)}')">
          ${icon} ${escapeHtml(chName)}<span class="year-pill-count">${channelCounts[chName] || 0}</span>
        </button>`;
      });
      pillsHtml += `</div>`;
    }

    const filterLabel = yearChannelFilter === 'all' ? '' : ` · ${escapeHtml(yearChannelFilter)}`;

    let html = `
      <div class="year-section">
        <div class="year-title">📊 Аналитика ${year} · ${cityLabel}${filterLabel}</div>
      </div>

      ${pillsHtml}

      <div class="year-kpi-grid">
        <div class="year-kpi acc">
          <div class="year-kpi-lbl">Всего за год</div>
          <div class="year-kpi-val">${yearTotal}</div>
          <div class="year-kpi-sub">направлений</div>
        </div>
        <div class="year-kpi">
          <div class="year-kpi-lbl">Среднее в месяц</div>
          <div class="year-kpi-val t">${Math.round(avgPerMonth)}</div>
          <div class="year-kpi-sub">по ${monthsWithData} мес. с данными</div>
        </div>
        <div class="year-kpi">
          <div class="year-kpi-lbl">Лучший месяц</div>
          <div class="year-kpi-val b">${totalsByMonth[bestMonthIdx]}</div>
          <div class="year-kpi-sub">${months[bestMonthIdx]} ${year}</div>
        </div>
        <div class="year-kpi">
          <div class="year-kpi-lbl">Худший месяц (с данными)</div>
          <div class="year-kpi-val r">${totalsByMonth[worstMonthIdx] || 0}</div>
          <div class="year-kpi-sub">${months[worstMonthIdx] || '—'} ${year}</div>
        </div>
      </div>`;

    // Алерты
    if (alerts.length) {
      html += `<div class="year-alerts">`;
      alerts.forEach(a => {
        html += `<div class="year-alert ${a.type}"><div class="year-alert-icon">${a.icon}</div><div class="year-alert-text">${a.text}</div></div>`;
      });
      html += `</div>`;
    }

    // График по месяцам
    html += `
      <div class="year-chart-block">
        <div class="year-chart-title">📈 Динамика по месяцам</div>
        <div class="year-chart-wrap"><canvas id="ch-year-monthly"></canvas></div>
      </div>`;

    // Топ-СК
    if (topCompanies.length) {
      html += `
      <div class="year-chart-block">
        <div class="year-chart-title">🏆 Топ страховых компаний за год</div>
        <div class="year-chart-wrap"><canvas id="ch-year-top"></canvas></div>
      </div>`;
    }

    // Таблица СК × месяцы
    if (topCompanies.length) {
      // Формирователь дельты к предыдущему месяцу
      // prev=undefined (нет данных за прошлый месяц) → ничего не показывать
      // prev>0, curr=0 → "ушла" (gone)
      // prev=0, curr>0 → "NEW" (new)
      // ±5% порог для flat
      const formatDelta = (curr, prev) => {
        if (prev === undefined || prev === null) return '';
        if (prev === 0 && curr === 0) return '';
        if (prev === 0 && curr > 0) return `<span class="delta new">↑ NEW</span>`;
        if (prev > 0 && curr === 0) return `<span class="delta gone">↓ ушла</span>`;
        const diff = curr - prev;
        const pct = Math.round((diff / prev) * 100);
        if (Math.abs(pct) < 5) return `<span class="delta flat">→</span>`;
        const arrow = pct > 0 ? '↑' : '↓';
        const cls = pct > 0 ? 'up' : 'down';
        const sign = pct > 0 ? '+' : '';
        return `<span class="delta ${cls}">${arrow}${sign}${pct}%</span>`;
      };

      // Хелпер для рендера одной таблицы по подмножеству direction-записей
      const renderCompanyTable = (subDirs, titleSuffix = '') => {
        // Считаем агрегаты по только этим записям
        const byMonthCompany = {};
        const byYearCompany = {};
        for (let m = 1; m <= 12; m++) {
          byMonthCompany[`${year}-${String(m).padStart(2,'0')}`] = {};
        }
        subDirs.forEach(d => {
          if (!byMonthCompany[d.period]) return;
          const cid = d.company_id;
          byMonthCompany[d.period][cid] = (byMonthCompany[d.period][cid] || 0) + (+d.incoming_count || 0);
          byYearCompany[cid] = (byYearCompany[cid] || 0) + (+d.incoming_count || 0);
        });
        const localTop = Object.entries(byYearCompany)
          .map(([id, count]) => ({ id, count, name: companies.find(c => c.id === id)?.name || id }))
          .filter(x => x.count > 0)
          .sort((a,b) => b.count - a.count);
        if (!localTop.length) return '';

        let t = `<div class="year-table" style="margin-top:18px;">
          <div style="font-family:var(--font-display);font-size:14px;color:var(--accent);letter-spacing:1.5px;margin-bottom:11px;">📋 По компаниям и месяцам${titleSuffix}</div>`;
        t += `<div class="year-table-grid">`;
        t += `<div class="year-table-cell head label">СК</div>`;
        months.forEach(m => t += `<div class="year-table-cell head">${m}</div>`);
        t += `<div class="year-table-cell head">Год</div>`;
        localTop.slice(0, 16).forEach(comp => {
          t += `<div class="year-table-cell label">${escapeHtml(comp.name)}</div>`;
          for (let m = 1; m <= 12; m++) {
            const period = `${year}-${String(m).padStart(2,'0')}`;
            const v = byMonthCompany[period][comp.id] || 0;
            // Дельта к прошлому месяцу — показываем только начиная со 2-го месяца
            // и только если в обоих месяцах есть хоть какие-то данные по точке
            // (иначе если месяц вообще не отчитан — не маркируем "ушла")
            let deltaHtml = '';
            if (m > 1) {
              const prevPeriod = `${year}-${String(m-1).padStart(2,'0')}`;
              // Был ли вообще трафик за прошлый месяц у любой СК?
              const prevMonthHasData = Object.values(byMonthCompany[prevPeriod] || {}).some(x => x > 0);
              const currMonthHasData = Object.values(byMonthCompany[period] || {}).some(x => x > 0);
              if (prevMonthHasData && currMonthHasData) {
                const prevV = byMonthCompany[prevPeriod][comp.id] || 0;
                deltaHtml = formatDelta(v, prevV);
              }
            }
            t += `<div class="year-table-cell ${v === 0 ? 'zero' : ''}">
              <span class="num">${v || '—'}</span>${deltaHtml}
            </div>`;
          }
          t += `<div class="year-table-cell total">${comp.count}</div>`;
        });
        t += `</div></div>`;
        return t;
      };

      if (yearChannelFilter === 'all' && (availableChannels.length > 1 || points.length > 1)) {
        // Режим "Все" — показываем матрицу (точка × канал)
        // Порядок: для каждой точки — все её каналы
        points.forEach(pt => {
          availableChannels.forEach(chName => {
            const allowedIds = channels.filter(c => c.name === chName).map(c => c.id);
            const sub = dirs.filter(d =>
              allowedIds.includes(d.channel_id) &&
              d.point_id === pt.id
            );
            if (!sub.length) return;
            // Заголовок: "Калужская" или "Совхозная · РАВТ"
            const suffix = availableChannels.length > 1
              ? ` · ${escapeHtml(pt.name)} · ${escapeHtml(chName)}`
              : ` · ${escapeHtml(pt.name)}`;
            html += renderCompanyTable(sub, suffix);
          });
        });
      } else if (yearChannelFilter !== 'all') {
        // Один канал выбран — также делим по точкам
        const allowedIds = channels.filter(c => c.name === yearChannelFilter).map(c => c.id);
        if (points.length > 1) {
          points.forEach(pt => {
            const sub = dirs.filter(d => allowedIds.includes(d.channel_id) && d.point_id === pt.id);
            if (sub.length) {
              html += renderCompanyTable(sub, `${filterLabel} · ${escapeHtml(pt.name)}`);
            }
          });
        } else {
          html += renderCompanyTable(dirs, filterLabel);
        }
      } else {
        // Только одна точка и один канал — одна таблица
        html += renderCompanyTable(dirs, filterLabel);
      }
    }

    document.getElementById('year-content').innerHTML = html;

    // Графики
    setTimeout(() => {
      const ctx1 = document.getElementById('ch-year-monthly');
      if (ctx1) yearCharts.push(new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: months,
          datasets: [{
            label: 'Направления',
            data: totalsByMonth,
            backgroundColor: totalsByMonth.map((v,i) => i === bestMonthIdx ? '#4caf50' : (v < avgPerMonth * 0.7 && v > 0 ? '#f44336' : '#e8b84b')),
            borderRadius: 5
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => c.raw + ' направлений' } }
          },
          scales: {
            x: { ticks: { color: '#909090' }, grid: { display: false } },
            y: { ticks: { color: '#909090' }, grid: { color: '#333' }, beginAtZero: true }
          }
        }
      }));

      const ctx2 = document.getElementById('ch-year-top');
      if (ctx2 && topCompanies.length) {
        const top10 = topCompanies.slice(0, 10);
        yearCharts.push(new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: top10.map(c => c.name.length > 16 ? c.name.substring(0,15)+'…' : c.name),
            datasets: [{
              data: top10.map(c => c.count),
              backgroundColor: '#2196f3',
              borderRadius: 4
            }]
          },
          options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: c => c.raw + ' направлений' } }
            },
            scales: {
              x: { ticks: { color: '#909090' }, grid: { color: '#333' } },
              y: { ticks: { color: '#fff', font: { size: 11 } }, grid: { display: false } }
            }
          }
        }));
      }
    }, 50);
  }
</script>
<script>
// === PWA: регистрация Service Worker ===
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js")
      .then(reg => {
        console.log("[PWA] SW registered");
        reg.addEventListener("updatefound", () => {
          const newSW = reg.installing;
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              showPwaUpdateBanner();
            }
          });
        });
      })
      .catch(err => console.warn("[PWA] SW failed:", err));
  });
}
function showPwaUpdateBanner() {
  if (document.getElementById("pwa-update")) return;
  if (!document.getElementById("pwa-update-style")) {
    const st = document.createElement("style");
    st.id = "pwa-update-style";
    st.textContent = `
      @keyframes pwaDrop { from { transform:translate(-50%,-26px); opacity:0; } to { transform:translate(-50%,0); opacity:1; } }
      @keyframes pwaPulse { 0%,100% { box-shadow:0 0 0 0 rgba(232,184,75,.55); } 50% { box-shadow:0 0 0 8px rgba(232,184,75,0); } }
      #pwa-update { animation: pwaDrop .35s ease; }
      #pwa-update button { animation: pwaPulse 1.6s ease-in-out infinite; }
    `;
    document.head.appendChild(st);
  }
  const b = document.createElement("div");
  b.id = "pwa-update";
  b.style.cssText = "position:fixed;top:16px;left:50%;transform:translateX(-50%);" +
    "width:calc(100% - 28px);max-width:440px;background:linear-gradient(135deg,#f0c456,#e8b84b);" +
    "border:2px solid #fff3d6;border-radius:14px;padding:14px 16px;display:flex;" +
    "justify-content:space-between;align-items:center;gap:12px;z-index:100000;" +
    "font-family:Inter,sans-serif;color:#1a1407;box-shadow:0 14px 40px rgba(0,0,0,.55);";
  b.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
      '<span style="font-size:22px;line-height:1;">🔄</span>' +
      '<div style="min-width:0;">' +
        '<div style="font-weight:800;font-size:15px;letter-spacing:.2px;">Доступно обновление</div>' +
        '<div style="font-size:12px;opacity:.8;">Нажми «Обновить», чтобы загрузить новую версию</div>' +
      '</div>' +
    '</div>' +
    '<button style="flex:none;background:#1a1407;color:#f0c456;border:none;padding:11px 20px;' +
      'border-radius:9px;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;" ' +
      'onclick="pwaApplyUpdate()">Обновить</button>';
  document.body.appendChild(b);
}
function pwaApplyUpdate() {
  navigator.serviceWorker.getRegistration().then(reg => {
    if (reg && reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    setTimeout(() => location.reload(), 300);
  });
}
function showOfflineIndicator() {
  if (document.getElementById("pwa-offline")) return;
  const el = document.createElement("div");
  el.id = "pwa-offline";
  el.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(244,67,54,.95);color:#fff;padding:6px 14px;border-radius:6px;z-index:9999;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.3px;box-shadow:0 4px 16px rgba(0,0,0,.4);";
  el.textContent = "📡 Нет связи · работаю с кэшем";
  document.body.appendChild(el);
}
function hideOfflineIndicator() {
  const el = document.getElementById("pwa-offline");
  if (el) el.remove();
}
window.addEventListener("online", hideOfflineIndicator);
window.addEventListener("offline", showOfflineIndicator);
if (!navigator.onLine) showOfflineIndicator();
</script>
</body>
