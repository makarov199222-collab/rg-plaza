<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RG Hub">

<title>RG Plaza · RG Hub — Направления СК</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/lib/chart.umd.js"></script>
<script src="/lib/xlsx.full.min.js"></script>
<script src="/lib/supabase.js"></script>
<style>
  /* ============================================
     RG PLAZA — стиль фирменного сайта
     Тёмный фон, янтарь, чистая типографика
     ============================================ */
  :root {
    --bg:#1a1a1a;
    --bg-dark:#141414;
    --surface:#222222;
    --surface-2:#2a2a2a;
    --border:#333333;
    --border-bright:#404040;

    --text:#ffffff;
    --text-dim:#b8b8b8;
    --muted:#777777;
    --label:#909090;

    --brand:#e8b84b;
    --brand-soft:#d4a342;
    --brand-glow:rgba(232,184,75,.25);

    --ok:#4caf50;
    --warn:#ff9800;
    --crit:#f44336;
    --info:#2196f3;

    --font:'Inter',-apple-system,system-ui,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-display:'Bebas Neue',sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

  html, body {
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overscroll-behavior-y:contain;
  }
  body {
    min-height:100vh;
    padding-bottom:50px;
  }

  /* ============== LOGIN ============== */
  .login{
    position:fixed; inset:0; background:var(--bg);
    z-index:500; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:20px;
  }
  .login.hidden{display:none;}
  .login-brand{
    font-family:var(--font-display); font-size:48px;
    color:var(--brand); letter-spacing:5px;
    line-height:1; margin-bottom:8px;
  }
  .login-sublogo{
    font-family:var(--font-display); font-size:14px;
    color:var(--text-dim); letter-spacing:3px;
    margin-top:4px;
  }
  .login-subtitle{
    font-size:11px; color:var(--text-dim);
    letter-spacing:5px; margin-bottom:36px;
    font-weight:600; text-transform:uppercase;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:26px 24px;
    width:100%; max-width:360px;
  }
  .login-title{
    font-size:14px; font-weight:600;
    color:var(--text); margin-bottom:18px;
    text-align:center;
  }
  .login-input{
    width:100%; background:var(--bg-dark);
    border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; color:var(--text);
    font-family:var(--font); font-size:15px;
    font-weight:500; letter-spacing:1px;
    outline:none; text-align:center;
    -webkit-appearance:none;
    transition:border-color .15s;
  }
  .login-input:focus{border-color:var(--brand);}
  .login-btn{
    width:100%; margin-top:12px; padding:14px;
    background:var(--brand); border:none;
    border-radius:8px; color:#000;
    font-family:var(--font-display); font-size:18px;
    letter-spacing:2px; cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  .login-btn:active{transform:scale(.99); filter:brightness(1.08);}
  .login-err{
    margin-top:10px; font-size:13px;
    color:var(--crit); text-align:center; min-height:18px;
  }

  /* ============== HEADER ============== */
  header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; gap:10px;
    flex-wrap:wrap;
  }
  .brand-block{display:flex; flex-direction:column; gap:2px;}
  .brand-name{
    font-family:var(--font-display); font-size:24px;
    color:var(--brand); letter-spacing:3px; line-height:1;
  }
  .brand-sub{
    font-size:9px; color:var(--text-dim);
    letter-spacing:2.5px; font-weight:600;
    text-transform:uppercase;
  }

  .pick{
    background:var(--bg-dark); border:1px solid var(--border);
    color:var(--text); padding:9px 12px;
    border-radius:8px; font-family:var(--font);
    font-size:13px; font-weight:500;
    cursor:pointer; outline:none;
    transition:border-color .15s;
  }
  .pick:focus, .pick:hover{border-color:var(--border-bright);}

  /* === Кастомный месяц-пикер === */
  .mp-wrap{display:flex;align-items:center;gap:6px;background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .mp-arrow{background:none;border:none;color:var(--accent);width:30px;height:30px;border-radius:5px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:inherit;line-height:1;}
  .mp-arrow:hover{background:var(--surface-2);} .mp-arrow:active{transform:scale(.92);}
  .mp-current{background:none;border:none;color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;border-radius:5px;min-width:130px;text-align:center;text-transform:capitalize;letter-spacing:.3px;transition:background .15s;}
  .mp-current:hover{background:var(--surface-2);color:var(--accent);}
  .mp-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px;}
  .mp-modal.show{display:flex;}
  .mp-sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:340px;animation:mpUp .25s ease;}
  @keyframes mpUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .mp-year-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .mp-year-arrow{background:var(--bg-dark);border:1px solid var(--border);color:var(--accent);width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;font-family:inherit;line-height:1;}
  .mp-year-arrow:hover{border-color:var(--accent);}
  .mp-year{font-family:var(--font-display);font-size:26px;color:var(--accent);letter-spacing:2px;}
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mp-month{padding:14px 8px;background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;text-align:center;text-transform:capitalize;transition:all .15s;}
  .mp-month:hover{border-color:var(--accent);color:var(--accent);}
  .mp-month.active{background:var(--accent);color:#000;border-color:var(--accent);}
  .mp-month.future{opacity:.4;}

  .save-status{
    display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:600;
    color:var(--text-dim); padding:7px 11px;
    background:var(--bg-dark); border:1px solid var(--border);
    border-radius:6px;
    transition:all .2s;
  }
  .save-dot{
    width:6px; height:6px; border-radius:50%;
    background:currentColor;
  }
  .save-status.saving{color:var(--warn);}
  .save-status.saved{color:var(--ok);}
  .save-status.error{color:var(--crit);}
  .save-status.saving .save-dot{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .logout-btn{
    margin-left:auto;
    background:transparent; border:1px solid var(--border);
    color:var(--text-dim);
    width:34px; height:34px; border-radius:8px;
    font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s;
  }
  .logout-btn:hover{color:var(--crit); border-color:var(--crit);}

  /* Заметная кнопка импорта рекомендаций из 1С */
  .import-btn{
    display:flex; align-items:center; gap:7px;
    background:var(--brand); color:#000;
    border:none; border-radius:8px;
    height:34px; padding:0 14px;
    font-family:var(--font); font-size:13px; font-weight:700;
    letter-spacing:.3px; cursor:pointer;
    margin-right:8px;
    box-shadow:0 0 0 0 var(--brand-glow);
    transition:box-shadow .2s, filter .15s, transform .1s;
  }
  .import-btn:hover{ filter:brightness(1.08); box-shadow:0 0 14px var(--brand-glow); }
  .import-btn:active{ transform:scale(.97); }
  .import-btn .import-ico{ font-size:15px; line-height:1; }
  @media (max-width:600px){
    .import-btn{ padding:0 11px; font-size:12px; }
  }

  /* ============== РЕЖИМЫ (МЕСЯЦ / ГОД) ============== */
  .mode-switch{
    display:flex; gap:6px; margin-bottom:14px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:4px;
  }
  .mode-tab{
    flex:1; padding:10px 14px; background:transparent;
    border:none; color:var(--text-dim);
    font-family:var(--font); font-size:13px; font-weight:600;
    cursor:pointer; border-radius:7px; text-align:center;
    transition:all .15s;
  }
  .mode-tab.active{background:var(--accent); color:#000;}
  .mode-tab:hover:not(.active){color:var(--text);}

  /* ============== ГОДОВАЯ АНАЛИТИКА ============== */
  .year-section{margin-bottom:18px;}
  .year-title{
    font-family:var(--font-display); font-size:18px;
    color:var(--accent); letter-spacing:2px;
    margin-bottom:10px;
  }
  .year-channel-pills{
    display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;
  }
  .year-pill{
    flex:1; min-width:80px; padding:9px 12px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:8px; color:var(--text-dim);
    font-family:var(--font); font-size:12px; font-weight:600;
    cursor:pointer; text-align:center; transition:all .15s;
  }
  .year-pill:hover{border-color:var(--accent); color:var(--text);}
  .year-pill.active{background:var(--accent); color:#000; border-color:var(--accent);}
  .year-pill-count{display:block; font-family:var(--font-display); font-size:16px; margin-top:2px; letter-spacing:.5px;}
  .year-kpi-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    margin-bottom:14px;
  }
  .year-kpi{
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:13px;
  }
  .year-kpi.acc{border-color:rgba(232,184,75,.5);}
  .year-kpi-lbl{font-size:10px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px;}
  .year-kpi-val{font-family:var(--font-display); font-size:26px; color:var(--accent); letter-spacing:.5px; line-height:1;}
  .year-kpi-val.b{color:var(--ok);}
  .year-kpi-val.r{color:var(--crit);}
  .year-kpi-val.t{color:var(--text);}
  .year-kpi-sub{font-size:11px; color:var(--text-dim); margin-top:6px;}

  .year-chart-block{
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:14px; margin-bottom:14px;
  }
  .year-chart-title{
    font-family:var(--font-display); font-size:14px;
    color:var(--accent); letter-spacing:1.5px; margin-bottom:11px;
  }
  .year-chart-wrap{position:relative; height:240px;}

  .year-alerts{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .year-alert{
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:11px 14px;
    display:flex; align-items:flex-start; gap:10px;
    font-size:12px; line-height:1.5;
  }
  .year-alert.red{border-left:3px solid var(--crit);}
  .year-alert.orange{border-left:3px solid var(--warn);}
  .year-alert.green{border-left:3px solid var(--ok);}
  .year-alert.blue{border-left:3px solid var(--info);}
  .year-alert-icon{font-size:18px; flex-shrink:0;}
  .year-alert-text{flex:1; color:var(--text);}
  .year-alert-text b{color:var(--accent);}

  .year-table{
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:14px; margin-bottom:14px;
    overflow-x:auto;
  }
  .year-table-grid{
    display:grid; grid-template-columns:140px repeat(12, 1fr) 80px;
    gap:1px; background:var(--border); padding:1px;
    font-size:11px; min-width:680px;
  }
  .year-table-cell{
    background:var(--surface); padding:6px 6px;
    text-align:center; color:var(--text);
    min-height:38px; display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .year-table-cell.head{
    background:var(--bg-dark); color:var(--text-dim);
    font-weight:600; text-transform:uppercase; letter-spacing:.4px; font-size:10px;
  }
  .year-table-cell.label{
    text-align:left; font-weight:600;
    background:var(--bg-dark);
  }
  .year-table-cell.total{
    background:var(--bg-dark); color:var(--accent);
    font-family:var(--font-display); font-size:13px;
  }
  .year-table-cell.zero{color:var(--text-dim);}
  .year-table-cell .num{ font-weight:600; }
  .year-table-cell .delta{
    display:block; font-size:9px; line-height:1.1; margin-top:2px;
    font-weight:500; letter-spacing:.2px;
  }
  .year-table-cell .delta.up   { color:#34d399; }   /* зелёный */
  .year-table-cell .delta.down { color:#f87171; }   /* красный */
  .year-table-cell .delta.flat { color:var(--text-dim); }
  .year-table-cell .delta.new  { color:#60a5fa; }   /* синий — "ожила" */
  .year-table-cell .delta.gone { color:var(--text-dim); }

  /* ============== PULL TO REFRESH ============== */
  .pull-indicator{
    position:fixed; top:0; left:0; right:0; height:50px;
    background:var(--surface); display:flex; align-items:center;
    justify-content:center; font-size:12px;
    color:var(--text-dim); z-index:90;
    transform:translateY(-50px);
    transition:transform .2s;
    border-bottom:1px solid var(--border);
  }
  .pull-indicator.show{transform:translateY(0);}
  .pull-indicator.releasing{color:var(--brand);}
  .pull-spinner{
    width:14px; height:14px;
    border:2px solid var(--border-bright);
    border-top-color:var(--brand); border-radius:50%;
    animation:spin .6s linear infinite;
    margin-right:8px; display:none;
  }
  .pull-indicator.refreshing .pull-spinner{display:block;}
  .pull-indicator.refreshing .pull-arrow{display:none;}
  .pull-arrow{
    display:inline-block; margin-right:8px;
    transition:transform .2s;
  }
  .pull-indicator.releasing .pull-arrow{transform:rotate(180deg);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============== MAIN ============== */
  .wrap{
    padding:16px;
    max-width:1400px; margin:0 auto;
  }

  .info-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px; margin-bottom:14px;
  }
  .info-title{
    font-family:var(--font-display); font-size:18px;
    color:var(--brand); letter-spacing:1.5px;
    margin-bottom:6px;
  }
  .info-text{
    font-size:13px; color:var(--text-dim);
    line-height:1.6;
  }
  .info-text b{color:var(--brand); font-weight:600;}

  /* ============== CHANNELS GRID ============== */
  .channels-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px; margin-bottom:14px;
    align-items:start;   /* карточки не тянутся до высоты соседа — блоки внутри не провисают */
  }
  @media (max-width:900px){.channels-grid{grid-template-columns:1fr;}}

  /* ============== CHANNEL CARD ============== */
  .channel-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    transition:border-color .25s;
  }
  .channel-card.fill-partial{border-color:var(--border);}
  .channel-card.fill-full{border-color:var(--border);}

  .channel-head{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .channel-name{
    font-family:var(--font-display); font-size:20px;
    color:var(--brand); letter-spacing:2px; line-height:1;
  }
  .channel-pin{
    font-size:10px; color:var(--text-dim);
    font-weight:600; background:var(--bg-dark);
    padding:4px 9px; border-radius:5px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .channel-status-badge{
    margin-left:auto; display:flex;
    align-items:center; gap:7px;
    font-size:11px; font-weight:600;
    letter-spacing:.5px;
  }
  .channel-led{
    width:8px; height:8px; border-radius:50%;
    background:currentColor;
  }
  .channel-status-badge.fill-empty{color:var(--muted);}
  .channel-status-badge.fill-full{color:var(--text-dim);}
  /* Точку-LED для информационного бейджа объёма убираем (это не статус) */
  .channel-status-badge .channel-led{ display:none; }
  @keyframes steady{50%{opacity:.5;}}

  /* ============== ROWS ============== */
  .ck-row{
    display:grid;
    grid-template-columns:1.4fr auto auto;
    gap:10px; padding:10px 16px; align-items:center;
    border-bottom:1px solid rgba(51,51,51,.5);
  }
  .ck-row:last-of-type{border-bottom:none;}

  .ck-row.head{
    background:var(--bg-dark);
    padding:10px 16px;
    border-bottom:1px solid var(--border);
  }
  .ck-row.head > div{
    font-size:10px; font-weight:600;
    color:var(--label); letter-spacing:1px;
    text-transform:uppercase;
  }
  .ck-row.head .stepper-head{text-align:center; width:108px;}

  .ck-name-block{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .ck-name{
    font-size:13px; color:var(--text);
    font-weight:500; line-height:1.3;
  }
  .ck-prev{
    font-size:10px; font-weight:500;
    color:var(--muted);
    display:flex; align-items:center; gap:4px;
  }
  .ck-prev .arr{
    width:0; height:0;
    border-left:3px solid transparent;
    border-right:3px solid transparent;
  }
  .ck-prev.up{color:var(--ok);}
  .ck-prev.up .arr{border-bottom:5px solid var(--ok); border-top:none;}
  .ck-prev.down{color:var(--crit);}
  .ck-prev.down .arr{border-top:5px solid var(--crit); border-bottom:none;}
  .ck-prev.same{color:var(--text-dim);}
  .ck-rec{
    font-size:10px; font-weight:600; margin-top:2px;
    color:var(--info); letter-spacing:.2px;
  }
  .ck-rec .ck-rec-diff{ font-weight:500; color:var(--muted); }
  .ck-rec.rec-ok{ color:var(--ok); }
  .ck-rec.rec-ok .ck-rec-diff{ color:var(--ok); opacity:.8; }
  .ck-rec.rec-diff{ color:var(--brand); }
  .ck-rec.rec-diff .ck-rec-diff{ color:var(--brand); opacity:.85; }
  .ck-fill-btn{
    width:100%; margin-top:8px; background:transparent;
    border:1px dashed var(--info); color:var(--info);
    border-radius:8px; padding:9px; font-family:var(--font);
    font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.3px;
  }
  .ck-fill-btn:hover{ background:rgba(33,150,243,.08); }

  /* ============== STEPPER ============== */
  .stepper{
    display:flex; align-items:center;
    background:var(--bg-dark);
    border:1px solid var(--border);
    border-radius:8px; overflow:hidden;
    width:108px; height:36px;
    transition:border-color .15s;
  }
  .stepper.has-value{border-color:var(--brand);}
  .stepper.has-value .stepper-val{color:var(--brand);}

  .stepper-btn{
    flex:0 0 32px; height:100%;
    background:transparent; border:none;
    color:var(--text-dim); font-size:20px;
    font-weight:300; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1; user-select:none; -webkit-user-select:none;
    transition:all .1s;
  }
  .stepper-btn:hover{color:var(--text);}
  .stepper-btn:active{
    background:var(--brand); color:#000;
  }

  .stepper-val{
    flex:1; text-align:center;
    font-family:var(--font); font-size:14px;
    font-weight:700; color:var(--text);
    min-width:30px; cursor:text; outline:none;
    border:none; background:transparent;
    padding:0;
    -moz-appearance:textfield;
  }
  .stepper-val::-webkit-outer-spin-button,
  .stepper-val::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .stepper-val:focus{color:var(--brand);}

  .stepper.withdrawn{width:94px;}
  .stepper.withdrawn .stepper-btn{flex:0 0 28px; font-size:18px;}

  /* ============== TOTALS ============== */
  .ck-totals{
    padding:14px 16px;
    background:var(--bg-dark);
    border-top:1px solid var(--border-bright);
    display:grid;
    grid-template-columns:1.4fr auto auto;
    gap:10px; align-items:center;
  }
  .ck-totals-lbl{
    font-size:11px; color:var(--brand);
    font-weight:600; letter-spacing:1px;
    text-transform:uppercase;
  }
  .ck-totals-val{
    text-align:center; color:var(--brand);
    font-family:var(--font-display); font-size:26px;
    width:108px; letter-spacing:1px;
  }
  .ck-totals-val.withdrawn{width:94px;}

  /* ============== RAVT BLOCK ============== */
  /* Дашборд-строки СК (новый компактный вид) */
  .cx-list{ padding:6px 0; }
  .cx-row{
    display:flex; align-items:center; gap:14px;
    padding:9px 16px;
    border-bottom:1px solid rgba(51,51,51,.4);
  }
  .cx-row:last-child{ border-bottom:none; }
  .cx-num{
    font-family:var(--font-display); font-size:26px;
    color:var(--brand); line-height:1; letter-spacing:1px;
    min-width:42px; text-align:right; flex:0 0 auto;
  }
  .cx-mid{ flex:1; min-width:0; }
  .cx-name{ font-size:13.5px; color:var(--text); font-weight:600; line-height:1.25; }
  .cx-meta{ display:flex; align-items:center; gap:10px; margin-top:3px; flex-wrap:wrap; }
  .cx-sum{ font-size:11px; color:var(--text-dim); font-weight:500; }
  .cx-wd{ font-size:11px; color:var(--crit); font-weight:600; }
  .cx-trend{ font-size:11px; font-weight:600; }
  .cx-trend.up{ color:var(--ok); }
  .cx-trend.down{ color:var(--crit); }
  .cx-sleeping{
    padding:11px 16px; font-size:11px; line-height:1.5;
    color:var(--muted); border-top:1px solid rgba(51,51,51,.4);
  }
  .cx-sleeping-lbl{ color:var(--text-dim); font-weight:600; }
  .cx-empty{ padding:20px 16px; text-align:center; color:var(--muted); font-size:13px; }

  .cx-totals{
    display:flex; align-items:baseline; gap:12px;
    padding:14px 16px;
    background:var(--bg-dark);
    border-top:1px solid var(--border-bright);
  }
  .cx-totals-num{
    font-family:var(--font-display); font-size:34px;
    color:var(--brand); line-height:1; letter-spacing:1px;
  }
  .cx-totals-lbl{
    font-size:11px; color:var(--label);
    font-weight:600; letter-spacing:.8px; text-transform:uppercase;
  }

  /* Подпись секции каналов */
  .ch-section-lbl{
    font-size:12px; color:var(--text-dim); font-weight:600;
    letter-spacing:.4px; margin:6px 2px 10px;
  }

  /* Плашка «Проверь оформление» (непривязанные плательщики) */
  .unm-block{
    background:var(--surface);
    border:1px solid var(--crit);
    border-radius:12px; padding:16px; margin:14px 0;
  }
  .unm-title{
    font-family:var(--font-display); font-size:16px;
    color:var(--crit); letter-spacing:.5px; margin-bottom:6px;
  }
  .unm-sub{ font-size:12px; color:var(--text-dim); margin-bottom:12px; line-height:1.4; }
  .unm-list{ display:flex; flex-direction:column; gap:2px; }
  .unm-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .unm-row:last-child{ border-bottom:none; }
  .unm-payer{ color:var(--text); font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unm-meta{ color:var(--text-dim); font-size:11.5px; white-space:nowrap; }
  .unm-more{ font-size:11.5px; color:var(--muted); padding-top:8px; }

  /* Сворачиваемая сверка с РАВТ */
  .ck-ravt-details{
    background:var(--surface-2);
    border-top:1px solid var(--border);
  }
  .ck-ravt-summary{
    list-style:none; cursor:pointer;
    padding:12px 16px;
    font-size:11px; color:var(--info);
    font-weight:600; letter-spacing:.5px; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    user-select:none;
  }
  .ck-ravt-summary::-webkit-details-marker{ display:none; }
  .ck-ravt-summary::before{
    content:'▸'; transition:transform .2s; font-size:10px; color:var(--text-dim);
  }
  .ck-ravt-details[open] .ck-ravt-summary::before{ transform:rotate(90deg); }
  .ck-ravt-inner{ padding:0 16px 14px; }

  .ck-ravt-block{
    padding:14px 16px;
    background:var(--surface-2);
    border-top:1px solid var(--border);
    position:relative; width:100%; clear:both;
  }
  .ck-ravt-title{
    font-size:11px; color:var(--info);
    font-weight:600; letter-spacing:.5px;
    margin-bottom:11px;
    text-transform:uppercase;
    display:block; width:100%;
  }
  .ck-ravt-row{
    display:flex; align-items:center;
    gap:10px; flex-wrap:wrap; margin-bottom:11px;
    width:100%;
  }
  .ck-ravt-lbl{
    font-size:12px; color:var(--text-dim);
    font-weight:500;
  }
  .ck-ravt-stepper{
    display:flex; align-items:center;
    background:var(--bg-dark);
    border:1px solid var(--border);
    border-radius:8px; overflow:hidden;
    width:108px; height:34px;
  }
  .ck-ravt-stepper.has-value{border-color:var(--info);}
  .ck-ravt-stepper.has-value .stepper-val{color:var(--info);}

  /* ============== DIFF ============== */
  .ck-diff{
    display:block; width:100%;
    font-size:12.5px; font-weight:500;
    padding:10px 14px; border-radius:8px;
    cursor:help; line-height:1.5;
    border-left:3px solid;
  }
  .ck-diff.empty{
    background:var(--bg-dark); color:var(--muted);
    border-left-color:var(--muted);
  }
  .ck-diff.ok{
    background:rgba(76,175,80,.08); color:var(--ok);
    border-left-color:var(--ok);
  }
  .ck-diff.warn{
    background:rgba(255,152,0,.08); color:var(--warn);
    border-left-color:var(--warn);
  }
  .ck-diff.bad{
    background:rgba(244,67,54,.08); color:var(--crit);
    border-left-color:var(--crit);
  }

  /* ============== EXPLAINER ============== */
  .explainer-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(4px);
    z-index:300;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .explainer-overlay.show{opacity:1; pointer-events:auto;}
  .explainer{
    background:var(--surface);
    border-top:3px solid var(--brand);
    border-radius:14px 14px 0 0;
    width:100%; max-width:540px;
    padding:24px;
    transform:translateY(100%);
    transition:transform .25s;
  }
  .explainer-overlay.show .explainer{transform:translateY(0);}
  .explainer-title{
    font-family:var(--font-display); font-size:22px;
    color:var(--text); letter-spacing:1.5px;
    margin-bottom:14px;
  }
  .explainer-text{
    font-size:14px; color:var(--text-dim);
    line-height:1.7; margin-bottom:20px;
  }
  .explainer-text b{color:var(--brand); font-weight:600;}
  .explainer-text ul{list-style:none; padding-left:0; margin-top:10px;}
  .explainer-text ul li{
    padding:5px 0 5px 18px; position:relative;
    font-size:13.5px;
  }
  .explainer-text ul li::before{
    content:'•'; position:absolute; left:4px;
    color:var(--brand); font-size:14px; top:5px;
  }
  .explainer-close{
    width:100%; padding:13px;
    background:var(--brand); border:none;
    border-radius:8px; color:#000;
    font-family:var(--font-display); font-size:16px;
    letter-spacing:2px; cursor:pointer;
    transition:filter .15s;
  }
  .explainer-close:active{filter:brightness(1.08);}

  /* ============== SKELETON ============== */
  .skel-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:14px;
    position:relative; overflow:hidden;
  }
  .skel{
    background:var(--surface-2);
    border-radius:6px;
  }
  .skel-line{height:14px; margin-bottom:10px;}
  .skel-card::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(232,184,75,.04) 50%,
      transparent 100%);
    transform:translateX(-100%);
    animation:shimmer 1.8s infinite;
  }
  @keyframes shimmer{100%{transform:translateX(100%);}}

  .empty{
    text-align:center; color:var(--muted);
    font-size:14px; padding:60px 20px;
  }

  /* ============== TOAST ============== */
  .toast{
    position:fixed; bottom:20px; left:50%;
    transform:translate(-50%, 20px);
    background:var(--surface);
    border:1px solid var(--border-bright);
    border-radius:8px; padding:12px 18px;
    font-size:13px; color:var(--text); z-index:300;
    opacity:0; transition:all .25s;
    pointer-events:none;
    border-left:3px solid var(--brand);
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .toast.ok{border-left-color:var(--ok);}
  .toast.err{border-left-color:var(--crit);}

  /* ============== SUMMARY ============== */
  .summary-block{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .summary-title{
    font-family:var(--font-display); font-size:18px;
    color:var(--brand); letter-spacing:1.5px;
    margin-bottom:14px;
  }
  .summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
  }
  .summary-item{
    background:var(--bg-dark);
    border:1px solid var(--border);
    border-radius:8px;
    padding:13px 14px;
  }
  .summary-item-lbl{
    font-size:10px; color:var(--label);
    font-weight:600; letter-spacing:1px;
    margin-bottom:6px; text-transform:uppercase;
  }
  .summary-item-val{
    font-family:var(--font-display); font-size:30px;
    color:var(--brand); line-height:1;
    letter-spacing:1px;
  }
  .summary-item-val.b{color:var(--info);}
  .summary-item-val.g{color:var(--ok);}
  .summary-item-val.r{color:var(--crit);}
  .summary-item-sub{
    font-size:11px; color:var(--muted);
    margin-top:6px; font-weight:500;
  }
  .summary-item-sub.up{color:var(--ok);}
  .summary-item-sub.down{color:var(--crit);}

  /* ============== ТАБЛИЦА-СРАВНЕНИЕ СК ПО ТОЧКАМ ============== */
  .pc-block{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .pc-title{
    font-family:var(--font-display); font-size:18px;
    color:var(--brand); letter-spacing:1.5px; margin-bottom:14px;
  }
  .pc-sub{ font-family:var(--font); font-size:11px; color:var(--text-dim); font-weight:500; letter-spacing:.3px; }
  .pc-chart-wrap{ position:relative; height:300px; }
  @media (max-width:600px){ .pc-chart-wrap{ height:240px; } }

  /* ============== ВОРОНКА НАПРАВЛЕНИЙ (Этап 2) ============== */
  .funnel-block{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .funnel-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap; margin-bottom:4px;
  }
  .funnel-title{
    font-family:var(--font-display); font-size:18px;
    color:var(--brand); letter-spacing:1.5px;
  }
  .funnel-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .fn-toggle{ display:flex; background:var(--bg-dark); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .fn-toggle-btn{
    background:transparent; border:none; color:var(--text-dim);
    font-family:var(--font); font-size:12px; font-weight:600;
    padding:7px 12px; cursor:pointer; letter-spacing:.3px;
  }
  .fn-toggle-btn.active{ background:var(--brand); color:#000; }
  .fn-points-btn{
    background:var(--bg-dark); border:1px solid var(--border); border-radius:8px;
    color:var(--text-dim); font-family:var(--font); font-size:12px; font-weight:600;
    padding:7px 12px; cursor:pointer; letter-spacing:.3px;
  }
  .fn-points-btn.active{ border-color:var(--brand); color:var(--brand); }
  .funnel-sub{ font-size:12px; color:var(--text-dim); margin-bottom:14px; }
  .funnel-stages{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  }
  .fn-stage{
    background:var(--bg-dark); border:1px solid var(--border);
    border-radius:8px; padding:12px;
  }
  .fn-stage-top{ display:flex; align-items:baseline; gap:8px; }
  .fn-stage-count{ font-family:var(--font-display); font-size:30px; line-height:1; letter-spacing:1px; }
  .fn-stage-label{ font-size:12px; color:var(--text); font-weight:600; }
  .fn-stage-hint{ font-size:10px; color:var(--muted); margin-top:3px; }
  .fn-stage-bar{ height:4px; background:var(--border); border-radius:3px; margin:9px 0 7px; overflow:hidden; }
  .fn-stage-bar-fill{ height:100%; border-radius:3px; transition:width .3s; }
  .fn-stage-amount{ font-size:11px; color:var(--text-dim); }
  .fn-stage.clickable{ cursor:pointer; transition:border-color .15s; }
  .fn-stage.clickable:hover{ border-color:var(--brand); }
  .fn-other{ font-size:11px; color:var(--muted); margin-top:10px; }
  .funnel-tasks{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .fn-task{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-dark); border:1px solid var(--border);
    border-left:3px solid var(--brand); border-radius:8px; padding:11px 13px;
  }
  .fn-task.warn{ border-left-color:var(--crit); }
  .fn-task.wait{ border-left-color:var(--warn); }
  .fn-task.docs{ border-left-color:var(--info); }
  .fn-task.foreign{ border-left-color:var(--muted); opacity:.85; }
  .fn-task.ok{ border-left-color:var(--ok); }
  .fn-task-ico{ font-size:20px; flex:0 0 auto; }
  .fn-task-body{ flex:1; min-width:0; }
  .fn-task-title{ font-size:13px; font-weight:700; color:var(--text); }
  .fn-task-sub{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .fn-task-actions{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  .fn-task-btn{
    flex:0 0 auto; background:var(--brand); color:#000; border:none;
    border-radius:7px; padding:8px 14px; font-family:var(--font);
    font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.3px;
    white-space:nowrap;
  }
  .fn-task-btn.ghost{ background:transparent; border:1px solid var(--border-bright); color:var(--text-dim); }
  .fn-rec-row{ background:var(--bg-dark); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .fn-rec-main{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .fn-rec-zn{ font-weight:700; color:var(--text); font-size:13px; }
  .fn-rec-amt{ color:var(--brand); font-size:13px; font-weight:600; }
  .fn-rec-meta{ font-size:11px; color:var(--text-dim); margin-top:3px; }
  .fn-rec-meta.dim{ color:var(--muted); }
  .fn-rec-btn{
    margin-top:8px; background:var(--brand); color:#000; border:none;
    border-radius:6px; padding:7px 12px; font-family:var(--font);
    font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.3px;
  }
  .fn-rec-btn.ghost{ background:transparent; border:1px solid var(--border-bright); color:var(--text-dim); }
  .fn-rec-empty{ color:var(--muted); text-align:center; padding:20px; font-size:13px; }
  .fn-group-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    font-family:var(--font-display); font-size:16px; color:var(--brand);
    letter-spacing:1px; padding:14px 2px 6px; margin-top:6px;
    border-bottom:1px solid var(--border-bright);
  }
  .fn-group-head:first-child{ margin-top:0; }
  .fn-group-count{ font-family:var(--font); font-size:11px; color:var(--text-dim); font-weight:600; letter-spacing:.3px; }
  @media (max-width:600px){
    .funnel-stages{ grid-template-columns:repeat(2,1fr); }
    .fn-stage-count{ font-size:26px; }
  }

  /* ============== MOBILE ============== */
  @media (max-width:600px){
    .wrap{padding:12px;}
    .ck-row, .ck-totals{padding:9px 12px;}
    .ck-row.head{padding:9px 12px;}
    .ck-name{font-size:12px;}
    .ck-prev{font-size:9px;}
    .stepper{width:96px; height:34px;}
    .stepper-btn{flex:0 0 28px; font-size:18px;}
    .stepper-val{font-size:13px;}
    .stepper.withdrawn{width:84px;}
    .stepper.withdrawn .stepper-btn{flex:0 0 24px; font-size:16px;}
    .ck-totals-val{width:96px; font-size:22px;}
    .ck-totals-val.withdrawn{width:84px;}
    .channel-name{font-size:18px;}
    .brand-name{font-size:20px;}
    header{padding:11px 13px; gap:7px;}
    .pick{padding:8px 10px; font-size:12px;}
    .save-status{padding:6px 9px; font-size:10px;}
    .summary-item-val{font-size:26px;}
  }
</style>
</head>
<body>

<div class="login" id="login">
  <div class="login-brand">RG PLAZA<div class="login-sublogo">RG HUB</div></div>
  <div class="login-subtitle">Направления СК</div>
  <div class="login-card">
    <div class="login-title">Введи код доступа</div>
    <input type="password" class="login-input" id="login-code" placeholder="Код" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">ВОЙТИ</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div id="app" style="display:none;">

<div class="pull-indicator" id="pull-ind">
  <div class="pull-spinner"></div>
  <span class="pull-arrow">↓</span>
  <span id="pull-text">Потяни для обновления</span>
</div>

<header>
  <div class="brand-block">
    <div class="brand-name">RG Plaza · RG Hub</div>
    <div class="brand-sub">Направления СК</div>
  </div>
  <select class="pick" id="city-pick" onchange="onCityChange()">
    <option value="moscow">Москва</option>
    <option value="izhevsk">Ижевск</option>
  </select>
  <input type="hidden" id="month-pick">
  <div class="mp-wrap">
    <button class="mp-arrow" onclick="mpPrev()" title="Предыдущий">‹</button>
    <button class="mp-current" id="mp-current" onclick="mpOpenGrid()">—</button>
    <button class="mp-arrow" onclick="mpNext()" title="Следующий">›</button>
  </div>
  <div class="save-status saved" id="save-status">
    <div class="save-dot"></div>
    <span id="save-text">Всё сохранено</span>
  </div>
  <button class="import-btn" onclick="importRecsOpen()" title="Импорт рекомендаций из 1С" style="margin-left:auto;">
    <span class="import-ico">📥</span><span>Импорт 1С</span>
  </button>
  <input type="file" id="recs-file-input" accept=".xlsx,.xls" style="display:none;" onchange="importRecsFile(this.files[0])">
  <button class="logout-btn" onclick="doLogout()" title="Выйти" style="margin-left:0;">⏻</button>
</header>

<div class="wrap">
  <div class="mode-switch">
    <button class="mode-tab active" id="mode-month-btn" onclick="switchMode('month')">📅 Месяц</button>
    <button class="mode-tab" id="mode-year-btn" onclick="switchMode('year')">📊 Год</button>
  </div>

  <div id="mode-month-content">
    <div id="content">
      <div class="channels-grid">
        <div class="skel-card">
          <div class="skel skel-line" style="width:60%;height:18px;margin-bottom:14px;"></div>
          <div class="skel skel-line" style="width:80%;"></div>
          <div class="skel skel-line" style="width:70%;"></div>
          <div class="skel skel-line" style="width:75%;"></div>
          <div class="skel skel-line" style="width:65%;"></div>
          <div class="skel skel-line" style="width:80%;"></div>
        </div>
        <div class="skel-card">
          <div class="skel skel-line" style="width:60%;height:18px;margin-bottom:14px;"></div>
          <div class="skel skel-line" style="width:80%;"></div>
          <div class="skel skel-line" style="width:70%;"></div>
          <div class="skel skel-line" style="width:75%;"></div>
          <div class="skel skel-line" style="width:65%;"></div>
          <div class="skel skel-line" style="width:80%;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="mode-year-content" style="display:none;">
    <div id="year-content">
      <div class="loader"><div class="spinner"></div>Загружаю годовую аналитику...</div>
    </div>
  </div>
</div>

</div>

<script>
  const SUPABASE_URL = 'https://uxdgiwbkvgbnrsuxjhvp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bg1BRofqJsjkV_9eXzn2Pg__YJ-xRMK';

  // === Проверка связи с базой (Путь 3): при блокировке доступа к Supabase
  // (часто без VPN) показываем понятный полноэкранный экран вместо пустых цифр. ===
  function rgpShowConnError() {
    if (document.getElementById('rgp-conn-error')) return;
    const o = document.createElement('div');
    o.id = 'rgp-conn-error';
    o.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(10,10,10,.97);' +
      'display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:#fff;';
    o.innerHTML =

        '<div style="font-size:46px;line-height:1;margin-bottom:12px;">&#128225;</div>' +
        '<div style="font-size:19px;font-weight:800;margin-bottom:8px;">Нет связи с сервером</div>' +
        '<div style="font-size:14px;line-height:1.5;color:#cfcfcf;margin-bottom:20px;">Похоже, доступ к базе временно заблокирован.<br>Включите <b style="color:#e8b84b;">VPN</b> и нажмите «Повторить».</div>' +
        '<button id="rgp-conn-retry" style="background:#e8b84b;color:#000;border:none;padding:13px 26px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;font-family:Inter,sans-serif;width:100%;">Повторить</button>' +
      '</div>';
    document.body.appendChild(o);
    document.getElementById('rgp-conn-retry').onclick = function(){ this.textContent='Проверяю…'; this.disabled=true; rgpCheckServer(true); };
  }
  function rgpHideConnError(){ const o=document.getElementById('rgp-conn-error'); if (o) o.remove(); }
  async function rgpCheckServer(isRetry){
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 7000);
      // no-cors: запрос проходит = сервер достижим; падает = домен заблокирован/нет сети
      await fetch(SUPABASE_URL + '/rest/v1/', { mode:'no-cors', cache:'no-store', signal: ctrl.signal });
      clearTimeout(t);
      if (isRetry) { location.reload(); return; }
      rgpHideConnError();
    } catch(e){
      rgpShowConnError();
      const btn = document.getElementById('rgp-conn-retry');
      if (isRetry && btn){ btn.textContent='Повторить'; btn.disabled=false; }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => rgpCheckServer(false));
  else rgpCheckServer(false);

  let companies = [], channels = [], points = [];
  let directionsData = [], ravtData = [];
  let prevMonthData = [];
  // Отгруженный страховой вал (equity) из orders_history_1c за выбранный месяц —
  // ЕДИНЫЙ источник для разнесения каналов РАВТ/Локальные/ошибки (оба региона).
  let equityRows = [];
  let _equityCache = null;

  const saveQueue = new Map();
  let pendingSaves = 0;
  let saveTimer = null;

  function haptic(s = 10) { try { if (navigator.vibrate) navigator.vibrate(s); } catch(e){} }

  function doLogin() {
    const code = document.getElementById('login-code').value.trim();

    else { document.getElementById('login-err').textContent = 'Неверный код'; haptic(50); }

    location.reload();

  function enterApp() {
    document.getElementById('login').classList.add('hidden');

    const now = new Date();
    document.getElementById('month-pick').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const savedCity = localStorage.getItem('rgp_insmgr_city');

    loadAll();
  }
  function onCityChange() {
    localStorage.setItem('rgp_insmgr_city', document.getElementById('city-pick').value);
    yearChannelFilter = 'all';  // сбрасываем фильтр при смене города
    haptic(15); loadAll();
  }

  // === КАСТОМНЫЙ МЕСЯЦ-ПИКЕР ===
  const MP_MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  let mpGridYear = new Date().getFullYear();
  function mpGetCurrent() {
    const v = document.getElementById('month-pick').value || '';
    const [y, m] = v.split('-').map(Number);
    return [y || new Date().getFullYear(), m || (new Date().getMonth()+1)];
  }
  function mpSet(y, m) { document.getElementById('month-pick').value = `${y}-${String(m).padStart(2,'0')}`; mpUpdateLabel(); haptic(10); loadAll(); }
  function mpUpdateLabel() { const [y,m]=mpGetCurrent(); const el=document.getElementById('mp-current'); if(el) el.textContent = `${MP_MONTHS_FULL[m-1]} ${y}`; }
  function mpPrev() { let [y,m]=mpGetCurrent(); m--; if(m<1){m=12;y--;} mpSet(y,m); }
  function mpNext() { let [y,m]=mpGetCurrent(); m++; if(m>12){m=1;y++;} mpSet(y,m); }
  function mpOpenGrid() { const [y]=mpGetCurrent(); mpGridYear=y; mpRenderGrid(); document.getElementById('mp-modal').classList.add('show'); }
  function mpCloseGrid() { document.getElementById('mp-modal').classList.remove('show'); }
  function mpYearPrev() { mpGridYear--; mpRenderGrid(); }
  function mpYearNext() { mpGridYear++; mpRenderGrid(); }
  function mpRenderGrid() {
    document.getElementById('mp-year').textContent = mpGridYear;
    const [curY, curM] = mpGetCurrent();
    const now = new Date();
    const nowY = now.getFullYear(), nowM = now.getMonth()+1;
    let html = '';
    for (let i=0; i<12; i++) {
      const m = i+1;
      const isActive = (mpGridYear===curY && m===curM);
      const isFuture = (mpGridYear>nowY) || (mpGridYear===nowY && m>nowM);
      html += `<button class="mp-month ${isActive?'active':''} ${isFuture?'future':''}" onclick="mpPickMonth(${m})">${MP_MONTHS_FULL[i]}</button>`;
    }
    document.getElementById('mp-grid').innerHTML = html;
  }
  function mpPickMonth(m) { mpSet(mpGridYear, m); mpCloseGrid(); }

  function setStatus(state) {
    const el = document.getElementById('save-status');
    const txt = document.getElementById('save-text');
    el.className = 'save-status ' + state;
    if (state === 'saving') txt.textContent = 'Сохраняю...';
    else if (state === 'saved') txt.textContent = 'Всё сохранено';
    else if (state === 'error') txt.textContent = 'Ошибка';
  }

  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type||'');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function fm(n) { return n ? Number(n).toLocaleString('ru-RU') : '0'; }
  // Экранирование данных из БД перед вставкой в innerHTML — защита от XSS,
  // если в названии канала/компании/точки окажется HTML/скрипт.
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function getPeriod() { return document.getElementById('month-pick').value || new Date().toISOString().substring(0,7); }
  function getCity() { return document.getElementById('city-pick').value; }

  // ====== ИМПОРТ РЕКОМЕНДАЦИЙ ИЗ 1С (Этап 1: сбор данных) ======
  // Сопоставление названий страховых из файла → company_id в базе
  const REC_COMPANY_MAP = {
    'ресогарантия':'reso','ингосстрах':'ingo','альфастрахование':'alfa','согаз':'sogaz',
    'согласие':'soglasie','росгосстрах':'rgs','югория':'yugoria','вск':'vsk',
    'сбербанкстрахование':'sber','зетта':'zetta','тинькофф':'t_strah',
    'абсолютстрахование':'absolut','ренессанс':'renessans','гелиос':'helios',
    'скинтери':'interi','совкомбанк':'sovkombank','энергогарант':'energo','энергогарантмск':'energo_msk',
    // Короткие формы из «Вид Заказ-наряда» (выгрузка направлений Ижевска):
    'ресо':'reso','интери':'interi','энгмосква':'energo_msk','энгмск':'energo_msk','скгранта':'granta','гранта':'granta',
  };
  // Резолв СК из произвольного текста: сперва точный алиас, иначе матч ПО ВХОЖДЕНИЮ
  // против справочника (как в каналах) — чтобы полные юр-имена «САО РЕСО-ГАРАНТИЯ»,
  // «…ИНГОССТРАХ ПАО», «АЛЬФАСТРАХОВАНИЕ НАО», «ВСК САО» распознавались сами.
  // companyRoots() объявлена ниже (function declaration, поднимается) и использует
  // загруженный справочник companies; при импорте он уже загружен.
  function recResolveCompany(raw){
    if (!raw) return null;
    const n = recNorm(raw);
    if (!n) return null;
    if (REC_COMPANY_MAP[n]) return REC_COMPANY_MAP[n];
    try { for (const c of companyRoots()) { if (n.includes(c.root)) return c.id; } } catch(e){}
    return null;
  }
  // Сопоставление территории → point_id ПО КОРНЮ (вхождение), а не точным
  // совпадением: в файле бывает «Б. Серпуховская», «Калужская ул.» и т.п.
  // МГТ исключён намеренно — это скрытый проект/контрагент, а НЕ точка.
  const REC_POINT_ROOTS = [
    { root: 'калужск',   id: 'kaluga'   },
    { root: 'серпуховск', id: 'serpuhov' },
    { root: 'совхозн',   id: 'sovhoz'   },
    { root: 'пойм',      id: 'poyma'    },
  ];
  function recMatchPoint(terr){
    const s = recNorm(terr); // нижний регистр, только буквы
    if (!s) return null;
    for (const p of REC_POINT_ROOTS) { if (s.includes(p.root)) return p.id; }
    return null;
  }
  function recNorm(s){ return String(s||'').toLowerCase().replace(/[^а-яёa-z]/g,''); }

  // Поиск колонок по НАЗВАНИЯМ заголовков (строка 0 файла). Устойчив к сдвигу
  // столбцов в выгрузках 1С. Возвращает индексы; -1 если колонка не найдена.
  function recFindColumns(header){
    const norm = s => String(s||'').toLowerCase().replace(/[^а-яёa-z0-9]/g,'');
    const idx = {};
    header.forEach((h,i) => { const k = norm(h); if (k && idx[k] == null) idx[k] = i; });
    const find = (...names) => { for (const n of names){ const k = norm(n); if (idx[k] != null) return idx[k]; } return -1; };
    return {
      date:    find('Дата'),
      num:     find('Номер'),
      type:    find('Тип рекомендации'),
      sum:     find('Сумма'),
      client:  find('Наименование контрагента'),
      model:   find('Модель'),
      plate:   find('Рег.знак','Рег знак','Регзнак'),
      vin:     find('VIN'),
      terr:    find('Территория'),
      zn:      find('Заказ наряд','Заказ-наряд'),
      kontr:   find('Контрагент'),  // резерв СК для прямых направлений (когда «Вид Заказ-наряда» пуст)
      company: find('Вид Заказ-наряда','Вид Заказ наряда'),
    };
  }

  function recStage(t){
    t = String(t||'').toLowerCase();
    if (t.includes('рекомендац')) return 'priem';
    if (t.includes('калькуляц'))  return 'work';
    if (t.includes('сервисн'))    return 'done';
    if (t.includes('отзывн'))     return 'cancelled';
    return 'other';
  }
  function recParseZn(s){
    if (!s) return [null,null];
    const m = String(s).trim().match(/^(\d+)\s+от\s+(.+)/);
    if (m) return [m[1], m[2].trim()];
    return [String(s).trim().split(/\s+/)[0], null];
  }
  // Номер ЗН → 10 знаков с ведущими нулями (формат orders_history_1c.zn_number).
  // В выгрузке направлений ЗН без ведущих нулей («000012489»), в отгрузках — «0000012489».
  // Без нормализации связка отгрузка↔направление по zn_number не сходится.
  function padZn(zn){
    if (zn == null) return null;
    const s = String(zn).trim();
    return /^\d+$/.test(s) ? s.padStart(10, '0') : s;
  }
  // Парсинг суммы: SheetJS с raw:false отдаёт "5,000.00" (запятая=тысячи, точка=дроби).
  // Поддерживаем также русский "5 000,00" и чистое число.
  function recParseAmount(v){
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return v;
    let s = String(v).trim().replace(/\s/g,'');
    if (s.includes(',') && s.includes('.')) {
      // оба знака: последний из них — десятичный разделитель
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
        s = s.replace(/\./g,'').replace(',','.');   // "5.000,00" → "5000.00"
      } else {
        s = s.replace(/,/g,'');                       // "5,000.00" → "5000.00"
      }
    } else if (s.includes(',')) {
      // только запятая: считаем десятичным разделителем (русский "5000,50")
      s = s.replace(',','.');
    }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  // Дата из 1С (текст "27.11.2025 16:50:50" или Date) → ISO
  function recParseDate(v){
    if (!v) return null;
    if (v instanceof Date) return v.toISOString();
    const m = String(v).trim().match(/^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (m) {
      const [_,d,mo,y,h='0',mi='0',s='0'] = m;
      return new Date(+y, +mo-1, +d, +h, +mi, +s).toISOString();
    }
    return null;
  }

  let recParsed = null;
  function importRecsOpen(){
    document.getElementById('recs-file-input').value = '';
    document.getElementById('recs-file-input').click();
  }

  async function importRecsFile(file){
    if (!file) return;
    try {
      toast('Читаю файл…', 'ok');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
      // строка 0 = заголовки. Колонки ищем ПО НАЗВАНИЯМ заголовков, а не по номерам:
      // выгрузки из 1С могут идти со сдвигом столбцов, и жёсткие индексы ломались
      // («распознано 0»). Поиск по заголовку устойчив к сдвигу и порядку колонок.
      const C = recFindColumns(rows[0] || []);
      // Без колонок «Номер» или «Заказ наряд» импортировать нечего — понятная ошибка.
      if (C.num < 0 || C.zn < 0) {
        toast('Не нашёл колонки «Номер»/«Заказ наряд» в файле. Проверь заголовки.', 'err');
        return;
      }
      const parsed = [];
      let skipped = 0;
      for (let i = 1; i < rows.length; i++){
        const r = rows[i];
        if (!r || !r[C.num]) { skipped++; continue; }
        const [zn, zndate] = recParseZn(r[C.zn]);
        // СК берём из «Вид Заказ-наряда» (реальный страховщик для РАВТ-потока).
        // Если пусто (прямые направления) — резерв из «Контрагент» (= плательщик-СК).
        const skVid = r[C.company] && String(r[C.company]).trim();
        const skRaw = skVid || (C.kontr >= 0 ? r[C.kontr] : null);
        parsed.push({
          rec_number: String(r[C.num]).trim(),
          rec_date:   recParseDate(r[C.date]),
          rec_type:   r[C.type] || null,
          stage:      recStage(r[C.type]),
          amount:     recParseAmount(r[C.sum]),
          company_id: recResolveCompany(skRaw),
          company_raw: skRaw || null,
          point_id:   recMatchPoint(r[C.terr]),
          point_raw:  r[C.terr] || null,
          zn_number:  padZn(zn),
          zn_date:    zndate,
          client:     r[C.client] || null,
          car_model:  r[C.model] || null,
          plate:      r[C.plate] || null,
          vin:        r[C.vin] || null,
          source_file: file.name,
        });
      }
      recParsed = parsed;
      // Сводка для подтверждения в красивой модалке
      const byStage = {};
      parsed.forEach(p => byStage[p.stage] = (byStage[p.stage]||0)+1);
      const sumStage = {};
      parsed.forEach(p => sumStage[p.stage] = (sumStage[p.stage]||0)+p.amount);
      const noCompany = parsed.filter(p => !p.company_id).length;
      const noPoint   = parsed.filter(p => !p.point_id).length;
      const withZn    = parsed.filter(p => p.zn_number).length;
      const totalSum  = parsed.reduce((s,p)=>s+p.amount,0);
      const fmt = n => Math.round(n).toLocaleString('ru-RU');
      const cards = [
        ['priem','Приём','#888'], ['work','Калькуляция','#e8b84b'],
        ['done','Сервисная','#5dcaa5'], ['cancelled','Отзыв','#e24b4a'],
      ];
      const cardHtml = cards.map(([k,label,color]) => `
        <div style="background:rgba(255,255,255,.05);border-radius:10px;padding:10px 12px;flex:1;min-width:88px;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:${color};line-height:1;">${byStage[k]||0}</div>
          <div style="font-size:11px;color:#aaa;margin-top:3px;">${label}</div>
          <div style="font-size:11px;color:#777;">${fmt(sumStage[k]||0)} ₽</div>
        </div>`).join('');
      const warnHtml = (noCompany || noPoint)
        ? `<div style="margin-top:12px;font-size:12px;color:#e8b84b;">⚠ ${noCompany?`без распознанной СК: ${noCompany}`:''}${noCompany&&noPoint?' · ':''}${noPoint?`без точки: ${noPoint}`:''}</div>`
        : '';
      document.getElementById('rec-import-file').textContent =
        `${file.name} · распознано ${parsed.length}, на сумму ${fmt(totalSum)} ₽`;
      document.getElementById('rec-import-body').innerHTML =
        `<div style="display:flex;gap:8px;flex-wrap:wrap;">${cardHtml}</div>`
        + `<div style="margin-top:12px;font-size:12px;color:#999;">Связано с ЗН: ${withZn} из ${parsed.length}${skipped?` · пропущено пустых: ${skipped}`:''}</div>`
        + warnHtml
        + `<div style="margin-top:10px;font-size:11px;color:#777;">Повторный импорт обновит существующие записи (по номеру), дубли не создадутся.</div>`;
      document.getElementById('rec-import-go').disabled = false;
      document.getElementById('rec-import-go').textContent = 'Импортировать';
      document.getElementById('rec-import-modal').classList.add('show');
    } catch(e){
      console.error('importRecsFile:', e);
      toast('Ошибка чтения файла: ' + (e.message||e), 'err');
    }
  }

  function recImportClose(){
    document.getElementById('rec-import-modal').classList.remove('show');
    recParsed = null;
  }

  async function importRecsConfirm(){
    if (!recParsed || !recParsed.length) { toast('Нет данных для импорта', 'err'); return; }
    const goBtn = document.getElementById('rec-import-go');
    try {
      goBtn.disabled = true;
      goBtn.textContent = 'Импортирую…';
      const BATCH = 200;
      let ok = 0;
      for (let i = 0; i < recParsed.length; i += BATCH){
        const chunk = recParsed.slice(i, i + BATCH);
        const { error } = await sb.from('insurance_recommendations')
          .upsert(chunk, { onConflict: 'rec_number' });
        if (error) {
          console.error('insurance_recommendations upsert error:', error);
          toast('Ошибка импорта: ' + error.message, 'err');
          goBtn.disabled = false; goBtn.textContent = 'Импортировать';
          return;
        }
        ok += chunk.length;
        goBtn.textContent = `Импортирую… ${ok}/${recParsed.length}`;
      }
      recImportClose();
      toast(`✅ Импортировано рекомендаций: ${ok}`, 'ok');
    } catch(e){
      console.error('importRecsConfirm:', e);
      toast('Ошибка импорта: ' + (e.message||e), 'err');
      goBtn.disabled = false; goBtn.textContent = 'Импортировать';
    }
  }


  function getPrevPeriod() {
    const [y, m] = getPeriod().split('-').map(Number);
    const pm = m === 1 ? 12 : m - 1;
    const py = m === 1 ? y - 1 : y;
    return `${py}-${String(pm).padStart(2,'0')}`;
  }

  function showSkeleton() {
    const html = `<div class="channels-grid">
      ${[1,2].map(() => `<div class="skel-card">
        <div class="skel skel-line" style="width:60%;height:18px;margin-bottom:14px;"></div>
        <div class="skel skel-line" style="width:80%;"></div>
        <div class="skel skel-line" style="width:70%;"></div>
        <div class="skel skel-line" style="width:75%;"></div>
        <div class="skel skel-line" style="width:65%;"></div>
        <div class="skel skel-line" style="width:80%;"></div>
      </div>`).join('')}
    </div>`;
    document.getElementById('content').innerHTML = html;
  }

  async function loadAll() {
    showSkeleton();
    const period = getPeriod();
    const prevPeriod = getPrevPeriod();
    const city = getCity();
    try {
      const [cR, chR, pR, dR, rR, prevR] = await Promise.all([
        sb.from('insurance_companies').select('*').eq('is_active', true).order('display_order'),
        sb.from('insurance_channels').select('*').eq('city', city).eq('is_active', true).order('display_order'),
        sb.from('points').select('*').eq('format', city === 'moscow' ? 'moscow' : 'izhevsk').eq('project_type', 'workshop').eq('is_active', true).order('id'),
        sb.from('insurance_directions').select('*').eq('period', period),
        sb.from('insurance_ravt_check').select('*').eq('period', period),
        sb.from('insurance_directions').select('*').eq('period', prevPeriod)
      ]);
      if (cR.error) throw cR.error;
      if (chR.error) throw chR.error;
      if (pR.error) throw pR.error;
      if (dR.error) throw dR.error;
      if (rR.error) throw rR.error;
      if (prevR.error) throw prevR.error;
      companies = cR.data || [];
      channels = chR.data || [];
      points = pR.data || [];
      directionsData = dR.data || [];
      ravtData = rR.data || [];
      prevMonthData = prevR.data || [];
      await loadFunnelData();      // воронка: рекомендации + проверка отгрузки по ЗН
      await loadEquityChannels();  // каналы: отгруженный equity-вал по плательщику
      render();
      if (currentMode === 'year') loadYearData();
    } catch (e) {
      console.error(e);
      document.getElementById('content').innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`;
      setStatus('error');
    }
  }

  // ====================================================================
  // ВИДЖЕТ ВОРОНКИ СТРАХОВЫХ НАПРАВЛЕНИЙ (Этап 2)
  // ====================================================================
  // Стадии: priem (приём/Рекомендация) → work (калькуляция) →
  //         done (сервисная/отгружено) → cancelled (отзыв).
  // Источник: insurance_recommendations. Связь с заказами по zn_number.
  // «Отгружено по факту» = zn_number найден в orders_history_1c
  // (там только status_1c='Отгружен'). Нужно для плашки «переведи в Сервисную».

  let recsData = [];            // все insurance_recommendations
  // Ключи карт ниже — СОСТАВНЫЕ: `${point_id}|${zn_number}`. Номера ЗН пересекаются
  // между точками/юрлицами (см. A14), поэтому матчить только по zn_number нельзя —
  // иначе московская рекомендация цепляет одноимённый ижевский заказ и считается «чужой».
  const znKey = (pid, zn) => `${pid == null ? '' : pid}|${zn == null ? '' : String(zn)}`;
  let shippedZnSet = new Set(); // ключ → найден в orders_history_1c (отгружен)
  let znMaxDebt = new Map();    // ключ → макс. долг по строкам заказа (для проверки оплаты)
  let znCategory = new Map();   // ключ → категория заказа (equity/corp/retail/detail)
  let znHasRegistry = new Map(); // ключ → реестр отправлен (есть label или date)
  let recFunnelMode = 'snapshot'; // 'snapshot' | 'month'
  let recFunnelAllPoints = false; // false = только город из шапки, true = все точки

  const FUNNEL_STAGES = [
    { key: 'priem',     label: 'Приём',       hint: 'Рекомендация',          color: 'var(--muted)' },
    { key: 'work',      label: 'Калькуляция', hint: 'согласована, в работе', color: 'var(--brand)' },
    { key: 'done',      label: 'Отгружено',   hint: 'Сервисная кампания',    color: 'var(--ok)' },
    { key: 'cancelled', label: 'Отзыв',       hint: 'Отзывная кампания',     color: 'var(--crit)' },
  ];

  // Загрузка данных воронки. Изолирована в try/catch — сбой здесь
  // не должен ронять основной экран направлений.
  async function loadFunnelData() {
    try {
      // Supabase отдаёт максимум 1000 строк за запрос. Рекомендаций может стать больше —
      // грузим постранично, иначе воронка считает по неполным данным.
      const PAGE = 1000;
      let recs = [];
      let from = 0;
      for (;;) {
        const { data, error } = await sb
          .from('insurance_recommendations')
          .select('rec_number, rec_date, rec_type, stage, amount, company_id, company_raw, point_id, point_raw, zn_number, zn_date, client, car_model, plate, service_confirmed_at')
          .range(from, from + PAGE - 1);
        if (error) throw error;
        const batch = data || [];
        recs = recs.concat(batch);
        if (batch.length < PAGE) break;
        from += PAGE;
        if (from > 50000) break; // предохранитель
      }
      recsData = recs || [];

      // Какие из ЗН отгружены (есть в orders_history_1c) и каков их долг.
      // На один ЗН может быть несколько строк истории → берём максимальный долг:
      // если хоть одна строка с долгом > 0, считаем заказ ещё не оплаченным.
      shippedZnSet = new Set();
      znMaxDebt = new Map();
      znCategory = new Map();
      znHasRegistry = new Map();
      const zns = [...new Set(recsData.map(r => r.zn_number).filter(Boolean).map(String))];
      const CHUNK = 200; // дробим .in() на части — список ЗН может быть большим
      for (let i = 0; i < zns.length; i += CHUNK) {
        const part = zns.slice(i, i + CHUNK);
        const { data: ord, error: oErr } = await sb
          .from('orders_history_1c')
          .select('zn_number, point_id, debt, category, registry_label, registry_date')
          .in('zn_number', part);
        if (oErr) { console.warn('orders_history_1c lookup:', oErr); continue; }
        (ord || []).forEach(o => {
          if (o.zn_number == null) return;
          const key = znKey(o.point_id, o.zn_number);
          shippedZnSet.add(key);
          const d = +o.debt || 0;
          const prev = znMaxDebt.has(key) ? znMaxDebt.get(key) : -Infinity;
          if (d > prev) znMaxDebt.set(key, d);
          // Категория: если хоть одна строка equity — считаем ЗН страховым.
          const cat = o.category || null;
          if (!znCategory.has(key) || cat === 'equity') znCategory.set(key, cat);
          // Реестр отправлен, если заполнен label ИЛИ date (хоть в одной строке).
          const hasReg = (o.registry_label != null && String(o.registry_label).trim() !== '')
                      || (o.registry_date != null && String(o.registry_date).trim() !== '');
          if (hasReg || !znHasRegistry.has(key)) znHasRegistry.set(key, hasReg || znHasRegistry.get(key) || false);
        });
      }
    } catch (e) {
      console.warn('loadFunnelData:', e);
      recsData = recsData || [];
      // карты оставляем как есть — виджет просто покажет меньше задач
    }
  }

  // Реестр (документы) по ЗН отправлен? true = есть реестр, false = нет (надо отправить).
  function znRegistrySent(zn, pid) {
    if (!zn) return false;
    return znHasRegistry.get(znKey(pid, zn)) === true;
  }

  // «Чужая» рекомендация: ЗН отгружён, но категория заказа НЕ страховая (не equity).
  // Это случайно попавшие в файл corp/retail/detail (напр. ЗН 0000000095, corp,
  // плательщик ТЕХНЕЙДАВТО). Такие исключаем из воронки и подсчётов.
  // Если ЗН ещё не отгружён (категории нет) — НЕ считаем чужим: рекомендация в работе.
  function znIsForeign(zn, pid) {
    if (!zn) return false;
    const key = znKey(pid, zn);
    if (!shippedZnSet.has(key)) return false; // не отгружён (на этой точке) — не судим
    const cat = znCategory.get(key);
    return cat != null && cat !== 'equity';
  }

  // Долг страховой по ЗН погашен? Готов к Сервисной, если максимальный долг <= 0
  // (ноль = оплачено, отрицательный = переплата/франшиза — тоже не блокирует).
  // Долг > 0 означает: СК ещё не доплатила свою часть, переводить рано.
  function znPaid(zn, pid) {
    if (!zn) return false;
    const d = znMaxDebt.get(znKey(pid, zn));
    return d != null && d <= 0;
  }

  // ====== СВЕРКА РУЧНОГО УЧЁТА С РЕКОМЕНДАЦИЯМИ (Этап 2, пункт 2) ======
  // Сколько рекомендаций по конкретной СК за ВЫБРАННЫЙ МЕСЯЦ (по rec_date).
  // Разделяем: count = «Поступило» (стадии priem/work/done), cancelled = «Отзыв»
  // (стадия cancelled, «Отзывная кампания»). Исключаем «чужих» (не страховые ЗН).
  // pointId: если задан — только эта точка, иначе все точки города.
  // Возвращает {count, sum, cancelled}. Кэш на время одного render().
  // ====== ПОДСЧЁТ ПО СК ИЗ 1С ======
  // count = направления за выбранный месяц (стадии кроме cancelled),
  // sum = деньги по ним, cancelled = отзывы за месяц,
  // prevCount = направления за ПРОШЛЫЙ месяц (для тренда, тоже из 1С).
  // Исключаем «чужих» (не страховые ЗН). pointId: задан — точка, иначе город.
  let _recCountCache = null;
  function buildRecCountCache() {
    const period = getPeriod();
    const prevPeriod = getPrevPeriod();
    const cityIds = new Set(funnelCityPointIds());
    const map = {}; // ключ `${company_id}__${point_id||'all'}` → {count,sum,cancelled,prevCount}
    const ensure = k => { if (!map[k]) map[k] = { count: 0, sum: 0, cancelled: 0, prevCount: 0 }; return map[k]; };
    recsData.forEach(r => {
      if (znIsForeign(r.zn_number, r.point_id)) return;     // чужих не считаем
      if (!r.company_id) return;                            // нераспознанная СК — пропуск
      if (!r.point_id || !cityIds.has(r.point_id)) return;  // только текущий город
      const m = r.rec_date ? String(r.rec_date).substring(0,7) : '';
      const isCancelled = (r.stage === 'cancelled');
      const amt = +r.amount || 0;
      if (m === period) {
        [`${r.company_id}__${r.point_id}`, `${r.company_id}__all`].forEach(k => {
          const e = ensure(k);
          if (isCancelled) e.cancelled++;
          else { e.count++; e.sum += amt; }
        });
      } else if (m === prevPeriod && !isCancelled) {
        [`${r.company_id}__${r.point_id}`, `${r.company_id}__all`].forEach(k => {
          ensure(k).prevCount++;
        });
      }
    });
    _recCountCache = map;
  }
  function recCountByCompany(companyId, pointId) {
    if (!_recCountCache) buildRecCountCache();
    const k = `${companyId}__${pointId || 'all'}`;
    return _recCountCache[k] || { count: 0, sum: 0, cancelled: 0, prevCount: 0 };
  }

  // point_id текущего города (points уже отфильтрован по format в loadAll).
  function funnelCityPointIds() { return points.map(p => p.id); }

  // Рекомендации под текущие фильтры (город + режим месяца).
  function funnelFilteredRecs() {
    let list = recsData.slice();
    if (!recFunnelAllPoints) {
      const ids = new Set(funnelCityPointIds());
      // Записи без point_id показываем только в режиме «все точки»,
      // чтобы не приписать нераспознанную точку чужому городу.
      list = list.filter(r => r.point_id && ids.has(r.point_id));
    }
    if (recFunnelMode === 'month') {
      const period = getPeriod();
      list = list.filter(r => r.rec_date && String(r.rec_date).substring(0, 7) === period);
    }
    return list;
  }

  // Эффективная стадия: ручное подтверждение Сервисной (service_confirmed_at)
  // важнее стадии из файла. Так перевод не откатывается следующим импортом,
  // который перезаписывает только r.stage.
  function effStage(r) {
    return r.service_confirmed_at ? 'done' : r.stage;
  }

  function funnelCompute() {
    const recs = funnelFilteredRecs();
    const byStage = {};
    FUNNEL_STAGES.forEach(s => { byStage[s.key] = { count: 0, amount: 0 }; });
    const other = { count: 0, amount: 0 };
    const toService = [];      // отгружен И оплачен (долг СК погашен), но Сервисная не подтверждена
    const awaitingPay = [];    // отгружен, но СК ещё должна (debt > 0) — переводить рано
    const mismatch = [];       // отгружен, страховой (equity), но company_id пустой
    const confirmed = [];      // подтверждены вручную (service_confirmed_at стоит)
    const foreign = [];        // ЗН отгружён, но категория не страховая (corp/retail/detail) — чужие
    const needDocs = [];       // отгружен страховой, но реестр не отправлен (документы не сданы в СК)

    recs.forEach(r => {
      // «Чужих» (не-страховые отгруженные ЗН) полностью исключаем из воронки и задач.
      if (znIsForeign(r.zn_number, r.point_id)) { foreign.push(r); return; }

      const amt = +r.amount || 0;
      const st = effStage(r);
      if (byStage[st]) { byStage[st].count++; byStage[st].amount += amt; }
      else { other.count++; other.amount += amt; }
      const shipped = r.zn_number && shippedZnSet.has(znKey(r.point_id, r.zn_number));
      const paid = znPaid(r.zn_number, r.point_id);
      const active = !r.service_confirmed_at && (r.stage === 'work' || r.stage === 'priem');
      // Готов к Сервисной: отгружен, долг СК погашен, ещё не подтверждён.
      if (shipped && paid && active) toService.push(r);
      // Отгружен, но СК ещё не доплатила — ждём оплаты, не переводим.
      if (shipped && !paid && active) awaitingPay.push(r);
      if (shipped && !r.company_id) mismatch.push(r);
      if (r.service_confirmed_at) confirmed.push(r);
      // Документы: отгружен, но реестр (дата+номер) ещё не проставлен → надо отправить.
      if (shipped && !znRegistrySent(r.zn_number, r.point_id)) needDocs.push(r);
    });

    const totalCount = recs.length - foreign.length; // чужих не считаем в итог
    const totalAmount = recs.reduce((s, r) => znIsForeign(r.zn_number, r.point_id) ? s : s + (+r.amount || 0), 0);
    const inWorkCount = byStage.priem.count + byStage.work.count;
    return { byStage, other, totalCount, totalAmount, inWorkCount, toService, awaitingPay, mismatch, confirmed, foreign, needDocs };
  }

  function setFunnelMode(mode) { recFunnelMode = mode; haptic(10); render(); }
  function toggleFunnelPoints() { recFunnelAllPoints = !recFunnelAllPoints; haptic(10); render(); }

  function renderFunnel() {
    if (!recsData.length) return ''; // импорта ещё не было — блок не показываем
    const f = funnelCompute();
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    const cityLbl = getCity() === 'moscow' ? 'Москва' : 'Ижевск';

    const maxCount = Math.max(1, ...FUNNEL_STAGES.map(s => f.byStage[s.key].count));
    const stageCards = FUNNEL_STAGES.map(s => {
      const d = f.byStage[s.key];
      const barPct = Math.round((d.count / maxCount) * 100);
      // Карточку «Отгружено» делаем кликабельной, если есть подтверждённые вручную —
      // чтобы можно было посмотреть список и при ошибке вернуть в работу.
      const clickable = (s.key === 'done' && f.confirmed.length);
      const onclick = clickable ? `onclick="showFunnelTask('confirmed')"` : '';
      const hint = clickable ? `${s.hint} · ${f.confirmed.length} вручную ›` : s.hint;
      return `<div class="fn-stage ${clickable ? 'clickable' : ''}" ${onclick}>
        <div class="fn-stage-top">
          <div class="fn-stage-count" style="color:${s.color};">${d.count}</div>
          <div class="fn-stage-label">${escapeHtml(s.label)}</div>
        </div>
        <div class="fn-stage-hint">${escapeHtml(hint)}</div>
        <div class="fn-stage-bar"><div class="fn-stage-bar-fill" style="width:${barPct}%;background:${s.color};"></div></div>
        <div class="fn-stage-amount">${fmt(d.amount)} ₽</div>
      </div>`;
    }).join('');

    const otherChip = f.other.count
      ? `<div class="fn-other">+ ${f.other.count} без стадии (${fmt(f.other.amount)} ₽)</div>` : '';

    let tasksHtml = '';
    if (f.toService.length) {
      tasksHtml += `<div class="fn-task">
        <div class="fn-task-ico">🚚</div>
        <div class="fn-task-body">
          <div class="fn-task-title">Перевести в «Сервисную»: ${f.toService.length}</div>
          <div class="fn-task-sub">Отгружены и оплачены (долг СК погашен), но Сервисная ещё не подтверждена.</div>
        </div>
        <div class="fn-task-actions">
          <button class="fn-task-btn ghost" onclick="showFunnelTask('toService')">Список</button>
          <button class="fn-task-btn" onclick="confirmServiceMass()">Подтвердить все</button>
        </div>
      </div>`;
    }
    if (f.needDocs.length) {
      tasksHtml += `<div class="fn-task docs">
        <div class="fn-task-ico">📄</div>
        <div class="fn-task-body">
          <div class="fn-task-title">Отправить документы в СК: ${f.needDocs.length}</div>
          <div class="fn-task-sub">Отгружены, но реестр не отправлен (нет даты и номера реестра).</div>
        </div>
        <button class="fn-task-btn" onclick="showFunnelTask('needDocs')">Список</button>
      </div>`;
    }
    if (f.awaitingPay.length) {
      const sumDebt = f.awaitingPay.reduce((s, r) => s + (znMaxDebt.get(znKey(r.point_id, r.zn_number)) || 0), 0);
      tasksHtml += `<div class="fn-task wait">
        <div class="fn-task-ico">⏳</div>
        <div class="fn-task-body">
          <div class="fn-task-title">Ждут оплаты СК: ${f.awaitingPay.length}</div>
          <div class="fn-task-sub">Отгружены, но страховая ещё должна (всего ${fmt(sumDebt)} ₽). Переводить рано.</div>
        </div>
        <button class="fn-task-btn ghost" onclick="showFunnelTask('awaitingPay')">Список</button>
      </div>`;
    }
    if (f.mismatch.length) {
      tasksHtml += `<div class="fn-task warn">
        <div class="fn-task-ico">⚠️</div>
        <div class="fn-task-body">
          <div class="fn-task-title">Разобрать нестыковку: ${f.mismatch.length}</div>
          <div class="fn-task-sub">Отгружено, но страховая не распознана (company_id пустой).</div>
        </div>
        <button class="fn-task-btn" onclick="showFunnelTask('mismatch')">Список</button>
      </div>`;
    }
    if (f.foreign.length) {
      // Плашку «Не наши» намеренно не показываем: исключение чужих ЗН
      // (корпоратив/розница) работает молча, постоянная техническая плашка не нужна.
    }
    if (!tasksHtml) {
      tasksHtml = `<div class="fn-task ok">
        <div class="fn-task-ico">✓</div>
        <div class="fn-task-body">
          <div class="fn-task-title">Задач нет</div>
          <div class="fn-task-sub">Все отгруженные ЗН в актуальных стадиях.</div>
        </div>
      </div>`;
    }

    const modeBtns = `<div class="fn-toggle">
      <button class="fn-toggle-btn ${recFunnelMode==='snapshot'?'active':''}" onclick="setFunnelMode('snapshot')">Всё время</button>
      <button class="fn-toggle-btn ${recFunnelMode==='month'?'active':''}" onclick="setFunnelMode('month')">За месяц</button>
    </div>`;
    const subtitle = recFunnelMode === 'month' ? `за ${formatMonth()}` : 'текущее состояние';

    return `<div class="funnel-block">
      <div class="funnel-head">
        <div class="funnel-title">Воронка направлений</div>
        <div class="funnel-controls">${modeBtns}</div>
      </div>
      <div class="funnel-sub">${escapeHtml(subtitle)} · всего ${f.totalCount} на ${fmt(f.totalAmount)} ₽ · в работе ${f.inWorkCount}</div>
      <div class="funnel-stages">${stageCards}</div>
      ${otherChip}
      <div class="funnel-tasks">${tasksHtml}</div>
    </div>`;
  }

  function showFunnelTask(kind) {
    const f = funnelCompute();
    const listMap = { toService: f.toService, confirmed: f.confirmed, awaitingPay: f.awaitingPay, mismatch: f.mismatch, foreign: f.foreign, needDocs: f.needDocs };
    const titleMap = {
      toService: '🚚 Перевести в «Сервисную»',
      confirmed: '✓ Подтверждены вручную',
      awaitingPay: '⏳ Ждут оплаты СК',
      mismatch: '⚠️ Нестыковки',
      foreign: '🚫 Не наши (исключены)',
      needDocs: '📄 Отправить документы в СК',
    };
    const list = listMap[kind] || f.mismatch;
    const title = titleMap[kind] || '⚠️ Нестыковки';
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    const CAT_LBL = { corp: 'корпоратив', retail: 'розница', detail: 'детейл', equity: 'страховой' };

    // Рендер одной записи (общий для всех режимов).
    const renderRec = (r) => {
      const comp = r.company_id
        ? (companies.find(c => c.id === r.company_id)?.name || r.company_id)
        : (r.company_raw || '—');
      const pt = points.find(p => p.id === r.point_id);
      const ptLbl = pt ? pt.name : (r.point_raw || '—');
      let action = '';
      if (kind === 'toService') {
        action = `<button class="fn-rec-btn" onclick="confirmServiceOne('${escapeHtml(String(r.rec_number))}')">✓ В Сервисную</button>`;
      } else if (kind === 'confirmed') {
        action = `<button class="fn-rec-btn ghost" onclick="unconfirmServiceOne('${escapeHtml(String(r.rec_number))}')">↩ Вернуть в работу</button>`;
      }
      const debtLine = kind === 'awaitingPay'
        ? `<div class="fn-rec-meta" style="color:var(--warn);">Долг СК: ${fmt(znMaxDebt.get(znKey(r.point_id, r.zn_number)) || 0)} ₽</div>`
        : '';
      const catLine = kind === 'foreign'
        ? `<div class="fn-rec-meta" style="color:var(--crit);">Категория заказа: ${escapeHtml(CAT_LBL[znCategory.get(znKey(r.point_id, r.zn_number))] || znCategory.get(znKey(r.point_id, r.zn_number)) || '—')}</div>`
        : '';
      // В режиме документов точку в строке не дублируем — она в заголовке группы.
      const ptInline = kind === 'needDocs' ? '' : ` · ${escapeHtml(ptLbl)}`;
      return `<div class="fn-rec-row">
        <div class="fn-rec-main">
          <span class="fn-rec-zn">ЗН ${escapeHtml(r.zn_number || '—')}</span>
          <span class="fn-rec-amt">${fmt(+r.amount || 0)} ₽</span>
        </div>
        <div class="fn-rec-meta">${escapeHtml(comp)}${ptInline}${r.client ? ' · ' + escapeHtml(r.client) : ''}</div>
        ${debtLine}
